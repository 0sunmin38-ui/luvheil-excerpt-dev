      ratioField.appendChild(el('label', 'lab', '비율'));
      const RSUB = { '9:16': '스토리', '3:4': '세로', '1:1': '정사각', '4:3': '가로', '16:9': '와이드' };
      const ratioTabs = el('div', 'seg');
      Object.keys(RATIOS).forEach(k => {
        const b = el('button', c.ratio === k ? 'is-on' : '');
        b.innerHTML = `${k}<small>${RSUB[k]}</small>`;
        b.onclick = () => { c.ratio = k; save(); rerender(); };
        ratioTabs.appendChild(b);
      });
      ratioField.appendChild(ratioTabs);
      canvasBody.appendChild(ratioField);
    }
  }

  /* 여백 설정 (함께 토글 + 상하좌우) */
  const marginHead = el('div', 'tgl-inline');
  marginHead.style.marginTop = 'var(--sp-lg)';
  marginHead.appendChild(el('span', 'lab', '여백'));
  const marginLinkWrap = el('div', 'tgl-inline');
  marginLinkWrap.style.cssText = 'gap:6px;margin-left:auto';
  marginLinkWrap.appendChild(el('span', 'lab', '상하·좌우 함께'));
  if (c.marginLink == null) c.marginLink = true;
  const linkTgl = el('div', 'tgl tgl-sm' + (c.marginLink ? ' is-on' : ''));
  linkTgl.onclick = () => { c.marginLink = !c.marginLink; linkTgl.classList.toggle('is-on'); };
  marginLinkWrap.appendChild(linkTgl);
  marginHead.appendChild(marginLinkWrap);
  canvasBody.appendChild(marginHead);

  const marginGrid = el('div', 'grid-2');
  marginGrid.style.cssText = 'margin-top:var(--sp-sm);row-gap:9px';
  const mkMargin = (lab, key, linked) => {
    const sync = v => {
      c[key] = v;
      if (c.marginLink && linked) {
        c[linked] = v;
        rerender(); /* 연동된 값도 UI에 반영 */
        return;
      }
      up();
    };
    return stepH(lab, c[key] ?? 16, 0, 80, 2, sync);
  };
  marginGrid.appendChild(mkMargin('위', 'mt', 'mb'));
  marginGrid.appendChild(mkMargin('아래', 'mb', 'mt'));
  marginGrid.appendChild(mkMargin('좌측', 'ml', 'mr'));
  marginGrid.appendChild(mkMargin('우측', 'mr', 'ml'));
  canvasBody.appendChild(marginGrid);

  /* 정렬 — 페이지 분할 모드에서 내용을 위에 붙일지 가운데에 둘지 */
  if (!isFit()) {
    const vAlignField = el('div', 'field');
    vAlignField.style.marginTop = 'var(--sp-lg)';
    vAlignField.appendChild(el('label', 'lab', '정렬'));
    if (!t.fmt) t.fmt = Object.assign({}, S.format);
    vAlignField.appendChild(segment([['top', '상단 정렬'], ['center', '중앙 정렬']], t.fmt.vAlign || 'center',
      v => { t.fmt.vAlign = v; rerender(); }));
    canvasBody.appendChild(vAlignField);
  }

  canvasSection.appendChild(canvasBody);
  body.appendChild(canvasSection);

  /* ═══ 배경 ═══ */
  const bgSection = el('div', 'section' + (openSec.bg ? ' open' : ''));
  const bgHeader = el('div', 'section-header');
  bgHeader.innerHTML = '<h3>배경</h3><svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  bgHeader.onclick = () => { openSec.bg = !openSec.bg; bgSection.classList.toggle('open'); };
  bgSection.appendChild(bgHeader);
  const bgBody = el('div', 'section-body');
  const bgGrid = el('div', 'grid-2');
  bgGrid.appendChild(colorField('배경색', t.bg, v => { t.bg = v; up(); }));
  bgGrid.appendChild(colorField('글자색', t.fg, v => { t.fg = v; up(); }));
  bgBody.appendChild(bgGrid);
  /* 배경 이미지 버튼 (프레임 없을 때만) */
  if (frKind === 'none') {
    const bgiField = el('div', 'field');
    bgiField.style.marginTop = 'var(--sp-md)';
    bgiField.appendChild(el('label', 'lab', '배경 이미지'));
    const pickBtn = el('button', 'btn btn-quiet', t.bgImage ? '이미지 변경' : '이미지 선택');
    pickBtn.style.width = '100%';
    pickBtn.onclick = () => openBgImageModal(t.bgImage || '', (d, cropped) => {
      t.bgImage = d;
      if (cropped) { t.bgSize = 100; t.bgX = 50; t.bgY = 50; }
      rerender();
    }, t);
    bgiField.appendChild(pickBtn);
    bgBody.appendChild(bgiField);
  } else {
    const bgNote = el('div', 'lab-sub');
    bgNote.style.marginTop = 'var(--sp-md)';
    bgNote.textContent = (FRAMES.find(f => f[0] === frKind) || [, ''])[1] + "은 배경 이미지 설정이 불가합니다.";
    bgBody.appendChild(bgNote);
  }
  bgSection.appendChild(bgBody);
  body.appendChild(bgSection);

  /* ═══ 대사 ═══ */
  const bubbleSection = el('div', 'section' + (openSec.bubble ? ' open' : ''));
  const bubbleHeader = el('div', 'section-header');
  bubbleHeader.innerHTML = '<h3>대사</h3><svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  bubbleHeader.onclick = () => { openSec.bubble = !openSec.bubble; bubbleSection.classList.toggle('open'); };
  bubbleSection.appendChild(bubbleHeader);
  const bubbleBody = el('div', 'section-body');

  /* 스타일 */
  const styleField = el('div', 'field');
  styleField.appendChild(el('label', 'lab', '스타일'));
  const styleSeg = el('div', 'seg');
  [['bubble', '말풍선'], ['quote', '인용'], ['script', '각본'], ['notif', '알림'], ['sns', '트윗'], ['plain', '없음']].forEach(([v, l]) => {
    const b = el('button', (t.bubbleStyle || 'bubble') === v ? 'is-on' : '', l);
    b.onclick = () => {
      t.bubbleStyle = v;
      if (v === 'quote' || v === 'script') t.groupRuns = false;
      if (v === 'notif') t.groupRuns = true;
      /* 각본은 이미지 표시 불가 */
      if (v === 'script') { t.showAvatar = false; t.myAvatar = false; }
      rerender();
    };
    styleSeg.appendChild(b);
  });
  styleField.appendChild(styleSeg);
  bubbleBody.appendChild(styleField);

  const bs = t.bubbleStyle || 'bubble';
  const isBubble = bs === 'bubble';
  const isQuote = bs === 'quote';
  const isNotif = bs === 'notif';
  const isSns = bs === 'sns';
  const isScript = bs === 'script';

  /* 대사 묶기 — 말풍선·인용·각본·알림·SNS 적용 (plain 제외) */
  if (bs !== 'plain') {
    const grpTgl = el('div', 'tgl-inline');
    grpTgl.style.marginTop = 'var(--sp-md)';
    grpTgl.appendChild(el('span', 'lab', '대사 묶기'));
    const grpBtn = el('div', 'tgl tgl-sm' + (t.groupRuns !== false ? ' is-on' : ''));
    grpBtn.onclick = () => { t.groupRuns = t.groupRuns === false; rerender(); };
    grpTgl.appendChild(grpBtn);
    bubbleBody.appendChild(grpTgl);
  }

  if (isBubble) {
    /* 말풍선 스타일 프리셋 — Plain / Modern / iMessage / Kakaotalk */
    const presetField = el('div', 'field');
    presetField.style.marginTop = 'var(--sp-md)';
    presetField.appendChild(el('label', 'lab', '말풍선'));
    const presetOpts = Object.keys(BUBBLE_STYLES).map(k => [k, BUBBLE_STYLES[k].label]);
    const currentPreset = resolvePreset(t);
    presetField.appendChild(segment(presetOpts, currentPreset, v => {
      t.bubblePreset = v;
      /* 호환: 기존 tailShape/showTail 도 함께 설정 */
      t.tailShape = v;
      t.showTail = BUBBLE_STYLES[v].hasTail;
      const preset = BUBBLE_STYLES[v];
      if (preset && preset.radius != null) {
        const r = preset.radius;
        t.bubbleRadius = r;
        /* modern은 brDetail/brLink 둘 다 끄고 brBL을 각진 모서리로 사용, 나머지는 brLink 켜기 */
        if (preset.isCorner) {
          t.brDetail = true;
          t.brLink = false;
          t.brTL = r; t.brTR = r; t.brBR = r;
          t.brBL = preset.flatRadius ?? 2;
        } else {
          t.brDetail = false;
          t.brLink = true;
          t.brTL = t.brTR = t.brBL = t.brBR = r;
        }
      }
      rerender();
    }));
    bubbleBody.appendChild(presetField);

    /* 모서리 둥글기 — 프리셋별로 UI가 다름:
       Plain: 함께 토글 + 4코너/1스텝퍼 전환
       Modern: 함께 토글 없음, 4코너(3개 연동)
       iMessage/Kakaotalk: 함께 토글 없음, 1스텝퍼만 */
    const curPreset = resolvePreset(t);
    const isPlain = curPreset === 'plain';
    const isModern = curPreset === 'modern';

    const radiusHead = el('div', 'tgl-inline');
    radiusHead.style.marginTop = 'var(--sp-md)';
    radiusHead.appendChild(el('span', 'lab', '모서리 둥글기'));

    /* Plain만 함께 토글 표시 */
    if (isPlain) {
      const radiusLinkWrap = el('div', 'tgl-inline');
      radiusLinkWrap.style.cssText = 'gap:6px;margin-left:auto';
      radiusLinkWrap.appendChild(el('span', 'lab', '함께'));
      if (t.brLink == null) t.brLink = true;
      const radiusTgl = el('div', 'tgl tgl-sm' + (t.brLink ? ' is-on' : ''));
      radiusTgl.onclick = () => {
        t.brLink = !t.brLink;
        /* brDetail도 동기화 — 렌더링은 brDetail을 확인함 */
        t.brDetail = !t.brLink;
        if (t.brDetail) {
          /* 개별 모드로 전환: 현재 bubbleRadius로 4코너 초기화 */
          const r = t.bubbleRadius ?? 18;
          t.brTL = t.brTR = t.brBL = t.brBR = r;
        } else {
          /* 함께 모드로 전환: 4코너 중 가장 큰 값을 bubbleRadius로 */
          t.bubbleRadius = Math.max(t.brTL ?? 18, t.brTR ?? 18, t.brBL ?? 18, t.brBR ?? 18);
        }
        rerender();
      };
      radiusLinkWrap.appendChild(radiusTgl);
      radiusHead.appendChild(radiusLinkWrap);
    }
    radiusHead.hidden = curPreset === 'bubble';
    bubbleBody.appendChild(radiusHead);

    /* 4개 값 초기화 — 없으면 bubbleRadius에서 가져옴 */
    const defR = t.bubbleRadius ?? 14;
    if (t.brTL == null) t.brTL = defR;
    if (t.brTR == null) t.brTR = defR;
    if (t.brBL == null) t.brBL = defR;
    if (t.brBR == null) t.brBR = defR;

    const radiusGrid = el('div', 'grid-2');
    radiusGrid.style.cssText = 'margin-top:var(--sp-sm);row-gap:9px';

    if (isPlain) {
      /* Plain: 함께 켜면 1스텝퍼, 끄면 4코너 (brLink와 brDetail 동기화됨) */
      if (t.brLink) {
        const singleStep = stepH('둥글기', t.bubbleRadius ?? 18, 0, 28, 1, v => {
          t.bubbleRadius = v;
          t.brTL = t.brTR = t.brBL = t.brBR = v;
          t.brDetail = false; /* 렌더링용 */
          up();
        });
        singleStep.style.gridColumn = '1 / -1';
        radiusGrid.appendChild(singleStep);
      } else {
        const mkPlain = (lab, key) => stepH(lab, t[key] ?? 18, 0, 28, 1, v => {
          t[key] = v;
          t.brDetail = true; /* 렌더링용 */
          up();
        });
        radiusGrid.appendChild(mkPlain('좌상', 'brTL'));
        radiusGrid.appendChild(mkPlain('우상', 'brTR'));
        radiusGrid.appendChild(mkPlain('좌하', 'brBL'));
        radiusGrid.appendChild(mkPlain('우하', 'brBR'));
      }
    } else if (isModern) {
      /* Modern: 스텝퍼 2개 — 둥근(3코너 연동) / 뾰족(brBL) */
      radiusGrid.appendChild(stepH('일반', t.bubbleRadius ?? 20, 0, 28, 1, v => {
        t.bubbleRadius = v;
        t.brTL = t.brTR = t.brBR = v;
        up();
      }));
      radiusGrid.appendChild(stepH('말꼬리', t.brBL ?? 2, 0, 28, 1, v => {
        t.brBL = v;
        up();
      }));
    } else {
      /* iMessage / Kakaotalk: 스텝퍼 1개만 */
      const singleStep = stepH('둥글기', t.bubbleRadius ?? 14, 0, 28, 1, v => {
        t.bubbleRadius = v;
        t.brTL = t.brTR = t.brBL = t.brBR = v;
        up();
      });
      singleStep.style.gridColumn = '1 / -1';
      radiusGrid.appendChild(singleStep);
    }
    radiusGrid.hidden = curPreset === 'bubble';
    bubbleBody.appendChild(radiusGrid);
  }

  /* 색상 설정 — 스타일별로 다른 UI */
  if (isBubble) {
    /* 말풍선 색상 */
    const colorGrid = el('div', 'grid-2');
    colorGrid.style.marginTop = 'var(--sp-md)';
    colorGrid.appendChild(colorField('좌측 말풍선', t.bubbleBg, v => { t.bubbleBg = v; up(); }));
    colorGrid.appendChild(colorField('좌측 글자', t.bubbleFg, v => { t.bubbleFg = v; up(); }));
    colorGrid.appendChild(colorField('우측 말풍선', t.myBubbleBg || t.bubbleBg, v => { t.myBubbleBg = v; up(); }));
    colorGrid.appendChild(colorField('우측 글자', t.myBubbleFg || t.bubbleFg, v => { t.myBubbleFg = v; up(); }));
    bubbleBody.appendChild(colorGrid);
  }
  if (isQuote) {
    /* 인용 색상 — 좌측/우측 인용선 색만 (말풍선 색과 연동) */
    const colorGrid = el('div', 'grid-2');
    colorGrid.style.marginTop = 'var(--sp-md)';
    colorGrid.appendChild(colorField('좌측 인용선', t.bubbleBg, v => { t.bubbleBg = v; up(); }));
    colorGrid.appendChild(colorField('우측 인용선', t.myBubbleBg || t.bubbleBg, v => { t.myBubbleBg = v; up(); }));
    bubbleBody.appendChild(colorGrid);
  }
  if (isNotif) {
    /* 알림 배경색 — 기본 오퍼시티 50% 유지 */
    const colorGrid = el('div', 'grid-2');
    colorGrid.style.marginTop = 'var(--sp-md)';
    const notifHex = '#' + (hexOf(t.notifBg) || 'FFFFFF');
    colorGrid.appendChild(colorField('알림 배경', notifHex, v => { t.notifBg = rgbaOf(v, 50); up(); }));
    bubbleBody.appendChild(colorGrid);
  }
  if (isSns) {
    /* SNS 배경색 — 기본 투명 */
    const colorGrid = el('div', 'grid-2');
    colorGrid.style.marginTop = 'var(--sp-md)';
    colorGrid.appendChild(colorField('배경색', t.snsBg || 'transparent', v => { t.snsBg = v; up(); }));
    bubbleBody.appendChild(colorGrid);
  }

  /* 추가 옵션 (라운드/그림자, 좌측 프로필·이름, 우측 프로필·이름)
     각본은 이름이 대사 앞에 인라인으로 붙어서 프로필 이미지가 의미 없음
     알림은 이미지·이름 무조건 표시라 추가 옵션 필요 없음 */
  if (!isNotif) {
    const extraLabel = el('label', 'lab', '추가 옵션');
    extraLabel.style.marginTop = 'var(--sp-lg)';
    bubbleBody.appendChild(extraLabel);
    const extraGrid = el('div', 'grid-2');
    extraGrid.style.cssText = 'gap:var(--sp-md) 14px;margin-top:var(--sp-sm)';
    const mkTgl = (lab, val, on) => {
      const row = el('div', 'tgl-inline');
      row.appendChild(el('span', 'lab', lab));
      const btn = el('div', 'tgl tgl-sm' + (val ? ' is-on' : ''));
      btn.onclick = () => on(!val);
      row.appendChild(btn);
      return row;
    };
    if (isBubble && resolvePreset(t) === 'bubble') {
      const place = (node, column, row) => {
        node.style.gridColumn = String(column);
        node.style.gridRow = String(row);
        extraGrid.appendChild(node);
      };
      const tagOn = t.artistTag !== false;
      place(mkTgl('아티스트 태그', tagOn, v => { t.artistTag = v; rerender(); }), 1, 1);
      place(mkTgl('그림자', t.bubbleShadow, v => { t.bubbleShadow = v; rerender(); }), 2, 1);
      if (tagOn) place(colorField('태그 색', t.artistTagColor || '#F080A6', v => { t.artistTagColor = v; up(); }), 1, 2);
      place(mkTgl('좌측 프로필', t.showAvatar, v => { t.showAvatar = v; rerender(); }), 2, 2);
      place(mkTgl('좌측 이름', t.showName, v => { t.showName = v; rerender(); }), 1, tagOn ? 3 : 2);
      place(mkTgl('우측 프로필', !!t.myAvatar, v => { t.myAvatar = v; rerender(); }), 2, 3);
      place(mkTgl('우측 이름', !!t.myName, v => { t.myName = v; rerender(); }), 1, tagOn ? 4 : 3);
    } else {
      if (!isScript && !isSns) extraGrid.appendChild(mkTgl('라운드 프로필', t.roundAvatar, v => { t.roundAvatar = v; rerender(); }));
      if (isBubble) extraGrid.appendChild(mkTgl('그림자', t.bubbleShadow, v => { t.bubbleShadow = v; rerender(); }));
      if (!isScript && !isSns) extraGrid.appendChild(mkTgl('좌측 프로필', t.showAvatar, v => { t.showAvatar = v; rerender(); }));
      if (!isSns) extraGrid.appendChild(mkTgl('좌측 이름', t.showName, v => { t.showName = v; rerender(); }));
      if (!isScript && !isSns) extraGrid.appendChild(mkTgl('우측 프로필', !!t.myAvatar, v => { t.myAvatar = v; rerender(); }));
      if (!isSns) extraGrid.appendChild(mkTgl('우측 이름', !!t.myName, v => { t.myName = v; rerender(); }));
    }
    bubbleBody.appendChild(extraGrid);
  }

  bubbleSection.appendChild(bubbleBody);
  body.appendChild(bubbleSection);

  /* ═══ 텍스트 서식 ═══ */
  const textSection = el('div', 'section' + (openSec.text ? ' open' : ''));
  const textHeader = el('div', 'section-header');
  textHeader.innerHTML = '<h3>서식</h3><svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  textHeader.onclick = () => { openSec.text = !openSec.text; textSection.classList.toggle('open'); };
  textSection.appendChild(textHeader);
  const textBody = el('div', 'section-body');
  if (!t.fmt) t.fmt = Object.assign({}, S.format);
  t.useFont = true;

  /* 단 지정 */
  const colField = el('div', 'field');
  colField.appendChild(el('label', 'lab', '단 수'));
  colField.appendChild(segment([[1, '1단'], [2, '2단'], [3, '3단']], t.fmt.columns || 1,
    v => { t.fmt.columns = +v; rerender(); }));
  textBody.appendChild(colField);
  if ((t.fmt.columns || 1) > 1) {
    const gapField = el('div', 'field');
    gapField.style.marginTop = 'var(--sp-md)';
    gapField.appendChild(stepH('단 간격', t.fmt.columnGap ?? 24, 0, 80, 2, v => { t.fmt.columnGap = v; up(); }));
    textBody.appendChild(gapField);
  }

  /* 글꼴 컨트롤 */
  const fontCtl = fontControls(t.fmt, rerender, up);
  fontCtl.style.marginTop = 'var(--sp-lg)';
  textBody.appendChild(fontCtl);

  textSection.appendChild(textBody);
  body.appendChild(textSection);

  /* ═══ 서명 ═══ */
  const signSection = el('div', 'section' + (openSec.sign ? ' open' : ''));
  const signHeader = el('div', 'section-header');
  signHeader.innerHTML = '<h3>서명</h3><svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  signHeader.onclick = () => { openSec.sign = !openSec.sign; signSection.classList.toggle('open'); };
  signSection.appendChild(signHeader);
  const signBody = el('div', 'section-body');
  const signTgl = el('div', 'tgl-inline');
  signTgl.appendChild(el('span', 'lab', '서명 표시'));
  const signBtn = el('div', 'tgl tgl-sm' + (t.signShow ? ' is-on' : ''));
  signBtn.onclick = () => { t.signShow = !t.signShow; rerender(); };
  signTgl.appendChild(signBtn);
  signBody.appendChild(signTgl);
  if (t.signShow) {
    const signGrid = el('div', 'grid-2');
    signGrid.style.marginTop = 'var(--sp-md)';
    const cf = el('div', 'field');
    cf.appendChild(el('label', 'lab', '캐릭터'));
    const ci = el('input', 'inp');
    ci.placeholder = '예) 해이';
    ci.value = t.signChar || '';
    ci.oninput = () => { t.signChar = ci.value; up(); };
    cf.appendChild(ci);
    signGrid.appendChild(cf);
    const mf = el('div', 'field');
    mf.appendChild(el('label', 'lab', '제작자'));
    const mi = el('input', 'inp');
    mi.placeholder = '예) @luvheil';
    mi.value = t.signMaker || '';
    mi.oninput = () => { t.signMaker = mi.value; up(); };
    mf.appendChild(mi);
    signGrid.appendChild(mf);
    signBody.appendChild(signGrid);

    /* 정렬 — segment 스타일 (버디버디는 만든이 영역에 서명이 들어가므로 정렬 선택 불필요) */
    if (frameKind(t) !== 'buddy') {
      const alignField = el('div', 'field');
      alignField.style.marginTop = 'var(--sp-md)';
      alignField.appendChild(el('label', 'lab', '정렬'));
      alignField.appendChild(segment([['left', '좌측 정렬'], ['center', '중앙 정렬'], ['right', '우측 정렬']],
        t.signAlign || 'right', v => { t.signAlign = v; rerender(); }));
      signBody.appendChild(alignField);
    }

    /* 구분·서식 — 같은 줄에 icb 버튼 스타일로, 자동 배분 */
    const fmtLine = el('div', 'tool-line');
    fmtLine.style.cssText = 'margin-top:var(--sp-md);justify-content:space-evenly;';

    /* 구분 */
    const sepGrp = el('div', 'tool-grp');
    sepGrp.appendChild(el('span', 'tool-lab', '구분 기호'));
    const sepBtns = el('div', 'tool-grp');
    sepBtns.style.gap = '6px';
    const mkSepBtn = (val) => {
      const btn = el('button', 'icb' + ((t.signSep || '·') === val ? ' is-on' : ''));
      btn.style.boxShadow = 'none';
      btn.textContent = val;
      btn.title = val;
      btn.onclick = () => { t.signSep = val; rerender(); };
      return btn;
    };
    sepBtns.appendChild(mkSepBtn('·'));
    sepBtns.appendChild(mkSepBtn('|'));
    sepGrp.appendChild(sepBtns);
    fmtLine.appendChild(sepGrp);
    fmtLine.appendChild(el('div', 'tool-sep'));

    /* 서식 */
    const fmtGrp = el('div', 'tool-grp');
    fmtGrp.appendChild(el('span', 'tool-lab', '서식'));
    const fmtBtns = el('div', 'tool-grp');
    fmtBtns.style.gap = '6px';
    const mkSignFmt = (label, key, icon) => {
      const btn = el('button', 'icb' + (t[key] ? ' is-on' : ''));
      btn.style.boxShadow = 'none';
      btn.innerHTML = icon;
      btn.title = label;
      btn.onclick = () => { t[key] = !t[key]; rerender(); };
      return btn;
    };
    fmtBtns.appendChild(mkSignFmt('볼드', 'signBold', '<b style="font-weight:700">B</b>'));
    fmtBtns.appendChild(mkSignFmt('이탤릭', 'signItalic', '<b style="font-style:italic">I</b>'));
    fmtGrp.appendChild(fmtBtns);
    fmtLine.appendChild(fmtGrp);

    signBody.appendChild(fmtLine);
  }
  signSection.appendChild(signBody);
  body.appendChild(signSection);

  container.appendChild(body);
  restoreThemeForm(container, formState, t.id);
}

/* 테마 저장 */
function saveThemeEditV2() {
  const t = S.ui.themeDraft;
  if (!t) return;

  const idx = S.themes.findIndex(x => x.id === t.id);
  if (idx >= 0) {
    S.themes[idx] = t;
  }

  S.ui.editingThemeId = null;
  S.ui.themeDraft = null;
  S.ui.canvasSnapshot = null; /* 캔버스 변경 확정 */
  save();
  toast('저장되었습니다');

  /* 목록으로 돌아가기 */
  const slider = $('#tabSlider');
  if (slider) setSettingsView(2);
  renderThemeGridV2();
  renderCanvas();
}

/* 테마 삭제 */
function deleteThemeEditV2() {
  const t = S.ui.themeDraft;
  if (!t) return;

  /* 기본 테마는 삭제 불가 */
  if (S.themes.length <= 1) {
    toast('마지막 테마는 삭제할 수 없습니다');
    return;
  }

  confirmDelete('테마 삭제', `"${t.name || '이름 없음'}" 테마를 삭제하시겠습니까?`, () => {
    const idx = S.themes.findIndex(x => x.id === t.id);
    if (idx >= 0) {
      S.themes.splice(idx, 1);
      /* 삭제된 테마가 활성 테마였다면 첫 번째 테마로 전환 */
      if (S.activeThemeId === t.id) {
        S.activeThemeId = S.themes[0]?.id;
      }
      S.ui.editingThemeId = null;
      S.ui.themeDraft = null;
      save();
      toast('삭제되었습니다');

      const slider = $('#tabSlider');
      if (slider) setSettingsView(2);
      renderThemeGridV2();
      renderCanvas();
    }
  });
}

/* v2 설정 패널 이벤트 초기화 */
function initSettingsPanelV2() {
  const panel = $('#settingsPanel');
  if (!panel) return;

  /* 탭 버튼 클릭 */
  document.querySelectorAll('.tabs-line .tab-line').forEach((tab, i) => {
    tab.addEventListener('click', () => switchSettingsTab(i));
  });

  /* 캐릭터 추가 버튼 */
  const btnAddChar = $('#btnAddCharV2');
  if (btnAddChar) btnAddChar.onclick = () => openCharEditV2('new');

  /* 캐릭터 뒤로 가기 */
  const btnCharBack = $('#btnCharBack');
  if (btnCharBack) {
    btnCharBack.onclick = () => {
      const goBack = () => {
        resetSettingsTabUI();
        renderCharListV2();
      };
      /* 저장하지 않은 수정이 있으면 확인 */
      if (confirmDiscardCharDraft(goBack)) return;
      S.ui.editingCharacterId = null;
      S.ui.charDraft = null;
      goBack();
    };
  }

  /* 캐릭터 복제 */
  const btnCharDupe = $('#btnCharDupeV2');
  if (btnCharDupe) {
    btnCharDupe.onclick = () => copyEditor($('#charEditView'), () => {
      const c = S.ui.charDraft;
      if (!c || S.ui.editingCharacterId === 'new') return;
      const copy = Object.assign({}, c);
      delete copy.__for;
      copy.id = uid();
      copy.name = (c.name || '캐릭터') + ' 사본';
      const stored = charOf(S.ui.editingCharacterId);
      S.characters.splice(S.characters.indexOf(stored) + 1, 0, copy);
      save();
      S.ui.editingCharacterId = copy.id;
      S.ui.charDraft = null;
      openCharEditV2(copy.id);
      toast('캐릭터를 복제했습니다');
    });
  }

  /* 캐릭터 저장/삭제 */
  const btnCharSave = $('#btnCharSaveV2');
  if (btnCharSave) btnCharSave.onclick = saveCharEditV2;

  const btnCharDelete = $('#btnCharDeleteV2');
  if (btnCharDelete) btnCharDelete.onclick = deleteCharEditV2;

  /* 캐릭터 이름 입력 */
  const charNameInp = $('#charNameV2');
  if (charNameInp) {
    charNameInp.oninput = () => {
      if (S.ui.charDraft) {
        S.ui.charDraft.name = charNameInp.value;
        /* 아바타 미리보기 업데이트 */
        const avPrev = $('#charAvatarPreviewV2');
        if (avPrev && !S.ui.charDraft.avatar) {
          avPrev.textContent = charNameInp.value ? charNameInp.value.charAt(0).toUpperCase() : '?';
        }
      }
    };
  }

  /* 캐릭터 아바타 선택 */
  const btnCharAvatar = $('#btnCharAvatarV2');
  if (btnCharAvatar) {
    btnCharAvatar.onclick = () => {
      const c = S.ui.charDraft;
      if (!c) return;
      openAvatarModal(c.avatar, d => {
        c.avatar = d;
        syncCharEditFormV2();
      });
    };
  }

  /* 캐릭터 말풍선 토글 */
  const bubbleToggle = $('#charBubbleToggleV2');
  if (bubbleToggle) {
    bubbleToggle.onclick = () => {
      const c = S.ui.charDraft;
      if (!c) return;
      c.useCustomBubble = !c.useCustomBubble;
      bubbleToggle.classList.toggle('is-on', c.useCustomBubble);
      const bubbleOpts = $('#charBubbleOptsV2');
      if (bubbleOpts) bubbleOpts.style.display = c.useCustomBubble ? 'block' : 'none';
    };
  }

  /* 캐릭터 말풍선 색상 */
  const charBubbleBg = $('#charBubbleBgV2');
  const charBubbleBgSw = $('#charBubbleBgSwV2');
  if (charBubbleBg) {
    charBubbleBg.oninput = () => {
      if (S.ui.charDraft) {
        S.ui.charDraft.bubbleBg = charBubbleBg.value;
        if (charBubbleBgSw) charBubbleBgSw.style.background = charBubbleBg.value;
      }
    };
  }
  if (charBubbleBgSw) {
    charBubbleBgSw.style.cursor = 'pointer';
    charBubbleBgSw.onclick = () => {
      if (!S.ui.charDraft) return;
      openColorPop(charBubbleBgSw, S.ui.charDraft.bubbleBg || '#6C7A89', '배경색', c => {
        if (!c) return;
        S.ui.charDraft.bubbleBg = c;
        charBubbleBgSw.style.background = c;
        if (charBubbleBg) charBubbleBg.value = c;
      });
    };
  }

  const charBubbleFg = $('#charBubbleFgV2');
  const charBubbleFgSw = $('#charBubbleFgSwV2');
  if (charBubbleFg) {
    charBubbleFg.oninput = () => {
      if (S.ui.charDraft) {
        S.ui.charDraft.bubbleFg = charBubbleFg.value;
        if (charBubbleFgSw) charBubbleFgSw.style.background = charBubbleFg.value;
      }
    };
  }
  if (charBubbleFgSw) {
    charBubbleFgSw.style.cursor = 'pointer';
    charBubbleFgSw.onclick = () => {
      if (!S.ui.charDraft) return;
      openColorPop(charBubbleFgSw, S.ui.charDraft.bubbleFg || '#FFFFFF', '글자색', c => {
        if (!c) return;
        S.ui.charDraft.bubbleFg = c;
        charBubbleFgSw.style.background = c;
        if (charBubbleFg) charBubbleFg.value = c;
      });
    };
  }

  /* ── 테마 이벤트 ── */

  /* 테마 뒤로 가기 */
  const btnThemeBack = $('#btnThemeBack');
  if (btnThemeBack) {
    btnThemeBack.onclick = () => {
      const goBack = () => {
        const slider = $('#tabSlider');
        if (slider) setSettingsView(2);
        renderThemeGridV2();
      };
      /* 저장하지 않은 수정이 있으면 확인 */
      if (confirmDiscardThemeDraft(goBack)) return;
      S.ui.editingThemeId = null;
      S.ui.themeDraft = null;
      goBack();
    };
  }

  /* 테마 복제 */
  const btnThemeDupe = $('#btnThemeDupeV2');
  if (btnThemeDupe) {
    btnThemeDupe.onclick = () => copyEditor($('#themeEditView'), () => {
      const t = S.ui.themeDraft;
      if (!t) return;
      const copy = JSON.parse(JSON.stringify(t));
      copy.id = uid();
      copy.name = (t.name || '테마') + ' 사본';
      const src = S.themes.find(x => x.id === t.id);
      S.themes.splice(S.themes.indexOf(src) + 1, 0, copy);
      S.activeThemeId = copy.id;
      save();
      S.ui.editingThemeId = copy.id;
      S.ui.themeDraft = null;
      openThemeEditV2(copy.id);
      toast('테마를 복제했습니다');
    });
  }

  /* 테마 저장/삭제 */
  const btnThemeSave = $('#btnThemeSaveV2');
  if (btnThemeSave) btnThemeSave.onclick = saveThemeEditV2;

  const btnThemeDelete = $('#btnThemeDeleteV2');
  if (btnThemeDelete) btnThemeDelete.onclick = deleteThemeEditV2;

  /* 테마 초기화 */
  const btnThemeReset = $('#btnThemeResetV2');
  if (btnThemeReset) {
    btnThemeReset.onclick = () => {
      const id = S.ui.editingThemeId;
      if (!id) return;
      const orig = S.themes.find(t => t.id === id);
      if (!orig) return;
      S.ui.themeDraft = JSON.parse(JSON.stringify(orig));
      openThemeEditV2(id);
      toast('테마를 초기화했습니다');
    };
  }

  /* 테마 이름 */
  const themeNameInp = $('#themeNameV2');
  if (themeNameInp) {
    themeNameInp.oninput = () => {
      if (S.ui.themeDraft) S.ui.themeDraft.name = themeNameInp.value;
    };
  }

  /* 테마 배경색 */
  const themeBg = $('#themeBgV2');
  const themeBgSw = $('#themeBgSwV2');
  if (themeBg) {
    themeBg.oninput = () => {
      if (S.ui.themeDraft) {
        S.ui.themeDraft.bg = themeBg.value;
        if (themeBgSw) themeBgSw.style.background = themeBg.value;
        renderCanvas();
      }
    };
  }
  if (themeBgSw) {
    themeBgSw.style.cursor = 'pointer';
    themeBgSw.onclick = () => {
      if (!S.ui.themeDraft) return;
      openColorPop(themeBgSw, S.ui.themeDraft.bg || '#FFFFFF', '배경색', c => {
        if (!c) return;
        S.ui.themeDraft.bg = c;
        themeBgSw.style.background = c;
        if (themeBg) themeBg.value = c;
        renderCanvas();
      });
    };
  }

  /* 테마 말풍선 배경 */
  const themeBubbleBg = $('#themeBubbleBgV2');
  const themeBubbleBgSw = $('#themeBubbleBgSwV2');
  if (themeBubbleBg) {
    themeBubbleBg.oninput = () => {
      if (S.ui.themeDraft) {
        S.ui.themeDraft.bubbleBg = themeBubbleBg.value;
        if (themeBubbleBgSw) themeBubbleBgSw.style.background = themeBubbleBg.value;
        renderCanvas();
      }
    };
  }
  if (themeBubbleBgSw) {
    themeBubbleBgSw.style.cursor = 'pointer';
    themeBubbleBgSw.onclick = () => {
      if (!S.ui.themeDraft) return;
      openColorPop(themeBubbleBgSw, S.ui.themeDraft.bubbleBg || '#E4F6E4', '말풍선 배경', c => {
        if (!c) return;
        S.ui.themeDraft.bubbleBg = c;
        themeBubbleBgSw.style.background = c;
        if (themeBubbleBg) themeBubbleBg.value = c;
        renderCanvas();
      });
    };
  }

  /* 테마 말풍선 글자색 */
  const themeBubbleFg = $('#themeBubbleFgV2');
  const themeBubbleFgSw = $('#themeBubbleFgSwV2');
  if (themeBubbleFg) {
    themeBubbleFg.oninput = () => {
      if (S.ui.themeDraft) {
        S.ui.themeDraft.fg = themeBubbleFg.value;
        if (themeBubbleFgSw) themeBubbleFgSw.style.background = themeBubbleFg.value;
        renderCanvas();
      }
    };
  }
  if (themeBubbleFgSw) {
    themeBubbleFgSw.style.cursor = 'pointer';
    themeBubbleFgSw.onclick = () => {
      if (!S.ui.themeDraft) return;
      openColorPop(themeBubbleFgSw, S.ui.themeDraft.fg || '#1C1C1E', '글자색', c => {
        if (!c) return;
        S.ui.themeDraft.fg = c;
        themeBubbleFgSw.style.background = c;
        if (themeBubbleFg) themeBubbleFg.value = c;
        renderCanvas();
      });
    };
  }

  /* 테마 글자 크기 step */
  const fontSizeInp = $('#themeFontSizeV2');
  if (fontSizeInp) {
    const container = fontSizeInp.closest('.step');
    if (container) {
      container.querySelectorAll('button').forEach(btn => {
        const step = parseFloat(btn.dataset.step);
        btn.onclick = () => {
          if (!S.ui.themeDraft) return;
          const cur = parseFloat(fontSizeInp.value) || 15;
          const next = Math.max(8, Math.min(40, cur + step));
          fontSizeInp.value = next;
          S.ui.themeDraft.fontSize = next;
          renderCanvas();
        };
      });
    }
    fontSizeInp.onchange = () => {
      if (S.ui.themeDraft) {
        const v = Math.max(8, Math.min(40, parseFloat(fontSizeInp.value) || 15));
        fontSizeInp.value = v;
        S.ui.themeDraft.fontSize = v;
        renderCanvas();
      }
    };
  }

  /* 테마 줄 높이 step */
  const lineHeightInp = $('#themeLineHeightV2');
  if (lineHeightInp) {
    const container = lineHeightInp.closest('.step');
    if (container) {
      container.querySelectorAll('button').forEach(btn => {
        const step = parseFloat(btn.dataset.step);
        btn.onclick = () => {
          if (!S.ui.themeDraft) return;
          const cur = parseFloat(lineHeightInp.value) || 1.6;
          const next = Math.max(1, Math.min(3, Math.round((cur + step) * 10) / 10));
          lineHeightInp.value = next;
          S.ui.themeDraft.lineHeight = next;
          renderCanvas();
        };
      });
    }
    lineHeightInp.onchange = () => {
      if (S.ui.themeDraft) {
        const v = Math.max(1, Math.min(3, parseFloat(lineHeightInp.value) || 1.6));
        lineHeightInp.value = Math.round(v * 10) / 10;
        S.ui.themeDraft.lineHeight = v;
        renderCanvas();
      }
    };
  }

  /* 꼬리 방향 선택 */
  const tailSel = $('#themeTailSelV2');
  if (tailSel) {
    tailSel.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        if (!S.ui.themeDraft) return;
        tailSel.querySelectorAll('button').forEach(b => b.classList.remove('is-on'));
        btn.classList.add('is-on');
        S.ui.themeDraft.tail = btn.dataset.tail;
        renderCanvas();
      };
    });
  }

  /* 섹션 아코디언 */
  document.querySelectorAll('.section-header').forEach(header => {
    header.onclick = () => {
      const section = header.closest('.section');
      if (section) section.classList.toggle('open');
    };
  });

  /* 색상 swatch 클릭 시 컬러 피커 열기 — 이미 핸들러가 있는 v2 스와치는 건너뛴다 */
  document.querySelectorAll('.colorf .sw').forEach(sw => {
    if (sw.id) return; /* v2 스와치는 initComposerV2에서 처리 */
    sw.style.cursor = 'pointer';
    sw.onclick = () => {
      const inp = sw.nextElementSibling;
      if (inp && inp.type === 'text') {
        const label = sw.closest('.field')?.querySelector('.lab')?.textContent || '색상';
        openColorPop(sw, inp.value || '#424448', label, c => {
          if (!c) return;
          sw.style.background = c;
          inp.value = c;
          inp.dispatchEvent(new Event('change'));
        });
      }
    };
  });
}

/* 테마가 들고 있는 사진 한 장을 고르는 칸 — 아이메시지 화면머리와 미니홈피 대문이 함께 쓴다.
   칸 이름은 사진 «옆» 이 아니라 «위» 다 — 옆에 두면 44px 짜리 단추 한가운데에 맞춰 떠서,
   위의 '이름' 칸과 왼쪽 끝도 위아래 자리도 어긋난다. 위에 두면 이 구획의 다른 칸들과
   같은 줄에서 시작한다. 옆에 남는 것은 «그래서 어떻게 되나» 뿐이다. */
function themeAvatarField(t, opts, onUpdate) {
  const o = opts || {};
  const update = onUpdate || render;  /* 패널 전체를 다시 그려야 버튼·지우기가 갱신된다 */
  const label = o.label || '프로필 사진';
  const avBox = el('div');
  avBox.appendChild(el('span', 'lab', label));
  const row = el('div', 'row'); row.style.alignItems = 'center';
  const avBtn = el('button', 'av-chip');
  avBtn.style.cssText = 'width:44px;height:44px;flex:0 0 44px';
  /* 정사각이 아니면 동그란 칩이 거짓말이 된다 — 모서리만 살짝 둥근 네모로 보여 준다 */
  if (o.ratio && o.ratio !== '1:1') avBtn.style.borderRadius = '6px';
  avBtn.title = label + ' 편집';
  if (t.headerAvatar) { const i = el('img'); i.src = t.headerAvatar; avBtn.appendChild(i); }
  else {
    avBtn.classList.add('is-pick');
    /* 캔버스 헤더와 같은 사람 실루엣 아이콘 */
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.innerHTML = '<circle cx="12" cy="7.6" r="4.9"/><path d="M12 14.6c-5.4 0-9.1 3.3-9.1 7.2V24h18.2v-2.2c0-3.9-3.7-7.2-9.1-7.2z"/>';
    avBtn.appendChild(svg);
  }
  avBtn.onclick = () => openAvatarModal(t.headerAvatar, d => { t.headerAvatar = d; update(); }, o);
  const side = el('div'); side.style.flex = '1';
  if (t.headerAvatar) {
    const clr = el('button', 'btn btn-quiet', '사진 지우기');
    clr.onclick = () => { t.headerAvatar = ''; update(); };
    side.appendChild(clr);
  } else {
    /* .hint 는 패널 «바깥» 여백(--pad)을 안고 있어 여기서는 혼자 안으로 들어가 보인다 —
       칸 안에서 쓰는 잔글씨(.lab-sub)로 둔다. 다른 안내 줄과도 같은 결이 된다. */
    side.appendChild(Object.assign(el('div', 'lab-sub'),
      { textContent: o.hint || '미지정 시 회색 사람 아이콘으로 대체됩니다.' }));
  }
  row.append(avBtn, side);
  avBox.appendChild(row);
  return avBox;
}

function themeEditor() {
  const src = S.themes.find(x => x.id === S.ui.editingThemeId);
  if (!src) return el('div');
  /* 테마는 색·여백·글꼴을 한꺼번에 갈아 끼우는 물건이라 손대는 즉시 굳으면 되돌리기 어렵다.
     그래서 사본(초안)을 놓고 고친다 — 미리보기는 초안을 그리고(theme() 이 초안을 돌려준다),
     저장소에는 [저장] 을 눌러야 옮겨 담는다. 닫으면 초안째 버린다. */
  if (!S.ui.themeDraft || S.ui.themeDraft.id !== src.id) {
    S.ui.themeDraft = JSON.parse(JSON.stringify(src));
  }
  const t = S.ui.themeDraft;
  const box = el('div', 'editcard');
  /* [저장] 단추와 제목의 «•» 는 «초안이 원본과 다른가» 하나로 정해진다. 그런데 그 판정은
     패널을 다시 그릴 때만 계산됐다 — 색·테마명·화면머리 이름처럼 «치는 대로 캔버스에만
     반영» 하는 손잡이들은 패널을 안 그리므로(치던 자리를 잃는다), 값이 바뀌어도 단추는
     옛 상태로 남아 «고쳤는데 저장이 안 눌리는» 꼴이 됐다.
     이제 그 손잡이들이 값을 만질 때마다 여기를 부른다 — 패널은 그대로 두고 단추만 고친다. */
  let okBtn = null;
  const isDirty = () => JSON.stringify(t) !== JSON.stringify(src);
  const syncDirty = () => {
    const d = isDirty();
    ttl.textContent = '수정하기' + (d ? ' •' : '');
    ttl.title = d ? '저장하지 않은 수정이 있습니다' : '';
    if (okBtn) { okBtn.textContent = d ? '저장' : '저장됨'; okBtn.disabled = !d; }
  };
  const up = () => { renderCanvas(); syncDirty(); };
  const dirty = isDirty();

  /* 캐릭터 편집과 같은 머리 — 제목 왼쪽, 복제·닫기 오른쪽 */
  const head = el('div', 'row-between');
  const ttl = el('div', 'sec-title', '수정하기' + (dirty ? ' •' : ''));
  ttl.style.margin = '0';
  ttl.title = dirty ? '저장하지 않은 수정이 있습니다' : '';
  head.appendChild(ttl);
  const hg = el('div', 'row'); hg.style.gap = '6px';
  /* 기본 제공 테마에만 둔다 — 되돌릴 '처음' 이 있는 것은 그것들뿐이다.
     색·여백·꼬리·프로필까지 통째로 처음 상태가 된다. 초안만 바꾸므로 [저장] 전에는 되돌릴 수 있다. */
  if (presetOf(src)) {
    const rs = el('button', 'icb icb-sm', '↺');
    rs.title = '이 테마를 기본값으로'; rs.setAttribute('aria-label', '기본값으로');
    rs.onclick = () => {
      const f = freshPreset(src);
      if (!f) return;
      Object.keys(t).forEach(k => { if (!(k in f)) delete t[k]; });
      Object.assign(t, f);
      render(); toast('기본값으로 되돌렸습니다 · 저장해야 확정됩니다');
    };
    hg.appendChild(rs);
  }
  /* 복제 — 마음에 드는 테마에서 한 군데만 바꿔 쓰고 싶을 때가 대부분이라
     빈 테마를 만드는 것보다 이쪽이 훨씬 자주 쓰인다. 지금 고치던 값 그대로 복제한다. */
  const dup = el('button', 'icb icb-sm', '⧉');
  dup.title = '이 테마를 복제'; dup.setAttribute('aria-label', '테마 복제');
  dup.onclick = () => {
    const copy = JSON.parse(JSON.stringify(t));
    copy.id = uid();
    copy.name = (t.name || '테마') + ' 사본';
    S.themes.splice(S.themes.indexOf(src) + 1, 0, copy);
    S.activeThemeId = copy.id; S.ui.editingThemeId = copy.id; S.ui.themeDraft = null;
    save(); render(); toast('테마를 복제했습니다');
  };
  const cl = el('button', 'icb icb-sm');
  cl.title = '닫기 (저장하지 않은 수정은 버립니다)'; cl.setAttribute('aria-label', '닫기');
  cl.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  cl.onclick = () => {
    /* 고친 것이 있으면 토스트로 알리고 끝낼 일이 아니다 — 되돌릴 수 없으므로 먼저 묻는다 */
    if (confirmDiscardThemeDraft(() => { render(); toast('수정을 취소했습니다'); })) return;
    S.ui.editingThemeId = null; S.ui.themeDraft = null;
    render();
  };
  hg.append(dup, cl); head.appendChild(hg);
  box.append(head, el('div', 'divider'));

  box.appendChild(el('span', 'lab', '테마명'));
  const n = el('input', 'inp'); n.value = t.name; n.placeholder = '예) 윤도 전용 iMessage';
  n.oninput = () => { t.name = n.value; syncDirty(); };
  n.onchange = () => render();
  box.appendChild(n);

  /* 프레임 — 캔버스 네 변을 두르는 껍데기 [FRAMES]. 테마명 바로 다음, 무엇보다 앞에 둔다:
     이것을 고르는 순간 배경 이미지도 헤더도 함께 가려지므로 [headerNode], 아래 칸들이
     무엇을 할 수 있는지가 여기서 정해진다. 뒤에 두면 «왜 이 칸이 사라졌지» 를 위로
     거슬러 올라가며 찾게 된다 — 무엇이 무엇을 덮는지가 곧 차례다. */
  box.appendChild(el('div', 'divider'));
  box.appendChild(el('div', 'sec-title', '프레임'));
  const frKind = frameKind(t);
  const frBox = el('div', 'stack');
  frBox.appendChild(segment(FRAMES, frKind, v => { t.frame = v; render(); }));
  if (frKind !== 'none') {
    frBox.appendChild(Object.assign(el('div', 'lab-sub'), {
      textContent: (frKind === 'cyworld'
        ? '판형이 4:3 가로로 고정됩니다 · 본문은 오른쪽 쪽에만 흐릅니다'
        : '본문이 창 안쪽에만 흐릅니다 · 판형은 그대로 고를 수 있습니다')
        + ' · 캔버스 여백은 창 안쪽부터 잽니다'
    }));
    const nw = el('div');
    nw.appendChild(el('span', 'lab', frKind === 'cyworld' ? '미니홈피 주인' : '대화 상대'));
    const ni = el('input', 'inp');
    ni.value = t.headerTitle || '';
    ni.placeholder = '이름';
    /* 적는 대로 캔버스에 비친다. render() 를 부르면 이 칸이 통째로 새로 그려져
       치던 자리를 잃는다 — 캔버스만 다시 그린다. */
    ni.oninput = () => { t.headerTitle = ni.value; up(); };
    nw.appendChild(ni);
    frBox.appendChild(nw);
  }
  if (frKind === 'cyworld') {
    /* 왼쪽 쪽 맨 윗줄 — «TODAY IS ○○». 그 시절 미니홈피에서 기분을 적던 자리다.
       비워 두면 «TODAY IS» 만 남는다. 길면 … 로 잘린다 [.mh-today]. */
    const mdW = el('div');
    mdW.appendChild(el('span', 'lab', 'TODAY IS'));
    const mdI = el('input', 'inp');
    mdI.value = t.frameMood || '';
    mdI.placeholder = '예) 맑음';
    mdI.oninput = () => { t.frameMood = mdI.value; up(); };
    mdW.appendChild(mdI);
    frBox.appendChild(mdW);
    /* 대문 사진 — 프로필·앨범 커버와 같은 자르기 창을 쓴다. 비율만 4:3 이다 [openAvatarModal] */
    frBox.appendChild(themeAvatarField(t, {
      label: '대문 사진', title: '미니홈피 대문 사진',
      sub: '4:3 으로 잘라 넣습니다. 끌어서 위치를, 아래에서 크기를 맞추세요.',
      hint: '미지정 시 회색 사람 아이콘으로 대체됩니다.',
      ratio: '4:3', maxPx: 640
    }, render));
  }
  box.appendChild(frBox);

  /* ═══ 캔버스 (v2: 테마 안으로 통합) ═══════════════════════════ */
  box.appendChild(el('div', 'divider'));
  box.appendChild(el('div', 'sec-title', '캔버스'));
  const cvBox = el('div', 'stack');
  /* 테마별 캔버스 — 없으면 기본값으로 초기화 */
  if (!t.canvas) t.canvas = Object.assign({}, DEF_CANVAS);
  const c = t.canvas;
  const lockR = lockRatio();
  if (lockR) {
    const lseg = segment([[lockR, lockR + ' 고정']], lockR, () => { });
    lseg.style.pointerEvents = 'none';
    cvBox.appendChild(lseg);
    const lnote = el('div', 'lab-sub');
    lnote.style.margin = '9px 0 0';
    lnote.textContent = (FRAMES.find(f => f[0] === frameKind(theme())) || [, ''])[1]
      + "은 캔버스 사이즈를 변경할 수 없습니다.";
    cvBox.appendChild(lnote);
  } else {
    cvBox.appendChild(el('span', 'sec-lab', '판형'));
    cvBox.appendChild(segment([['fit', '내용 맞춤'], ['ratio', '비율 지정']], c.mode || 'ratio',
      v => { c.mode = v; save(); render(); }));
    const cvHint = el('div', 'lab-sub');
    cvHint.style.margin = '9px 0 0';
    cvHint.textContent = isFit()
      ? '내용에 맞춰 캔버스 크기와 비율이 함께 수정'
      : '비율에 맞춰 페이지를 여러 장으로 자동 분할';
    cvBox.appendChild(cvHint);
    const cvBody = el('div'); cvBody.style.marginTop = '14px';
    if (isFit()) {
      const lab = el('span', 'lab', '캔버스 좌우 너비');
      const val = el('span', 'lab-sub', (c.width ?? 560) + 'px');
      val.style.cssText = 'display:inline;margin-left:6px';
      lab.appendChild(val); cvBody.appendChild(lab);
      const r = el('input', 'rng');
      r.type = 'range'; r.min = 300; r.max = 1000; r.step = 10; r.value = c.width ?? 560;
      r.oninput = () => { c.width = +r.value; val.textContent = c.width + 'px'; renderCanvas(); };
      r.onchange = () => save();
      cvBody.appendChild(r);
    } else {
      cvBody.appendChild(el('span', 'lab', '캔버스 비율'));
      const RSUB = { '9:16': '스토리', '3:4': '세로', '1:1': '정사각', '4:3': '가로', '16:9': '와이드' };
      cvBody.appendChild(segment(Object.keys(RATIOS).map(k => [k, `${k}<small>${RSUB[k]}</small>`, true]),
        c.ratio, v => { c.ratio = v; save(); render(); }));
    }
    cvBox.appendChild(cvBody);
  }
  cvBox.appendChild(marginSection(c));
  box.appendChild(cvBox);

  /* ═══ 서명 (v2: 테마 안으로 통합) ═══════════════════════════════
     예전에는 footer 블록으로 관리했지만 v2 부터는 테마 설정이다.
     기존 footer 블록이 있으면 그것이 우선하고, 없으면 테마 서명을 쓴다. */
  box.appendChild(el('div', 'divider'));
  box.appendChild(el('div', 'sec-title', '서명'));
  const signBox = el('div', 'stack');
  /* 서명 표시 토글 — 토글하면 하위 설정이 나타나거나 사라지므로 render() 를 부른다 */
  const signTgl = el('div', 'tgl-row');
  const signTglLab = el('span', 'lab', '서명 표시');
  const signTglBtn = el('div', 'tgl tgl-sm' + (t.signShow ? ' is-on' : ''));
  signTglBtn.onclick = () => { t.signShow = !t.signShow; render(); };
  signTgl.append(signTglLab, signTglBtn);
  signBox.appendChild(signTgl);
  /* 서명이 켜져 있을 때만 세부 설정을 보여 준다 */
  if (t.signShow) {
    const signFields = el('div', 'grid2'); signFields.style.marginTop = '12px';
    /* 캐릭터 이름 */
    const charField = el('div', 'field');
    charField.appendChild(el('label', 'lab', '캐릭터'));
    const charInp = el('input', 'inp');
    charInp.placeholder = '예) 해이';
    charInp.value = t.signChar || '';
    charInp.oninput = () => { t.signChar = charInp.value; up(); };
    charField.appendChild(charInp);
    signFields.appendChild(charField);
    /* 제작자 */
    const makerField = el('div', 'field');
    makerField.appendChild(el('label', 'lab', '제작자'));
    const makerInp = el('input', 'inp');
    makerInp.placeholder = '예) @luvheil';
    makerInp.value = t.signMaker || '';
    makerInp.oninput = () => { t.signMaker = makerInp.value; up(); };
    makerField.appendChild(makerInp);
    signFields.appendChild(makerField);
    signBox.appendChild(signFields);
    /* 위치와 구분자 (버디버디는 만든이 영역에 서명이 들어가므로 위치 선택 불필요) */
    const signOpts = el('div', 'grid2'); signOpts.style.marginTop = '12px';
    if (frameKind(t) !== 'buddy') {
      const alignField = el('div', 'field');
      alignField.appendChild(el('label', 'lab', '위치'));
      alignField.appendChild(segment([['left', '좌'], ['center', '중앙'], ['right', '우']],
        t.signAlign || 'right', v => { t.signAlign = v; up(); }));
      signOpts.appendChild(alignField);
    }
    const sepField = el('div', 'field');
    sepField.appendChild(el('label', 'lab', '구분'));
    sepField.appendChild(segment([['·', '·'], ['|', '|']], t.signSep || '·', v => { t.signSep = v; up(); }));
    signOpts.appendChild(sepField);
    signBox.appendChild(signOpts);
  }
  box.appendChild(signBox);

  /* 배경 — «캔버스를 무엇으로 채우나» 를 한 구획에 모은다. 색 두 칸과 그 위에 까는
     이미지는 같은 것을 정한다 — 이미지는 색을 덮는 것이지 딴 이야기가 아니다.
     그래서 '배경 이미지' 는 구획 제목(.sec-title)이 아니라 '전체 배경' 과 같은 칸 이름(.lab)이다. */
  box.appendChild(el('div', 'divider'));
  box.appendChild(el('div', 'sec-title', '기본 배경'));
  const gBg = el('div', 'grid2');
  /* 프레임을 두르면 이 색이 칠해지는 데는 캔버스 전체가 아니라 창 안쪽이다 [.fr-hole] —
     이름도 그렇게 바꿔 준다. 고치는 값은 같은 t.bg 하나다. */
  gBg.appendChild(colorField(frKind === 'none' ? '전체 배경' : '본문 배경', t.bg, v => { t.bg = v; up(); }));
  gBg.appendChild(colorField('전체 글자', t.fg, v => { t.fg = v; up(); }));
  box.appendChild(gBg);
  /* 배경 이미지는 프레임 껍데기 아래로 완전히 가려진다 — 고를 칸을 아예 안 내놓는다.
     («고를 수는 있는데 안 보이는» 칸은 고장으로 읽힌다.) 값은 지우지 않는다:
     프레임을 도로 «없음» 으로 돌리면 깔아 두었던 그림이 그대로 살아난다. */
  if (frKind !== 'none') {
    const bgNote = el('div', 'lab-sub');
    bgNote.style.marginTop = '11px';
    bgNote.textContent = (FRAMES.find(f => f[0] === frKind) || [, ''])[1] + "은 배경 이미지 설정이 불가합니다.";
    box.appendChild(bgNote);
  } else {
    /* 배경 이미지 — v2 스타일: 버튼만 두고 모달에서 설정 */
    const bgiField = el('div', 'field'); bgiField.style.marginTop = 'var(--sp-md)';
    bgiField.appendChild(el('label', 'lab', '배경 이미지'));
    const openBg = () => openBgImageModal(t.bgImage || '', (d, cropped) => {
      t.bgImage = d;
      if (cropped) { t.bgSize = 100; t.bgX = 50; t.bgY = 50; }
      render();
    }, t);
    const pickBtn = el('button', 'btn btn-quiet', t.bgImage ? '이미지 변경' : '이미지 선택');
    pickBtn.style.width = '100%';
    pickBtn.onclick = openBg;
    bgiField.appendChild(pickBtn);
    box.appendChild(bgiField);
  }

  /* 헤더 — 프레임을 두르면 아예 안 그려지므로 [headerNode] 고를 칸 자체를 안 내놓는다.
     이름과 프로필 사진은 위의 프레임 구획이 이미 받아 갔다. */
  if (frKind === 'none') {
  box.appendChild(el('div', 'divider'));
  box.appendChild(el('div', 'sec-title', '헤더'));
  const hdBox = el('div', 'stack');
  const hdKind = headKind(t);
  hdBox.appendChild(segment(HEADS, hdKind, v => { t.header = v; render(); }));
  if (TITLE_HEADER_FIELDS[hdKind]) {
    hdBox.appendChild(titleHeaderControls(t, hdKind, up));
  } else if (hdKind !== 'none') {
    /* 신문은 칸이 둘이다 — 큰 제호와 그 아래 한 줄. 제호를 붙박이로 두었더니
       «내 신문» 이 안 되었다: 신문 이름은 발췌마다 다르다. */
    if (hdKind === 'news') {
      const mw = el('div');
      mw.appendChild(el('span', 'lab', '제호'));
      const mi = el('input', 'inp');
      mi.value = t.headerMark ?? '';
      /* 제호 예시는 placeholder로만 안내한다.
         그것이 저장본에 찍히므로, 안내는 흐린 글씨로만 둔다. */
      mi.placeholder = NEWS_MARK;
      mi.oninput = () => { t.headerMark = mi.value; up(); };
      mw.appendChild(mi);
      hdBox.appendChild(mw);
    }
    const tw = el('div');
    tw.appendChild(el('span', 'lab', hdKind === 'news' ? '날짜 · 한 줄' : '이름'));
    const ti = el('input', 'inp');
    ti.value = t.headerTitle || '';
    ti.placeholder = hdKind === 'news' ? '예) 1986년 12월 26일 금요일' : '예) 사해이';
    /* 적는 대로 캔버스에 비친다. render() 를 부르면 이 칸이 통째로 새로 그려져
       치던 자리를 잃는다 — 캔버스만 다시 그린다. */
    ti.oninput = () => { t.headerTitle = ti.value; up(); };
    tw.appendChild(ti);
    hdBox.appendChild(tw);
  }
  /* 프로필 사진이 자리를 차지하는 것은 아이메시지뿐이다 — 나머지에서는 고를 이유가 없다 */
  if (hdKind === 'imessage') hdBox.appendChild(themeAvatarField(t, {}, render));
  /* 머리 배경색 — 띠를 칠할 수 있는 것은 메시지1·2 다. 헤드라인은 신문 제호라 띠가 없다.
     토글 뒤에 숨기지 않는다 — 다른 색 칸들과 같은 «늘 있는 값» 이고, 무엇을 고르는지도
     칩을 봐야 안다. 아직 고른 적이 없으면 칩은 «자동» 색을 비춘다 [headerNode 의 .055 / A]:
     메시지1 은 그 색이 지금 화면의 띠 색 그대로라, 골라도 화면이 안 뛴다.
     ↺ 는 골라 둔 색을 지워 «자동» 으로 되돌린다 — 메시지1 은 옅은 자동 띠로,
     메시지2 는 원래대로 띠 없이 캔버스 배경 위에 선다. */
  if (hdKind === 'imessage') {
    const auto = mixHex(t.bg, t.fg, .055 / HD_BAND_A);
    const cur = (t.headerBg || '').trim();
    const bgW = el('div');
    const bgHead = el('div', 'row-between');
    const bgLab = el('span', 'lab', '배경색'); bgLab.style.margin = '0';
    const rs = el('button', 'icb icb-sm', '↺');
    rs.title = '자동으로 되돌리기'; rs.setAttribute('aria-label', '자동으로');
    rs.disabled = !cur;
    rs.onclick = () => { t.headerBg = ''; render(); };
    bgHead.append(bgLab, rs);
    bgW.appendChild(bgHead);

function segment(items, cur, on) {

    const b = el('button', String(cur) === String(v) ? 'is-on' : '');
    if (isHtml) b.innerHTML = l; else b.textContent = l;
    b.onclick = () => on(v);
    s.appendChild(b);
  });
  return s;
}
function toggleRow(label, sub, val, on) {
  const r = el('div', 'row-between');
  const L = el('div');
  const t1 = el('span', 'lab', label); t1.style.margin = '0';
  L.appendChild(t1);
  if (sub) L.appendChild(el('div', 'lab-sub', sub));

  t.onclick = () => { const nv = !t.classList.contains('is-on'); t.classList.toggle('is-on', nv); on(nv); };
  r.append(L, t);

}
/* dec=1 이면 소수점 한 자리까지 받는다. 음수도 그대로 받는다. */
/* 라벨과 컨트롤을 한 줄에 놓는다. 세로로 쌓으면 패널이 금세 길어진다. */
function stepH(label, val, min, max, step, on, dec) {
  const r = el('div', 'steph');
  r.appendChild(el('span', 'lab', label));
  const s = el('div', 'step');
  const minus = el('button', '', '−'), plus = el('button', '', '+');
  const i = el('input'); i.type = 'text'; i.inputMode = dec ? 'decimal' : (min < 0 ? 'text' : 'numeric');
  const fmt = v => dec ? String(Math.round(v * 10) / 10) : String(Math.round(v));
  i.value = fmt(val);
  const read = () => { const n = parseFloat(String(i.value).replace(/[^\d.\-]/g, '')); return Number.isFinite(n) ? n : 0; };
  const set = v => { v = clamp(dec ? Math.round(v * 10) / 10 : Math.round(v), min, max); i.value = fmt(v); on(v); };
  /* [+]/[−] 는 click 이 아니라 pointerup 으로 받는다 [bindStickyTap].
     칸에 숫자를 치고 나서 [+] 를 누르면 첫 번을 늘 흘렸다 — 누르는 순간 칸에서 포커스가
     빠지며 change 가 먼저 터지고, 그 콜백이 패널을 통째로 다시 그려 단추가 사라져서
     pointerup 이 «방금 새로 생긴 다른 단추» 위에 떨어졌기 때문이다(그러면 click 이 안 난다).
     칸을 잡고 있을 때만 기본 동작을 막아 포커스가 안 빠지게 한다 — 안 잡고 있을 때는
     막지 않는다. 이 칸은 세로로 스크롤되는 패널 안이라, 늘 막으면 단추 위에서 시작한
     쓸어내리기가 죽는다 [bindFormatAction 과 같은 이유]. */

  bindStickyTap(plus, () => set(read() + step), holdFocus);

  return r;
}

/* ═══ 이미지 굽기 ═══════════════════════════════════════════
   작업 내용은 localStorage 에 통째로 들어간다. 그 칸은 5MB 안팎인데 요즘 사진은
   한 장이 그보다 크다 — 고른 파일을 그대로 담으면 캐릭터 두어 명에 저장이 통째로
   실패하고, 화면에는 멀쩡히 보이니 새로고침하기 전까지 알 수도 없다.
   그래서 넣기 전에 반드시 다시 굽는다. webp 는 같은 그림을 png 의 1/5~1/10 로 줄이고
   투명도도 그대로 살린다 — 못 쓰는 브라우저에서는 png 로 떨어진다. */
function encodeCanvas(cv) {
  try {
    const w = cv.toDataURL('image/webp', 0.92);
    if (w.indexOf('data:image/webp') === 0) return w;
  } catch (_) { }
  return cv.toDataURL('image/png');
}
/* 비율은 그대로 두고 긴 변만 maxPx 로 줄여 다시 굽는다. 실패하면 원본을 돌려준다. */
function shrinkImage(src, maxPx) {
  return new Promise(res => {
    if (!src || !/^data:image\//i.test(src)) { res(src); return; }
    const im = new Image();
    im.onload = () => {
      try {
        const w = im.naturalWidth, h = im.naturalHeight;
        if (!w || !h) { res(src); return; }
        const k = Math.min(1, maxPx / Math.max(w, h));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
        const g = cv.getContext('2d');
        if (!g) { res(src); return; }
        g.drawImage(im, 0, 0, cv.width, cv.height);
        const out = encodeCanvas(cv);
        res(out && out.length < src.length ? out : src);
      } catch (e) { console.warn('이미지 굽기 실패 — 원본 사용', e); res(src); }
    };
    im.onerror = () => res(src);
    im.src = src;
  });
}

/* 파일 하나를 data URL 로 읽는다 — 고르기 · 끌어놓기 · 붙여넣기가 모두 이 길로 들어온다 */
const readImageFile = (f, cb) => {
  const r = new FileReader();
  r.onload = () => cb(r.result);
  r.onerror = () => toast('이미지를 읽지 못했습니다');
  r.readAsDataURL(f);
};
const imageFileOf = dt => {
  const files = dt && dt.files ? [...dt.files] : [];
  return files.find(f => /^image\//i.test(f.type)) || null;
};

/* ═══ 사진 끌어놓기 ═══════════════════════════════════════════
   받는 자리를 캔버스로만 좁히면 손이 조금 어긋났을 때 브라우저가 그 파일을 그냥 열어
   페이지를 갈아 끼운다 — 쓰던 내용이 통째로 날아간다. 그래서 창 전체에서 기본 동작을
   막고, 그 위에서 이미지 파일일 때만 편집 모달로 넘긴다.
   모달이 열려 있으면 새로 만들지 않고 지금 자르고 있는 틀의 그림을 갈아 끼운다. */
(function initDropImage() {
  const veil = el('div', 'drop-veil', '사진을 놓으면 이미지 블록으로 추가됩니다');
  let depth = 0;
  const hasFiles = e => {
    const dt = e.dataTransfer;
    if (!dt) return false;
    if (dt.types && [...dt.types].indexOf('Files') >= 0) return true;
    return !!(dt.files && dt.files.length);
  };
  const show = on => {
    if (on && !veil.parentNode) document.body.appendChild(veil);
    if (!on && veil.parentNode) veil.remove();
    const cv = $('#canvas'); if (cv) cv.classList.toggle('is-drop', on);
  };
  addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; show(true); });
  addEventListener('dragover', e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'copy'; } catch (_) { }
  });
  addEventListener('dragleave', e => {
    if (!hasFiles(e)) return;
    depth = Math.max(0, depth - 1);
    if (!depth) show(false);
  });
  addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    depth = 0; show(false);
    const f = imageFileOf(e.dataTransfer);
    if (!f) { toast('이미지 파일만 넣을 수 있습니다'); return; }
    const crop = document.querySelector('#modalRoot .crop, #formatWrap .crop');
    if (crop && crop._dropFile) { crop._dropFile(f); return; }
    if ($('#modalRoot').firstChild) return;      /* 다른 모달이 떠 있으면 건드리지 않는다 */
    readImageFile(f, d => startNew('image', d));
  });
})();

let _toastT;
function toast(msg, duration = 1800) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('is-on');
  t.classList.toggle('is-persistent', duration === 0);
  clearTimeout(_toastT);
  if (duration === 0) {
    const dismiss = el('button', '', '×');
    dismiss.setAttribute('aria-label', '알림 닫기');
    dismiss.onclick = () => { t.classList.remove('is-on'); t.classList.remove('is-persistent'); };
    t.appendChild(dismiss);
  } else _toastT = setTimeout(() => t.classList.remove('is-on'), duration);
}

function weightSteps(name) {
  const a = [...new Set((fontOf(name).w || [400, 700, 800]).filter(w => w >= 400))].sort((x, y) => x - y);

  const mid = a.slice(1, -1).reduce((best, w) => Math.abs(w - 700) < Math.abs(best - 700) ? w : best, a[1]);

/* ═══ 저장 결과 넘기기 [원본 mobile-save-choice / mobileSavedImageViewer] ═══

   떨어질 뿐이고 인앱 브라우저에서는 아예 막히기도 한다. 사진첩으로 가는 길은 공유 시트뿐이라

async function deliver(items) {
  if (!isHandheld()) {
    items.forEach((it, i) => setTimeout(() => download(it.url, it.name), i * 450));
    toast(items.length > 1
      ? `${items.length}장 다운로드를 요청했습니다 · 자동 다운로드 허용과 목록을 확인해주세요`
      : '다운로드를 요청했습니다 · 다운로드 목록을 확인해주세요');

  /* 공유에 넘기려면 File 이어야 한다 — data URL 을 blob 으로 되돌린다 */
  const out = [];
  for (const it of items) {
    const blob = await fetch(it.url).then(r => r.blob());
    out.push({ blob, url: URL.createObjectURL(blob), name: it.name });

  if ($('#saveSheet').classList.contains('is-on')) closeSaveSheet();

  const root = $('#saveSheet');
