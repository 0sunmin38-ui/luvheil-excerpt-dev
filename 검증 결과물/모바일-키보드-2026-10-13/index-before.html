      clearRich('color'); block.text = reflowComposer(null); block.color = v;
    }
    save(); render();
  }, true);
  colorA.style.boxShadow = 'none';
  colorGrp.appendChild(colorA);
  const colorH = colorBtn('✏️', S.colors.highlight, '형광펜', v => {
    /* 형광펜은 블록 단위 값이 없다. 선택이 없으면 글 전체에 건다. */
    if (v == null) {
      if (hasSel()) { formatSelection(() => clearRich('mark')); return; }
      clearRich('mark');
    } else {
      const hv = overlayOnWhite(v, .8);
      S.colors.highlight = hv;
      if (hasSel()) { formatSelection(() => applyRich('mark', hv)); return; }
      applyRich('mark', hv);
    }
    const markup = reflowComposer(null);
    block.text = markup;
    save(); render();
  }, true);
  colorH.style.boxShadow = 'none';
  colorGrp.appendChild(colorH);
  line2.append(alignGrp, el('div', 'tool-sep'), colorGrp);
  fmtSection.appendChild(line2);

  /* 3행: 서식 (BIUS + 윗주석 + 아랫주석 통합) */
  const line3 = el('div', 'tool-line');
  const styleGrp = el('div', 'tool-grp');
  styleGrp.appendChild(el('span', 'lab', '서식'));
  [['B', 'bold', '굵게'], ['I', 'italic', '기울임'], ['U', 'underline', '밑줄'], ['S', 'strike', '취소선']].forEach(([label, key, title]) => {
    const btn = el('button', 'icb');
    btn.style.boxShadow = 'none';
    const st = key === 'italic' ? 'font-style:italic' : key === 'underline' ? 'text-decoration:underline' : key === 'strike' ? 'text-decoration:line-through' : 'font-weight:700';
    btn.innerHTML = `<b style="${st}">${label}</b>`;
    btn.title = title;
    btn.onclick = () => { formatSelection(() => applyRich(key)); };
    styleGrp.appendChild(btn);
  });
  /* 윗주석/아랫주석도 서식에 통합 */
  [['윗주석', 'sup', 0], ['아랫주석', 'sub', 1]].forEach(([title, tag, idx]) => {
    const btn = el('button', 'icb' + (block.ann === idx + 1 ? ' is-on' : ''));
    btn.style.boxShadow = 'none';
    btn.innerHTML = `<span class="ann">A<${tag}>2</${tag}></span>`;
    btn.title = title;
    btn.onclick = () => {
      clearRich('sup'); clearRich('sub');
      block.ann = block.ann === idx + 1 ? 0 : idx + 1;
      save(); render();
    };
    styleGrp.appendChild(btn);
  });
  line3.appendChild(styleGrp);
  fmtSection.appendChild(line3);

  host.appendChild(fmtSection);
}

/* 정사각형 이미지 모달 — 파일 · 링크 [원본 memberEditor 의 tabFile/tabLink]
   캐릭터 프로필과 화면머리 사진, 그리고 음악 카드의 앨범 커버가 같은 칸을 쓴다.
   셋 다 «정사각형으로 잘라 넣고, 끌어서 위치를 맞추고, 확대로 크기를 잡는» 같은 일이라
   틀을 하나만 두고 머리말만 갈아 끼운다 — 자리마다 다른 자르기 창을 두면 손이 헤맨다. */
function openAvatarModal(cur, onDone, opts) {
  const o = opts || {};
  /* 틀의 비율과 구워 낼 크기는 부르는 쪽이 정한다 — 프로필·앨범 커버는 정사각 256 이지만
     미니홈피 대문 사진은 4:3 이고 캔버스에서 훨씬 크게 나온다. 자르는 «일» 은 같으므로
     창을 새로 만들지 않고 이 둘만 받는다. */
  const R = o.ratio || '1:1', MAX = o.maxPx || 256;
  const p = modal(o.title || '캐릭터 이미지',
    o.sub || '정사각형으로 잘라 넣습니다. 끌어서 위치를 맞추세요.');
  const crop = cropField(cur, R);
  crop._maxPx = MAX;
  const zoomWrap = el('div', 'slideh');
  zoomWrap.appendChild(el('span', 'lab', '확대'));
  const zoom = el('input', 'rng'); zoom.type = 'range'; zoom.step = '0.01';
  zoomWrap.appendChild(zoom);
  crop._onScale = base => { zoom.min = base; zoom.max = base * 3; zoom.value = base; };
  zoom.oninput = () => crop._zoom(parseFloat(zoom.value));

  const body = el('div', 'stack');
  const stage = el('div', 'crop-stage'); stage.style.position = 'relative';
  /* 미리보기를 누르면 곧바로 이미지 선택 — 별도 버튼도 파일/링크 탭도 두지 않는다 */
  const imgBtns = el('div');
  imgBtns.style.cssText = 'position:absolute;right:8px;bottom:8px;z-index:4;display:flex;gap:6px;';
  imgBtns.hidden = !cur;
  crop._onPick = () => { imgBtns.hidden = false; };
  const pick = () => pickImage(d => { crop._setSrc(d); imgBtns.hidden = false; });
  crop.style.cursor = 'pointer';
  crop.addEventListener('click', e => { if (!crop._src) { e.stopPropagation(); pick(); } });
  const reBtn = el('button', 'btn btn-quiet');
  reBtn.style.cssText = 'box-shadow:var(--shadow-pop);width:32px;height:32px;padding:0;';
  reBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
  reBtn.title = '바꾸기';
  reBtn.onclick = e => { e.stopPropagation(); pick(); };
  const rmBtn = el('button', 'btn btn-danger btn-fill');
  rmBtn.style.cssText = 'box-shadow:var(--shadow-pop);width:32px;height:32px;padding:0;';
  rmBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
  rmBtn.title = '삭제';
  rmBtn.onclick = e => { e.stopPropagation(); crop._setSrc(''); imgBtns.hidden = true; };
  imgBtns.append(reBtn, rmBtn);
  stage.append(crop, imgBtns);
  body.append(stage, zoomWrap);
  p.appendChild(body);

  const foot = el('div', 'modal-foot');
  const cancel = el('button', 'btn btn-quiet', '취소'); cancel.onclick = closeModal;
  const ok = el('button', 'btn btn-primary', '확인');
  ok.onclick = () => {
    const d = crop._export() || cur || '';
    closeModal();
    /* 프로필은 캔버스에서 28px, 앨범 커버도 50px 남짓이다 — 원본 해상도를 들고 있을 이유가 없다 */
    shrinkImage(d, MAX).then(onDone);
  };
  foot.append(cancel, ok); p.appendChild(foot);
}

/* 배경 이미지 모달 — 테마가 주어지면 캔버스와 동일한 CSS 기반 미리보기를 표시한다.
   위치·회전·확대·흐림·덮기를 모달 안에서 미리 보면서 조절할 수 있다. */
function openBgImageModal(cur, onDone, t) {
  /* 테마별 캔버스 — 없으면 전역 캔버스 사용 */
  if (t && !t.canvas) t.canvas = { ...themeCanvas(t) };
  const c = t ? t.canvas : canvas();
  const was = { ...c };
  const bgKeys = ['bgImage', 'bgSize', 'bgX', 'bgY', 'bgRotation', 'bgBlur', 'bgOverlay', 'bgOverlayColor'];
  const beforeBg = t ? Object.fromEntries(bgKeys.map(key => [key, t[key]])) : null;
  const p = modal('배경 이미지', t
    ? '미리보기에서 실제 캔버스와 동일하게 표시됩니다.'
    : '변경한 비율은 캔버스에 바로 적용됩니다.');
  const up = () => {
    /* t와 S.ui.themeDraft가 다른 객체일 수 있음 (클로저 문제)
       t의 배경 속성을 S.ui.themeDraft에 동기화해야 renderCanvas()에서 반영됨 */
    if (t && S.ui.themeDraft && S.ui.themeDraft !== t) {
      S.ui.themeDraft.bgImage = t.bgImage;
      S.ui.themeDraft.bgSize = t.bgSize;
      S.ui.themeDraft.bgX = t.bgX;
      S.ui.themeDraft.bgY = t.bgY;
      S.ui.themeDraft.bgRotation = t.bgRotation;
      S.ui.themeDraft.bgBlur = t.bgBlur;
      S.ui.themeDraft.bgOverlay = t.bgOverlay;
      S.ui.themeDraft.bgOverlayColor = t.bgOverlayColor;
      S.ui.themeDraft.canvas = { ...c };
    }
    renderCanvas();
  };

  const body = el('div', 'stack');
  const RSUB = { '9:16': '스토리', '3:4': '세로', '1:1': '정사각', '4:3': '가로', '16:9': '와이드' };

  /* 테마가 주어지면 CSS 기반 미리보기, 아니면 기존 cropField */
  let currentSrc = cur || '';
  let previewEl = null, imgLayer = null, overlayLayer = null;

  if (t) {
    /* ══ CSS 기반 미리보기 (캔버스와 동일한 렌더링) ══ */
    const stage = el('div', 'crop-stage');
    stage.style.cssText = 'position:relative;overflow:hidden;border-radius:var(--r-md);background:' + (t.bg || '#fff');
    stage.style.aspectRatio = String(c.ratio || '9:16').replace(':', '/');

    /* 이미지 레이어 — 캔버스 .cv-bg i 와 동일한 스타일 */
    imgLayer = el('div');
    imgLayer.style.cssText = 'position:absolute;display:block;background-repeat:no-repeat;';
    /* 오버레이 레이어 */
    overlayLayer = el('div');
    overlayLayer.style.cssText = 'position:absolute;inset:0;pointer-events:none;';

    const syncPreview = () => {
      const rot = t.bgRotation ?? 0;
      const hasRotation = rot !== 0;
      const bgSizeVal = t.bgSize ?? 100;
      /* 회전 시 inset:-25%, 크기 보정 */
      if (hasRotation) {
        imgLayer.style.inset = '-25%';
        imgLayer.style.backgroundSize = bgSizeVal === 100 ? '66.67%' : (bgSizeVal * 0.6667) + '%';
      } else {
        imgLayer.style.inset = '0';
        imgLayer.style.backgroundSize = bgSizeVal === 100 ? 'cover' : bgSizeVal + '%';
      }
      imgLayer.style.backgroundImage = currentSrc ? `url("${currentSrc}")` : 'none';
      imgLayer.style.backgroundPosition = `${t.bgX ?? 50}% ${t.bgY ?? 50}%`;
      imgLayer.style.transform = `rotate(${rot}deg)`;
      imgLayer.style.filter = (t.bgBlur ?? 0) > 0 ? `blur(${t.bgBlur}px)` : 'none';
      /* 오버레이 */
      overlayLayer.style.background = t.bgOverlayColor || '#000000';
      overlayLayer.style.opacity = (t.bgOverlay ?? 0) / 100;
    };

    /* 이미지 선택/변경 버튼 */
    const imgBtns = el('div');
    imgBtns.style.cssText = 'position:absolute;right:8px;bottom:8px;z-index:4;display:flex;gap:6px;';
    /* 배경 이미지도 압축 적용 — localStorage 용량 및 렌더링 성능 개선 */
    const pick = () => pickImage(async rawData => {
      const d = await shrinkImage(rawData, 2048);
      currentSrc = d;
      /* 항상 S.ui.themeDraft를 수정해야 renderCanvas()에서 반영됨 */
      if (S.ui.themeDraft) S.ui.themeDraft.bgImage = d;
      t.bgImage = d; /* 미리보기용 */
      c.mode = 'ratio';
      if (!RATIOS[c.ratio]) c.ratio = '9:16';
      imgBtns.querySelector('.rm-btn').hidden = !d;
      syncPreview();
      up();
    });
    const pickBtn = el('button', 'btn btn-quiet');
    pickBtn.style.cssText = 'box-shadow:var(--shadow-pop);height:32px;padding:0 12px;';
    pickBtn.textContent = currentSrc ? '변경' : '이미지 선택';
    pickBtn.onclick = pick;
    const rmBtn = el('button', 'btn btn-danger btn-fill rm-btn');
    rmBtn.style.cssText = 'box-shadow:var(--shadow-pop);width:32px;height:32px;padding:0;';
    rmBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    rmBtn.title = '삭제';
    rmBtn.hidden = !currentSrc;
    rmBtn.onclick = () => { currentSrc = ''; if (S.ui.themeDraft) S.ui.themeDraft.bgImage = ''; t.bgImage = ''; rmBtn.hidden = true; pickBtn.textContent = '이미지 선택'; syncPreview(); up(); };
    imgBtns.append(pickBtn, rmBtn);

    stage.append(imgLayer, overlayLayer, imgBtns);
    syncPreview();

    /* 드래그로 위치 조정 */
    stage.style.cursor = 'grab';
    let dragState = null;
    stage.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return; /* 버튼 클릭은 무시 */
      e.preventDefault();
      stage.style.cursor = 'grabbing';
      dragState = { startX: e.clientX, startY: e.clientY, startBgX: t.bgX ?? 50, startBgY: t.bgY ?? 50 };
      try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    });
    stage.addEventListener('pointermove', e => {
      if (!dragState) return;
      e.preventDefault();
      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;
      /* 픽셀 이동을 % 로 변환 (스테이지 크기 기준) */
      const pctX = (dx / stage.clientWidth) * 100;
      const pctY = (dy / stage.clientHeight) * 100;
      /* 드래그 방향과 이미지 이동 방향이 반대 (배경 위치는 이미지가 보이는 위치) */
      t.bgX = clamp(dragState.startBgX - pctX, 0, 100);
      t.bgY = clamp(dragState.startBgY - pctY, 0, 100);
      syncPreview();
      up();
    });
    const endDrag = () => { dragState = null; stage.style.cursor = 'grab'; };
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);

    /* 비율 선택 */
    const ratios = el('div', 'crop-ratios');
    Object.keys(RATIOS).forEach(r => {
      const b = el('button', ((c.ratio || '9:16') === r) ? 'on' : '');
      b.innerHTML = `${r}<small>${RSUB[r]}</small>`;
      b.onclick = () => {
        c.mode = 'ratio'; c.ratio = r;
        [...ratios.children].forEach(x => x.classList.toggle('on', x === b));
        stage.style.aspectRatio = r.replace(':', '/');
        up();
      };
      ratios.appendChild(b);
    });
    body.appendChild(ratios);
    body.appendChild(stage);
    previewEl = { syncPreview };

    /* 확대 슬라이더 — bgSize 제어 */
    const zoomWrap = el('div', 'slideh');
    zoomWrap.appendChild(el('span', 'lab', '확대'));
    const zoom = el('input', 'rng');
    zoom.type = 'range'; zoom.min = '50'; zoom.max = '200'; zoom.step = '5'; zoom.value = t.bgSize ?? 100;
    zoom.oninput = () => { t.bgSize = +zoom.value; syncPreview(); up(); };
    zoomWrap.appendChild(zoom);
    body.appendChild(zoomWrap);

    /* 위치 — 9방향 그리드 */
    const posWrap = posGrid9(t.bgX ?? 50, t.bgY ?? 50, (x, y) => { t.bgX = x; t.bgY = y; syncPreview(); up(); });
    posWrap.style.marginTop = 'var(--sp-lg)';
    body.appendChild(posWrap);

    /* 회전·흐림·덮기 */
    const opts = el('div', 'grid2'); opts.style.cssText = 'margin-top:var(--sp-md);row-gap:9px';
    opts.appendChild(stepH('회전', t.bgRotation ?? 0, -180, 180, 90, v => { t.bgRotation = v; syncPreview(); up(); }));
    opts.appendChild(stepH('흐림', t.bgBlur ?? 0, 0, 40, 1, v => { t.bgBlur = v; syncPreview(); up(); }));
    opts.appendChild(stepH('덮는 색 불투명도', t.bgOverlay ?? 0, 0, 100, 5, v => { t.bgOverlay = v; syncPreview(); up(); }));
    body.appendChild(opts);

    /* 덮는 색 */
    const colorWrap = colorField('덮기색', t.bgOverlayColor || '#000000', v => { t.bgOverlayColor = v; syncPreview(); up(); });
    colorWrap.style.marginTop = 'var(--sp-md)';
    body.appendChild(colorWrap);

  } else {
    /* ══ 기존 cropField 방식 (테마 없이 호출될 때) ══ */
    const crop = cropField(cur || '', c.ratio || '9:16');
    crop._maxPx = 1600;

    const ratios = el('div', 'crop-ratios');
    Object.keys(RATIOS).forEach(r => {
      const b = el('button', ((c.ratio || '9:16') === r) ? 'on' : '');
      b.innerHTML = `${r}<small>${RSUB[r]}</small>`;
      b.onclick = () => {
        c.mode = 'ratio'; c.ratio = r;
        [...ratios.children].forEach(x => x.classList.toggle('on', x === b));
        crop._setRatio(r);
        up();
      };
      ratios.appendChild(b);
    });

    const zoomWrap = el('div', 'slideh');
    zoomWrap.appendChild(el('span', 'lab', '확대'));
    const zoom = el('input', 'rng'); zoom.type = 'range'; zoom.step = '0.01';
    zoomWrap.appendChild(zoom);
    crop._onScale = base => { zoom.min = base; zoom.max = base * 3; zoom.value = base; crop._center(); };
    zoom.oninput = () => crop._zoom(parseFloat(zoom.value));

    const stage = el('div', 'crop-stage'); stage.style.position = 'relative';
    const imgBtns = el('div');
    imgBtns.style.cssText = 'position:absolute;right:8px;bottom:8px;z-index:4;display:flex;gap:6px;';
    imgBtns.hidden = !cur;
    crop._onPick = () => { imgBtns.hidden = false; };
    const pick = () => pickImage(async d => { const src = await shrinkImage(d, 2048); crop._setSrc(src); imgBtns.hidden = false; });
    crop.style.cursor = 'pointer';
    crop.addEventListener('click', e => { if (!crop._src) { e.stopPropagation(); pick(); } });
    const reBtn = el('button', 'btn btn-quiet');
    reBtn.style.cssText = 'box-shadow:var(--shadow-pop);width:32px;height:32px;padding:0;';
    reBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
    reBtn.title = '바꾸기';
    reBtn.onclick = e => { e.stopPropagation(); pick(); };
    const rmBtn = el('button', 'btn btn-danger btn-fill');
    rmBtn.style.cssText = 'box-shadow:var(--shadow-pop);width:32px;height:32px;padding:0;';
    rmBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    rmBtn.title = '삭제';
    rmBtn.onclick = e => { e.stopPropagation(); crop._setSrc(''); imgBtns.hidden = true; };
    imgBtns.append(reBtn, rmBtn);
    stage.append(crop, imgBtns);

    body.append(ratios, stage, zoomWrap);
    previewEl = { crop };
  }

  p.appendChild(body);

  const foot = el('div', 'modal-foot');
  const cancel = el('button', 'btn btn-quiet', '취소');
  const cancelChanges = () => {
    Object.assign(c, was);
    if (t) Object.assign(t, beforeBg);
    up(); closeModal(); render();
  };
  cancel.onclick = cancelChanges;
  p.parentElement.onclick = e => { if (e.target === p.parentElement) cancelChanges(); };
  const ok = el('button', 'btn btn-primary', '확인');
  ok.onclick = () => {
    if (t) {
      /* 테마 모드: 이미 t에 값들이 반영되어 있음 — false로 리셋 방지 */
      if (currentSrc) {
        c.mode = 'ratio';
        if (!RATIOS[c.ratio]) c.ratio = '9:16';
      }
      up(); closeModal();
      onDone(currentSrc, false);
    } else {
      /* 크롭 모드 */
      const out = previewEl.crop._export() || cur || '';
      if (out) { c.mode = 'ratio'; if (!RATIOS[c.ratio]) c.ratio = '9:16'; }
      closeModal();
      onDone(out, out !== (cur || ''));
    }
  };
  foot.append(cancel, ok); p.appendChild(foot);
}

/* ═══════════════════════════════════════════════════════════════
   도구
   ═══════════════════════════════════════════════════════════════ */
const HINTS = {
  character: '캐릭터를 등록합니다. 블록을 말풍선으로 바꾸면 발화자로 고를 수 있습니다.',
  canvas: '이미지의 크기와 여백입니다. 내용에 맞추거나, 비율을 정할 수 있습니다.',
  theme: '배경·말풍선·전반적인 서식을 한 테마로 저장합니다.'
};

/* 도구 칸[.sheet-body]이 굴려 온 자리. 패널은 손잡이 하나를 만질 때마다 통째로 다시
   그려지는데, 그때 내용이 잠깐 비어 굴림자리가 맨 위로 되돌아간다 — 토글 하나 켤 때마다
   화면이 위로 튀어, 무엇을 만지고 있었는지를 매번 다시 찾아야 했다.
   그래서 그리기 전에 그 자리를 적어 두고 그린 뒤 되돌린다. 탭을 옮기는 것은 «다른 것을
   보러 가는» 일이라 그때만 맨 위에서 시작한다 [toolScrollKey]. */
let toolScrollKey = '';
function renderTools() {
  const wrap = $('#toolsWrap');
  /* v2: 기존 toolsWrap 대신 settingsPanel 사용 — toolsWrap 항상 숨김 */
  wrap.hidden = true;
  /* v2 설정 패널은 setStage에서 toggleSettingsPanel로 제어됨 */
  if (S.ui.stage !== 'tools') { toolScrollKey = ''; return; }
  wrap.querySelectorAll('.tab').forEach(t => t.classList.toggle('is-on', t.dataset.tool === S.ui.tool));
  $('#toolHint').textContent = HINTS[S.ui.tool] || '';
  const sb = $('#sheetBody');
  const keep = sb ? sb.scrollTop : 0;
  const same = toolScrollKey === S.ui.tool;
  toolScrollKey = S.ui.tool;
  const p = $('#toolPanel'); p.innerHTML = '';
  /* v2: 캔버스 탭을 테마로 통합 — 기존 canvas 선택 시 theme로 전환 */
  if (S.ui.tool === 'canvas') S.ui.tool = 'theme';
  ({ character: panelCharacter, theme: panelTheme })[S.ui.tool](p);
  /* 패널 전환 시 항상 스크롤 최상단으로 초기화 */
  if (sb) sb.scrollTop = 0;
}

function panelCharacter(p) {
  const sec = el('div', 'sec');

  const ttl = el('div', 'sec-title', '캐릭터'); ttl.style.margin = '0';
  sec.appendChild(ttl);

  /* 목록과 [+] 를 한 줄에 둔다 — 추가 버튼이 제목 옆에 따로 떠 있으면
     '무엇에 더하는 버튼인가' 가 한 번 더 생각해야 알 수 있다. */
  const row = el('div', 'av-row'); row.style.marginTop = '9px';
  S.characters.forEach(c => {
    const slot = el('div', 'av-slot');
    const a = el('button', 'av-chip' + (S.ui.editingCharacterId === c.id ? ' is-on' : ''));
    if (c.avatar) { const i = el('img'); i.src = c.avatar; a.appendChild(i); } else a.innerHTML = initialSvg(c.name);
    /* v13: isMe 대신 position 표시 — 우측(나) 캐릭터만 뱃지를 단다 */
    a.title = c.name + (c.position === 'right' ? ' · 우측' : ' · 좌측');
    a.onclick = () => { S.ui.editingCharacterId = S.ui.editingCharacterId === c.id ? null : c.id; S.ui.charDraft = null; render(); };
    slot.appendChild(a);
    /* 우측 캐릭터는 별표로 표시해 좌측과 구분한다 */
    if (c.position === 'right') { const bd = el('div', 'me-badge', '⭐'); bd.title = '우측 캐릭터'; slot.appendChild(bd); }
    row.appendChild(slot);
  });
  const add = el('button', 'av-chip is-add');
  add.title = '캐릭터 추가';
  add.innerHTML = PLUS_SVG;
  add.onclick = () => { S.ui.editingCharacterId = 'new'; S.ui.charDraft = null; render(); };
  row.appendChild(add);
  sec.appendChild(row);
  if (!S.characters.length) {
    const e = el('div', 'lab-sub', '아직 등록한 캐릭터가 없습니다. [+] 로 추가하세요.');
    e.style.marginTop = '8px'; sec.appendChild(e);
  }

  if (S.ui.editingCharacterId) sec.appendChild(charEditor());
  p.appendChild(sec);
}

function charEditor() {
  const isNew = S.ui.editingCharacterId === 'new';
  /* 편집 중인 값은 이 함수의 지역 변수가 아니라 상태에 둔다.
     전에는 지역 변수였는데, 그러면 편집 도중 무슨 이유로든 화면을 다시 그릴 때
     초안이 통째로 새로 만들어진다. 이름을 쓰기 전에 이미지부터 고른 경우
     방금 고른 이미지가 그 순간 조용히 사라져 '저장이 안 되는' 것처럼 보였다.
     __for 로 편집 대상을 표시해 두고, 대상이 바뀌면 그때만 새로 만든다.
     테마 편집과 완전히 같은 얼개다 — 초안에 고치고 [저장] 으로 확정, [X] 로 버림. */
  if (!S.ui.charDraft || S.ui.charDraft.__for !== S.ui.editingCharacterId) {
    const base = isNew
      ? { id: uid(), name: '', avatar: '', useCustomBubble: false, bubbleBg: '#6C7A89', bubbleFg: '#FFFFFF', position: 'left' }
      : Object.assign({}, charOf(S.ui.editingCharacterId));
    S.ui.charDraft = Object.assign(base, { __for: S.ui.editingCharacterId });
  }
  const c = S.ui.charDraft;
  const stored = isNew ? null : charOf(S.ui.editingCharacterId);
  const box = el('div', 'editcard');

  /* 저장하지 않은 수정이 있는가. 새 캐릭터는 이름이나 이미지가 들어온 뒤부터 저장할 수 있다 —
     빈 껍데기를 목록에 넣어 봐야 지울 일만 생긴다. */
  const bare = o => { const x = Object.assign({}, o); delete x.__for; return JSON.stringify(x); };
  const dirty = () => isNew
    ? !!(c.name || '').trim() || !!c.avatar || !!c.useCustomBubble || c.position === 'right'
    : bare(c) !== bare(stored);

  /* 제목 오른쪽은 복제·닫기 자리다 — 삭제는 저장 옆(누르는 순서의 끝)으로 내렸다.
     지우는 버튼과 빠져나가는 버튼이 같은 자리에 있으면 손이 헷갈린다. */
  const head = el('div', 'row-between');
  const ttl = el('div', 'sec-title'); ttl.style.margin = '0';
  head.appendChild(ttl);
  const hg = el('div', 'row'); hg.style.gap = '6px';
  if (!isNew) {
    const dup = el('button', 'icb icb-sm', '⧉');
    dup.title = '이 캐릭터를 복제'; dup.setAttribute('aria-label', '캐릭터 복제');
    dup.onclick = () => {
      const copy = Object.assign({}, c); delete copy.__for;
      copy.id = uid();
      copy.name = (c.name || '캐릭터') + ' 사본';
      /* position 도 그대로 따라간다 — 같은 쪽(좌/우)의 캐릭터가 여럿일 수 있으므로
         한 캐릭터를 복제해 늘리는 것이 흔한 길이다. */
      S.characters.splice(S.characters.indexOf(stored) + 1, 0, copy);
      S.ui.editingCharacterId = copy.id; S.ui.charDraft = null;
      save(); render(); toast('캐릭터를 복제했습니다');
    };
    hg.appendChild(dup);
  }
  const cl = el('button', 'icb icb-sm');
  cl.title = '닫기 (저장하지 않은 수정은 버립니다)'; cl.setAttribute('aria-label', '닫기');
  cl.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  cl.onclick = () => {
    const had = dirty();
    S.ui.editingCharacterId = null; S.ui.charDraft = null;
    render();
    if (had) toast('수정을 취소했습니다');
  };
  hg.appendChild(cl); head.appendChild(hg);
  box.append(head, el('div', 'divider'));

  const top = el('div', 'row'); top.style.alignItems = 'flex-end';
  const avBtn = el('button', 'av-chip'); avBtn.style.cssText = 'width:56px;height:56px;flex:0 0 56px';
  /* 이미지가 없을 때 이름 첫 글자나 '?' 를 띄우면 여기가 사진을 넣는 자리라는 걸 알 수 없다.
     연필을 두어 눌러서 고치는 곳임을 보여준다. */
  const paint = () => {
    avBtn.innerHTML = '';
    avBtn.classList.toggle('is-pick', !c.avatar);
    if (c.avatar) { const i = el('img'); i.src = c.avatar; avBtn.appendChild(i); }
    else {
      /* 캔버스 헤더와 같은 사람 실루엣 아이콘 */
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.innerHTML = '<circle cx="12" cy="7.6" r="4.9"/><path d="M12 14.6c-5.4 0-9.1 3.3-9.1 7.2V24h18.2v-2.2c0-3.9-3.7-7.2-9.1-7.2z"/>';
      avBtn.appendChild(svg);
    }
  };
  avBtn.title = '이미지 편집';
  avBtn.onclick = () => openAvatarModal(c.avatar, d => { c.avatar = d; paint(); sync(); });
  const nb = el('div'); nb.style.flex = '1';
  nb.appendChild(el('span', 'lab', '이름'));
  const nameI = el('input', 'inp'); nameI.value = c.name; nameI.placeholder = '예) 사해이';
  /* 쓰는 즉시 초안에 담는다 — 이미지를 고르러 갔다 와도 쓰던 이름이 남는다 */
  nameI.oninput = () => { c.name = nameI.value; sync(); };
  nb.appendChild(nameI);
  top.append(avBtn, nb); box.appendChild(top); paint();

  box.appendChild(el('div', 'divider'));
  box.appendChild(toggleRow('말풍선 추가 설정', '', c.useCustomBubble,
    v => { c.useCustomBubble = v; colors.hidden = !v; sync(); }));
  const colors = el('div', 'grid2-sm'); colors.hidden = !c.useCustomBubble; colors.style.marginTop = '12px';
  colors.appendChild(colorField('말풍선 배경', c.bubbleBg, v => { c.bubbleBg = v; sync(); }));
  colors.appendChild(colorField('말풍선 글자', c.bubbleFg, v => { c.bubbleFg = v; sync(); }));
  box.appendChild(colors);

  /* v13: 캐릭터의 위치(좌/우)를 여기서 정한다. 테마에서 좌측/우측 스타일이 따로 있으므로
     캐릭터가 어느 쪽에 서는지 명시해야 한다. */
  box.appendChild(el('div', 'divider'));
  const posRow = el('div', 'row-between');
  posRow.appendChild(el('span', 'lab', '위치'));
  const posSeg = el('div', 'seg');
  const leftBtn = el('button', c.position === 'left' ? 'is-on' : '', '좌');
  const rightBtn = el('button', c.position === 'right' ? 'is-on' : '', '우');
  leftBtn.onclick = () => { c.position = 'left'; leftBtn.classList.add('is-on'); rightBtn.classList.remove('is-on'); sync(); };
  rightBtn.onclick = () => { c.position = 'right'; rightBtn.classList.add('is-on'); leftBtn.classList.remove('is-on'); sync(); };
  posSeg.append(leftBtn, rightBtn);
  posRow.appendChild(posSeg);
  box.appendChild(posRow);

  /* 삭제·저장은 카드 하단 · 복제·닫기는 제목 옆 */
  const foot = el('div', 'modal-foot'); foot.style.marginTop = '16px';
  const del = isNew ? null : dangerBtn('삭제', 'char:' + c.id, () => {
    const used = S.blocks.filter(b => b.speakerId === c.id);
    used.forEach(b => { b.speakerId = null; });
    S.characters = S.characters.filter(x => x.id !== c.id);
    S.ui.editingCharacterId = null; S.ui.charDraft = null; save(); render();
    toast(used.length ? `삭제했습니다 · 블록 ${used.length}개의 발화자 해제` : '삭제했습니다');
  });
  const ok = el('button', 'btn btn-primary');
  ok.onclick = () => {
    c.name = (nameI.value || '').trim() || '이름 없음';
    /* 같은 쪽(좌/우)에 여러 캐릭터가 있을 수 있다 — 한 발췌에 같은 쪽에 선 인물이 둘 이상인
       대화가 흔하고, 말풍선이 어느 쪽에 붙는지는 캐릭터의 position 이 정한다
       [renderBlock 의 isMe]. */
    /* __for 는 편집 중에만 쓰는 표시다 — 저장본에 섞여 들어가지 않게 떼고 넣는다 */
    const rec = Object.assign({}, c); delete rec.__for;
    if (isNew) S.characters.push(rec); else Object.assign(charOf(rec.id), rec);
    S.ui.charDraft = null;
    /* 새로 만든 뒤에는 목록으로 돌아가고, 고치던 중이면 그 자리에 남는다 —
       테마와 같은 규칙이다. */
    if (isNew) S.ui.editingCharacterId = null; else S.ui.editingCharacterId = rec.id;
    save(); render(); toast('저장했습니다');
  };
  if (del) { del.style.flex = '1'; foot.appendChild(del); }
  foot.appendChild(ok);
  box.appendChild(foot);

  /* 제목의 • 표시와 저장 버튼 상태는 초안이 바뀔 때마다 다시 잰다 —
     토글·색은 카드를 새로 그리지 않으므로 여기서 손으로 맞춰 준다. */
  function sync() {
    const d = dirty();
    ttl.textContent = (isNew ? '캐릭터 추가' : '수정하기') + (d ? ' •' : '');
    ttl.title = d ? '저장하지 않은 수정이 있습니다' : '';
    /* 아직 만든 적 없는 캐릭터에 '저장됨' 이라고 쓸 수는 없다 — 비활성으로만 둔다 */
    ok.textContent = (d || isNew) ? '저장' : '저장됨';
    ok.disabled = !d;
  }
  sync();
  return box;
}
/* 테마가 소유하는 글자 설정 한 벌. */
/* up   — 패널을 통째로 다시 그리는 갱신. 글꼴·굵기·정렬처럼 «고른 것» 을 표시로 보여 주는
          손잡이(segment · select)는 다시 그려야 켜진 자리가 옮겨 간다.
   light — 캔버스만 다시 그리는 가벼운 갱신. 스테퍼는 제 숫자를 스스로 고쳐 보여 주므로
          패널을 다시 그릴 이유가 없다. 오히려 다시 그리면 누르고 있던 단추가 사라져
          연달아 누르기가 끊긴다 [stepH]. 안 주면 up 을 쓴다(예전 동작 그대로). */
function fontControls(g, up, light) {
  /* 겉껍데기는 맨 div 다 — .sec 의 좌우 여백(--pad)을 쓰면 안 된다. 이 묶음이 사는 곳은
     테마 편집 카드[.editcard] 안이고, 그 카드가 이미 제 여백(12px)을 두고 있다.
     둘이 겹치면 여기 든 것들만 --pad 만큼 더 안으로 들어가, 바로 아래 '단 나누기' 와
     왼쪽 끝이 어긋난다. .sec 은 #toolPanel 바로 밑에 서는 묶음들의 것이다. */
  const sec = el('div');
  const tick = light || up;

  /* 글꼴 · 굵기 — 한 줄 */
  const r1 = el('div', 'grid2'); r1.style.alignItems = 'end';
  const f1 = el('div'); f1.appendChild(el('span', 'lab', '글꼴'));
  f1.appendChild(fontSelect(g.font, v => {
    g.font = v;
    /* 글꼴마다 가진 굵기가 다르다 — 새 글꼴에 없는 굵기가 그대로 남으면 어느 단추도
       안 켜지고, 화면은 그 글꼴이 대신 고른 굵기로 그려져 둘이 어긋난다 [weightSteps]. */
    g.weight = snapWeight(v, g.weight);
    clearBlockOwn('font', '글꼴'); up();
  }));
  const f2 = el('div'); f2.appendChild(el('span', 'lab', '굵기'));
  /* 눈금은 «이 글꼴이 실제로 가진 굵기» 다 [weightSteps]. 400/700/800 으로 못 박아 두면
     그 굵기가 없는 글꼴에서는 눌러도 아무 일이 안 일어난다 — 가진 만큼만 내놓는다. */
  const steps = weightSteps(g.font);
  f2.appendChild(segment(steps, snapWeight(g.font, g.weight),
    v => { g.weight = +v; clearBlockOwn('bold', '굵기'); up(); }));
  /* 굵기가 하나뿐인 글꼴은 «왜 단추가 하나뿐인가» 를 적어 준다 */
  if (steps.length < 2) f2.appendChild(el('span', 'lab-sub', '이 글꼴은 굵기가 하나뿐입니다'));
  r1.append(f1, f2); sec.appendChild(r1);

  /* 글 정렬 */
  const r2 = el('div'); r2.style.marginTop = '12px';
  r2.appendChild(el('span', 'lab', '글 정렬'));
  r2.appendChild(segment(Object.keys(ALIGN_ICON).map(k => [k, `<svg viewBox="0 0 24 24"><path d="${ALIGN_ICON[k]}"/></svg>`, true]),
    g.align, v => { g.align = v; clearBlockOwn('align', '글 정렬'); up(); }));
  sec.appendChild(r2);

  /* 위(글꼴·굵기·정렬)는 '무엇으로 쓰나', 아래는 '얼마나' 다. 성격이 달라 선으로 가른다. */
  const dv = el('div', 'divider'); dv.style.margin = '16px 0';
  sec.appendChild(dv);

  /* 글꼴 상세 설정 — 2열 가로 스테퍼.
     제목이 스테퍼 라벨(.lab)과 같은 크기면 어느 쪽이 제목인지 알 수 없다.
     '캔버스 여백' 과 같은 구획 제목(.sec-lab)으로 한 단 올린다. */
  const r3 = el('div');
  r3.appendChild(el('span', 'sec-lab', '상세 설정'));
  const gr = el('div', 'grid2'); gr.style.rowGap = '9px';
  gr.appendChild(stepH('크기', g.size, 6, 60, .5, v => { g.size = v; tick(); }, 1));
  gr.appendChild(stepH('행간', g.lineHeight * 100, 100, 250, 5, v => { g.lineHeight = v / 100; tick(); }, 1));
  gr.appendChild(stepH('자간', g.letterSpacing * 100, -20, 30, .1, v => { g.letterSpacing = v / 100; tick(); }, 1));
  gr.appendChild(stepH('문단 간격', g.blockGap, 0, 60, 1, v => { g.blockGap = v; tick(); }));
  r3.appendChild(gr); sec.appendChild(r3);

  return sec;
}

function panelCanvas(p) {
  const c = S.canvas;
  const sec = el('div', 'sec');

  /* 캔버스를 정하는 방식은 둘 중 하나다 — 쓴 만큼 나오게 두거나, 한 장의 규격을 먼저 정하거나.
     둘은 딸린 설정도 다르므로 고른 쪽만 보여 준다. */
  /* '설정' 은 도구 이름과 겹치고 '비율' 은 두 갈래 중 한쪽 이름이라 둘 다 제목으로는 못 쓴다.
     판형 — 한 장을 어떤 꼴로 뽑을지, 인쇄에서 쓰던 말 그대로다. */
  sec.appendChild(el('span', 'sec-lab', '판형'));
  /* 프레임이 판형을 정해 버리는 테마가 있다 [FRAME_RATIO] — 그때는 고를 칸을 안 내놓는다.
     흐리게 남겨 두면 눌리는 줄 알고 계속 누르게 되고, 왜 안 되는지도 알 길이 없다. */
  const lockR = lockRatio();
  if (lockR) {
    const lseg = segment([[lockR, lockR + ' 고정']], lockR, () => { });
    lseg.style.pointerEvents = 'none';
    sec.appendChild(lseg);
    const lnote = el('div', 'lab-sub');
    lnote.style.margin = '9px 0 0';
    lnote.textContent = (FRAMES.find(f => f[0] === frameKind(theme())) || [, ''])[1]
      + "은 캔버스 사이즈를 변경할 수 없습니다.";
    sec.appendChild(lnote);
    const dv0 = el('div', 'divider'); dv0.style.margin = '16px 0';
    sec.appendChild(dv0);
    sec.appendChild(marginSection(c));
    p.appendChild(sec);
    return;
  }
  sec.appendChild(segment([['fit', '내용 맞춤'], ['ratio', '비율 지정']], c.mode || 'ratio',
    v => { c.mode = v; save(); render(); }));

  const hint = el('div', 'lab-sub');
  hint.style.margin = '9px 0 0';
  hint.textContent = isFit()
    ? '내용에 맞춰 캔버스 크기와 비율이 함께 수정'
    : '비율에 맞춰 페이지를 여러 장으로 자동 분할';
  sec.appendChild(hint);

  const body = el('div'); body.style.marginTop = '14px';
  if (isFit()) {
    /* 높이는 내용이 정하므로 사람이 정할 것은 폭 하나뿐이다 [원본 lyWidth 300~1000] */
    const lab = el('span', 'lab', '캔버스 좌우 너비');
    const val = el('span', 'lab-sub', (c.width ?? 560) + 'px');
    val.style.cssText = 'display:inline;margin-left:6px';
    lab.appendChild(val); body.appendChild(lab);
    const r = el('input', 'rng');
    r.type = 'range'; r.min = 300; r.max = 1000; r.step = 10; r.value = c.width ?? 560;
    /* 끄는 동안은 캔버스만 다시 그린다 — 도구 패널까지 새로 그리면 잡고 있던 손잡이가 사라진다 */
    r.oninput = () => { c.width = +r.value; val.textContent = c.width + 'px'; renderCanvas(); };
    r.onchange = () => save();
    body.appendChild(r);
    const note = el('div', 'lab-sub', '화면이 이 값보다 좁으면 통째로 줄여서 보여 줍니다.');
    note.style.marginTop = '6px';
    body.appendChild(note);
  } else {
    body.appendChild(el('span', 'lab', '캔버스 비율'));
    const RSUB = { '9:16': '스토리', '3:4': '세로', '1:1': '정사각', '4:3': '가로', '16:9': '와이드' };
    body.appendChild(segment(Object.keys(RATIOS).map(k => [k, `${k}<small>${RSUB[k]}</small>`, true]),
      c.ratio, v => { c.ratio = v; save(); render(); }));
  }
  sec.appendChild(body);

  const dv = el('div', 'divider'); dv.style.margin = '16px 0';
  sec.appendChild(dv);
  sec.appendChild(marginSection(c));
  p.appendChild(sec);
}

/* 캔버스 여백 — 판형이 잠겼든 아니든 늘 고칠 수 있어야 해서 따로 떼어 둔다.
   프레임을 두르면 이 값은 «껍데기보다 더 들어갈 때만» 먹는다 [padT]. */
function marginSection(c) {
  const mw = el('div');
  const head = el('div', 'row-between');
  /* 프레임을 두르면 이 여백은 캔버스 가장자리가 아니라 «창 안쪽» 부터 잰다 [padT] —
     껍데기가 먹는 자리는 따로 있고, 여기서 정하는 것은 그 안에서 글이 얼마나 물러설지다. */
  const framed = frameKind(theme()) !== 'none';
  const l = el('span', 'sec-lab', '캔버스 여백'); l.style.margin = '0';
  head.appendChild(l);
  /* 열림·닫힘을 그대로 보여주는 꺾쇠. '나누기'/'합치기' 는 눌러 봐야 뭐가 되는지 알 수 있었다. */
  const tg = el('button', 'icb icb-sm');
  tg.title = c.marginDetail ? '여백 합치기 — 위아래·좌우' : '여백 나누기 — 상·하·좌·우 따로';
  tg.innerHTML = `<svg viewBox="0 0 24 24"><path d="${c.marginDetail ? 'M18 15l-6-6-6 6' : 'M6 9l6 6 6-6'}"/></svg>`;
  tg.onclick = () => { c.marginDetail = !c.marginDetail; save(); render(); };
  head.appendChild(tg); mw.appendChild(head);
  if (framed) {
    const note = el('div', 'lab-sub');
    note.style.margin = '7px 0 0';
    note.textContent = '프레임 안쪽, 글이 앉는 자리부터 잽니다.';
    mw.appendChild(note);
  }
  const box = el('div', 'grid2'); box.style.cssText = 'margin-top:9px;row-gap:9px';
  if (c.marginDetail) {
    /* 값만 바뀌는 자리다 — 캔버스만 다시 그린다. 패널까지 다시 그리면 누르던 단추가
       사라져 연달아 못 누른다 [stepH]. 스테퍼는 제 숫자를 스스로 고쳐 보여 준다. */
    box.appendChild(stepH('상단', c.mt, 0, 160, 2, v => { c.mt = v; save(); renderCanvas(); }));
    box.appendChild(stepH('하단', c.mb, 0, 160, 2, v => { c.mb = v; save(); renderCanvas(); }));
    box.appendChild(stepH('좌측', c.ml, 0, 160, 2, v => { c.ml = v; save(); renderCanvas(); }));
    box.appendChild(stepH('우측', c.mr, 0, 160, 2, v => { c.mr = v; save(); renderCanvas(); }));
  } else {
    box.appendChild(stepH('위아래', c.mt, 0, 160, 2, v => { c.mt = c.mb = v; save(); renderCanvas(); }));
    box.appendChild(stepH('좌우', c.ml, 0, 160, 2, v => { c.ml = c.mr = v; save(); renderCanvas(); }));
  }
  mw.appendChild(box);
  return mw;
}

function panelTheme(p) {
  const s = el('div', 'sec');
  const ttl = el('div', 'sec-title', '테마'); ttl.style.margin = '0';
  s.appendChild(ttl);

  const grid = el('div', 'theme-grid'); grid.style.marginTop = '9px';
  S.themes.forEach(t => {
    const card = el('button', 'theme-card' + (t.id === S.activeThemeId ? ' is-on' : ''));
    const sw = el('div', 'sw'); sw.style.background = t.bg;
    const dot = el('div'); dot.style.cssText = `width:20px;height:12px;border-radius:2px;background:${t.bubbleBg}`;
    sw.appendChild(dot); card.appendChild(sw);
    card.appendChild(el('div', 'nm', t.name || '이름'));
    card.onclick = () => {
      /* 두 테마를 한꺼번에 고칠 수는 없다 — 다른 테마로 넘어가는 것도, 고치던 테마를 다시
         눌러 편집기를 접는 것도 초안을 버리는 일이다. 버리기 전에 묻는다. */
      const go = () => {
        if (S.activeThemeId === t.id) S.ui.editingThemeId = S.ui.editingThemeId === t.id ? null : t.id;
        else { S.activeThemeId = t.id; S.ui.editingThemeId = null; }
        if (S.ui.editingThemeId !== (S.ui.themeDraft && S.ui.themeDraft.id)) S.ui.themeDraft = null;
        save(); render();
      };
      if (confirmDiscardThemeDraft(go)) return;
      go();
    };
    grid.appendChild(card);
  });
  /* 추가 버튼도 카드 하나로 목록 끝에 세운다 — 미리보기와 같은 네모라 줄이 어긋나지 않는다 */
  const add = el('button', 'theme-card is-add');
  add.title = '테마 추가';
  add.innerHTML = PLUS_SVG;
  /* 새 테마를 활성으로 올린다. 안 그러면 편집기는 새 테마를 가리키는데 캔버스는
     이전 테마를 그리고 있어서, 색을 바꿔도 미리보기가 꿈쩍하지 않는다. */
  add.onclick = () => {
    const go = () => {
      const t = DEF_THEME(); t.name = '새 테마';
      S.themes.push(t); S.activeThemeId = t.id; S.ui.editingThemeId = t.id; S.ui.themeDraft = null;
      save(); render();
    };
    /* 새 테마를 만들면 편집기가 그쪽으로 옮겨 간다 — 고치던 초안은 여기서 끝난다 */
    if (confirmDiscardThemeDraft(go)) return;
    go();
  };
  grid.appendChild(add);
  s.appendChild(grid);
  if (S.ui.editingThemeId) s.appendChild(themeEditor());
  p.appendChild(s);
}

/* ═══ v2 설정 패널 함수 ════════════════════════════════════════
   v2 디자인 시스템의 슬라이딩 탭 UI. 기존 panelCharacter/panelTheme 과 병행한다.
   tab-slider[data-active]:
     0 = 캐릭터 목록
     1 = 캐릭터 편집
     2 = 테마 목록
     3 = 테마 편집
*/

/* 설정 패널 열기/닫기 */
function syncSettingsViews() {
  const panel = $('#settingsPanel'), slider = $('#tabSlider');
  const visible = isWide() || panel.classList.contains('is-open');
  panel.inert = !visible;
  const active = Number(slider.dataset.active || 0);
  [...slider.children].forEach((view, i) => {
    view.inert = !visible || i !== active;
    view.setAttribute('aria-hidden', String(view.inert));
  });
  panel.querySelectorAll('.tab-line').forEach((tab, i) => {
    tab.classList.toggle('is-on', i === (active < 2 ? 0 : 1));
    tab.setAttribute('aria-pressed', String(i === (active < 2 ? 0 : 1)));
  });
  const indicator = $('#tabIndicator');
  indicator.style.left = (active < 2 ? 0 : 50) + '%';
  indicator.style.width = '50%';
  BTN_SETTINGS.setAttribute('aria-expanded', String(visible));
  const focused = document.activeElement;
  if (focused !== document.body && focused.closest('#settingsPanel [inert]')) {
    const view = slider.children[active];
    (focusableIn(view)[0] || panel.querySelector('.tab-line')).focus({ preventScroll: true });
  }
}
const settingsEditReturn = { character: null, theme: null };
function setSettingsView(index) {
  const previous = Number($('#tabSlider').dataset.active || 0);
  $('#tabSlider').dataset.active = String(index);
  /* 전환 중 포커스가 화면 밖 폼으로 이동해도 바깥 상자를 가로로 밀지 않는다. */
  $('#settingsPanel').scrollLeft = 0;
  $('#sheetBody').scrollLeft = 0;
  syncSettingsViews();
  if ((index === 0 && previous === 1) || (index === 2 && previous === 3)) {
    queueMicrotask(() => {
      if (Number($('#tabSlider').dataset.active) !== index || $('#settingsPanel').inert) return;
      const id = index === 0 ? settingsEditReturn.character : settingsEditReturn.theme;
      const view = index === 0 ? $('#charListView') : $('#themeListView');
      const card = [...view.querySelectorAll('[data-item-id]')].find(item => item.dataset.itemId === id);
      (card?.querySelector('.edit-btn') || focusableIn(view)[0] || $('#settingsPanel .tab-line')).focus({ preventScroll: true });
    });
  }
}
function focusSettingsEditor(view) {
  if (activeOverlay() || view.inert) return;
  if (document.activeElement === document.body || document.activeElement.closest('[inert]')) {
    focusableIn(view)[0]?.focus({ preventScroll: true });
  }
}

/* 복제 상태는 즉시 확정하고, 두 편집기 모두 같은 완료 모션을 끝까지 재생한다. */
function copyEditor(view, apply) {
  if (!view || view.dataset.copyBusy === 'true') return;
  view.dataset.copyBusy = 'true';
  const scroll = view.scrollTop;
  apply();
  view.scrollTop = scroll;
  const buttons = [...view.querySelectorAll('button')].filter(button => button.title === '복제');
  buttons.forEach(button => { button.disabled = true; });
  const done = () => {
    view.classList.remove('is-copying');
    delete view.dataset.copyBusy;
    buttons.forEach(button => { if (button.isConnected) button.disabled = false; });
  };
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) { done(); return; }
  view.classList.add('is-copying');
  const motion = view.getAnimations().find(animation => animation.animationName === 'slide-copy');
  if (motion) motion.finished.catch(() => {}).then(done);
  else done();
}

/* 컨트롤의 외형을 유지하며 이름·상태·키보드 조작을 보완한다. */
let controlSerial = 0;
function enhanceControls(root = document) {
  root.querySelectorAll('button').forEach(button => {
    if (!button.hasAttribute('aria-label') && button.title) button.setAttribute('aria-label', button.title);
    if (button.matches('.back-btn') && !button.title && !button.textContent.trim()) button.setAttribute('aria-label', '목록으로 돌아가기');
    if (button.matches('.seg button,.tgl-text button')) button.setAttribute('aria-pressed', String(button.classList.contains('is-on')));
  });
  root.querySelectorAll('.section-header').forEach(header => {
    header.setAttribute('role', 'button'); header.tabIndex = 0;
    header.setAttribute('aria-expanded', String(header.closest('.section').classList.contains('open')));
  });
  root.querySelectorAll('.tgl').forEach(toggle => {
    toggle.setAttribute('role', 'switch');
    if (toggle.tagName !== 'BUTTON') toggle.tabIndex = 0;
    toggle.setAttribute('aria-checked', String(toggle.classList.contains('is-on')));
    const label = toggle.closest('.tgl-inline,.row-between,.field')?.querySelector('.lab');
    if (label) toggle.setAttribute('aria-label', label.textContent.trim());
  });
  root.querySelectorAll('.field,.steph,.slideh,.colorf').forEach(field => {
    const label = field.querySelector('.lab') || field.closest('.field')?.querySelector('.lab');
    if (!label) return;
    field.querySelectorAll('input,select,textarea').forEach(input => {
      if (!input.hasAttribute('aria-label') && !input.hasAttribute('aria-labelledby')) input.setAttribute('aria-label', label.textContent.trim());
    });
    if (label.tagName === 'LABEL') {
      const input = field.querySelector('input,select,textarea');
      if (input) {
        if (!input.id) input.id = 'ux-control-' + (++controlSerial);
        label.htmlFor = input.id;
      }
    }
  });
  root.querySelectorAll('.sw').forEach(swatch => {
    if (typeof swatch.onclick !== 'function') return;
    swatch.setAttribute('role', 'button'); swatch.tabIndex = 0;
    const label = swatch.closest('.field,.colorf')?.querySelector('.lab')?.textContent || '색상';
    swatch.setAttribute('aria-label', label + ' 선택');
  });
  root.querySelectorAll('.char-add,.theme-card.is-add').forEach(card => {
    card.setAttribute('role', 'button'); card.tabIndex = 0;
    card.setAttribute('aria-label', card.matches('.char-add') ? '캐릭터 추가' : '테마 추가');
  });
  root.querySelectorAll('.char-card').forEach(card => {
    const name = card.querySelector('.name')?.textContent || '캐릭터';
    const info = card.querySelector('.info');
    info.setAttribute('role', 'button'); info.tabIndex = 0;
    info.setAttribute('aria-label', name + ' 편집');
    card.querySelector('.edit-btn')?.setAttribute('aria-label', name + ' 편집');
  });
  root.querySelectorAll('.theme-card:not(.is-add)').forEach(card => {
    const name = card.querySelector('.nm')?.textContent || '테마';
    const preview = card.querySelector('.preview');
    preview.setAttribute('role', 'button'); preview.tabIndex = 0;
    preview.setAttribute('aria-label', name + (card.classList.contains('is-on') ? ' 편집' : ' 적용'));
    preview.setAttribute('aria-pressed', String(card.classList.contains('is-on')));
    card.querySelector('.edit-btn')?.setAttribute('aria-label', name + ' 편집');
  });
}

document.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.isComposing || e.keyCode === 229 || e.ctrlKey || e.metaKey || e.altKey) return;
  const target = e.target.closest('[role="button"],[role="switch"]');
  if (!target || target.tagName === 'BUTTON' || !['Enter', ' '].includes(e.key)) return;
  e.preventDefault(); target.click();
  enhanceControls(target.parentElement);
});
document.addEventListener('click', e => {
  const section = e.target.closest('.section-header,.tgl,.seg');
  if (section) enhanceControls(section.parentElement);
});

function toggleSettingsPanel(open) {
  const panel = $('#settingsPanel');
  if (!panel) return;
  const willOpen = open ?? !panel.classList.contains('is-open');
  panel.classList.toggle('is-open', willOpen);
  /* v2: 설정 버튼 is-on 상태 */
  if (BTN_SETTINGS) BTN_SETTINGS.classList.toggle('is-on', willOpen);
  if (willOpen) {
    /* 열릴 때 시트 크기 자동 조정 — 높이가 충분하지 않으면 45%로 */
    if (S.ui.snap == null || S.ui.snap < 30) setSnap(45);
    /* 열릴 때 현재 탭 데이터 갱신 */
    const slider = $('#tabSlider');
    const active = Number(slider?.dataset.active || 0);
    if (active === 0 || active === 1) renderCharListV2();
    else renderThemeGridV2();
  }
  syncSettingsViews();
}

/* 탭 전환 (0=캐릭터, 1=테마) */
function switchSettingsTab(tabIndex) {
  const tabs = document.querySelectorAll('.tabs-line .tab-line');
  const indicator = $('#tabIndicator');
  const slider = $('#tabSlider');
  if (!tabs.length || !slider) return;

  /* 저장하지 않은 변경사항 확인 */
  const doSwitch = () => {
    /* 탭 버튼 상태 */
    tabs.forEach((t, i) => t.classList.toggle('is-on', i === tabIndex));

    /* 인디케이터 위치 — 탭 개수에 따라 너비 계산 */
    if (indicator) {
      indicator.style.left = `${tabIndex * (100 / tabs.length)}%`;
      indicator.style.width = `${100 / tabs.length}%`;
    }

    /* 슬라이더: 탭 0 → 뷰 0 (캐릭터목록), 탭 1 → 뷰 2 (테마목록) */
    const viewIndex = tabIndex === 0 ? 0 : 2;
    setSettingsView(viewIndex);

    /* 편집 중이던 draft 정리 */
    if (tabIndex === 0) {
      renderCharListV2();
    } else {
      renderThemeGridV2();
    }
  };

  /* 캐릭터 탭으로 갈 때 테마 수정 확인, 테마 탭으로 갈 때 캐릭터 수정 확인 */
  if (tabIndex === 0 && confirmDiscardThemeDraft(doSwitch)) return;
  if (tabIndex === 1 && confirmDiscardCharDraft(doSwitch)) return;

  /* 확인 없이 바로 전환 */
  S.ui.editingThemeId = null;
  S.ui.themeDraft = null;
  S.ui.canvasSnapshot = null; /* 캔버스 스냅샷도 정리 */
  S.ui.editingCharacterId = null;
  S.ui.charDraft = null;
  doSwitch();
}

/* 설정 패널 탭 UI를 캐릭터 목록으로 초기화 (슬라이더 + 탭버튼 + 인디케이터) */
function resetSettingsTabUI() {
  const tabs = document.querySelectorAll('.tabs-line .tab-line');
  const indicator = $('#tabIndicator');
  const slider = $('#tabSlider');
  if (slider) setSettingsView(0);
  if (tabs.length) tabs.forEach((t, i) => t.classList.toggle('is-on', i === 0));
  if (indicator) { indicator.style.left = '0'; indicator.style.width = '50%'; }
}

/* 캐릭터 목록 렌더링 */
function renderCharListV2() {
  const container = $('#charListContainer');
  if (!container) return;
  container.innerHTML = '';

  S.characters.forEach(c => {
    const card = el('div', 'char-card' + (S.ui.editingCharacterId === c.id ? ' is-on' : ''));
    card.dataset.itemId = c.id;
    /* 아바타 */
    const av = el('div', 'avatar');
    if (c.avatar) {
      const img = el('img');
      img.src = c.avatar;
      av.appendChild(img);
    } else {
      av.innerHTML = initialSvg(c.name);
    }
    card.appendChild(av);
    /* 정보 영역 */
    const info = el('div', 'info');
    info.appendChild(el('div', 'name', c.name || '이름 없음'));
    /* 색상 점 또는 힌트 */
    if (c.useCustomBubble) {
      const colors = el('div', 'colors');
      const bgDot = el('div', 'color-dot');
      bgDot.style.background = c.bubbleBg;
      const fgDot = el('div', 'color-dot');
      fgDot.style.background = c.bubbleFg;
      colors.append(bgDot, fgDot);
      info.appendChild(colors);
    } else {
      info.appendChild(el('div', 'colors-hint', '개별 팔레트 없음'));
    }
    card.appendChild(info);
    /* 수정 버튼 */
    const editBtn = el('button', 'edit-btn');
    editBtn.type = 'button';
    editBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
    editBtn.onclick = (e) => { e.stopPropagation(); openCharEditV2(c.id); };
    card.appendChild(editBtn);
    /* 카드 클릭도 편집 열기 */
    card.onclick = () => openCharEditV2(c.id);
    container.appendChild(card);
  });

  /* 캐릭터 추가 버튼 (showcase 구조 일치) */
  const addBtn = el('div', 'char-add');
  addBtn.innerHTML = '<span class="icon">+</span><span>캐릭터 추가</span>';
  addBtn.onclick = () => openCharEditV2('new');
  container.appendChild(addBtn);
}

/* 캐릭터 편집 열기 */
function openCharEditV2(charId) {
  const slider = $('#tabSlider');
  if (!slider) return;

  const isNew = charId === 'new';
  settingsEditReturn.character = charId;
  S.ui.editingCharacterId = charId;

  /* 초안 생성/로드 */
  if (!S.ui.charDraft || S.ui.charDraft.__for !== charId) {
    const base = isNew
      ? { id: uid(), name: '', avatar: '', useCustomBubble: false, bubbleBg: '#6C7A89', bubbleFg: '#FFFFFF', position: 'left' }
      : Object.assign({}, charOf(charId));
    S.ui.charDraft = Object.assign(base, { __for: charId });
  }

  /* 뷰 1로 슬라이드 */
  setSettingsView(1);
  syncCharEditFormV2();
  focusSettingsEditor($('#charEditView'));
}

/* 캐릭터 편집 폼 동기화 */
function syncCharEditFormV2() {
  const c = S.ui.charDraft;
  if (!c) return;

  const isNew = S.ui.editingCharacterId === 'new';

  /* 제목 */
  const title = $('#charEditTitle');
  if (title) title.textContent = isNew ? '캐릭터 추가' : '캐릭터 편집';

  /* 이름 */
  const nameInp = $('#charNameV2');
  if (nameInp) nameInp.value = c.name || '';

  /* 아바타 미리보기 */
  const avPrev = $('#charAvatarPreviewV2');
  if (avPrev) {
    avPrev.innerHTML = '';
    if (c.avatar) {
      const img = el('img');
      img.src = c.avatar;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover';
      avPrev.appendChild(img);
    } else {
      avPrev.textContent = c.name ? c.name.charAt(0).toUpperCase() : '?';
    }
  }

  /* 말풍선 토글 */
  const bubbleToggle = $('#charBubbleToggleV2');
  if (bubbleToggle) {
    bubbleToggle.classList.toggle('is-on', !!c.useCustomBubble);
  }
  const bubbleOpts = $('#charBubbleOptsV2');
  if (bubbleOpts) {
    bubbleOpts.style.display = c.useCustomBubble ? 'block' : 'none';
  }

  /* 말풍선 색상 */
  const bubbleBgInp = $('#charBubbleBgV2');
  const bubbleBgSw = $('#charBubbleBgSwV2');
  if (bubbleBgInp) bubbleBgInp.value = c.bubbleBg || '#6C7A89';
  if (bubbleBgSw) bubbleBgSw.style.background = c.bubbleBg || '#6C7A89';

  const bubbleFgInp = $('#charBubbleFgV2');
  const bubbleFgSw = $('#charBubbleFgSwV2');
  if (bubbleFgInp) bubbleFgInp.value = c.bubbleFg || '#FFFFFF';
  if (bubbleFgSw) bubbleFgSw.style.background = c.bubbleFg || '#FFFFFF';

  /* 삭제 버튼 — 새 캐릭터면 숨김 */
  const delBtn = $('#btnCharDeleteV2');
  if (delBtn) delBtn.style.display = isNew ? 'none' : '';
}

/* 캐릭터 저장 */
function saveCharEditV2() {
  const c = S.ui.charDraft;
  if (!c) return;

  const isNew = S.ui.editingCharacterId === 'new';
  if (isNew) {
    /* 이름이나 아바타가 있어야 저장 */
    if (!(c.name || '').trim() && !c.avatar) {
      toast('이름 또는 이미지를 입력하세요');
      return;
    }
    delete c.__for;
    S.characters.push(c);
  } else {
    const idx = S.characters.findIndex(x => x.id === c.id);
    if (idx >= 0) {
      delete c.__for;
      S.characters[idx] = c;
    }
  }

  S.ui.editingCharacterId = null;
  S.ui.charDraft = null;
  save();
  toast('저장되었습니다');

  /* 목록으로 돌아가기 */
  settingsEditReturn.character = c.id;
  resetSettingsTabUI();
  renderCharListV2();
  renderCanvas();
}

/* 캐릭터 삭제 */
function deleteCharEditV2() {
  const c = S.ui.charDraft;
  if (!c || S.ui.editingCharacterId === 'new') return;

  confirmDelete('캐릭터 삭제', `"${c.name || '이름 없음'}" 캐릭터를 삭제하시겠습니까?`, () => {
    const idx = S.characters.findIndex(x => x.id === c.id);
    if (idx >= 0) {
      S.characters.splice(idx, 1);
      S.ui.editingCharacterId = null;
      S.ui.charDraft = null;
      save();
      toast('삭제되었습니다');

      resetSettingsTabUI();
      renderCharListV2();
      renderCanvas();
    }
  });
}

/* 테마 그리드 렌더링 */
function renderThemeGridV2() {
  const container = $('#themeGridContainer');
  if (!container) return;
  container.innerHTML = '';

  const EDIT_SVG = '<svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>';

  S.themes.forEach(t => {
    const card = el('div', 'theme-card' + (t.id === S.activeThemeId ? ' is-on' : ''));
    card.dataset.itemId = t.id;
    /* 수정 버튼 */
    const editBtn = el('button', 'edit-btn');
    editBtn.type = 'button';
    editBtn.innerHTML = EDIT_SVG;
    editBtn.onclick = (e) => { e.stopPropagation(); openThemeEditV2(t.id); };
    card.appendChild(editBtn);
    /* 프리뷰 영역 */
    const preview = el('div', 'preview');
    preview.style.background = t.bgImage ? `url(${t.bgImage}) center/cover` : t.bg;
    /* 말풍선 미리보기 */
    const bs = t.bubbleStyle || 'bubble';
    let bubbleClass = 'bubble-preview';
    if (bs === 'bubble') bubbleClass += ' has-tail-left';
    else if (bs === 'quote') bubbleClass += ' is-quote';
    else if (bs === 'notif') bubbleClass += ' is-notif';
    else if (bs === 'sns') bubbleClass += ' is-sns';
    else if (bs === 'script') bubbleClass += ' is-script';
    else bubbleClass += ' is-none';
    const bubble = el('div', bubbleClass);
    if (bs === 'bubble') {
      bubble.style.background = t.bubbleBg;
      bubble.style.color = t.bubbleFg;
    } else if (bs === 'notif') {
      bubble.style.background = t.notifBg || 'rgba(255,255,255,0.5)';
      bubble.style.color = t.fg;
    } else {
      bubble.style.color = t.bubbleFg || t.fg;
    }

    card.appendChild(el('div', 'nm', t.name || '이름'));

      /* 테마 선택 또는 편집 열기 */

        S.activeThemeId = t.id;
        save();
        renderThemeGridV2();
        renderCanvas();
      }

    container.appendChild(card);
  });

  /* 추가 버튼 */
  const add = el('div', 'theme-card is-add');
  add.onclick = () => {
    const t = DEF_THEME();
    t.name = '새 테마';
    S.themes.push(t);
    S.activeThemeId = t.id;
    save();
    openThemeEditV2(t.id);
  };
  add.innerHTML = '<div class="preview">+</div><div class="nm">추가</div>';
  container.appendChild(add);

  /* 내보내기/가져오기 버튼 — 상단, 우측 정렬 */
  const parent = container.parentElement;
  const existingIoRow = parent.querySelector('.io-row');
  if (existingIoRow) existingIoRow.remove();
  const ioRow = el('div', 'io-row');
  ioRow.style.cssText = 'display:flex;gap:6px;padding:var(--sp-sm) var(--sp-md);justify-content:flex-end';

  impBtn.onclick = () => $('#settingsPick').click();
  ioRow.append(expBtn, impBtn);
  parent.insertBefore(ioRow, container);
}

/* 테마 편집 열기 */
function openThemeEditV2(themeId) {
  const slider = $('#tabSlider');
  if (!slider) return;

  const src = S.themes.find(x => x.id === themeId);
  if (!src) return;
  settingsEditReturn.theme = themeId;

  S.activeThemeId = themeId; /* theme()가 초안을 반환하도록 */
  S.ui.editingThemeId = themeId;

  /* 초안 생성/로드 */
  if (!S.ui.themeDraft || S.ui.themeDraft.id !== themeId) {
    S.ui.themeDraft = JSON.parse(JSON.stringify(src));
    /* 캔버스 스냅샷 — 테마 편집 중 캔버스 변경 감지용 */
    S.ui.canvasSnapshot = JSON.parse(JSON.stringify(S.canvas));
  }

  /* 뷰 3으로 슬라이드 */
  setSettingsView(3);
  syncThemeEditFormV2();
  renderCanvas(); /* 캔버스도 초안으로 갱신 */
  focusSettingsEditor($('#themeEditView'));
}

/* 구조가 바뀌는 옵션도 편집하던 섹션·스크롤·커서로 돌아온다. */
function formControlKey(control, container) {
  if (control.id && !control.id.startsWith('ux-control-')) return '#' + control.id;
  const section = control.closest('.section')?.querySelector('h3')?.textContent || '머리';
  const label = control.getAttribute('aria-label') || control.title || control.closest('.field,.steph,.slideh')?.querySelector('.lab')?.textContent || '';
  const peers = [...container.querySelectorAll(control.tagName)].filter(item =>
    (item.closest('.section')?.querySelector('h3')?.textContent || '머리') === section &&
    (item.getAttribute('aria-label') || item.title || item.closest('.field,.steph,.slideh')?.querySelector('.lab')?.textContent || '') === label);
  return [section, control.tagName, label, peers.indexOf(control)].join('|');
}
function rememberThemeForm(container) {
  const active = document.activeElement;
  return {
    key: container.contains(active) ? formControlKey(active, container) : null,
    start: active.selectionStart, end: active.selectionEnd,
    scroll: $('#themeEditView').scrollTop,
    outer: $('#sheetBody').scrollTop,
    id: container.dataset.themeId
  };
}
function restoreThemeForm(container, state, id) {
  container.dataset.themeId = id;
  enhanceControls(container);
  if (state.id !== id) { $('#themeEditView').scrollTop = 0; return; }
  const next = state.key && [...container.querySelectorAll('button,input,select,textarea,[tabindex]')]
    .find(control => formControlKey(control, container) === state.key);
  if (next) {
    next.focus({ preventScroll: true });
    if (state.start != null && next.setSelectionRange) {
      try { next.setSelectionRange(state.start, state.end); } catch (_) { }
    }
  }
  $('#themeEditView').scrollTop = state.scroll;
  $('#sheetBody').scrollTop = state.outer;
}
