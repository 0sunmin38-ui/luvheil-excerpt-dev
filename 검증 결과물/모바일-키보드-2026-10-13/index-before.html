     lineHeight 와 문자 수로 분할점을 추정해 Range.getClientRects() 호출을 피한다. */
  const splitBudget = pageBox().inner - hold, splitAt = performance.now();
  diag('split:start', { budget: Math.round(splitBudget), rows: flowRows().length });
  try {
    if (isAndroid()) {
      splitTallRowsEstimated(splitBudget);
      diag('split:android-estimated', { ms: Math.round(performance.now() - splitAt), rows: flowRows().length });
    } else {
      splitTallRows(splitBudget);
      diag('split:done', { ms: Math.round(performance.now() - splitAt), rows: flowRows().length });
    }
  } catch (e) {
    diag('split:error', { name: e && e.name || 'Error', message: String(e && e.message || '').slice(0, 180) });
    /* 분할 실패 시 원본 유지 — 저장 자체는 진행한다 */
  }
  const rangeAt = performance.now();
  const rg = pageRanges(hold);
  diag('page-ranges:done', { ms: Math.round(performance.now() - rangeAt), ranges: rg.length });
  /* 단을 쓰면 rg 한 칸은 «장» 이 아니라 «단» 이다 — 장은 그것을 N 개씩 묶은 것이다 */
  const N = colOn() ? colCount() : 1;
  const pages = Math.max(1, Math.ceil(rg.length / N));
  /* 인스타는 한 장에서도 서명을 입력창 위에 고정한다. 다른 서명은 여러 장일 때 고정한다.
     중앙 정렬에서도 서명은 하단에 고정한다 — 상단 정렬과 동일한 동작. */
  const pin = (!!foot || !!ebFoot) && (pages > 1 || !!dmFoot || !isTopAlign());

     단을 쓰면 한 장이라도 앉혀야 한다: 둘째 단부터는 제자리가 저절로 나오지 않고,

  if (rg.length < 2 && N === 1) return 1;

     (한 장의 내용은 늘 한 장보다 짧으니 그 차이가 장마다 쌓인다). 그래서 구분선을
     '다음 장 첫 줄' 에 맞춰 그렸는데, 그 줄 자체가 제자리에 없어 선이 엉뚱한 데 떴다.
     저장은 장마다 캔버스를 새로 세워 그 장의 내용을 가운데에 놓는다 [exportPNG].
     미리보기도 같은 자리에 세운다 — 그러면 구분선은 그냥 장 경계(i×장높이)가 된다. */
  const box = pageBox(), H = box.h;

  if (frame0) frame0.style.height = H + 'px';
  const avail = Math.max(1, box.inner - headHold - footHold);
  const rows = flowRows();
  /* «위로» 면 장의 맨 위(위 여백 + 화면머리 몫)에서 바로 시작한다 — 남는 자리는 아래에 몰린다 */
  const top = isTopAlign();
  placeFlow(rows, rg.map((r, k) => ({ r, p: Math.floor(k / N), c: k % N })),
    H, avail, headHold, top, N > 1 ? colStep() : 0);
  /* 구분선·사본은 «장» 마다다 — 단마다 붙이면 한 장 안에 선이 여러 개 생긴다 */
  for (let i = 0; i < pages; i++) {
    if (i) {
      const mk = el('div', 'pagemark');
      mk.style.top = (i * H) + 'px';
      cv.appendChild(mk);
    }
    if (frame0 && i) {
      const g = frame0.cloneNode(true);
      g.classList.add('frame-ghost');
      g.style.top = (i * H) + 'px';
      cv.appendChild(g);
    }
    /* 첫 장의 화면머리는 진짜(.head-pin)가 캔버스 맨 위에 서 있다 — 뒷장에만 사본을 깐다.
       Big Title 흐름 모드(.head-flow)는 본문 안에 섞이므로 사본을 안 깐다. */
    if (head && i && !isFlowHead) {
      /* 서명 사본과 달리 겉모습이 뿌리 클래스(hd-imessage…)에 걸려 있다 —
         통째로 갈아치우지 말고 «못 박음» 만 «사본» 으로 바꿔 단다. */
      const g = head.cloneNode(true);
      g.classList.remove('head-pin');
      g.classList.add('head-ghost');
      g.style.top = (i * H) + 'px';    /* 장 맨 위 가장자리부터 — 위 여백은 그 아래부터다 */
      cv.appendChild(g);
    }
    /* 마지막 장의 서명은 진짜(.foot-pin)가 캔버스 바닥에 서 있다 — 앞 장에만 사본을 깐다 */
    if (pin && foot && i < pages - 1) {
      const g = foot.cloneNode(true);
      g.className = 'foot-ghost';
      g.removeAttribute('data-id');
      g.style.top = ((i + 1) * H - fh - (dmFoot ? dmh + dmSpacing : padB())) + 'px';
      cv.appendChild(g);
    }
    /* 이북 푸터도 마지막 장에 진짜가 있고, 앞 장에 사본을 깐다 */
    if (pin && ebFoot && i < pages - 1) {
      const g = ebFoot.cloneNode(true);
      g.classList.add('eb-foot-ghost');
      g.style.bottom = 'auto';
      /* 배경은 장 끝에 붙인다 — 내용의 하단 여백은 푸터 자체의 패딩이 맡는다. */
      g.style.top = ((i + 1) * H - ebh) + 'px';
      cv.appendChild(g);
    }
  }
  return pages;
}

function setStage(st, keepNav) {
  /* 넓은 화면에서는 도구가 단계와 상관없이 늘 떠 있다 [renderTools] — 자리를 옮겨도
     편집기는 눈앞에 그대로다. 그때 초안을 비우면 고치던 값이 소리 없이 되돌아간다.
     도구가 실제로 사라지는 좁은 화면에서만 '나가는 것' 으로 친다. */
  const closesTools = st !== 'tools' && S.ui.stage === 'tools' && !isWide();
  /* 나가는 길이면 먼저 묻는다 — 답을 받고 나서 같은 자리로 다시 온다 */
  if (closesTools && confirmDiscardThemeDraft(() => setStage(st, keepNav))) return;
  if (closesTools && confirmDiscardCharDraft(() => setStage(st, keepNav))) return;
  S.ui.newKind = null;
  /* NAV 는 그 안에서 벌어진 일일 때만 열려 있는다. 자리를 옮기는 것은 NAV 밖의 일이다 —
     칩을 눌러 들어온 길은 그 핸들러가 다시 열어 준다. NAV 단추가 스스로 자리를 옮기는
     경우만 예외다 — 그때는 옮긴 목적이 곧 칩을 펴는 것이라 열어 둔 채로 간다. */
  S.ui.navOpen = !!keepNav;
  S.ui.stage = st;
  if (st !== 'format') S.ui.imagePreview = null;
  /* 데스크톱 한 기둥 배치에서 «열려 있을 칸» 도 함께 옮긴다 [setDeskPane] — 캔버스의 블록을
     눌러 들어오는 길처럼 시트 밖에서 시작한 이동은 칸을 누른 적이 없어 저절로 안 따라온다.
     그러면 서식이 밀린 칸 안에서 열려, 고치러 왔는데 고칠 데가 안 보인다. */
  S.ui.deskPane = st === 'tools' ? 'tools' : 'dock';
  if (st === 'tools' && document.activeElement && document.activeElement.blur) document.activeElement.blur();
  S.ui.panel = (st === 'tools' || st === 'format') ? 'full' : (S.ui.panel || 'compact');
  if (closesTools) {
    S.ui.editingCharacterId = null; S.ui.charDraft = null;
    S.ui.editingThemeId = null; S.ui.themeDraft = null; S.ui.canvasSnapshot = null;
    /* 탭 UI 초기화 — 다음에 열 때 캐릭터 목록으로 */
    resetSettingsTabUI();
  }
  /* 블록 편집은 서식 단계에서만 산다. 어느 경로로 빠져나가든 작성창을 비운다.
     selectedBlockId가 이미 null이어도 입력창에 텍스트가 남아 있을 수 있으므로 항상 비운다. */
  if (st !== 'format') endEdit();
  if (st === 'composer') { S.ui.insertMode = null; }
  if (st === 'tools') S.ui.bulk = false;
  /* v2: 도구 단계 진입/이탈 시 설정 패널 토글 — 2패널에서는 항상 열림 */
  toggleSettingsPanel(st === 'tools' || is2Panel());
  render();
}
function themeDraftDirty() {
  const d = S.ui.themeDraft;
  if (!d || d.id !== S.ui.editingThemeId) return false;
  const src = S.themes.find(x => x.id === d.id);
  const themeDirty = !!src && JSON.stringify(d) !== JSON.stringify(src);
  /* 캔버스 변경도 테마 수정으로 간주 */
  const snap = S.ui.canvasSnapshot;
  const canvasDirty = !!snap && JSON.stringify(S.canvas) !== JSON.stringify(snap);
  return themeDirty || canvasDirty;
}
/* 캐릭터 초안이 저장소의 원본과 다른가 */
function charDraftDirty() {
  const d = S.ui.charDraft;
  /* __for 로 비교 — 새 캐릭터는 id가 UID이고 editingCharacterId가 'new'라서 d.id 로 비교하면 항상 false */
  if (!d || (d.__for ?? d.id) !== S.ui.editingCharacterId) return false;
  if (S.ui.editingCharacterId === 'new') return !!(d.name || d.avatar || d.bubbleBg || d.bubbleFg);
  /* __for 필드는 비교에서 제외 */
  const src = S.characters.find(x => x.id === d.id);

/* 캐릭터 초안을 저장소에 반영 */
function commitCharDraft() {
  const d = S.ui.charDraft;
  if (!d) return false;
  if (S.ui.editingCharacterId === 'new') {
    if (!(d.name || '').trim() && !d.avatar) {
      toast('이름 또는 이미지를 입력하세요');
      return false;
    }
    d.id = uid();
    delete d.__for;
    S.characters.push(d);
    S.ui.charDraft = null;
    save();
    return true;
  }
  const src = S.characters.find(x => x.id === d.id);
  if (src) {
    Object.keys(src).forEach(k => { if (!(k in d)) delete src[k]; });
    Object.assign(src, JSON.parse(JSON.stringify(d)));
  }

  save();

/* 고치던 테마 초안이 버려지는 길목은 하나가 아니다 — 편집기를 닫는 것뿐 아니라
   다른 테마를 고르는 것 · 새 테마를 만드는 것 · 캐릭터/캔버스 탭으로 넘어가는 것 ·

   [저장] 단추와 «나가기» 확인창이 같은 일을 하므로 셈은 한 군데에만 둔다. */
function commitThemeDraft() {
  const d = S.ui.themeDraft;
  if (!d) return false;
  const src = S.themes.find(x => x.id === d.id);

    Object.keys(src).forEach(k => { if (!(k in d)) delete src[k]; });
    Object.assign(src, JSON.parse(JSON.stringify(d)));
  }
  S.ui.themeDraft = null;
  save();
  return !!src;
}
function confirmDiscardThemeDraft(onDiscard) {
  if (!themeDraftDirty()) return false;

    '저장하지 않을 경우, 지금까지 입력한 내용은 삭제됩니다.');

const addBlock = patch => { S.blocks.push(Object.assign({ id: uid(), type: 'text', text: '' }, patch)); save(); };

/* ═══ 붙여넣은 글 정리 ═══════════════════════════════════════
   다른 곳에서 복사해 온 글에는 «글자로 적힌» 태그(<sub>)·서식 마커(**)·따옴표가 섞여 온다.
   붙여넣기는 이미 text/plain 만 받으므로[initComposer] 진짜 서식은 안 들어오지만, 이 글자들은
   그대로 남아 캔버스에 찍히거나(태그) 앱이 제 마크업으로 읽어 엉뚱하게 굵어진다(마커).
   [핵심] 검사도 지우기도 «텍스트 노드» 에만 한다. 단추로 준 굵게는 <b> 요소라 손대지 않는다 —
   마크업 문자열에서 찾으면 그 둘을 구별할 수 없다. */
const JUNK_KIND = [
  ['tag',    '태그 모양 글자', '<sub> </b> <br> 처럼 글자로 적힌 태그를 지웁니다.'],
  ['marker', '서식 마커',      '** * ~~ ++ == [#색] [/] [^] [_] [+] [-] 를 지웁니다.'],
  ['quote',  '따옴표',       '“…” ‘…’ "…" \'…\' 처럼 여닫는 짝이 맞는 따옴표만 걷어냅니다.']
];
const JUNK_TAG = /<\/?[A-Za-z][A-Za-z0-9]*(?:\s[^<>]{0,80})?>/g;
const JUNK_MARKERS = [
  /\*\*\*/g, /\*\*/g, /\*/g, /~~/g, /\+\+/g, /==/g,
  /\[#[0-9A-Fa-f]{6}\]/g, /\[\/\]/g,
  /\[\^\]/g, /\[\/\^\]/g, /\[_\]/g, /\[\/_\]/g,
  /\[\+\]/g, /\[\/\+\]/g, /\[-\]/g, /\[\/-\]/g
];
/* 짝이 맞을 때만 걷는다 — don't 의 어포스트로피는 남는다. 겹친 것부터 본다. */
const JUNK_QUOTES = [
  [/""([\s\S]*?)""/g, '$1'], [/''([\s\S]*?)''/g, '$1'],
  [/“([\s\S]*?)”/g, '$1'],   [/‘([\s\S]*?)’/g, '$1'],
  [/"([^"]*)"/g, '$1'],      [/'([^']*)'/g, '$1']
];
function junkTextNodes(root) {
  const out = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()) out.push(n);
  return out;
}
function junkClean(text, kinds) {
  let t = text;
  if (kinds.has('tag')) t = t.replace(JUNK_TAG, '');
  if (kinds.has('marker')) JUNK_MARKERS.forEach(re => { t = t.replace(re, ''); });
  if (kinds.has('quote')) JUNK_QUOTES.forEach(([re, to]) => { t = t.replace(re, to); });
  return t;
}
/* 어느 갈래가 몇 군데 있는가 — 있는 갈래만 모달에 올린다 */
function junkScan(root) {
  const hit = { tag: 0, marker: 0, quote: 0 };
  junkTextNodes(root).forEach(n => {
    const v = n.nodeValue || '';
    hit.tag += (v.match(JUNK_TAG) || []).length;
    JUNK_MARKERS.forEach(re => { hit.marker += (v.match(re) || []).length; });
    JUNK_QUOTES.forEach(([re]) => { hit.quote += (v.match(re) || []).length; });
  });
  return hit;
}
function junkStrip(root, kinds) {
  junkTextNodes(root).forEach(n => {
    const v = n.nodeValue || '', t = junkClean(v, kinds);
    if (t !== v) n.nodeValue = t;
  });
}
/* 올리기 직전에 한 번 묻는다. 걸리는 것이 없으면 그냥 올린다 — 평소에는 아무 일도 없다. */
function commitWithCleanup() {
  if (_composerComposing) return;
  const ta = $('#ta');
  diag('commit-with-cleanup:start', { n: (ta.value || '').length, blocks: S.blocks.length });
  /* 묻는 자리는 «밖에서 복사해 온 글이 처음 들어오는 곳» 하나뿐이다 — 곧 새 블록을 적는
     기본 작성창이다. 이미 올린 블록을 고치는 중에는 묻지 않는다: 그 글은 올릴 때 한 번
     걸러졌고, 고치는 중에 또 물으면 일부러 남겨 둔 따옴표·별표까지 다시 걷어내게 된다. */
  if (selBlock()) { commit(); return; }
  /* HTML 블록도 예외다 — 여기서는 태그도 따옴표도 «붙어 온 찌꺼기» 가 아니라 내용 그 자체다.
     <div class="x"> 를 걷어내면 적은 글이 통째로 부서진다. 묻지 않고 그대로 올린다. */
  if (S.ui.insertMode === 'html') { commit(); return; }
  const hit = junkScan(ta);
  const found = JUNK_KIND.filter(([k]) => hit[k] > 0);
  if (!found.length) { commit(); return; }
  const items = found.map(([k, name, desc]) => [k, name, desc + `  (${hit[k]}군데)`, true]);
  pickerModal(
    '아래의 내용을 제거하고 올릴까요?',
    '원하지 않는 서식을 걷어내고 캔버스에 올릴 수 있습니다.',
    items, '정리해서 올리기', 'btn-primary',
    selected => {
      junkStrip(ta, selected);
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      closeModal(); commit();
    });
  /* 「그대로 올리기」 — 취소는 «안 올림» 이라 따로 둔다 */
  const foot = $('#modalRoot .modal-foot');
  if (foot) {
    const asIs = el('button', 'btn btn-quiet', '그대로 올리기');
    asIs.onclick = () => { closeModal(); commit(); };
    foot.insertBefore(asIs, foot.lastChild);
  }
}

function commit() {
  if (_composerComposing) return;
  const ta = $('#ta'), raw = ta.value;
  diag('commit:start', { n: raw.length, paragraphs: raw.split(/\n\s*\n/).filter(s => s.trim()).length, blocks: S.blocks.length });
  const b = selBlock();
  if (b) {                       /* 편집은 실시간 반영이라 여기서는 끝내기만 한다 */
    if (b.type === 'html') { b.src = raw.trim(); expandBlock(b); }
    else if (HAS_TEXT.includes(b.type)) {
      b.text = raw.trim();
      if (!b.text && b.type === 'text') S.blocks = S.blocks.filter(x => x.id !== b.id);
    }
    save(); setStage('composer'); return;
  }
  if (!raw.trim()) { diag('commit:empty'); return; }
  if (S.ui.insertMode === 'html') {
    /* src 는 «적은 그대로», text 는 «CSS 를 굳힌 것». 고칠 때는 src 를 다시 펴 보여 주고,
       캔버스와 저장본은 text 를 쓴다 [expandHtml / blockSource]. */
    const nb = { id: uid(), type: 'html', src: raw, text: raw };
    S.blocks.push(nb);
    expandBlock(nb);
  } else raw.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean)
    .forEach(text => S.blocks.push({ id: uid(), type: 'text', text }));
  /* 문단마다 전체 localStorage를 다시 쓰지 않고 대량 붙여넣기도 한 번만 저장한다. */
  diag('blocks:created', { total: S.blocks.length });
  save(); diag('save:done', { blocks: S.blocks.length });
  /* contenteditable 초기화 — .value 는 input 전용이라 innerHTML 로 비운다 */
  try { ta.replaceChildren(); } catch (_) { ta.innerHTML = ''; }
  autoGrow();
  syncBtnAddState();          /* 버튼 상태를 (+)로 복원 */
  backToDefault();            /* 올렸으면 끝난 일이다 — HTML 을 적던 중이어도 기본으로 */
}

const ALIGN_ICON = {

const BLOCK_OWN = ['align', 'font', 'bold', 'italic', 'underline', 'strike', 'color', 'ann'];

  if (n && label) setTimeout(() => toast(`${label} — 따로 지정했던 블록 ${n}개도 함께 바꿨습니다`), 0);

}
const BLOCK_OWN_NAME = {
  align: '정렬', font: '글꼴', bold: '굵게', italic: '기울임',
  underline: '밑줄', strike: '취소선', color: '글자색', ann: '주석'
};
/* 서식이 사는 자리는 둘이다 — 블록 값[BLOCK_OWN]과 글 속 마커[applyInline].
   블록 전체에 색을 주면 b.color 로 들어가지만, 글 «일부» 를 골라 준 색은 글 안에
   [#RRGGBB]…[/] 로 들어간다. 「전체 설정 따르기」가 블록 값만 지우던 탓에, 일부를 골라
   준 색은 눌러도 그대로 남았다 — «가끔 색이 안 풀린다» 가 이것이다.
   여기 든 것은 그 마커들이다. 여는 짝만 찾으면 된다(닫는 짝은 늘 함께 온다). */
const INLINE_OWN = [
  ['글 속 색',   /(?<!==)\[#[0-9A-Fa-f]{6}\]/],
  ['형광펜',     /==(?:\[#[0-9A-Fa-f]{6}\])?/],
  ['글 속 굵게', /\*\*/],
  ['기울임',     /(?<!\*)\*(?!\*)/],
  ['밑줄',       /\+\+/],
  ['취소선',     /~~/],
  ['글자 크기',  /\[[+-]\]/],
  ['주석',       /\[[\^_]\]/]
];
/* 이 글에 걸려 있는 «글 속 서식» 의 이름들 */
const inlineOwn = text => INLINE_OWN.filter(([, re]) => re.test(String(text || ''))).map(([n]) => n);
/* 글 속 마커를 전부 걷어낸다 — 감싸던 마커만 빠지고 글자는 그대로 남는다.
   붙여넣은 글을 정리할 때 쓰는 것과 같은 목록이다 [JUNK_MARKERS]. */
const stripInline = text => JUNK_MARKERS.reduce((t, re) => t.replace(re, ''), String(text || ''));
/* 글자색 마커만 걷는다 — 형광펜은 남긴다.
   형광펜의 색은 ==[#RRGGBB] 꼴이라 앞에 == 이 붙어 있다. 그 짝은 건드리지 않고,
   그 «안에» 따로 걸린 글자색만 푼다 [==[#바탕][#글자]…[/]== 는 바탕만 남는다]. */
const stripColorMarks = text => String(text || '')
  .replace(/(?<!==)\[#[0-9A-Fa-f]{6}\]/g, '').replace(/\[\/\]/g, '');
/* 블록의 글을 고쳤을 때 작성창도 함께 되맞춘다 — 그 블록을 열어 둔 채라면 화면과 값이
   어긋나 보이고, 다음에 «캔버스에 올리기» 를 누르면 옛 글이 도로 덮어쓴다. */
function syncComposer(b) {
  const ta = $('#ta');
  if (ta && b && selBlock() === b && HAS_TEXT.includes(b.type || 'text')) ta.value = b.text;
}

function renderFormat() {
  const wrap = $('#formatWrap');
  /* 서식은 '고친다' 는 뜻이다 — 고칠 것이 정해졌을 때만 편다.
     처음 상태(그냥 새 글을 쓰는 중)에는 작성창 하나만 남긴다. 그때 여기 서 있던 서식은
     아무 블록에도 안 걸린 «전체 기본값» 이라, 쓰는 사람 눈에는 '지금 쓰는 글의 서식'
     처럼 보이면서 실제로는 그렇지 않은 손잡이였다. 전체 기본값은 도구 › 서식 설정에 있다.
       · 블록을 고른 동안        — 그 블록의 서식
       · 사진·서명을 꽂는 동안   — 그 편집기
       · HTML 을 적는 동안       — 아무것도 (태그를 그대로 넣는 자리라 글자 서식이 낄 데가 없다) */
  const b = selBlock();
  const on = S.ui.insertMode !== 'html' && (!!b || !!S.ui.newKind);
  wrap.hidden = !on;
  _confirm = null;          /* 사진 편집기가 있으면 아래에서 다시 걸어 준다 */
  if (!on) { wrap.innerHTML = ''; return; }
  const g = fmtStore();
  wrap.innerHTML = '';

  /* 새로 꽂는 중이면 빈 편집기부터 편다 — 고를 블록이 아직 없다 */
  if (!b && S.ui.newKind) {
    const host = el('div', 'sec');
    if (S.ui.newKind === 'image') {
      buildImageEditor(host, null, S.ui.newSrc || '');
      wrap.appendChild(host);
    } else if (S.ui.newKind === 'music') {
      /* 음악 블록을 먼저 만들고 선택한 뒤 편집기를 연다 */
      const newBlock = { id: uid(), type: 'music', title: '', artist: '' };
      S.blocks.push(newBlock);
      S.ui.selectedBlockId = newBlock.id;
      S.ui.newKind = null;
      save();
      buildMusicEditor(host, newBlock);
      wrap.appendChild(host);
    } else if (S.ui.newKind === 'html') {
      /* HTML도 이미지·음악과 마찬가지로 패널에서 편집한다 — newKind 는 확정 시점까지 유지 */
      buildHtmlEditor(host, null);
      wrap.appendChild(host);
    } else if (S.ui.newKind === 'divider') {
      /* 구분선 종류 선택 패널 */
      buildDividerEditor(host, null);
      wrap.appendChild(host);
    }
    return;
  }

  /* 글자가 없는 블록에는 글자 서식을 띄우지 않는다 */
  const isText = !b || b.type === 'text' || b.type === 'footer';

  /* 텍스트 블록은 전용 편집기를 쓴다 — v2 구조: 입력란 + 대사/서술 탭 + 캐릭터 + 서식 */
  if (b && b.type === 'text') {
    const host = el('div', 'sec');
    buildTextEditor(host, b);
    wrap.appendChild(host);
    return;
  }

  /* 사진은 글자 서식이 없다 — 자르기 편집기만 둔다 */
  if (b && b.type === 'image') {
    const host = el('div', 'sec');
    buildImageEditor(host, b);
    wrap.appendChild(host);
    return;
  }
  /* 음악도 글자 서식이 없다 — 제목·가수의 생김새는 블록이 통째로 정한다 [.blk-music] */
  if (b && b.type === 'music') {
    const host = el('div', 'sec');
    buildMusicEditor(host, b);
    wrap.appendChild(host);
    return;
  }
  /* HTML도 전용 편집기를 쓴다 — raw HTML 입력과 미리보기 */
  if (b && b.type === 'html') {
    const host = el('div', 'sec');
    buildHtmlEditor(host, b);
    wrap.appendChild(host);
    return;
  }
  /* 구분선 편집기 */
  if (b && b.type === 'divider') {
    const host = el('div', 'sec');
    buildDividerEditor(host, b);
    wrap.appendChild(host);
    return;
  }
  /* 서명은 두 칸을 먼저 두고, 그 아래에 글자 서식(글꼴·정렬·서식)을 이어 붙인다.
     한 블록의 일을 한 패널에서 끝낸다 — 예전처럼 취소를 눌러야 서식이 보이지 않는다. */
  if (b && b.type === 'footer') {
    const host = el('div', 'sec');
    buildFooterEditor(host, b);
    /* 위는 '무엇을 적는가', 아래는 '어떻게 보이는가' — 성격이 갈리므로 선으로 끊는다 */
    host.appendChild(el('div', 'divider'));
    wrap.appendChild(host);
  } else if (!isText) {
    return;
  }

  /* 줄 순서는 '이 블록이 무엇인가' → '어떻게 보이는가' 순이다.
     글꼴과 말풍선 여부가 블록의 성격을 정하고, 정렬·색·서식·주석은 그 안의 꾸밈이다.
       글꼴
       말풍선으로 출력
       정렬 / 색 지정
       서식 / 주석                                            */

  /* 좁은 화면(<900px)에서는 단추를 다 늘어놓을 자리가 없다. 정렬·크기는 «지금 값 하나»만
     보이고 누르면 다음 값으로 돌아가게 한다 — 고를 것이 넷·셋뿐이라 돌려 쓰는 편이 빠르다.
     넓은 화면에서는 여태처럼 전부 펼친다 [isWide]. 폭이 바뀌면 render 가 다시 돈다. */
  const wide = isWide();
  const l1 = el('div', 'tool-line');
  const g1 = el('div', 'tool-grp'); g1.appendChild(el('span', 'lab', '정렬'));
  const alignKeys = Object.keys(ALIGN_ICON);
  const curAlign = b ? (b.align || g.align) : g.align;
  const setAlign = k => {
    if (b) b.align = k; else { g.align = k; clearBlockOwn('align', '글 정렬'); }
    save(); render();
  };
  const alignBtn = (k, on) => {
    const btn = el('button', 'icb' + (on ? ' is-on' : ''));
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="${ALIGN_ICON[k]}"/></svg>`;
    return btn;
  };
  if (wide) {
    alignKeys.forEach(k => {
      const btn = alignBtn(k, curAlign === k);
      btn.title = ALIGN_NAME[k];
      btn.onclick = () => setAlign(k);
      g1.appendChild(btn);
    });
  } else {
    const i = Math.max(0, alignKeys.indexOf(curAlign));
    /* 단추가 하나뿐이어도 켜짐은 표시한다 — 이 블록이 «제 정렬을 따로 들고 있는가» 다.
       넓은 화면에서 넷 중 하나가 켜지는 것과 같은 뜻이고, 그 표시가 없으면 지금 보이는
       그림이 «이 블록의 것» 인지 «테마 기본값» 인지 구별할 길이 없었다 [B/I/U 와 같은 규칙]. */
    const btn = alignBtn(alignKeys[i], !!b && !!b.align && b.align !== g.align);
    btn.title = ALIGN_NAME[alignKeys[i]] + ' · 누르면 다음';
    btn.onclick = () => setAlign(alignKeys[(i + 1) % alignKeys.length]);
    g1.appendChild(btn);
  }
  const g2 = el('div', 'tool-grp'); g2.appendChild(el('span', 'lab', '색 지정'));
  g2.appendChild(colorBtn('A', S.colors.text, '글자 색', v => {
    if (v == null) {                       /* 기본값 — 테마의 글자색을 그대로 따라간다 */
      if (hasSel()) { formatSelection(() => clearRich('color')); return; }
      /* 고른 조각이 없으면 «이 블록 전부» 다 — 블록 값과 글 속 색을 함께 푼다.
         예전에는 b.color 만 지워, 글 일부에 준 색은 그대로 남았다 [형광펜은 이미 이렇게 한다].
         글에서 곧바로 뽑는다 — 작성창을 거쳐 되읽으면 그 칸이 비어 있을 때 글이 통째로 날아간다. */
      else if (b) { b.text = stripColorMarks(b.text); syncComposer(b); delete b.color; }
      else clearBlockOwn('color', '글자색');   /* 고른 블록이 없으면 전체를 고치는 중이다 */
    } else {
      S.colors.text = v;
      if (hasSel()) { formatSelection(() => applyRich('color', v)); return; }
      else if (b) { clearRich('color'); b.text = reflowComposer(null); b.color = v; }
      else clearBlockOwn('color', '글자색');   /* 고른 블록이 없으면 전체를 고치는 중이다 */
    }
    save(); render();
  }, true));
  g2.appendChild(colorBtn('✏️', S.colors.highlight, '형광펜', v => {
    /* 형광펜은 블록 단위 값이 없다. 선택이 없으면 글 전체에 건다. */
    if (v == null) {
      if (hasSel()) { formatSelection(() => clearRich('mark')); return; }
      clearRich('mark');
    }
    else {
      const hv = overlayOnWhite(v, .8);
      S.colors.highlight = hv;
      if (hasSel()) { formatSelection(() => applyRich('mark', hv)); return; }
      applyRich('mark', hv);
    }
    const markup = reflowComposer(null);
    if (b) b.text = markup;
    save(); render();
  }, true));
  /* 글자 크기 — 정렬·색과 같은 «꾸밈» 이라 한 줄에 둔다 [SIZE_LV] */
  const g5b = el('div', 'tool-grp');
  g5b.appendChild(el('span', 'lab', '크기'));
  /* 선택 영역이 있으면 «그 조각만» · 없으면 블록 전체 — 서식(B/I/U) 과 같은 규칙이다.
     조각 크기는 마크업 [+]…[/+] · [-]…[/-] 로 글에 남고, 블록 전체 크기는 b.sizeLv 로
     블록에 남는다. 둘은 겹쳐 걸릴 수 있다(블록을 크게 + 그 안 한 낱말을 더 크게). */
  const segSz = el('div', 'tool-grp');
  /* «지금 몇 단계인가» 는 무엇을 고쳤느냐를 따라간다 — 조각을 골랐으면 그 조각의 단계,
     아니면 블록의 단계. 예전에는 선택이 있어도 블록 값(b.sizeLv)만 봤다. 좁은 화면의
     «누르면 다음» 단추는 그 값에서 다음 단계를 고르므로, 낱말을 골라 놓고 누르면 늘
     같은 단계만 다시 걸렸다 — 한 번 «크게» 가 된 뒤로는 아무리 눌러도 «크게» 였다.
     [모바일 사파리에서 «일부만 골라 크기 바꾸기» 가 안 먹던 것이 이것이다.] */
  const onSel = !!b && hasSel();
  const curLv = !b ? 0 : (onSel ? richSizeLv() : (b.sizeLv || 0));
  /* 켜짐 표시는 «블록 전체에 걸린 것» 만 한다 [B/I/U·주석과 같은 규칙].
     일부만 골라 건 크기는 그 조각의 일이라, 단추를 켜 두면 «이 블록이 그렇다» 로 잘못 읽힌다.
     — 단추가 가리키는 «다음 단계»(curLv)는 조각을 따라가고, 켜짐만 블록을 따라간다. */
  const blockLv = b ? (b.sizeLv || 0) : 0;
  const szOn = !!b && !onSel;
  const applySize = v => {
    if (!b) return;
    if (hasSel()) {
      formatSelection(() => {
        clearRich('szUp'); clearRich('szDn');
        if (v > 0) applyRich('szUp'); else if (v < 0) applyRich('szDn');
      });
      return;
    }
    /* 블록 전체를 바꾸는 자리다 — 조각 크기는 걷어내고 블록 값 하나로 정리한다 */
    clearRich('szUp'); clearRich('szDn'); b.text = reflowComposer(null);
    if (v) b.sizeLv = v; else delete b.sizeLv;
    save(); render();
  };
  const sizeBtn = (v, label, cls, on) => {
    const btn = el('button', 'icb' + (on ? ' is-on' : ''));
    /* 작게만 소문자다 — 크게는 굵기로 갈린다 [.icb .szA] */
    btn.innerHTML = `<span class="szA ${cls}">${cls === 's' ? 'a' : 'A'}</span>`;
    btn.title = label;
    btn.disabled = !b;
    return btn;
  };
  if (wide) {
    SIZE_LV_UI.forEach(([v, label, cls]) => {
      const btn = sizeBtn(v, label, cls, szOn && blockLv === v);
      bindFormatAction(btn, () => applySize(v));
      segSz.appendChild(btn);
    });
  } else {
    const i = Math.max(0, SIZE_LV_UI.findIndex(x => x[0] === curLv));
    const [, label, cls] = SIZE_LV_UI[i];
    const btn = sizeBtn(curLv, label + ' · 누르면 다음', cls, szOn && blockLv !== 0);
    const nxt = SIZE_LV_UI[(i + 1) % SIZE_LV_UI.length][0];
    bindFormatAction(btn, () => applySize(nxt));
    segSz.appendChild(btn);
  }
  g5b.appendChild(segSz);
  /* 좁을 때는 정렬·크기가 단추 하나씩이라 색까지 한 줄에 들어간다.
     넓을 때는 정렬·크기를 다 펼치므로 색은 제 줄로 내린다. */
  const l1s = el('div', 'tool-line');
  if (wide) { l1.classList.add('compact'); l1.append(g1, el('div', 'tool-sep'), g5b); l1s.appendChild(g2); }
  else { l1.append(g1, el('div', 'tool-sep'), g5b, el('div', 'tool-sep'), g2); }

  /* 글 서식 · 주석 */
  const l2 = el('div', 'tool-line');
  const g3 = el('div', 'tool-grp'); g3.appendChild(el('span', 'lab', '서식'));
  [['bold', 'B'], ['italic', 'I'], ['underline', 'U'], ['strike', 'S']].forEach(([k, t]) => {
    const btn = el('button', 'icb' + (b && !hasSel() && b[k] ? ' is-on' : ''), t);
    if (k === 'bold') btn.style.fontWeight = 700;
    if (k === 'italic') btn.style.fontStyle = 'italic';
    if (k === 'underline') btn.style.textDecoration = 'underline';
    if (k === 'strike') btn.style.textDecoration = 'line-through';
    btn.disabled = !b;
    /* 선택 영역이 있으면 그 부분만 · 없으면 블록 전체 */
    bindFormatAction(btn, () => {
      if (!b) return;
      if (hasSel()) { formatSelection(() => applyRich(k)); return; }
      /* 블록 전체를 켜고 끄는 자리다 — 부분 서식은 걷어내고 블록 값 하나로 정리한다.
         걷어낸 결과를 블록에 다시 적어 두지 않으면 작성창에서만 사라지고
         캔버스에는 그대로 남아, 눌렀는데 미리보기가 안 따라오는 것처럼 보인다. */
      clearRich(k); b.text = reflowComposer(null); b[k] = !b[k];
      save(); render();
    });
    g3.appendChild(btn);
  });

  /* 주석 — 아예 안 고르거나 둘 중 하나 (배타) */
  const g4 = el('div', 'tool-grp'); g4.appendChild(el('span', 'lab', '주석'));
  [['윗주석', 'sup'], ['아랫주석', 'sub']].forEach(([title, tag], i) => {
    const btn = el('button', 'icb' + (b && b.ann === i + 1 && !hasSel() ? ' is-on' : ''));
    btn.innerHTML = `<span class="ann">A<${tag}>2</${tag}></span>`;
    btn.title = title;
    btn.disabled = !b;
    bindFormatAction(btn, () => {
      if (!b) return;
      if (hasSel()) { formatSelection(() => applyRich(i === 0 ? 'sup' : 'sub')); return; }
      clearRich('sup'); clearRich('sub'); b.text = reflowComposer(null);
      b.ann = b.ann === i + 1 ? 0 : i + 1;         /* 안 고르거나 둘 중 하나 */
      save(); render();
    });
    g4.appendChild(btn);
  });
  /* 서명에 윗주석·아랫주석을 달 일은 없다 — 이름 한 줄이다. 글꼴·정렬·서식·색만 남긴다. */
  if (b && b.type === 'footer') l2.appendChild(g3);
  else l2.append(g3, el('div', 'tool-sep'), g4);

  /* 이 시트는 '고른 블록 하나' 를 고친다. 도구 › 서식 설정은 '전체 기본값' 이다.
     여기서 한 번이라도 건드린 항목은 그 블록의 값이 되어, 그 뒤로 전체 설정을 바꿔도
     이 블록만 따라오지 않는다 — 넓은 화면에서 둘이 나란히 떠 있으면 그게
     '일부만 적용되는 고장' 처럼 보인다. 무엇이 걸려 있는지 적고, 한 번에 풀 수 있게 둔다. */
  /* 글꼴 — 고르는 칸이 넓어야 이름이 안 잘린다. 한 줄을 통째로 준다. */
  const l3 = el('div', 'tool-line');
  const g5 = el('div', 'tool-grp'); g5.style.flex = '1';
  g5.appendChild(el('span', 'lab', '글꼴'));
  g5.appendChild(fontSelect(b ? (b.font || g.font) : g.font,
    v => { if (b) b.font = v; else { g.font = v; clearBlockOwn('font', '글꼴'); } save(); render(); }));
  l3.appendChild(g5);
  wrap.appendChild(l3);

  /* 텍스트 블록의 말풍선/캐릭터 선택은 buildTextEditor 에서 처리한다 */

  if (wide) wrap.append(l1, l2, l1s); else wrap.append(l1, l2);

}

/* ═══ 선택 삭제 [원본 bulk-delete-mode] ═══════════════════════ */
function toggleBulk(on) {
  S.ui.bulk = on;
  S.ui.picked = new Set();
  /* 상단바의 X 버튼 활성 상태 표시 */
  $('#btnBulkDel').classList.toggle('is-on', on);
  /* NAV 에서 시작한 일이지만 NAV 안에서 이어지지는 않는다 — 칩을 접고 그 자리를 내준다.
     열어 둔 채로 두면 '삽입 메뉴' 와 '지울 것 고르기' 가 한 화면에 겹쳐 뜬다. */
  if (on) { endEdit(); S.ui.insertMode = null; S.ui.navOpen = false; }
  render();
}
/* v2: 선택 삭제 막대는 상단바 바로 아래에 뜬다 */
function renderBulkBar() {
  const row = $('#bulkRowTop');
  row.innerHTML = '';
  row.hidden = !S.ui.bulk;
  if (!S.ui.bulk) return;
  const bar = row;
  const n = S.ui.picked ? S.ui.picked.size : 0;
  const all = el('button', 'btn btn-quiet', n === S.blocks.length ? '전체 해제' : '전체 선택');
  all.onclick = () => {
    S.ui.picked = n === S.blocks.length ? new Set() : new Set(S.blocks.map(b => b.id));
    render();
  };
  const del = el('button', 'btn btn-danger btn-fill', n ? `${n}개 삭제` : '0개 선택');
  del.disabled = !n; del.style.opacity = n ? 1 : .5;
  del.onclick = () => {
    if (!n) return;
    S.blocks = S.blocks.filter(b => !S.ui.picked.has(b.id));
    toggleBulk(false);
    save(); toast(`${n}개를 삭제했습니다`);
    backToDefault();          /* 지웠으면 끝난 일이다 */
  };
  /* 취소 버튼 제거 — X 버튼 다시 누르면 꺼짐 */
  bar.append(all, del);
}

function fontSelect(cur, on) {
  const s = el('select', 'sel');
  let group = null, box = null;
  FONTS.forEach(f => {
    if (f.g !== group) { group = f.g; box = document.createElement('optgroup'); box.label = f.g; s.appendChild(box); }
    /* 함께 들고 다니는 글꼴은 file:// 로 열면 브라우저가 CORS 로 막아 아예 안 뜬다.
       고르고 나서야 아무 일도 안 일어나는 것보다 목록에서 미리 알려 주는 편이 낫다. */
    const o = el('option', '', f.label + (IS_FILE && f.local ? ' (서버 필요)' : ''));
    o.value = f.name;
    if (cur === f.name) o.selected = true;
    box.appendChild(o);
  });
  s.onchange = () => {
    /* 글꼴이 붙기 전에 그리면 대체 글꼴로 한 번 그려졌다가 튄다. 받아 놓고 반영한다. */
    ensureFontCss(s.value).then(() => on(s.value));
    on(s.value);
    if (IS_FILE && fontOf(s.value).local) toast('이 글꼴은 서버로 띄워야 보입니다 · ./serve.sh');
  };
  return s;
}

/* ═══ 색 지정 팝오버 [원본 setPartialColor 를 팝오버로] ═══════ */
/* 기본 팔레트 17색: 무채색 6 + 빨주노초파보 6 + 연한 5
   사용자가 더한 색은 뒤에 붙어 브라우저에 남는다 */
const PALETTE_BASE = [
  '#FFFFFF', '#E5E5E5', '#C0C0C0', '#808080', '#404040', '#1A1A1A',  /* 무채색 */
  '#E53935', '#FF9800', '#FDD835', '#43A047', '#1E88E5', '#8E24AA',  /* 진한 */
  '#FFCDD2', '#FFE0B2', '#FFF9C4', '#C8E6C9', '#BBDEFB'              /* 연한 */
];
const PALETTE_KEY = 'chat-excerpt/palette';
let userPalette = [];
let hiddenPalette = [];
const loadPalette = () => {
  try {
    const raw = JSON.parse(localStorage.getItem(PALETTE_KEY) || '[]');
    if (Array.isArray(raw)) { userPalette = raw; hiddenPalette = []; }
    else {
      userPalette = Array.isArray(raw.user) ? raw.user : [];
      hiddenPalette = Array.isArray(raw.hidden) ? raw.hidden : [];
    }
  } catch (e) { userPalette = []; hiddenPalette = []; }
};
const savePalette = () => {
  try { localStorage.setItem(PALETTE_KEY, JSON.stringify({ user: userPalette, hidden: hiddenPalette })); } catch (e) { }
};
const isUserColor = h => userPalette.includes(h.toUpperCase());
const isBaseColor = h => PALETTE_BASE.includes(h.toUpperCase());
function overlayOnWhite(hex, alpha) {
  const h = hexOf(hex);
  if (!h) return hex;
  const a = clamp(Number(alpha), 0, 1);
  const out = [0, 2, 4].map(i => {
    const v = parseInt(h.slice(i, i + 2), 16);
    return Math.round(v * a + 255 * (1 - a)).toString(16).padStart(2, '0');
  }).join('');
  return '#' + out.toUpperCase();
}
/* [원본 EYEDROPPER_SVG] */
const EYEDROPPER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" '
  + 'stroke-linecap="round" stroke-linejoin="round"><path d="M19 3a2.8 2.8 0 0 1 0 4l-1.5 1.5-3-3L16 4a2.8 2.8 0 0 1 3-1z"/>'
  + '<path d="M14.5 8.5 5 18v3h3l9.5-9.5"/></svg>';

function colorBtn(label, val, title, onPick, clearable) {
  let current = val;
  let savedRange = null;
  const b = el('button', 'icb is-tint', label);
  const sync = c => {
    current = c;
    b.title = `${title} — ${c}`;
    b.style.setProperty('--tint', c);        /* 원 둘레 링으로 지금 색을 보여준다 */
  };
  sync(current);
  /* iOS Safari는 팝오버 버튼으로 포커스가 이동하는 순간 selection 을 접는다.
     누르기 직전의 Range 를 먼저 붙잡아 두어야 팝오버에서 고른 색이 원래 선택 영역에
     들어간다. 첫 탭이 '인풋 닫기' 로 먹히는 것도 여기서 함께 막는다. */
  bindFormatAction(b, () => {
    const live = liveRange(); savedRange = live ? live.cloneRange() : null;
    openColorPop(b, current, title, c => {
      if (savedRange) {
        try {
          const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(savedRange);
          lastRange = savedRange.cloneRange();
        } catch (_) { }
      }
      if (c) sync(c); onPick(c);
    }, clearable);
  });
  return b;
}

function closePop() { $('#popRoot').innerHTML = ''; }

function openColorPop(anchor, cur, title, onPick, clearable) {
  closePop();
  const root = $('#popRoot');
  const mask = el('div', 'popmask'); mask.onclick = closePop;
  const pop = el('div', 'pop');
  /* 팝오버 안을 눌러도 작성창의 포커스는 그대로 둔다 — 색을 고르는 동안 키보드가
     내려갔다 올라오면 시트 높이가 출렁여 팔레트가 손 밑에서 움직인다.
     직접 값을 적는 칸만 예외로 둔다(거기는 포커스를 받아야 한다). */
  /* click 은 그대로 살려야 하므로 mousedown 만 막는다 — 포커스는 mousedown 의
     기본 동작으로 옮겨 가고, 터치에서도 탭할 때 이 순서를 그대로 따른다. */
  pop.addEventListener('mousedown', e => {
    if (e.target.closest && e.target.closest('input,select,textarea')) return;
    e.preventDefault();
  });
  root.append(mask, pop);
  let current = /^#[0-9a-f]{6}$/i.test(cur || '') ? cur.toUpperCase() : '#424448';

  const commit = c => {
    if (c == null) { closePop(); onPick(null); return; }   /* 기본값으로 되돌리기 */
    c = c.toUpperCase();
    current = c;
    S.colors.recent = [c, ...(S.colors.recent || []).filter(x => x !== c)].slice(0, 6);
    closePop(); onPick(c);
  };

  /* ── 1단계: 프리셋 팔레트 [원본 palettePop]
        자주 쓰는 색은 여기서 점 하나로 끝내고, 그 밖의 색만 스포이드로 넘어간다. */
  function stage1() {
    pop.innerHTML = '';
    pop.appendChild(el('div', 'pop-title', title + (hasSel() ? ' — 선택한 부분' : ' — 블록 전체')));
    const grid = el('div', 'pop-grid');
    if (clearable) {
      /* 지정한 색을 지우고 테마의 글자색을 그대로 따라가게 한다 */
      const none = el('button', 'pop-sw none');
      none.title = '기본값';
      none.onclick = () => commit(null);
      grid.appendChild(none);
    }
    const list = [...PALETTE_BASE.filter(c => !hiddenPalette.includes(c.toUpperCase())), ...userPalette];
    list.forEach(c => {
      const userColor = isUserColor(c);
      const baseColor = isBaseColor(c);
      const sw = el('button', 'pop-sw' + (c.toUpperCase() === current ? ' is-on' : ''));
      sw.style.background = c;
      sw.title = c;
      sw.onclick = () => commit(c);
      if (userColor || baseColor) {
        const cell = el('div', 'pop-cell');
        const rm = el('button', 'pop-rm', '×');
        rm.title = `${c} 삭제`;
        rm.setAttribute('aria-label', `${c} 삭제`);
        rm.onclick = e => {
          e.stopPropagation();
          const p = modal('팔레트 색상을 삭제할까요?', `${c} 색상을 팔레트에서 제거합니다.`);
          const foot = el('div', 'modal-foot');
          const cancel = el('button', 'btn btn-quiet', '취소');
          cancel.onclick = closeModal;
          const ok = el('button', 'btn btn-danger', '삭제');
          ok.onclick = () => {
            closeModal();
            if (baseColor) hiddenPalette = [...new Set([...hiddenPalette, c.toUpperCase()])];
            else userPalette = userPalette.filter(x => x !== c.toUpperCase());
            savePalette();
            stage1();
          };
          foot.append(cancel, ok); p.appendChild(foot);
        };
        cell.append(sw, rm);
        grid.appendChild(cell);
      } else {
        grid.appendChild(sw);
      }
    });
    /* 팔레트에 색 더하기 */
    const add = el('button', 'pop-sw pop-add', '＋');
    add.title = '팔레트에 색 추가';
    add.onclick = () => stage2(true);
    grid.appendChild(add);
    pop.appendChild(grid);

    const pick = el('button', 'btn btn-quiet pop-pick');
    pick.innerHTML = EYEDROPPER + '<span>직접 고르기</span>';
    pick.onclick = () => stage2(false);
    pop.appendChild(pick);
    place();
  }

  /* ── 2단계: HSV 피커 — 채도·명도 사각 + 색상 띠 [원본 openPicker] */
  function stage2(addMode) {
    pop.innerHTML = '';
    const hsv = hexToHsv(current);

    /* 상단 헤더: < 색상 선택 */
    const hdr = el('div');
    hdr.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:12px;';
    const backBtn = el('button');
    backBtn.style.cssText = 'width:24px;height:24px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;';
    backBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--c-text-secondary);fill:none;stroke-width:2;"><path d="M15 18l-6-6 6-6"/></svg>';
    backBtn.onclick = stage1;
    const hdrTitle = el('span', '', addMode ? '팔레트에 더할 색' : '색상 선택');
    hdrTitle.style.cssText = 'font-size:12px;color:var(--c-text);';
    hdr.append(backBtn, hdrTitle);
    pop.appendChild(hdr);

    const sv = el('div', 'pop-sv');
    const dot = el('i'); sv.appendChild(dot);
    const hue = el('div', 'pop-hue');
    const hdot = el('i'); hue.appendChild(hdot);
    pop.append(sv, hue);

    const foot = el('div', 'pop-foot');
    const swBox = el('div', 'pop-cur');
    const hex = el('input', 'inp'); hex.style.cssText = 'flex:1;min-width:0';
    const okb = el('button', 'btn btn-primary', addMode ? '추가' : '적용');
    foot.append(swBox, hex, okb); pop.appendChild(foot);

    const paint = () => {
      const v = hsvToHex(hsv.h, hsv.s, hsv.v);
      hex.value = v; swBox.style.background = v;
      sv.style.background =
        `linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,${hsvToHex(hsv.h, 100, 100)})`;
      dot.style.left = hsv.s + '%'; dot.style.top = (100 - hsv.v) + '%';
      dot.style.background = v;
      hdot.style.left = (hsv.h / 360 * 100) + '%';
    };
    const drag = (node, fn) => {
      const move = e => {
        const r = node.getBoundingClientRect();
        fn(clamp((e.clientX - r.left) / r.width, 0, 1), clamp((e.clientY - r.top) / r.height, 0, 1));
        paint();
      };
      node.addEventListener('pointerdown', e => {
        e.preventDefault(); try { node.setPointerCapture(e.pointerId); } catch (_) { }
        node._on = true; move(e);
      });
      node.addEventListener('pointermove', e => { if (node._on) move(e); });
      const up = () => { node._on = false; };
      node.addEventListener('pointerup', up); node.addEventListener('pointercancel', up);
    };
    drag(sv, (x, y) => { hsv.s = x * 100; hsv.v = (1 - y) * 100; });
    drag(hue, x => { hsv.h = x * 360; });
    hex.oninput = () => {
      if (!/^#[0-9a-f]{6}$/i.test(hex.value)) return;
      Object.assign(hsv, hexToHsv(hex.value)); paint();
    };
    okb.onclick = () => {
      const v = hsvToHex(hsv.h, hsv.s, hsv.v);
      if (addMode) {
        if (!isUserColor(v) && !PALETTE_BASE.includes(v)) { userPalette.push(v); savePalette(); }
        stage1();
      } else commit(v);
    };
    paint(); place();
  }

  function place() {
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth || 250, h = pop.offsetHeight || 240;
    pop.style.left = clamp(r.left + r.width / 2 - w / 2, 10, window.innerWidth - w - 10) + 'px';
    pop.style.top = (r.top - h - 10 > 10 ? r.top - h - 10 : Math.min(r.bottom + 10, window.innerHeight - h - 10)) + 'px';
  }
  stage1();
}

/* ═══ 모달 ═══════════════════════════════════════════════════ */
/* 모달과 저장 결과창은 같은 포커스 규칙을 쓴다. 배경은 화면 그대로 두고 조작만 막는다. */
const overlayFocus = new Map();
const focusableIn = node => [...node.querySelectorAll('button,input,select,textarea,a[href],[tabindex],[contenteditable="true"]')]
  .filter(n => !n.disabled && n.tabIndex >= 0 && !n.closest('[inert],[hidden]') && n.getClientRects().length);
function activeOverlay() {
  if ($('#saveSheet').classList.contains('is-on')) return $('#saveSheet');
  if ($('#modalRoot').firstChild) return $('#modalRoot');
  return null;
}
function syncOverlayLocks() {
  const active = activeOverlay();
  $('.shell').inert = !!active || exportBusy;
  $('#modalRoot').inert = !!active && active.id !== 'modalRoot';
  $('#popRoot').inert = !!active || exportBusy;
}
function enterOverlay(root, panel, title) {
  overlayFocus.set(root, exportBusy ? exportFocus : document.activeElement);
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-modal', 'true');
  panel.setAttribute('aria-label', title);
  panel.tabIndex = -1;
  syncOverlayLocks();
  queueMicrotask(() => {
    if (!panel.isConnected || activeOverlay() !== root) return;
    const controls = focusableIn(panel);
    const safe = panel.querySelector('.btn-quiet:not(:disabled)');
    const first = panel.querySelector('.btn-danger') ? safe : controls[0];
    (first || panel).focus({ preventScroll: true });
  });
}
function leaveOverlay(root) {
  const previous = overlayFocus.get(root);
  overlayFocus.delete(root);
  syncOverlayLocks();
  if (previous?.isConnected && !previous.closest('[inert],[hidden]')) previous.focus({ preventScroll: true });
  else if (!activeOverlay()) $('#btnSettings').focus({ preventScroll: true });
}
function closeModal() {
  const root = $('#modalRoot');
  if (!root.firstChild) return;
  root.innerHTML = '';
  leaveOverlay(root);
}

function modal(title, sub) {
  closeModal();
  const root = $('#modalRoot');
  const m = el('div', 'modal');
  m.onclick = e => { if (e.target === m) closeModal(); };
  const p = el('div', 'modal-panel');
  p.appendChild(el('h2', 'modal-title', title));
  if (sub) p.appendChild(el('p', 'modal-sub', sub));
  m.appendChild(p); root.appendChild(m);
  enterOverlay(root, p, title);
  return p;
}

/* 삭제 확인 모달 */
function confirmDelete(title, msg, onConfirm) {
  const p = modal(title, msg);
  const foot = el('div', 'modal-foot');
  const cancel = el('button', 'btn btn-quiet', '취소');
  cancel.onclick = closeModal;
  const ok = el('button', 'btn btn-danger btn-fill', '삭제');
  ok.onclick = () => { closeModal(); onConfirm(); };
  foot.append(cancel, ok);
  p.appendChild(foot);
}

/* 항목을 골라 무언가를 하는 모달. 초기화·내보내기·불러오기가 같은 꼴을 쓴다 —
   셋 다 «무엇을 건드릴지 먼저 고르고 한 번에 실행» 이라 손에 익은 자리가 같아야 한다.
   items = [열쇠, 제목, 설명, 처음부터 켤 것인가, 고를 수 있는가] */
function pickerModal(title, sub, items, actLabel, actClass, onApply, extra) {
  const p = modal(title, sub);
  if (extra) p.appendChild(extra);          /* 목록 앞에 붙는 것(불러오기의 «방식» 따위) */
  const list = el('div', 'reset-list');
  const checks = new Map();
  items.forEach(([key, name, desc, on, can]) => {
    const off = can === false;
    const label = el('label', 'reset-option' + (off ? ' is-off' : ''));
    const input = el('input'); input.type = 'checkbox'; input.value = key;
    input.checked = !off && !!on; input.disabled = off;
    const copy = el('span'); copy.append(el('strong', '', name), el('small', '', desc));
    label.append(input, copy); list.appendChild(label);
    if (!off) checks.set(key, input);
  });
  p.appendChild(list);
  const foot = el('div', 'modal-foot');
  const cancel = el('button', 'btn btn-quiet', '취소');
  const apply = el('button', 'btn ' + actClass, actLabel);
  const sync = () => {
    const on = [...checks.values()].some(x => x.checked);
    apply.disabled = !on; apply.style.opacity = on ? 1 : .45;
  };
  checks.forEach(input => input.onchange = sync);
  cancel.onclick = closeModal;
  apply.onclick = () => onApply(new Set([...checks].filter(([, i]) => i.checked).map(([k]) => k)));
  foot.append(cancel, apply); p.appendChild(foot);
  sync();
  return p;
}

function openResetModal() {
  pickerModal(
    '초기화할 항목을 선택하세요',
    '선택한 항목만 기본 상태로 되돌립니다. 선택하지 않은 항목은 그대로 유지됩니다.',
    [
      ['characters', '캐릭터 프리셋', '등록한 캐릭터 목록을 삭제합니다.'],

      ['colors', '색상', '색상 팔레트를 초기화합니다.'],
      /* 유일하게 «지우지 않는» 항목이다 — 브라우저가 들고 있던 예전 판만 버린다.
         고친 것이 화면에 안 나올 때 쓰는 자리라, 초기화를 찾아 들어온 손이 여기서 만난다. */

    /* 아래에서 작성창을 비우기 전에 챙겨 둔다 — 캐시만 고른 사람은 아무것도 잃지 않아야 한다 */
    const typed = $('#ta').value || '';

/* ═══ 캐시 비우기 ═══════════════════════════════════════════
   [초기화] 와는 반대쪽 일이다. 초기화는 «내가 만든 것» 을 지우고, 이쪽은 «브라우저가
   들고 있던 것» 만 버린다 — 고쳐 올린 새 판이 안 내려오고 예전 화면이 그대로 뜨는 일이
   여기서 생긴다. 작업 내용(localStorage)은 한 글자도 건드리지 않는다.
   브라우저의 HTTP 캐시는 스크립트가 직접 지울 수 없다. 그래서 두 겹으로 간다 —
   ① 문서를 캐시를 건너뛰고 다시 받아 그 자리를 새것으로 바꿔 두고 [cache:'reload'],
   ② 그래도 예전 것이 나올까 봐 캐시에 없는 주소(?fresh=…)로 새로 연다.
   ②가 남긴 자국은 뜨자마자 주소에서 지운다 — 아래 부팅부가 그 몫이다. */
const DRAFT_KEY = 'chat-excerpt/draft';
const FRESH_Q = 'fresh';
/* 캐시를 걷어내는 데 줄 시간. 넘기면 못 걷어낸 채로 새로 받는다 — 아예 안 뜨는 것보다 낫다. */
const CACHE_SWEEP_MS = 2500;
/* draft 를 주면 그것을, 안 주면 지금 작성창에 있는 것을 맡아 둔다 — 초기화와 함께 부를 때는
   호출한 쪽이 «비우기 전» 의 글을 들고 있으므로 그쪽 것을 받는다 [openResetModal]. */
async function clearCacheAndReload(draft) {
  /* 작성창에 치던 글은 아직 블록이 아니라 저장에 안 들어간다 — 잠깐 맡아 두었다 돌려준다 */
  try { sessionStorage.setItem(DRAFT_KEY, draft != null ? draft : ($('#ta').value || '')); } catch (_) { }
  let url = null;
  try { url = new URL(location.href); url.searchParams.delete(FRESH_Q); } catch (_) { }
  /* 아래 셋은 모두 «되면 좋은» 일이다 — 하나가 안 끝난다고 단추가 먹통이 되면 안 된다.
     실제로 caches.keys() 가 끝내 돌아오지 않는 자리를 보았다(헤드리스 크롬의 iframe).
     그래서 통째로 시간을 재고, 그 안에 못 끝내면 그냥 두고 새로 받는 쪽으로 넘어간다 —
     캐시를 못 지워도 ?fresh 로 새 주소를 여는 마지막 수는 늘 남아 있다. */
  const sweep = (async () => {
    /* 지금은 서비스 워커도 Cache Storage 도 안 쓴다. 예전 판이 남겨 둔 것이 있으면 걷어낸다 —
       한 번 등록된 서비스 워커는 그것을 만든 코드가 사라져도 혼자 계속 살아 있다. */
    try {
      if (window.caches) await Promise.all((await caches.keys()).map(k => caches.delete(k)));

    try {

        await Promise.all((await navigator.serviceWorker.getRegistrations())
          .map(r => r.unregister().catch(() => { })));
    } catch (_) { }
    /* 깨끗한 주소의 캐시 자리를 새것으로 갈아 둔다 — 이번 판이 아니라 «다음 방문» 을 위한 몫이다 */
    try { if (url) await fetch(url.href, { cache: 'reload' }); } catch (_) { }
  })();
  await withTimeout(sweep.catch(() => { }), CACHE_SWEEP_MS, null);
  if (url) { url.searchParams.set(FRESH_Q, Date.now().toString(36)); location.replace(url.href); }

}
/* 자르기 틀 [원본 msgCropState / clampMsgCrop / onMsgCropZoom] */
const arOf = r => { const q = String(r || 1).split(':').map(Number); return (q[1] ? q[0] / q[1] : q[0]) || 1; };

function cropField(src, ratio, options = {}) {
  const box = el('div', 'crop');
  /* 비율은 CSS 변수로도 내려 준다 — 높이 제한(max-width)이 이 값을 곱해 쓴다 */
  const setAR = r => { box.style.aspectRatio = String(r).replace(':', '/'); box.style.setProperty('--ar', arOf(r)); };
  let currentRatio = ratio || 1;
  setAR(currentRatio === 'original' ? 1 : currentRatio);
  const st = { scale: 1, x: 0, y: 0, natW: 0, natH: 0, drag: false, pid: null, base: 1, touched: false };
  let img = null, grid = null;
  let lastW = 0, lastH = 0, pendingCrop = options.crop || null;
  const snapshot = () => {
    if (!st.natW || !st.natH || !st.scale || !lastW || !lastH) return null;
    if (currentRatio === 'original' && Math.abs(st.scale - st.base) < 0.000001)
      return { x: 0, y: 0, width: 1, height: 1, ratio: st.natW / st.natH };
    return { x: -st.x / (st.natW * st.scale), y: -st.y / (st.natH * st.scale),
      width: lastW / (st.natW * st.scale), height: lastH / (st.natH * st.scale), ratio: lastW / lastH };
  };
  const changed = () => { if (box._onChange) box._onChange(); };

  const apply = () => { if (img) img.style.transform = `translate(${st.x}px,${st.y}px) scale(${st.scale})`; };
  const clampPos = () => {
    const fw = box.clientWidth, fh = box.clientHeight;
    const w = st.natW * st.scale, h = st.natH * st.scale;
    st.x = w <= fw ? (fw - w) / 2 : clamp(st.x, fw - w, 0);
    st.y = h <= fh ? (fh - h) / 2 : clamp(st.y, fh - h, 0);
  };
  const refit = () => {
    if (!img || !st.natW) return;
    if (currentRatio === 'original') setAR(st.natW / st.natH);
    const fw = box.clientWidth, fh = box.clientHeight;
    /* 아직 배치 전이면 0 이 나온다. 다음 프레임에 다시 잰다 — 0 으로 잡으면 배율이 0 이 되어 아무것도 안 보인다. */
    if (!fw || !fh) { requestAnimationFrame(refit); return; }
    const saved = pendingCrop || (options.preserve && lastW && lastH ? snapshot() : null);
    pendingCrop = null;
    st.base = Math.max(fw / st.natW, fh / st.natH);   /* 틀을 꽉 채우는 배율이 최소값 */
    st.scale = st.base; st.x = 0; st.y = 0;
    if (saved && [saved.x, saved.y, saved.width, saved.height].every(Number.isFinite) && saved.width > 0) {
      st.scale = Math.max(st.base, fw / (st.natW * saved.width));
      st.x = -saved.x * st.natW * st.scale;
      st.y = -saved.y * st.natH * st.scale;
    }
    lastW = fw; lastH = fh;
    clampPos(); apply();
    if (box._onScale) box._onScale(st.base, st.scale);
    changed();
  };
  const setSrc = s => {
    if (box._src && box._src !== s) pendingCrop = null;
    lastW = lastH = 0; st.natW = st.natH = 0; st.touched = false;
    box.innerHTML = '';
    box._src = s || '';
    if (!s) { box.appendChild(el('div', 'crop-empty', '이미지를 선택하세요')); img = null; return; }
    img = el('img'); img.src = s;
    img.onload = () => {
      st.natW = img.naturalWidth; st.natH = img.naturalHeight;
      img.style.width = st.natW + 'px'; img.style.height = st.natH + 'px';
      refit();
    };
    if (img.complete && img.naturalWidth) img.onload();
    grid = el('div', 'crop-grid');
    box.append(img, grid);
  };
  /* [원본 setMsgCropRatio] 비율을 바꾸면 틀만 바뀌고 이미지는 다시 꽉 차게 맞춘다 */
  box._setRatio = (r, reset = false) => {
    if (reset || r !== currentRatio) { lastW = lastH = 0; pendingCrop = null; }
    currentRatio = r;
    setAR(r === 'original' && st.natW ? st.natW / st.natH : (r === 'original' ? 1 : r));

  box.addEventListener('pointerdown', e => {
    if (!img) return;
    e.preventDefault(); st.drag = true; st.pid = e.pointerId;
    st.sx = e.clientX; st.sy = e.clientY; st.ox = st.x; st.oy = st.y;

    try { box.setPointerCapture(e.pointerId); } catch (_) { }

  box.addEventListener('pointermove', e => {
    if (!st.drag || e.pointerId !== st.pid) return;
    e.preventDefault();
    st.touched = true;
    st.x = st.ox + (e.clientX - st.sx); st.y = st.oy + (e.clientY - st.sy);
    clampPos(); apply();
    changed();
  });
  const end = e => {
    if (!st.drag || (e && e.pointerId !== st.pid)) return;
    st.drag = false; st.pid = null; box.classList.remove('grab');
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);

  /* 틀 한가운데를 기준으로 확대해야 보고 있던 지점이 그대로 남는다 [원본] */
  box._zoom = next => {
    st.touched = true;
    const prev = st.scale, cx = box.clientWidth / 2, cy = box.clientHeight / 2, k = next / prev;
    st.x = cx - (cx - st.x) * k; st.y = cy - (cy - st.y) * k;
    st.scale = next; clampPos(); apply();
    changed();
  };
  /* 틀 한가운데에 놓는다. 꽉 채우고 남는 쪽을 어디에 흘릴지를 refit 은 «왼쪽 위» 로 두는데,
     배경 이미지처럼 캔버스가 «가운데 정렬(50% 50%)» 로 그리는 자리는 첫 화면이 그와 같아야
     열자마자 다른 그림이 보이지 않는다 [openBgImageModal].
     손댄 것으로는 치지 않는다 — 열어 보기만 하고 나가면 원본 그대로 나가야 한다 [_export]. */
  box._center = () => {
    const fw = box.clientWidth, fh = box.clientHeight;
    st.x = (fw - st.natW * st.scale) / 2;
    st.y = (fh - st.natH * st.scale) / 2;
    clampPos(); apply();
  };
  box._state = st;
  box._snapshot = snapshot;
  box._setSrc = setSrc;
  /* 창에 떨군 사진을 이 틀이 받는다 — 받은 뒤 무엇을 더 할지는 모달이 정한다(_onPick) */
  box._dropFile = f => readImageFile(f, d => { setSrc(d); if (box._onPick) box._onPick(d); });
  box._maxPx = 1024;                 /* 구워 낼 최대 변 길이 — 캐릭터 이미지는 더 작게 잡는다 */
  box._export = () => {
    if (!img || !st.natW) return box._src || null;
    const fw = box.clientWidth, fh = box.clientHeight;
    /* 옮기지도 확대하지도 않았으면 다시 구울 이유가 없다 — 원본을 그대로 쓴다 */
    if (!st.touched || !fw || !fh) return box._src || null;
    try {
      const out = document.createElement('canvas');
      const R = Math.min(2, box._maxPx / Math.max(fw, fh));
      out.width = Math.round(fw * R); out.height = Math.round(fh * R);
      const g = out.getContext('2d');
      if (!g) return box._src || null;
      g.setTransform(R, 0, 0, R, 0, 0);
      g.drawImage(img, st.x, st.y, st.natW * st.scale, st.natH * st.scale);
      return encodeCanvas(out);
    } catch (e) { console.warn('crop export 실패 — 원본 사용', e); return box._src || null; }
  };
  setSrc(src);
  return box;
}

/* ═══ 제작자 서명 ═══════════════════════════════════════════
   서명은 거의 언제나 '누구의 이야기인가 · 누가 만들었나' 두 조각으로 적힌다.
   한 줄로 받으면 가운뎃점을 사람이 매번 손으로 찍어야 하고, 한쪽만 쓸 때
   점이 남거나 빠지는 것도 사람 몫이 된다. 칸을 둘로 나누고 잇는 일은 여기서 한다. */
const FOOTER_SEP = ' · ';
function footerText(b) {
  const parts = [b.charName, b.maker].map(x => (x || '').trim()).filter(Boolean);
  if (parts.length) {
    const sep = b.sep === '|' ? ' | ' : ' · ';
    return parts.join(sep);
  }
  return b.text || '';        /* 한 줄로만 적던 시절의 저장본 */
}

/* ═══ 블록 편집 헤더 ═══════════════════════════════════════════
   [<][>] 실행취소/다시실행 + [복사][삭제][저장]
   모든 블록 편집 패널 상단에 통일된 헤더로 사용한다. */
function moveBlock(block, destination) {
  if (!block || block.type === 'footer') return;
  const from = S.blocks.indexOf(block);
  const last = S.blocks.filter(item => item.type !== 'footer').length - 1;
  const to = clamp(destination, 0, last);
  if (from < 0 || from === to) return;
  S.blocks.splice(from, 1);
  S.blocks.splice(to, 0, block);

}
function openBlockMoveModal(block) {

  const list = el('div', 'settings-list');
  [['맨 위로', 0], ['위로 한 칸', from - 1], ['아래로 한 칸', from + 1], ['맨 아래로', last]].forEach(([label, to]) => {
    const button = el('button', 'btn btn-quiet', label);
    button.disabled = to < 0 || to > last || to === from;
    button.onclick = () => {
      closeModal(); moveBlock(block, to);
      $('#formatWrap button[title="블록 순서 이동"]')?.focus({ preventScroll: true });
    };

  });
  const foot = el('div', 'modal-foot');
  const cancel = el('button', 'btn btn-quiet', '취소'); cancel.onclick = closeModal;
  foot.appendChild(cancel); p.append(list, foot);
}

    btnCopy.style.cssText = 'height:28px;width:28px;padding:0;';
    btnCopy.title = '복제';
    btnCopy.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    btnCopy.onclick = () => {
      const copy = Object.assign({}, block, { id: uid() });
      S.blocks.splice(S.blocks.indexOf(block) + 1, 0, copy);
      S.ui.selectedBlockId = copy.id;
      save(); render(); toast('이 블록을 복제했습니다');
    };
    hdr.appendChild(btnCopy);
  }
  /* 삭제 — 새 블록이면 취소, 기존 블록이면 삭제 확인 */
  const btnDel = el('button', 'btn btn-danger');
  btnDel.style.cssText = 'height:28px;width:28px;padding:0;';
  btnDel.title = isNew ? '취소' : '삭제';
  btnDel.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
  btnDel.onclick = () => {
    if (isNew) {
      /* 새 블록 — 확인 없이 바로 취소 */
      backToDefault();
    } else {
      /* 기존 블록 — 삭제 확인 */
      confirmDelete('블록 삭제', '이 블록을 삭제하시겠습니까?', () => {
        S.blocks = S.blocks.filter(x => x.id !== block.id);
        save(); backToDefault(); toast('블록을 삭제했습니다');
      });
    }
  };
  hdr.appendChild(btnDel);
  /* 저장/확인 — 패널 닫고 기본으로 복귀 (실시간 반영이라 확인 역할) */
  const btnSave = el('button', 'btn btn-fill');
  btnSave.style.cssText = 'height:28px;width:28px;padding:0;';
  btnSave.title = '확인';
  btnSave.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;"><path d="M20 6L9 17l-5-5"/></svg>';
  btnSave.onclick = () => { if (onConfirm) onConfirm(); else backToDefault(); };
  hdr.appendChild(btnSave);
  host.appendChild(hdr);
  return { btnSave };  /* 필요하면 저장 버튼 상태 제어 가능 */
}

/* 서명 편집 — 칸이 둘뿐이라 확정 단추를 둘 이유가 없다. 적는 대로 캔버스에 반영된다.
   그만두려면 위 [×] 로 블록에서 손을 떼면 되고, 지우려면 아래 [블록 삭제] 다. */
function buildFooterEditor(host, block) {
  /* 통일된 헤더 */
  buildEditHeader(host, block, () => backToDefault());

  /* 예전 한 줄짜리 서명은 '제작자' 로 옮겨 놓고 시작한다 — 지우고 다시 쓰게 하지 않는다 */
  if (!block.charName && !block.maker && block.text) { block.maker = block.text; block.text = ''; }

  const wrap = el('div');
  wrap.style.cssText = 'padding:var(--sp-md);';
  const body = el('div', 'stack');

  /* 캐릭터 / 제작자 입력 */
  const mk = (label, key, ph) => {
    const w = el('div');
    w.appendChild(el('span', 'lab', label));
    const i = el('input', 'inp'); i.value = block[key] || ''; i.placeholder = ph;
    i.oninput = () => { block[key] = i.value; save(); renderCanvas(); };
    w.appendChild(i);
    return w;
  };
  body.append(mk('캐릭터', 'charName', '예) 해이'), mk('제작자', 'maker', '예) @luvheil'));

  /* 정렬 + 구분자 */
  const optGrid = el('div', 'grid2');
  optGrid.style.marginTop = 'var(--sp-md)';
  /* 정렬 */
  const alignField = el('div', 'field');
  alignField.appendChild(el('label', 'lab', '정렬'));
  alignField.appendChild(segment([['left', '좌측 정렬'], ['center', '중앙 정렬'], ['right', '우측 정렬']],
    block.align || 'right', v => { block.align = v; save(); renderCanvas(); }));
  optGrid.appendChild(alignField);
  /* 구분자 */
  const sepField = el('div', 'field');
  sepField.appendChild(el('label', 'lab', '구분 기호'));
  sepField.appendChild(segment([['·', '·'], ['|', '|']],
    block.sep || '·', v => { block.sep = v; save(); renderCanvas(); }));
  optGrid.appendChild(sepField);
  body.appendChild(optGrid);

  /* 서식: 볼드 / 이탤릭 */
  const fmtRow = el('div', 'fmt-row');
  fmtRow.style.marginTop = 'var(--sp-md)';
  const mkFmt = (label, key, icon) => {
    const btn = el('button', 'icb' + (block[key] ? ' is-on' : ''));
    btn.innerHTML = icon;
    btn.title = label;
    btn.onclick = () => {
      block[key] = !block[key];
      btn.classList.toggle('is-on', block[key]);
      save(); renderCanvas();
    };
    return btn;
  };
  fmtRow.appendChild(mkFmt('볼드', 'bold', '<b>B</b>'));
  fmtRow.appendChild(mkFmt('이탤릭', 'italic', '<i>I</i>'));
  body.appendChild(fmtRow);

  wrap.appendChild(body);
  host.appendChild(wrap);
}

/* 음악 편집 — 서명과 같은 방식이다. 확정 단추 없이 적는 대로 캔버스에 반영된다.
   그만두려면 위 [×] 로 블록에서 손을 떼고, 지우려면 아래 [블록 삭제] 다. */
function buildMusicEditor(host, block) {
  /* 통일된 헤더 추가 — 음악은 적는 대로 반영되므로 저장 버튼은 '확인(닫기)' 역할 */
  buildEditHeader(host, block, () => backToDefault());

  /* ── 버전 탭: VER1(기본) / VER2(납작) ─────────────────────────── */
  const tabs = el('div', 'tabs-line');
  tabs.style.position = 'relative';
  const ver1 = el('button', 'tab-line' + (block.layout !== 'flat' ? ' is-on' : ''), '기본형');
  const ver2 = el('button', 'tab-line' + (block.layout === 'flat' ? ' is-on' : ''), '납작형');
  const indicator = el('div', 'tab-indicator');
  indicator.style.width = '50%';
  indicator.style.left = block.layout === 'flat' ? '50%' : '0';
  const syncTab = (isFlat) => {
    ver1.classList.toggle('is-on', !isFlat);
    ver2.classList.toggle('is-on', isFlat);
    indicator.style.left = isFlat ? '50%' : '0';
  };
  ver1.onclick = () => { block.layout = 'normal'; syncTab(false); save(); renderCanvas(); };
  ver2.onclick = () => { block.layout = 'flat'; syncTab(true); save(); renderCanvas(); };
  tabs.append(ver1, ver2, indicator);
  host.appendChild(tabs);

  /* ── 상단: 앨범 커버 + 노래 정보 가로 배치 ─────────────────────────── */
  const topRow = el('div');
  topRow.style.cssText = 'display:flex;gap:var(--sp-md,12px);padding:var(--sp-md,12px);margin-bottom:var(--sp-md,12px);';
  /* 앨범 커버 */
  const openCover = () => openAvatarModal(block.cover || '', d => {
    if (d) block.cover = d; else delete block.cover;
    save(); render();
  }, { title: '앨범 커버', sub: '카드에서는 정사각형으로 잘려 들어갑니다. 끌어서 위치를 맞추세요.' });
  const prev = el('div', 'bgimg-drop');
  prev.style.cssText = 'width:80px;height:80px;flex:0 0 80px;border-radius:var(--r-sm,8px);overflow:hidden;'
    + 'background:var(--c-surface-sunken,#F2F2F7);display:grid;place-items:center;cursor:pointer;position:relative;';
  const paintCov = () => {
    prev.innerHTML = '';
    if (block.cover) {
      const i = el('img'); i.src = block.cover;
      i.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
      prev.appendChild(i);
    } else {
      prev.innerHTML = '<svg viewBox="0 0 24 24" style="width:24px;height:24px;stroke:var(--c-text-tertiary,#AEAEB2);fill:none;stroke-width:1.5;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
    }
  };
  paintCov();
  prev.onclick = openCover;
  /* 노래 정보 */
  const infoCol = el('div');
  infoCol.style.cssText = 'flex:1;display:flex;flex-direction:column;gap:var(--sp-sm,8px);justify-content:center;';
  const mkInput = (key, ph) => {
    const i = el('input', 'inp'); i.value = block[key] || ''; i.placeholder = ph;
    i.oninput = () => { block[key] = i.value; save(); renderCanvas(); };
    return i;
  };
  infoCol.append(mkInput('title', '곡명'), mkInput('artist', '아티스트'));
  topRow.append(prev, infoCol);
  host.appendChild(topRow);

  /* ── 상세 섹션 ─────────────────────────────────────────────────── */
  const details = el('div');
  details.style.cssText = 'border-top:1px solid var(--c-divider,#EBEBF0);padding:var(--sp-md,12px);';
  const body = el('div', 'stack');
  const th = theme();
  /* 글꼴 — 제목·가수에만 걸린다 [musicNode]. 안 고르면 본문 글꼴 그대로다.
     크기 손잡이는 일부러 안 둔다: 본문과 나란한 크기가 이 카드의 약속이다 [.mu-title].
     («고르는 칸이 넓어야 이름이 안 잘린다» — 한 줄을 통째로 준다 [fontControls].) */
  const fr = el('div');
  fr.appendChild(el('span', 'lab', '글꼴'));
  fr.appendChild(fontSelect(block.font || fmt().font,
    v => { block.font = v; save(); renderCanvas(); }));
  body.appendChild(fr);

  /* 색 — 안 건드리면 모두 본문 글자색을 그대로 따라간다. 그래서 처음 값은 «지금 나오는
     그 색» 이다. 한 번 고르면 그 블록의 값이 되어 테마를 바꿔도 안 따라온다.
     카드 배경만 홀로 맨 뒤에 두어 바로 아래 불투명도와 한 덩어리로
     읽히게 한다 — 그 둘이 실제로 «카드가 보이는 색» 하나를 만든다 [musicNode]. */
  /* 색상 — 글자색, 진행바 색, 배경 색 */
  const cg = el('div', 'grid2-sm');
  cg.appendChild(colorField('글자색', block.textColor || block.btnColor || block.tint || th.fg,
    v => { block.textColor = v; block.btnColor = v; save(); renderCanvas(); }));
  cg.appendChild(colorField('진행바 색', block.barColor || block.tint || th.fg,
    v => { block.barColor = v; save(); renderCanvas(); }));
  cg.appendChild(colorField('배경색', block.card || MU_CARD,
    v => { block.card = v; save(); renderCanvas(); }));
  body.appendChild(cg);

  /* 카드가 얼마나 비치는가 — 0 이면 아예 없는 것과 같고, 100 이면 꽉 찬 단색이다.
     배경 이미지를 깔았을 때 이 값이 «유리 한 장» 의 두께가 된다. */
  body.appendChild(sliderH('카드 불투명도', block.cardOpacity ?? MU_CARD_A, 0, 100, 5,
    v => { block.cardOpacity = v; save(); renderCanvas(); }, '%'));

  /* 흐림은 불투명도와 짝이다 — 불투명도가 «유리의 두께» 라면 이것은 «간유리인가» 다.
     둘 다 카드 뒤에 무엇이 있을 때만 뜻이 있으므로 나란히 둔다 [musicNode].
     (배경 이미지가 없으면 흐릴 것이 없다 — 값을 올려도 화면은 그대로다.) */
  body.appendChild(sliderH('카드 흐림', clamp(block.cardBlur ?? 0, 0, MU_BLUR_MAX), 0, MU_BLUR_MAX, 1,
    v => { block.cardBlur = v; save(); renderCanvas(); }, 'px'));

  /* 들은 만큼 — 진행바가 어디까지 차 있는가. 원본이 87% 에서 멈춰 있어 그것을 기본으로 둔다. */
  body.appendChild(sliderH('들은 만큼', block.progress ?? 87, 0, 100, 1,
    v => { block.progress = v; save(); renderCanvas(); }, '%'));
  /* 크기 — 캔버스 안쪽 폭의 몇 할을 쓰는가. 폭 하나로 안쪽이 통째로 따라온다 [musicNode].
     100% 가 캔버스를 꽉 채운 상태라 그 위는 없다. */
  body.appendChild(sliderH('크기', clamp(block.scale ?? 100, 30, 100), 30, 100, 5,
    v => { block.scale = v; save(); renderCanvas(); }, '%'));
  details.appendChild(body);
  host.appendChild(details);
}

/* 이미지 편집 — 예전엔 창으로 띄웠고 그 다음엔 별도 층(deck)이었다.
   둘 다 '이 블록을 고치는 일' 을 두 자리로 갈라 놓아, 서식은 취소를 눌러야 보였다.
   이제 서식 패널 안에 그대로 들어간다 — 한 블록의 일은 한 패널에서 끝난다. */
function buildImageEditor(host, block, initialSrc) {
  const isNew = !block;
  const previous = S.ui.imagePreview;
  const source = previous && (block ? previous.blockId === block.id
    : !previous.blockId && previous.initialSrc === (initialSrc || '')) ? previous.block : block;
  const draft = {
    src: source ? source.src : (initialSrc || ''),
    size: source ? (source.size ?? 60) : 60,
    round: source ? source.round !== false : true,
    imageAlign: source && ['left', 'center', 'right'].includes(source.imageAlign) ? source.imageAlign : 'center',
    ratio: source?.imageRatio || 'original'
  };
  let previewFrame = 0;
  const preview = () => {
    if (!host.isConnected || S.ui.stage !== 'format' ||
      (block ? S.ui.selectedBlockId !== block.id : S.ui.newKind !== 'image')) return;
    /* 입력은 즉시 보존하고 그리기만 한 프레임으로 묶는다. 중간 재렌더에도 마지막 클릭이 남는다. */
    S.ui.imagePreview = draft.src ? { blockId: block?.id || null, initialSrc: initialSrc || '', block: {
      id: block?.id || 'image-preview', type: 'image', src: draft.src,
      size: draft.size, round: draft.round, imageAlign: draft.imageAlign,
      imageCrop: crop._snapshot(), imageRatio: draft.ratio
    } } : null;
    if (!previewFrame) previewFrame = requestAnimationFrame(() => {
      previewFrame = 0;
      if (host.isConnected && S.ui.stage === 'format') renderCanvas();
    });
  };
  /* 통일된 헤더 */
  buildEditHeader(host, block, () => doConfirm());
  const confirmButton = host.querySelector('button[title="확인"]');
  confirmButton.onclick = null;
  bindStickyTap(confirmButton, () => doConfirm());

  /* 이미지 자르기 영역 */
  const wrap = el('div');
  wrap.style.cssText = 'padding:var(--sp-md);';

  const alignField = el('div', 'field');
  alignField.appendChild(el('label', 'lab', '정렬'));
  const alignItems = [['left', '좌측'], ['center', '중앙'], ['right', '우측']];
  const selectAlign = value => {
    draft.imageAlign = value;
    syncAlign();
    preview();
  };
  const alignSeg = segment(alignItems, draft.imageAlign, selectAlign);
  [...alignSeg.children].forEach((button, i) => {
    button.onclick = null;
    bindStickyTap(button, () => selectAlign(alignItems[i][0]));
  });
  const syncAlign = () => {
    [...alignSeg.children].forEach((button, i) => {
      const selected = alignItems[i][0] === draft.imageAlign;
      button.classList.toggle('is-on', selected);
      button.setAttribute('aria-pressed', String(selected));
    });
  };
  syncAlign();
  alignSeg.setAttribute('role', 'group');
  alignSeg.setAttribute('aria-label', '이미지 정렬');
  alignField.appendChild(alignSeg);
  wrap.appendChild(alignField);

  /* 상단: 모서리 둥글게 토글 (우측 정렬) */
  const topRow = el('div');
  topRow.style.cssText = 'display:flex;justify-content:flex-end;margin-bottom:var(--sp-md);';
  const roundToggle = toggleRow('모서리 둥글게', '', draft.round, v => {
    draft.round = v; crop.style.borderRadius = v ? '10px' : '0';
    preview();
  });
  roundToggle.style.cssText = 'margin:0;padding:0;';
  roundToggle.querySelector('.tgl').classList.add('tgl-sm');
  topRow.appendChild(roundToggle);
  wrap.appendChild(topRow);

  const crop = cropField(draft.src, draft.ratio, { preserve: true, crop: source?.imageCrop });
  crop._onChange = preview;

  const ratios = el('div', 'crop-ratios');
  [['original', '원본'], ['1:1', '정사각'], ['3:4', '세로'], ['4:3', '가로'], ['16:9', '와이드']].forEach(([r, sub]) => {
    const b = el('button', draft.ratio === r ? 'on' : '');
    if (r === 'original') b.textContent = sub;
    else b.innerHTML = `${r}<small>${sub}</small>`;
    b.onclick = () => {
      draft.ratio = r;
      [...ratios.children].forEach(x => x.classList.toggle('on', x === b));
      crop._setRatio(r, true);
    };
    ratios.appendChild(b);
  });

  const zoomWrap = el('div', 'slideh');
  zoomWrap.appendChild(el('span', 'lab', '확대'));
  const zoom = el('input', 'rng'); zoom.type = 'range'; zoom.step = '0.01';
  zoomWrap.appendChild(zoom);
  crop._onScale = (base, current) => { zoom.min = base; zoom.max = Math.max(base * 3, current); zoom.value = current; };
  zoom.oninput = () => crop._zoom(parseFloat(zoom.value));

  /* 미리보기(자르기 틀)를 누르면 곧바로 이미지 선택으로 간다 — 별도 버튼을 두지 않는다 */
  const took = d => { draft.src = d; crop.style.cursor = 'grab'; imgBtns.hidden = false; };
  crop._onPick = took;                       /* 창에 떨군 사진 */
  const pick = () => pickImage(d => { took(d); crop._setSrc(d); });
  crop.addEventListener('click', e => { if (!draft.src) { e.stopPropagation(); pick(); } });
  if (!draft.src) crop.style.cursor = 'pointer';
  const imgBtns = el('div');
  imgBtns.style.cssText = 'position:absolute;right:8px;bottom:8px;z-index:4;display:flex;gap:6px;';
  imgBtns.hidden = !draft.src;
  const reBtn = el('button', 'btn btn-quiet');
  reBtn.style.cssText = 'box-shadow:var(--shadow-pop);width:32px;height:32px;padding:0;';
  reBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
  reBtn.title = '바꾸기';
  reBtn.onclick = e => { e.stopPropagation(); pick(); };
  const rmBtn = el('button', 'btn btn-danger btn-fill');
  rmBtn.style.cssText = 'box-shadow:var(--shadow-pop);width:32px;height:32px;padding:0;';
  rmBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
  rmBtn.title = '삭제';
  rmBtn.onclick = e => { e.stopPropagation(); draft.src = ''; crop._setSrc(''); imgBtns.hidden = true; crop.style.cursor = 'pointer'; preview(); };
  imgBtns.append(reBtn, rmBtn);

  const stage = el('div', 'crop-stage'); stage.style.position = 'relative';
  /* 크기(%)는 캔버스에서 차지할 폭이다. 틀을 그만큼 좁혀 실제 크기를 눈으로 보게 한다. */
  const sizer = el('div');
  sizer.style.cssText = 'width:100%;position:relative;';
  sizer.appendChild(crop);
  /* 버튼은 틀이 아니라 스테이지 기준으로 붙인다 — 크기를 줄이면 틀을 따라
     안쪽으로 끌려 들어와 엉뚱한 자리에 놓였다. */
  stage.append(sizer, imgBtns);

  const body = el('div', 'stack');
  body.append(ratios, stage, zoomWrap);

  /* 크기 — 스테퍼가 아니라 슬라이더 */
  const szWrap = el('div', 'slideh');
  const szLab = el('span', 'lab', '크기');
  const szVal = el('span', 'lab-sub', draft.size + '%'); szVal.style.cssText = 'display:inline;margin-left:6px';
  szLab.appendChild(szVal); szWrap.appendChild(szLab);
  const sz = el('input', 'rng'); sz.type = 'range'; sz.min = 10; sz.max = 100; sz.step = 5; sz.value = draft.size;
  const applySize = () => {
    szVal.textContent = draft.size + '%';
    sizer.style.width = draft.size + '%';
    requestAnimationFrame(() => crop._setRatio(draft.ratio));   /* 폭이 바뀌면 배율을 다시 맞춘다 */
  };
  sz.oninput = () => { draft.size = +sz.value; applySize(); };
  szWrap.appendChild(sz); body.appendChild(szWrap);

  crop.style.borderRadius = draft.round ? '10px' : '0';
  wrap.appendChild(body);
  host.appendChild(wrap);
  applySize();

  let confirming = false;
  const put = async () => {
    if (confirming) return;
    confirming = true;
    if (!(await whenDrawable(crop.querySelector('img')))) {
      confirming = false; toast('이미지를 불러온 뒤 다시 확인해주세요'); return;
    }
    await raf2();
    const patch = { size: draft.size, round: draft.round, imageAlign: draft.imageAlign,
      imageRatio: draft.ratio, imageCrop: crop._snapshot() };
    /* 원본 하나와 작은 좌표만 보존한다. 편집 확정마다 자른 PNG를 중복 저장하지 않는다. */
    const src = block && draft.src === block.src ? draft.src : await shrinkImage(draft.src, 1024);
    if (S.ui.stage !== 'format' || (block ? S.ui.selectedBlockId !== block.id
      : S.ui.newKind !== 'image' || (S.ui.newSrc || '') !== (initialSrc || ''))) {
      confirming = false; return;
    }
    if (isNew) {
      addBlock({ type: 'image', src, ...patch });
      /* 만든 그 블록을 이어서 고칠 수 있게 곧바로 고른 상태로 둔다 */
      S.ui.selectedBlockId = S.blocks[S.blocks.length - 1].id;
    } else {
      const current = S.blocks.find(b => b.id === block.id);
      if (!current) { confirming = false; return; }
      Object.assign(current, { src, ...patch });
    }
    S.ui.imagePreview = null;
    save();
    toast(isNew ? '이미지를 추가했습니다' : '이미지를 수정했습니다');
    backToDefault();          /* 넣었으면 끝난 일이다 */
  };

  /* 확정 동작 — 헤더의 저장 버튼이나 하단 확인 버튼에서 호출한다 */
  const doConfirm = () => {
    if (!draft.src) { toast('이미지를 먼저 선택하세요'); return; }
    put();
  };
  /* 새 이미지 추가 시에만 하단 버튼이 쓰이고, 기존 블록은 헤더의 저장 버튼으로 확정한다 */
  _confirm = isNew ? doConfirm : null;
}

/* HTML 블록 편집 — 쇼케이스 스타일: 헤더 + 컴포저 입력 영역 */
function buildHtmlEditor(host, block) {
  const isNew = !block;
  const draft = { src: block ? (block.src || block.text || '') : '' };

  /* 헤더 */
  buildEditHeader(host, block, () => doConfirm());

  /* 컴포저 입력 영역 — inp-group 스타일 */
  const wrap = el('div');
  wrap.style.cssText = 'padding:var(--sp-md);';

  const grp = el('div', 'inp-group');

  /* 텍스트 입력 영역 — 모노스페이스 */
  const ta = el('textarea', 'composer-ta');
  ta.placeholder = '<div>HTML 코드</div>';
  ta.value = draft.src;
  ta.style.cssText = 'font-family:var(--font-mono,"SF Mono",Menlo,monospace);font-size:11px;min-height:80px;';
  ta.oninput = () => {
    draft.src = ta.value;
    /* 실시간 반영 — 기존 블록이면 바로 저장 */
    if (block) {
      block.src = ta.value;
      block.text = ta.value;
      expandBlock(block);
      save();
      renderCanvas();
    }
  };

  grp.append(ta);
  wrap.appendChild(grp);
  host.appendChild(wrap);

  /* 저장/확인 */
  const doConfirm = () => {
    const raw = draft.src.trim();
    if (!raw) { toast('HTML 내용을 입력하세요'); return; }
    if (isNew) {
      addBlock({ type: 'html', src: raw, text: raw });
      S.ui.selectedBlockId = S.blocks[S.blocks.length - 1].id;
      save();
      toast('HTML을 추가했습니다');
    }
    backToDefault();
  };

  _confirm = isNew ? doConfirm : null;
}

/* 구분선 블록 편집 — 종류 선택 + 미리보기 */
const DIVIDER_STYLES = [
  { key: 'solid', label: '실선', symbol: '───' },
  { key: 'star', label: '별', symbol: '✦ ✦ ✦' },
  { key: 'wave', label: '물결', symbol: '〰〰' },
  { key: 'double', label: '이중', symbol: '══' },
  { key: 'dash', label: '대시', symbol: '- - -' }
];
function buildDividerEditor(host, block) {
  const isNew = !block;
  const draft = { style: block?.dividerStyle || 'solid' };

  /* 통일된 헤더 — doConfirm은 아래에서 정의 */
  buildEditHeader(host, block, () => doConfirm());

  const wrap = el('div');
  wrap.style.cssText = 'padding:var(--sp-md);';

  /* 구분선 종류 레이블 */
  const lab = el('span', 'lab', '구분선 종류');
  wrap.appendChild(lab);

  /* segment 버튼들 */
  const seg = el('div', 'seg');
  seg.style.marginBottom = 'var(--sp-lg)';
  DIVIDER_STYLES.forEach(ds => {
    const btn = el('button', draft.style === ds.key ? 'is-on' : '');
    btn.innerHTML = `<small>${ds.label}</small>${ds.symbol}`;
    btn.onclick = () => {
      draft.style = ds.key;
      seg.querySelectorAll('button').forEach(b => b.classList.remove('is-on'));
      btn.classList.add('is-on');
      updatePreview();
      if (!isNew) {
        block.dividerStyle = ds.key;
        save(); renderCanvas();
      }
    };
    seg.appendChild(btn);
  });
  wrap.appendChild(seg);

  /* 미리보기 */
  const preview = el('div');
  preview.style.cssText = 'background:var(--c-surface-sunken);border-radius:var(--r-sm);padding:var(--sp-lg) var(--sp-md);margin-bottom:var(--sp-md);';
  const previewInner = el('div');
  preview.appendChild(previewInner);
  wrap.appendChild(preview);

  const updatePreview = () => {
    const st = draft.style;
    if (st === 'solid') {
      previewInner.style.cssText = 'height:1px;background:currentColor;opacity:0.18;';
      previewInner.textContent = '';
    } else if (st === 'double') {
      previewInner.style.cssText = 'height:4px;border-top:1px solid currentColor;border-bottom:1px solid currentColor;background:transparent;opacity:0.18;';
      previewInner.textContent = '';
    } else if (st === 'dash') {
      previewInner.style.cssText = 'height:0;border-top:1px dashed currentColor;background:transparent;opacity:0.18;';
      previewInner.textContent = '';
    } else {
      /* star, wave — 텍스트 */
      const sym = DIVIDER_STYLES.find(d => d.key === st)?.symbol || '───';
      previewInner.style.cssText = 'text-align:center;opacity:0.4;font-size:14px;letter-spacing:4px;';
      previewInner.textContent = sym;
    }
  };
  updatePreview();

  host.appendChild(wrap);

  /* 저장/확인 */
  const doConfirm = () => {
    if (isNew) {
      const newBlock = {
        id: uid(),
        type: 'divider',
        dividerStyle: draft.style
      };
      S.blocks.push(newBlock);
      S.ui.selectedBlockId = newBlock.id;
      save();
      toast('구분선을 추가했습니다');
    }
    backToDefault();
  };

  _confirm = isNew ? doConfirm : null;
}

/* 텍스트 블록 편집 — v2 구조: 헤더 + 입력란 + 대사/서술 탭 + 캐릭터 + 서식 */
function buildTextEditor(host, block) {
  const g = fmtStore();
  const th = theme();

  /* ═══ 헤더 (undo/redo + 액션 버튼들) ═══ */
  buildEditHeader(host, block, () => backToDefault());

  /* 텍스트 입력은 기존 #ta (composer)를 사용한다 — hasSel(), formatSelection() 등이 동작하려면 필수 */

  /* ═══ 대사/서술 탭 ═══ */
  const tabs = el('div', 'tabs-line');
  tabs.style.cssText = 'position:relative;margin:var(--sp-md);margin-bottom:0;';
  const tabSpeech = el('button', 'tab-line' + (block.asBubble ? ' is-on' : ''), '대사');
  const tabNarr = el('button', 'tab-line' + (!block.asBubble ? ' is-on' : ''), '서술');
  const indicator = el('div', 'tab-indicator');
  indicator.style.width = '50%';
  indicator.style.left = block.asBubble ? '0' : '50%';
  const syncTabs = (isSpeech) => {
    tabSpeech.classList.toggle('is-on', isSpeech);
    tabNarr.classList.toggle('is-on', !isSpeech);
    indicator.style.left = isSpeech ? '0' : '50%';
    charSection.hidden = !isSpeech;
    divider.hidden = !isSpeech;
  };
  tabSpeech.onclick = () => { block.asBubble = true; syncTabs(true); save(); renderCanvas(); };
  tabNarr.onclick = () => { block.asBubble = false; block.speakerId = null; syncTabs(false); save(); renderCanvas(); };
  tabs.append(tabSpeech, tabNarr, indicator);
  host.appendChild(tabs);

  /* ═══ 캐릭터 선택 (대사일 때만 표시) ═══ */
  const charSection = el('div', 'char-section');
  charSection.style.cssText = 'padding:var(--sp-md) var(--sp-md) var(--sp-sm);display:flex;flex-direction:column;gap:var(--sp-sm);';
  charSection.hidden = !block.asBubble;

  /* 1행: 위치 토글 (오른쪽 정렬) */
  const spk = S.characters.find(c => c.id === block.speakerId);
  const posRow = el('div', 'tool-grp');
  posRow.style.cssText = 'justify-content:flex-end;';
  if (!spk) posRow.style.opacity = '0.5';
  posRow.appendChild(el('span', 'lab', '위치'));
  const sideTgl = el('div', 'tgl-text' + (!spk ? ' is-disabled' : ''));
  const curPos = spk ? spk.position : 'left';
  [['left', '좌'], ['right', '우']].forEach(([val, label]) => {
    const btn = el('button', val === curPos ? 'is-on' : '', label);
    btn.disabled = !spk;
    btn.onclick = () => {
      if (!spk) return;
      spk.position = val; save(); render();
    };
    sideTgl.appendChild(btn);
  });
  posRow.appendChild(sideTgl);
  charSection.appendChild(posRow);

  /* 2행: 캐릭터 칩들 (char-chip 스타일 — 아바타 + 이름) */
  const chipRow = el('div');
  chipRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:var(--sp-sm);';
  S.characters.forEach(c => {
    const chip = el('button', 'char-chip' + (block.speakerId === c.id ? ' is-on' : ''));
    const av = el('span', 'avatar');
    if (c.avatar) { const i = el('img'); i.src = c.avatar; av.appendChild(i); }
    else { av.innerHTML = initialSvg(c.name); av.style.cssText = 'display:grid;place-items:center;background:var(--slate);color:#fff;font-size:11px;'; }
    chip.appendChild(av);
    chip.appendChild(el('span', '', c.name || '이름'));
    chip.onclick = () => { block.speakerId = block.speakerId === c.id ? null : c.id; save(); render(); };
    chipRow.appendChild(chip);
  });
  const addChip = el('button', 'char-chip');
  addChip.style.cssText = 'border-style:dashed;border-color:var(--c-primary);color:var(--c-primary-text);padding-left:var(--sp-sm);';
  addChip.innerHTML = PLUS_SVG + '<span>추가</span>';
  addChip.querySelector('svg').style.cssText = 'width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;';
  addChip.onclick = () => { S.ui.tool = 'character'; S.ui.editingCharacterId = 'new'; S.ui.charDraft = null; setStage('tools'); };
  chipRow.appendChild(addChip);
  charSection.appendChild(chipRow);

  host.appendChild(charSection);

  /* ═══ 구분선 (대사일 때만 표시) ═══ */
  const divider = el('div', 'divider');
  divider.style.marginBottom = '0';  /* tool-line에 이미 상단 패딩이 있으므로 */
  divider.hidden = !block.asBubble;
  host.appendChild(divider);

  /* ═══ 서식 컨트롤 (tool-line 구조: 글꼴|크기, 정렬|색, 서식|주석) ═══ */
  /* tool-line 자체에 padding이 있으므로 fmtSection에는 패딩 불필요 */
  const fmtSection = el('div', 'fmt-section');
  fmtSection.style.cssText = 'display:flex;flex-direction:column;';

  /* 1행: 글꼴 | 크기 */
  const line1 = el('div', 'tool-line');
  const fontGrp = el('div', 'tool-grp');
  fontGrp.appendChild(el('span', 'lab', '글꼴'));
  const fontSel = fontSelect(block.font || g.font, v => {
    block.font = v; save(); render();
  });
  fontSel.style.maxWidth = '120px';  /* 모바일에서 밀림 방지 */
  fontGrp.appendChild(fontSel);
  const sizeGrp = el('div', 'tool-grp');
  sizeGrp.appendChild(el('span', 'lab', '크기'));
  const onSel = hasSel();
  const curSizeLv = onSel ? richSizeLv() : (block.sizeLv ?? 0);
  const applySizeTE = v => {
    if (hasSel()) {
      formatSelection(() => {
        clearRich('szUp'); clearRich('szDn');
        if (v > 0) applyRich('szUp'); else if (v < 0) applyRich('szDn');
      });
      return;
    }
    /* 블록 전체 */
    clearRich('szUp'); clearRich('szDn'); block.text = reflowComposer(null);
    if (v) block.sizeLv = v; else delete block.sizeLv;
    save(); render();
  };
  SIZE_LV_UI.forEach(([lv, label, cls]) => {
    const btn = el('button', 'icb' + (!onSel && curSizeLv === lv ? ' is-on' : ''));
    btn.style.boxShadow = 'none';
    btn.innerHTML = `<span class="szA ${cls}">${cls === 's' ? 'a' : 'A'}</span>`;
    btn.title = label;
    bindFormatAction(btn, () => applySizeTE(lv));
    sizeGrp.appendChild(btn);
  });
  line1.append(fontGrp, el('div', 'tool-sep'), sizeGrp);
  fmtSection.appendChild(line1);

  /* 2행: 정렬 | 색 */
  const line2 = el('div', 'tool-line');
  const alignGrp = el('div', 'tool-grp');
  alignGrp.appendChild(el('span', 'lab', '정렬'));
  const alignKeys = Object.keys(ALIGN_ICON);
  const curAlign = block.align || g.align;
  alignKeys.forEach(k => {
    const btn = el('button', 'icb');
    btn.style.boxShadow = 'none';
    if (curAlign === k) btn.classList.add('is-on');
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="${ALIGN_ICON[k]}"/></svg>`;
    btn.title = ALIGN_NAME[k];
    btn.onclick = () => { block.align = k; save(); render(); };
    alignGrp.appendChild(btn);
  });
  const colorGrp = el('div', 'tool-grp');
  colorGrp.appendChild(el('span', 'lab', '색'));
  const colorA = colorBtn('A', S.colors.text, '글자 색', v => {
    if (v == null) {
      /* 기본값 — 테마의 글자색을 그대로 따라간다 */
      if (hasSel()) { formatSelection(() => clearRich('color')); return; }
      /* 고른 조각이 없으면 블록 전체 — 블록 값과 글 속 색을 함께 푼다 */
      block.text = stripColorMarks(block.text); syncComposer(block); delete block.color;
    } else {
      S.colors.text = v;
      if (hasSel()) { formatSelection(() => applyRich('color', v)); return; }
