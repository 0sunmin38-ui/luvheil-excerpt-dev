   떼어 낸 조각만 보면 부모가 조각 밖에 있어 서식이 걸린 줄 모른다 — 그래서 굵게를 다시
   눌러도 벗겨지는 대신 한 겹 더 씌워지고, 되읽으면 ****글**** 처럼 빈 마커가 남았다.
   부모를 앞 · 선택 · 뒤 세 조각으로 갈라, 선택한 부분만 벗기거나(retint 없음)
   새 색으로 다시 감싼다(retint). */
function splitFormatHost(host, r, spec, retint) {
  const parent = host.parentNode;
  if (!parent) return false;
  const shell = () => {
    const e = document.createElement(spec.el);
    const st = host.getAttribute('style');
    if (st) e.setAttribute('style', st);
    /* 크기 서식은 class 로 표시한다 — 갈라 낼 때 조각에도 그대로 물려줘야 한다 [RICH.szUp] */
    const cl = host.getAttribute('class');
    if (cl) e.setAttribute('class', cl);
    return e;
  };
  let tail, mid;
  try {
    const q = document.createRange();               /* 뒤부터 떼어 내야 선택 위치가 안 흔들린다 */
    q.setStart(r.endContainer, r.endOffset);
    q.setEnd(host, host.childNodes.length);
    tail = q.extractContents();
    mid = r.extractContents();
  } catch (_) { return false; }
  const nodes = [];
  let wrap = null;
  if (retint) {
    wrap = shell();
    if (spec.tint) spec.tint(wrap, retint);
    wrap.appendChild(mid);
    nodes.push(wrap);
  } else {
    unwrapFormatIn(mid, spec);
    nodes.push(mid);
  }
  const midFirst = wrap || nodes[0].firstChild, midLast = wrap || nodes[0].lastChild;
  if (tail.textContent !== '' || tail.querySelector('br,img')) {
    const w = shell(); w.appendChild(tail); nodes.push(w);
  }
  let ref = host;
  nodes.forEach(node => {
    const last = node.nodeType === 11 ? node.lastChild : node;
    parent.insertBefore(node, ref.nextSibling);
    ref = last || ref;
  });
  if (host.textContent === '' && !host.querySelector('br,img')) host.remove();
  if (wrap) selectEl(wrap); else selectInserted(midFirst, midLast);
  return true;
}

function selectInserted(first, last) {
  if (!first || !last) return;
  const sel = window.getSelection(), r = document.createRange();
  try {
    r.setStartBefore(first); r.setEndAfter(last);
    if (sel) { sel.removeAllRanges(); sel.addRange(r); }
    lastRange = r.cloneRange();
  } catch (_) { clearSel(); }
}
function composerSelectionOffsets() {
  const ta = $('#ta'), sel = window.getSelection();
  if (!ta || !sel || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if (r.collapsed || !ta.contains(r.commonAncestorContainer)) return null;
  const offset = (container, at) => {
    const q = document.createRange(); q.selectNodeContents(ta); q.setEnd(container, at);
    return q.toString().length;
  };
  try {
    return { start: offset(r.startContainer, r.startOffset), end: offset(r.endContainer, r.endOffset) };
  } catch (_) { return null; }
}
function restoreComposerSelection(saved) {
  const ta = $('#ta');
  if (!saved || !ta) return;
  /* 글자 위치가 두 글자 조각의 경계에 딱 걸리면 앞 조각의 끝과 뒤 조각의 처음 중
     어느 쪽이든 될 수 있다. 시작은 뒤 조각의 처음으로, 끝은 앞 조각의 끝으로 잡아
     선택 범위를 최소로 만든다 — 안 그러면 그 사이의 <br> 이나 빈 태그가 딸려 들어가
     다음 서식이 줄바꿈까지 함께 감싼다. */
  const nodes = textNodesIn(ta), locate = (pos, atStart) => {
    let n = 0;
    for (const node of nodes) {
      const next = n + node.nodeValue.length;
      if (atStart ? pos < next : pos <= next) return { node, offset: Math.max(0, pos - n) };
      n = next;
    }
    const last = nodes[nodes.length - 1];
    return last ? { node: last, offset: last.nodeValue.length } : null;
  };
  const a = locate(saved.start, saved.start < saved.end), b = locate(saved.end, false);
  if (!a || !b) return;
  const r = document.createRange(), sel = window.getSelection();
  try {
    r.setStart(a.node, a.offset); r.setEnd(b.node, b.offset);
    sel.removeAllRanges(); sel.addRange(r); lastRange = r.cloneRange();
  } catch (_) { }
}
function restoreRangeObject(range) {
  if (!range) return false;
  try {
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    lastRange = range.cloneRange();
    return true;
  } catch (_) { return false; }
}
/* 서식 단추는 '누르는 동안' 작성창의 포커스를 뺏지 않는다.
   터치에서 포커스가 단추로 넘어가면 인풋이 한 줄로 접히고 시트 높이가 다시 계산되면서
   단추가 손 밑에서 밀려난다. 그래서 첫 탭은 '인풋 닫기' 로만 먹히고 두 번 눌러야 서식이
   들어갔다. 선택 영역이 살아 있을 때는 pointerdown 의 기본 동작(포커스 이동)을 막고,
   click 을 기다리지 않고 손을 뗄 때 바로 실행한다.
   터치 포인터는 암묵적으로 캡처되므로, 그 사이 화면이 움직여도 pointerup 은 이 단추로 온다. */
/* pointerup 으로 먼저 동작하되, 그 길이 취소된 환경에서는 뒤따르는 click 을 안전망으로 쓴다. */
function bindStickyTap(btn, run, hold) {
  let armed = false, sx = 0, sy = 0, ranAt = 0;
  btn.addEventListener('pointerdown', e => {
    diag('button:pointerdown', { id: btn.id || '', kind: btn.textContent.trim().slice(0, 20) });
    armed = true; sx = e.clientX; sy = e.clientY;
    /* Android Chrome 에서 주소창·키보드가 움직이는 동안 pointerleave/pointercancel 이 먼저
       오는 기기가 있다. 명시적으로 붙잡아 손을 뗀 이벤트를 원래 단추로 돌려받는다. */
    try { btn.setPointerCapture(e.pointerId); } catch (_) { }
    if (!hold || hold(e)) e.preventDefault();
  });
  btn.addEventListener('pointerup', e => {
    diag('button:pointerup', { id: btn.id || '' });
    if (!armed) return;
    armed = false;
    /* 스크롤하려고 쓸어 내린 것은 누른 것이 아니다 */
    if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) return;
    if (btn.disabled) return;
    e.preventDefault();
    ranAt = Date.now();
    run();
  });
  btn.addEventListener('pointercancel', () => { diag('button:pointercancel', { id: btn.id || '' }); armed = false; });
  /* 키보드로 누른 click(detail 0) 만 받는다. 포인터로 생긴 click 은 위에서 이미 처리했다 —
     또 실행하면 방금 한 일이 곧바로 되돌아간다. 서식 단추는 누를 때마다 다시 그려지므로,
     같은 자리에 새로 생긴 단추가 그 click 을 대신 받는 경우까지 함께 막는다. */
  btn.addEventListener('click', e => {
    diag('button:click', { id: btn.id || '', detail: e.detail });
    if (btn.disabled) return;
    /* pointerup 이 실제로 실행된 경우만 중복 click 을 막는다. 예전의 전역 포인터 플래그는
       Android 가 pointerup 을 취소한 뒤 보내는 정상 click 까지 막아 단추를 완전히 죽였다. */
    if (Date.now() - ranAt < 700) return;
    run();
  });
}

/* 서식 단추 — 위의 규칙에 «누르기 직전의 선택 영역» 을 붙잡는 일이 더 붙는다.
   선택을 들고 있을 때만 기본 동작을 막는다. 서식 목록은 세로로 스크롤되는 칸이라,
   막을 이유가 없을 때는 브라우저 동작을 그대로 둔다. */
function bindFormatAction(btn, run) {
  let saved = null;
  bindStickyTap(btn, () => { restoreRangeObject(saved); run(); }, e => {
    trackSel();
    const r = liveRange(); saved = r ? r.cloneRange() : null;
    return !!saved || !e.pointerType || e.pointerType === 'mouse';
  });
}
/* 브라우저가 서식 명령을 처리하며 남기는 '크기' 관련 찌꺼기를 걷어낸다.
   iOS Safari 는 조각을 나눌 때 -webkit-text-size-adjust:auto 를 인라인으로 붙이는데,
   그 조각만 자동 확대가 되살아나 굵게·기울임 부분만 크게 보인다. */
function normalizeComposerFontSizes() {
  const ta = $('#ta');
  if (!ta) return;
  ta.querySelectorAll('[style],font[size]').forEach(node => {
    if (node.style) {
      ['font-size', '-webkit-text-size-adjust', 'text-size-adjust', 'font-family', 'zoom', 'font']
        .forEach(k => node.style.removeProperty(k));
      if (!node.getAttribute('style')) node.removeAttribute('style');
    }
    node.removeAttribute('size');
  });
  ta.querySelectorAll('big,small').forEach(node => {
    const parent = node.parentNode;
    if (!parent) return;
    while (node.firstChild) parent.insertBefore(node.firstChild, node);
    node.remove();
  });
}

/* 형광펜 위에 형광펜을 다시 씌우면 크롬은 <mark> 를 겹치는 대신, 그 <mark> 에서 배경색만
   빼내 안쪽 태그로 옮긴다 — 색을 잃은 껍데기 <mark> 와 색을 새로 얻은 안쪽이 함께 남는다.
   마커에는 겹친 형광펜을 적을 자리가 없어(== 안의 == 는 되읽히지 않는다) 그대로 두면
   ====[#FFE79A] 같은 글자가 화면에 그대로 튀어나왔다.
   우리가 그리는 <mark> 는 늘 배경색을 달고 나오므로[applyInline], 색이 없는데 안쪽이
   색을 들고 있는 <mark> 는 그 껍데기뿐이다 — 그것만 걷는다. */
function dropEmptyMarks(root) {
  const painted = e => !!hexOf(e.style.background || e.style.backgroundColor);
  [...root.querySelectorAll('mark')].forEach(m => {
    if (!m.parentNode || painted(m)) return;
    if ([...m.querySelectorAll('*')].some(painted)) unwrapEl(m);
  });
}

/* 중첩된 색상(형광펜/글자색)을 분할하여 내부 색이 우선되도록 한다.
   예: <mark yellow>맛있는 <mark red>밥을</mark> 먹었다</mark>
   →  <mark yellow>맛있는 </mark><mark red>밥을</mark><mark yellow> 먹었다</mark>
   마지막에 칠한 색이 최종 색이 되어 중첩이 사라지고 마커 파싱 오류도 방지된다. */
function splitNestedColors(root) {
  const getMarkColor = e => hexOf(e.style.background || e.style.backgroundColor) || '';
  const getTextColor = e => hexOf(e.style.color || '') || '';

  /* 중첩된 요소를 분할하는 핵심 함수 */
  function splitNested(selector, getColor, cloneOuter) {
    let changed;
    do {
      changed = false;
      const outers = [...root.querySelectorAll(selector)];
      for (const outer of outers) {
        if (!outer.parentNode) continue;
        const inner = outer.querySelector(selector);
        if (!inner) continue;
        const outerColor = getColor(outer), innerColor = getColor(inner);
        /* 같은 색이면 내부를 풀어주기만 하면 됨 */
        if (outerColor === innerColor) { unwrapEl(inner); changed = true; continue; }
        /* 다른 색이면 외부를 분할하여 내부를 독립시킴 */
        const parent = outer.parentNode;
        const frag = document.createDocumentFragment();
        /* inner 이전의 내용을 새 outer로 감쌈 */
        const beforeNodes = [];
        let node = outer.firstChild;
        while (node && node !== inner) { beforeNodes.push(node); node = node.nextSibling; }
        if (beforeNodes.length) {
          const before = cloneOuter(outer);
          beforeNodes.forEach(n => before.appendChild(n));
          frag.appendChild(before);
        }
        /* inner를 외부로 옮김 */
        frag.appendChild(inner);
        /* inner 이후의 내용을 새 outer로 감쌈 */
        const afterNodes = [...outer.childNodes].filter(n => n !== inner);
        if (afterNodes.length) {
          const after = cloneOuter(outer);
          afterNodes.forEach(n => after.appendChild(n));
          frag.appendChild(after);
        }
        parent.insertBefore(frag, outer);
        outer.remove();
        changed = true;
        break; /* DOM이 변경되었으므로 처음부터 다시 */
      }
    } while (changed);
  }

  /* 형광펜(mark) 분할 */
  splitNested('mark', getMarkColor, outer => {
    const clone = document.createElement('mark');
    clone.style.background = outer.style.background || outer.style.backgroundColor;
    clone.style.color = 'inherit';
    return clone;
  });

  /* 글자색(span with color) 분할 — font 태그도 처리 */
  const colorSelector = 'span[style*="color"],font[color]';
  splitNested(colorSelector, getTextColor, outer => {
    const clone = document.createElement('span');
    clone.style.color = outer.style.color || (outer.getAttribute && outer.getAttribute('color')) || '';
    return clone;
  });
}

/* 인접한 같은 색 요소를 하나로 합친다 (형광펜, 글자색 공통) */
function mergeAdjacentColors(root) {
  const getMarkColor = e => hexOf(e.style.background || e.style.backgroundColor) || '';
  const getTextColor = e => hexOf(e.style.color || '') || '';

  function mergeAdjacent(selector, getColor) {
    let merged;
    do {
      merged = false;
      const els = [...root.querySelectorAll(selector)];
      for (const el of els) {
        if (!el.parentNode) continue;
        const next = el.nextSibling;
        if (!next || next.nodeType !== 1) continue;
        const nextMatch = next.matches && next.matches(selector);
        if (nextMatch && getColor(el) === getColor(next)) {
          while (next.firstChild) el.appendChild(next.firstChild);
          next.remove();
          merged = true;
        }
      }
    } while (merged);
  }

  /* 먼저 중첩을 분할 */
  splitNestedColors(root);
  /* 인접 병합: 형광펜 */
  mergeAdjacent('mark', getMarkColor);
  /* 인접 병합: 글자색 */
  mergeAdjacent('span[style*="color"]', getTextColor);
}

/* 서식을 벗기거나 겹칠 때 브라우저가 남기는 빈 껍데기를 걷어낸다.
   선택 영역을 떼어 내면 <b>…</b> 의 껍데기가 제자리에 남는데, 그대로 되읽으면 글 속에
   **** · [#FF0000][/] 같은 빈 마커가 그대로 튀어나온다. 줄바꿈과 그림은 글자가 없어도
   내용이므로 남긴다. */
function pruneEmptyFormat(root) {
  [...root.querySelectorAll('*')].forEach(node => {
    if (/^(BR|IMG|HR)$/.test(node.tagName)) return;
    if (node.textContent !== '' || node.querySelector('br,img,hr')) return;
    node.remove();
  });
}

/* 서식을 건 뒤 작성창을 마커 기준으로 다시 그린다.
   브라우저마다 남기는 태그 모양(span 중첩·인라인 스타일·<font>)이 제각각이라, 눈에 보이는
   모습과 저장되는 마커가 어긋나기 시작한다. 마커로 한 번 접었다 펴면 캔버스와 같은 태그만
   남아 '입력한 대로 미리보기에 들어가는' 상태가 유지된다.
   글자 수는 서식으로 안 변하므로, 미리 재 둔 글자 위치로 선택을 그대로 되살린다. */
function reflowComposer(saved) {
  const ta = $('#ta');
  if (!ta) return '';
  normalizeComposerFontSizes();
  dropEmptyMarks(ta);
  mergeAdjacentColors(ta);
  pruneEmptyFormat(ta);
  const markup = ta.value;
  /* 마커에는 그림을 담을 자리가 없다 — 어쩌다 그림이 끼어든 작성창은 다시 그리지 않는다 */
  const html = markupToHtml(markup);
  if (html !== ta.innerHTML && !ta.querySelector('img')) ta.innerHTML = html;
  if (saved) restoreComposerSelection(saved);
  return markup;
}

/* 선택 영역에 거는 서식은 모두 이 길로 지나간다 — 선택 위치 기억 → 실행 → 마커 정규화 →
   블록에 반영 → 다시 그리기 → 선택 복구. 한 군데로 모아 두어야 서식마다 결과가 안 갈린다. */
function formatSelection(run) {
  if (_composerComposing) return;
  const b = selBlock();
  const saved = composerSelectionOffsets();
  run();
  const markup = reflowComposer(saved);
  if (b) b.text = markup;
  save(); render();
  restoreComposerSelection(saved);
}

function focusComposerEnd() {
  const ta = $('#ta');
  if (!ta || $('#sheetHead').hidden) return;
  try { ta.focus({ preventScroll: true }); } catch (_) { ta.focus(); }
  const r = document.createRange(), sel = window.getSelection();
  r.selectNodeContents(ta);
  r.collapse(false);
  if (sel) {
    try { sel.removeAllRanges(); sel.addRange(r); } catch (_) { }
  }
  clearSel();
}

/* 선택 영역에 서식을 건다. 이미 같은 서식 안이면 벗기고, 색만 다르면 색을 갈아 끼운다.
   선택이 없으면 작성창 전체를 대상으로 본다. */
function applyRich(kind, color) {
  const spec = RICH[kind]; if (!spec) return false;
  const ta = $('#ta');
  let r = liveRange();
  if (!r) { r = document.createRange(); r.selectNodeContents(ta); }
  /* iOS Safari는 선택 영역을 직접 분할하는 execCommand 경로가 가장 안정적이다.
     fragment를 먼저 떼면 부모 <b>/<span> 정보가 사라져 같은 서식을 해제할 때도
     다시 감싸게 된다. 브라우저에게 토글을 맡기고, 저장 시 마커로 한 번만 변환한다. */
  try {
    const sel = window.getSelection();
    if (sel) { sel.removeAllRanges(); sel.addRange(r); }
    const command = {
      bold: 'bold', italic: 'italic', underline: 'underline', strike: 'strikeThrough',
      sup: 'superscript', sub: 'subscript', color: 'foreColor', mark: 'hiliteColor'
    }[kind];
    if (command) {
      const beforeHTML = ta.innerHTML;
      if (kind === 'mark') {
        /* iOS Safari는 styleWithCSS가 꺼져 있으면 hiliteColor를 무시하거나
           선택 영역에 아무 DOM도 만들지 않는다. CSS 방식과 backColor를 함께 시도한다. */
        try { document.execCommand('styleWithCSS', false, true); } catch (_) { }
        let ok = false;
        try { ok = document.execCommand('hiliteColor', false, color || '#FFEEB0'); } catch (_) { }
        if (!ok) {
          try { document.execCommand('backColor', false, color || '#FFEEB0'); } catch (_) { }
        }
        /* 일부 iOS 버전은 명령 성공값만 반환하고 DOM은 바꾸지 않는다. 그 경우
           선택한 내용만 mark로 감싸는 최소 fallback을 사용한다. */
        if (ta.innerHTML === beforeHTML) {
          try {
            const frag = r.extractContents(), w = document.createElement('mark');
            w.style.background = color || '#FFEEB0'; w.style.color = 'inherit';
            while (frag.firstChild) w.appendChild(frag.firstChild);
            r.insertNode(w); selectEl(w);
          } catch (_) { }
        }
      } else {
        /* styleWithCSS 는 문서 전역 토글이라 형광펜에서 켠 값이 그대로 남는다.
           굵게·기울임까지 span+인라인 스타일로 만들어지면 되읽을 때 태그가 흔들린다.
           색만 CSS 로, 나머지는 <b>/<i> 같은 태그로 나오도록 매번 정해 준다. */
        try { document.execCommand('styleWithCSS', false, kind === 'color'); } catch (_) { }
        document.execCommand(command, false, color || null);
      }
      normalizeComposerFontSizes();
      trackSel();
      return true;
    }
  } catch (_) { }
  /* 윗주석·아랫주석은 서로 배타다 — 상대 서식 «안» 에 들어 있으면 그것부터 갈라 낸다.
     안 그러면 <sup> 안에 <sub> 가 겹쳐 글자만 자꾸 작아진다. */
  if (spec.group) {
    for (const k of spec.group) {
      if (k === kind) continue;
      const other = upIn(r.commonAncestorContainer, RICH[k].is);
      if (!other || !splitFormatHost(other, r, RICH[k], null)) continue;
      const next = liveRange();
      if (!next) return true;
      r = next;
    }
  }
  /* 이미 같은 서식 안에 통째로 들어 있으면 그 부모를 갈라서 처리한다 */
  const host = upIn(r.commonAncestorContainer, spec.is);
  if (host) {
    const sameTint = !spec.tint || !color || spec.read(host) === hexOf(color);
    return splitFormatHost(host, r, spec, sameTint ? null : color);
  }
  /* 선택 범위만 떼어 내서 처리한다. 기존 태그의 바깥 전체를 풀거나, 같은 태그를
     다시 안쪽에 겹쳐 씌우지 않도록 이 지점에서 서식 경계를 평탄화한다. */
  const source = r.cloneRange();
  let frag;
  try { frag = source.extractContents(); r.deleteContents(); } catch (_) { return false; }
  const sameColor = spec.tint && color && fragmentHasFormat(frag, spec, color);
  const fullyOn = fragmentHasFormat(frag, spec, spec.tint ? color : null);
  if (spec.group) {
    const other = spec.group.filter(k => k !== kind).map(k => RICH[k]);
    other.forEach(s => unwrapFormatIn(frag, s));
  }
  unwrapFormatIn(frag, spec);
  const remove = fullyOn && (!spec.tint || sameColor);
  let w = null;
  if (!remove) {
    w = document.createElement(spec.el);
    if (spec.init) spec.init(w);
    if (spec.tint && color) spec.tint(w, color);
    while (frag.firstChild) w.appendChild(frag.firstChild);
    frag.appendChild(w);
  }
  const first = frag.firstChild, last = frag.lastChild;
  try { r.insertNode(frag); } catch (_) { return false; }
  if (w) selectEl(w); else selectInserted(first, last);
  return true;
}

/* 선택에 걸친 같은 서식을 전부 벗긴다 — 색 팝오버의 '기본값' 이 쓴다 */
function clearRich(kind) {
  const spec = RICH[kind]; if (!spec) return false;
  const ta = $('#ta');
  let r = liveRange();
  if (!r) { r = document.createRange(); r.selectNodeContents(ta); }
  const command = {
    bold: 'bold', italic: 'italic', underline: 'underline', strike: 'strikeThrough',
    sup: 'superscript', sub: 'subscript'
  }[kind];
  if (command) {
    try {
      const sel = window.getSelection();
      if (sel) { sel.removeAllRanges(); sel.addRange(r); }
      try { document.execCommand('styleWithCSS', false, false); } catch (_) { }
      document.execCommand(command, false, null);
      normalizeComposerFontSizes();
      trackSel();
      return true;
    } catch (_) { }
  }
  const host = upIn(r.commonAncestorContainer, spec.is);
  if (host) return splitFormatHost(host, r, spec, null);
  /* 걸린 것이 아예 없으면 DOM 을 손대지 않고 그냥 돌아간다 — «벗길 것이 없다» 는 답을
     내는 데 조각을 떼었다 도로 붙일 이유가 없다.
     [왜 이 한 줄이 중요한가] 떼었다 붙이는 사이에 선택이 접히는 브라우저가 있다(iOS 사파리).
     그러면 바로 뒤에 오는 applyRich 가 «고른 데가 없다» 고 보고 작성창 «전체» 에 걸어 버린다 —
     일부만 골라 크기를 바꿨는데 블록이 통째로 커지거나 아무 일도 안 일어나던 것이 이것이다.
     크기 단추는 늘 이 짝으로 부른다: clearRich(szUp) · clearRich(szDn) · applyRich(…)
     [applySize]. 그 앞의 둘은 대개 «벗길 것이 없는» 헛걸음이라, 헛걸음이 선택을 깨뜨리면
     정작 걸어야 할 세 번째가 늘 빗나간다.
     사본으로 본다 — cloneContents 는 원본 DOM 을 안 건드린다. */
  try {
    if (!textNodesIn(r.cloneContents()).some(n => formatAncestor(n, spec))) return false;
  } catch (_) { }
  const source = r.cloneRange();
  let frag;
  try { frag = source.extractContents(); r.deleteContents(); } catch (_) { return false; }
  const had = textNodesIn(frag).some(n => formatAncestor(n, spec));
  if (!had) {
    /* 여기까지 왔는데 아무것도 안 걸려 있으면(위 사본 검사가 실패한 경우) 도로 붙이고,
       고른 자리도 되돌려 준다 — 붙이기만 하면 선택이 사라진 채로 남는다. */
    const back = frag.firstChild, backLast = frag.lastChild;
    try { r.insertNode(frag); } catch (_) { return false; }
    selectInserted(back, backLast);
    return false;
  }
  unwrapFormatIn(frag, spec);
  const first = frag.firstChild, last = frag.lastChild;
  try { r.insertNode(frag); } catch (_) { return false; }
  selectInserted(first, last);
  return true;
}

/* value / placeholder 를 textarea 처럼 쓰게 해 둔다 — 나머지 코드를 그대로 두기 위해서다. */
function initComposer() {
  const ta = $('#ta');
  Object.defineProperty(ta, 'value', {
    configurable: true,
    get() { return htmlToMarkup(ta).replace(/\n{3,}/g, '\n\n'); },
    set(v) {
      if (!v) { resetComposerValue(); return; }
      clearComposerSelection();
      ta.innerHTML = markupToHtml(v);
    }
  });
  Object.defineProperty(ta, 'placeholder', {
    configurable: true,
    get() { return ta.dataset.placeholder || ''; },
    set(v) { ta.dataset.placeholder = String(v == null ? '' : v); }
  });
  /* 붙여넣기는 글자만 받는다. 웹에서 복사한 태그가 들어오면 되읽을 때 엉뚱한 서식으로 굳는다. */
  ta.addEventListener('paste', e => {
    diag('paste:start');
    /* 사진을 복사해 붙여넣은 것이면 글이 아니라 이미지 블록으로 받는다 */
    const img = imageFileOf(e.clipboardData);
    if (img) { e.preventDefault(); readImageFile(img, d => startNew('image', d)); return; }
    e.preventDefault();
    const text = ((e.clipboardData || window.clipboardData) || { getData: () => '' }).getData('text/plain') || '';
    diag('paste:text-ready', { n: String(text).length });
    /* plain text만 삽입하면서 브라우저 초안 실행취소에도 한 단계로 기록한다.
       지원하지 않는 환경은 기존 Range 경로로 내려간다. */
    if (document.execCommand('insertText', false, String(text))) {
      diag('paste:inserted', { n: String(text).length });
      return;
    }
    const sel = window.getSelection(); if (!sel || !sel.rangeCount) { diag('paste:no-selection'); return; }
    const r = sel.getRangeAt(0); r.deleteContents();
    const frag = document.createDocumentFragment();
    String(text).split('\n').forEach((line, i) => {
      if (i) frag.appendChild(document.createElement('br'));
      frag.appendChild(document.createTextNode(line));
    });
    r.insertNode(frag); r.collapse(false);
    sel.removeAllRanges(); sel.addRange(r);
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    diag('paste:inserted', { n: String(text).length });
  });
}

/* ═══ v2 컴포저: 상호 배타 로직 ══════════════════════════════════
   모든 UI 모드는 상호 배타적으로 작동한다:
   - idle: 기본 상태 (입력창만)
   - settings: 설정 패널 열림
   - menu: 액션 메뉴 열림
   - format: 블록 편집 모드
   - editor: 이미지/음악 등 에디터

   어느 모드로 전환하든 다른 모드는 자동으로 닫힌다.
   ═══════════════════════════════════════════════════════════════ */
const ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
const ICON_SEND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10l-5 5 5 5"/><path d="M20 4v7a4 4 0 01-4 4H4"/></svg>';

/* 액션 메뉴만 닫기 (내부용) */
function closeActionMenu() {
  if (!ACTION_MENU) return;
  ACTION_MENU.hidden = true;
  if (BTN_ADD) {
    BTN_ADD.classList.remove('is-on');
    if (!BTN_ADD.classList.contains('is-send')) {
      BTN_ADD.innerHTML = ICON_PLUS;
    }
  }
}

/* 설정 패널만 닫기 (내부용) — 2패널에서는 닫지 않음 */
function closeSettingsPanel() {
  /* 2패널에서는 설정 패널을 닫지 않는다 */
  if (is2Panel()) return;
  const panel = $('#settingsPanel');
  if (!panel || !panel.classList.contains('is-open')) return;

  /* 테마/캐릭터 수정 중이면 확인 모달 표시 */
  const doClose = () => {
    toggleSettingsPanel(false);
    setSnap(null);
    /* 탭 UI 초기화 — 다음에 열 때 캐릭터 목록으로 */
    resetSettingsTabUI();
    /* 패널 닫으면 stage도 composer로 (tools → composer) */
    if (S.ui.stage === 'tools') {
      S.ui.stage = 'composer';
      S.ui.deskPane = 'dock';
    }
  };

  if (confirmDiscardThemeDraft(doClose)) return;
  if (confirmDiscardCharDraft(doClose)) return;
  doClose();
}

/* 블록 편집 해제 (내부용) */
function closeBlockEdit() {
  if (S.ui.selectedBlockId) {
    endEdit();
  }
}

/* 모든 오버레이 닫기 — 상호 배타성의 핵심 */
function closeAllOverlays(except) {
  if (except !== 'menu') closeActionMenu();
  if (except !== 'settings') closeSettingsPanel();
  if (except !== 'format') closeBlockEdit();
}

/* v2: 버튼 상태 동기화 — 입력창 내용에 따라 +/전송 아이콘 전환 */
function syncBtnAddState() {
  if (!BTN_ADD) return;
  const ta = $('#ta');
  const hasText = (ta.innerText || ta.textContent || '').replace(/\u00A0/g, ' ').trim();
  if (hasText) {
    BTN_ADD.classList.add('is-send');
    BTN_ADD.innerHTML = ICON_SEND;
    BTN_ADD.setAttribute('aria-label', '작성 확정');
    BTN_ADD.title = '작성 확정 (Ctrl/⌘+Enter)';
  } else {
    BTN_ADD.classList.remove('is-send');
    BTN_ADD.innerHTML = ICON_PLUS;
    BTN_ADD.setAttribute('aria-label', '요소 추가');
    BTN_ADD.title = '요소 추가';
  }
}

/* v2 컴포저 이벤트 초기화 */
function initComposerV2() {
  if (!BTN_SETTINGS || !BTN_ADD || !ACTION_MENU) return;

  /* btnSettings: 설정/도구 패널 토글 — 다른 모든 UI 닫음 */
  bindStickyTap(BTN_SETTINGS, () => {
    closeAllOverlays('settings');
    if (S.ui.stage === 'tools') {
      closeToolsToComposer();
    } else {
      setStage('tools');
    }
  });

  /* btnAdd: 전송 모드면 커밋, 아니면 액션 메뉴 토글 — 다른 모든 UI 닫음 */
  bindStickyTap(BTN_ADD, () => {
    if (BTN_ADD.classList.contains('is-send')) {
      commitWithCleanup();
      return;
    }
    /* 다른 UI 모두 닫기 */
    closeAllOverlays('menu');
    /* 도구 패널 열려 있으면 닫기 — 테마/캐릭터 수정 중이면 확인 */
    if (S.ui.stage === 'tools') {
      if (confirmDiscardThemeDraft(() => { closeToolsToComposer(); })) return;
      if (confirmDiscardCharDraft(() => { closeToolsToComposer(); })) return;
      closeToolsToComposer();
    }
    /* 액션 메뉴 토글 */
    const isOpen = !ACTION_MENU.hidden;
    ACTION_MENU.hidden = isOpen;
    BTN_ADD.classList.toggle('is-on', !isOpen);
    BTN_ADD.innerHTML = isOpen ? ICON_PLUS : ICON_X;
  });

  /* 바깥 클릭 시 액션 메뉴 닫기 */
  document.addEventListener('click', e => {
    if (!ACTION_MENU.hidden && !ACTION_MENU.contains(e.target) && !BTN_ADD.contains(e.target)) {
      closeActionMenu();
    }
  });

  /* 입력창 포커스 시 — 모든 오버레이 닫기 (입력 모드로 전환)
     블록 편집(format) 중에는 닫지 않는다 — 서식 패널 안에서 render() 를 부르면
     컴포저가 포커스를 다시 받아 편집기가 닫히는 것을 막는다.
     설정 패널(tools)은 닫는다 — 사용자가 입력창 클릭 시 상호 배타 UX.
     테마/캐릭터 수정 중이면 저장 확인 모달을 표시한다. */
  $('#ta').addEventListener('focus', () => {
    if (S.ui.stage === 'format') return;
    /* 테마 또는 캐릭터 수정 중이면 확인 모달 표시 */
    if (S.ui.stage === 'tools') {
      const doClose = () => {
        S.ui.panel = 'compact';
        resetSettingsTabUI();
        setStage('composer');
      };
      if (confirmDiscardThemeDraft(doClose)) return;
      if (confirmDiscardCharDraft(doClose)) return;
    }
    closeAllOverlays();
  });

  /* 액션 메뉴 항목 클릭 핸들러 */
  ACTION_MENU.querySelectorAll('.action-menu-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      closeActionMenu();
      switch (action) {
        case 'image':
          startNew('image');
          break;
        case 'html':
          startNew('html');
          break;
        case 'music':
          startNew('music');
          break;
        case 'divider':
          startNew('divider');
          break;
      }
    });
  });
}

function syncViewportVars() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  const active = document.activeElement;
  const block = selBlock();
  /* 작성창에 손이 가 있는가. 사진·서명 편집기가 뜬 동안에는 작성창 자체가 없다. */
  const writing = !isWide() && active === $('#ta') && !$('#composerInput').hidden;
  const textBlockInput = writing
    && ((block && block.type === 'text') || S.ui.insertMode === 'html');
  const rawInset = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  /* 확정 단추가 작성창 아래에 서므로, 무엇을 적든 키보드만큼의 여유가 필요하다 */
  const inset = writing && rawInset > 80 ? rawInset : 0;
  document.documentElement.style.setProperty('--app-vh', h + 'px');
  document.documentElement.style.setProperty('--keyboard-inset', inset + 'px');
  $('#sheet').classList.toggle('is-normal-writing', !!textBlockInput);
  /* 접힌 상태에서 '캔버스에 올리기' 를 펴는 열쇠 — 손을 떼면 도로 접힌다 */
  $('#sheet').classList.toggle('is-writing', writing);
  /* v2: 인풋 포커스로 자동 스냅 비활성화 — 손잡이로만 조절 */
  requestAnimationFrame(measureSheet);
}

/* 작성창을 누르면 시트를 가장 크게 펴고, 키보드가 내려가면 있던 자리로 되돌린다 [setSnap].
   글을 적는 동안에는 «적는 칸» 이 화면의 대부분이어야 한다 — 키보드가 아래 절반을 먹는데
   시트까지 한 줄로 접혀 있으면 방금 친 글이 두어 줄밖에 안 보인다.
   손잡이를 직접 끌거나 누른 경우에는 이 되돌리기가 끼어들지 않는다 — 사람이 정한 자리가
   먼저다 [initSheetGrab 이 snapAuto 를 놓는다].
   자동으로 올린 90% 는 «직전 크기» 로 치지 않는다 — 탭 한 번으로 돌아갈 자리는 사람이
   손잡이로 골랐던 그 크기여야 한다. 그래서 snapLast 를 안팎으로 그대로 지켜 준다. */
function autoSnapForWriting(writing) {
  if (isWide()) return;
  if (writing) {
    if (S.ui.snapAuto) return;
    S.ui.snapAuto = { back: S.ui.snap, last: S.ui.snapLast };
    setSnap(90);
    S.ui.snapLast = S.ui.snapAuto.last;
  } else if (S.ui.snapAuto) {
    const a = S.ui.snapAuto;
    S.ui.snapAuto = null;
    setSnap(a.back);
    S.ui.snapLast = a.last;
  }
}

/* ── 캔버스 렌더 ─────────────────────────────────────────── */
/* [원본 export.ratio] 기본은 9:16 세로. 캔버스는 위아래로 긴 것이 기본 꼴이다. */

/* ═══ 프레임 ══════════════════════════════════════════════════
   화면머리[HEADS]가 캔버스 맨 위에 눕는 띠라면, 프레임은 네 변을 통째로 두르는 껍데기다.
   본문은 그 안에 뚫린 칸에만 흐른다 — 그 칸의 두께가 곧 캔버스 안쪽 여백이다 [FRAME_PAD].
   테마가 소유한다: 같은 글을 창만 바꿔 다른 시절로 옮겨 담을 수 있어야 한다. */
const FRAMES = [['none', '없음'], ['cyworld', 'Cyworld'], ['buddy', 'Buddybuddy']];
const frameKind = t => (FRAMES.some(f => f[0] === (t && t.frame)) ? t.frame : 'none');
/* 껍데기 글자는 테마 글꼴을 안 따른다 — 그 시절 화면의 얼굴은 결국 이 도트 글꼴이다.
   [FONTS] 에 이미 있는 것이라 저장 임베드도 같은 길로 간다 [usedFonts]. */
const FRAME_FONT = 'Galmuri11';
/* 판형을 못 박는 창. 미니홈피는 펼친 책이라 세로로 길어지면 꼴이 무너진다 —
   비율을 고를 수 없게 잠근다 [panelCanvas · ratioKey]. */
const FRAME_RATIO = { cyworld: '4:3' };
/* 껍데기가 먹는 자리(px). CSS 에 적은 두께를 그대로 더한 값에 «숨 쉴 자리» 를 얹은 것이다 —
   딱 껍데기 두께만 주면 첫 줄이 프레임에 붙어 버린다.
   [셈] 버디버디 위: 바깥테 3 + 제목줄 20 + 메뉴 20 + 몸통테 1 + 몸통여백 5 + 탭줄 27
        + 판테 1 + 판여백 5 + 대화칸테 1 + 대화상대 22 = 105, 여기에 10 을 더한다.
   CSS 를 고치면 이 숫자도 같이 고쳐야 한다 — 어긋나면 글이 껍데기 위로 올라탄다. */
const FRAME_PAD = {
  cyworld: { t: 82, r: 58, b: 72, l: 252 },
  buddy: { t: 115, r: 26, b: 132, l: 26 }
};
/* 프레임이 잠근 판형. 없으면 사람이 고른 것을 그대로 쓴다. */
const lockRatio = () => FRAME_RATIO[frameKind(theme())] || null;
const ratioKey = () => lockRatio() || canvas().ratio;
const framePad = () => FRAME_PAD[frameKind(theme())] || { t: 0, r: 0, b: 0, l: 0 };
/* 캔버스 안쪽 여백 — 껍데기 두께에 사람이 정한 여백을 «더한» 값이다.
   [왜 더하나] 한때 둘 중 큰 쪽을 썼는데, 껍데기가 두꺼운 변에서는(미니홈피 왼쪽 252px)
   여백을 아무리 만져도 아무 일이 안 일어났다 — 손잡이가 헛도는 셈이다.
   더하면 여백이 «창 안쪽, 글이 앉는 자리» 에만 먹는다: 껍데기는 제자리를 지키고
   글만 그만큼 안으로 들어온다. 프레임이 없으면 framePad 가 0 이라 예전 그대로다.
   (껍데기 두께에는 이미 «숨 쉴 자리» 가 들어 있으므로 [FRAME_PAD] 여백을 0 으로 두어도
   첫 줄이 창틀에 닿지 않는다 — 더 주고 싶을 때만 주면 된다.) */
const padT = () => (canvas().mt || 0) + framePad().t;
const padR = () => (canvas().mr || 0) + framePad().r;
const padB = () => (canvas().mb || 0) + framePad().b;
const padL = () => (canvas().ml || 0) + framePad().l;

/* 껍데기 안의 작은 그림. 글꼴에 딸린 문자를 쓰면 기기마다 다른 그림이 나오므로 직접 그린다. */
const FR_ICON = {
  /* 말풍선 둘 — 버디버디의 얼굴이다 */
  talk: '<svg viewBox="0 0 26 14" aria-hidden="true">'
    + '<ellipse cx="8" cy="6.6" rx="7.4" ry="5.6" fill="#A9DA63" stroke="#4E7A18"/>'
    + '<ellipse cx="18.4" cy="8" rx="7" ry="5.2" fill="#D7EFAE" stroke="#4E7A18"/>'
    + '<g fill="#3F6614"><circle cx="5.2" cy="6.6" r=".9"/><circle cx="8" cy="6.6" r=".9"/>'
    + '<circle cx="10.8" cy="6.6" r=".9"/></g></svg>',
  bud: '<svg viewBox="0 0 14 14" aria-hidden="true">'
    + '<ellipse cx="7" cy="7.5" rx="6.4" ry="5.2" fill="#A9DA63" stroke="#2F5A0E"/>'
    + '<path d="M4 11l-1.6 3 4-2z" fill="#A9DA63" stroke="#2F5A0E" stroke-width=".8"/></svg>'
};
const frIcon = svg => { const s = el('span'); s.innerHTML = svg; return s.firstChild; };
const frRow = (cls, ...kids) => { const n = el('div', 'fr-row ' + cls); n.append(...kids); return n; };
const frTxt = (cls, s) => Object.assign(el('div', cls), { textContent: s });

/* 프레임 한 장. 여러 장으로 나뉘면 장마다 사본이 하나씩 깔린다 [renderPageMarks]. */
function frameNode(th) {
  const kind = frameKind(th);

    body.appendChild(frRow('fb-tabs', tab, el('div', 'fr-sp'), t2));

    const panel = el('div', 'fb-panel');
    const chat = el('div', 'fb-chatbox');
    chat.append(
      frRow('fb-peer', Object.assign(el('b'), { textContent: '대화상대' }),

    const icons = frRow('fb-icons');
    icons.append(Object.assign(el('i', 'fbi'), { textContent: 'T' }),

    const input = el('div', 'fb-input');
    input.appendChild(frTxt('fb-send', '보내기(S)'));
    /* 만든이 — 서명이 켜져 있으면 서명 내용, 아니면 대화명(headerTitle) */
    const maker = th.signShow

    panel.append(chat, icons, input,
      frRow('fb-status', frTxt('', '만든이 : ' + maker)));
    body.appendChild(panel);
    f.appendChild(body);
    return f;
  }

  /* 미니홈피 — 민트 위에 놓인 책 한 권 */
  const tabs = el('div', 'mh-tabs');
  ['홈', '사진첩', '다이어리'].forEach(s => {
    const tab = el('i');

    tabs.appendChild(tab);
  });
  f.appendChild(tabs);

  const book = el('div', 'mh-book');
  const hits = el('div', 'mh-hits');
  hits.appendChild(document.createTextNode('TODAY '));
  hits.appendChild(Object.assign(el('b'), { textContent: '486' }));
  hits.appendChild(document.createTextNode('  TOTAL 1052'));
  book.appendChild(frRow('mh-top', hits, el('div', 'fr-sp'),
    frTxt('mh-title', name ? name + '의 미니홈피' : '미니홈피'),
    el('div', 'fr-sp'), el('div', 'mh-set', '홈설정')));

  const left = el('div', 'mh-page mh-left');
  const today = el('div', 'mh-today');
  today.appendChild(document.createTextNode('TODAY IS  '));
  /* 적은 그대로 쓴다 — 비워 두면 «TODAY IS» 만 남는다. 빈칸에 대신 글자를 넣으면
     그것이 저장본에 그대로 찍힌다 [headerTitle 과 같은 규칙]. */
  today.appendChild(Object.assign(el('b'), { textContent: (th.frameMood || '').trim() }));
  left.appendChild(today);
  const photo = el('div', 'mh-photo');
  if (th.headerAvatar) { const i = el('img'); i.src = th.headerAvatar; i.alt = ''; photo.appendChild(i); }
  else photo.appendChild(frIcon('<svg viewBox="0 0 24 24" aria-hidden="true">' + HD_ICON.person[1] + '</svg>'));
  left.appendChild(photo);
  left.appendChild(frTxt('mh-mood', name));
  left.appendChild(el('div', 'fr-sp'));
  left.appendChild(frTxt('mh-edit', '▸EDIT  ▸HISTORY'));
  left.appendChild(frRow('mh-wave', frTxt('', '파도타기'), frTxt('', '0명')));

  const spine = el('div', 'mh-spine');
  for (let i = 0; i < 4; i++) spine.appendChild(el('i'));

  const right = el('div', 'mh-page mh-right');
  right.appendChild(el('div', 'fr-hole'));
  const foot = frRow('mh-foot');
  foot.append(frTxt('', '·내 미니룸'), frTxt('', '·미니미설정'), frTxt('', '·미니룸설정'),
    el('div', 'fr-sp'), Object.assign(el('em'), { textContent: '답글수정' }),
    Object.assign(el('b'), { textContent: '방명록' }));
  right.appendChild(foot);

  const pages = el('div', 'mh-pages');
  pages.append(left, spine, right);
  book.appendChild(pages);
  f.appendChild(book);
  return f;
}

const RATIOS = { '9:16': 9 / 16, '3:4': 3 / 4, '1:1': 1, '4:3': 4 / 3, '16:9': 16 / 9 };

function renderCanvas() {
  const renderAt = performance.now(); diag('render:start', { blocks: S.blocks.length });
  const cv = $('#canvas'), th = theme(), f = fmt();
  const preview = S.ui.imagePreview;
  const previewActive = S.ui.stage === 'format' && preview &&
    (preview.blockId ? S.ui.selectedBlockId === preview.blockId : S.ui.newKind === 'image');
  const blocks = previewActive
    ? (preview.blockId ? S.blocks.map(b => b.id === preview.blockId ? { ...b, ...preview.block } : b)
      : [...S.blocks.filter(b => b.type !== 'footer'), preview.block, ...S.blocks.filter(b => b.type === 'footer')])
    : S.blocks;
  /* 이전 렌더의 중앙 정렬과 서명 자리가 페이지 높이 계산에 섞이지 않게 먼저 푼다. */
  cv.classList.remove('ratio-center', 'foot-pinned');
  cv.style.setProperty('--cv-ratio', String(RATIOS[ratioKey()] || 1));
  cv.style.setProperty('--cv-bg', th.bg);
  cv.style.setProperty('--cv-fg', th.fg);
  /* 장 구분선 색 [.canvas > .pagemark] — 배경과 글자색을 섞어 어느 테마에서든 같은 세기로
     보이게 한다. 미리보기에만 있는 표시라 저장본에는 안 나간다. */
  cv.style.setProperty('--pm', mixHex(th.bg, th.fg, .55));
  /* 꼬리 밑변은 모서리 곡률을 넘어야 이어 붙인 자국이 안 보인다.
     네 귀를 따로 쓸 때는 가장 둥근 귀를 기준으로 잡는다. */
  const brMax = th.brDetail
    ? Math.max(th.brTL ?? 14, th.brTR ?? 14, th.brBR ?? 14, th.brBL ?? 14)
    : (th.bubbleRadius ?? 14);
  /* 좌우 + = 말풍선 안쪽 · 상하 + = 위. 내 말풍선은 거울이라 같은 부호로 같은 방향이 된다. */
  /* 꼬리는 «모양 × 붙는 자리» 프리셋이 통째로 정한다. 눈으로 맞춰 확정한 값이라
     테마가 따로 덮을 여지를 두지 않는다 — 덮을 수 있게 두면 그 값이 어디서 왔는지 알 수 없다. */
  const presetKey = resolvePreset(th);
  const tl = BUBBLE_STYLES[presetKey];
  const tPos = tailPos(th);
  const tb = tailBase(presetKey, tPos);
  const tv = k => tb[k];
  cv.style.setProperty('--tail-size', (tv('size') ?? 7) + 'px');
  cv.style.setProperty('--tail-x', (tv('x') ?? 0) + 'px');
  cv.style.setProperty('--tail-y', (tv('y') ?? 0) + 'px');
  cv.style.setProperty('--tail-sx', tv('flipX') ? '-1' : '1');
  cv.style.setProperty('--tail-sy', tv('flipY') ? '-1' : '1');
  /* 회전은 뒤집기 다음에 걸린다 — 그림을 먼저 바로 세우고 나서 돌린다는 뜻이다 */
  cv.style.setProperty('--tail-rot', (tv('rot') ?? 0) + 'deg');
  /* 꼬리는 절대 배치라 말풍선 높이에 안 잡힌다. 긴꼬리처럼 아래로 흘러내리는 모양은
     흘러내린 만큼(= -y) 아랫공간을 먹어 문단 간격이 그만큼 좁아 보였다.
     그 값을 행 아래 여백으로 돌려주면 꼬리 끝을 기준으로 간격이 맞는다. */
  /* 삐져나온 만큼을 그 방향 여백으로 돌려준다 — 붙는 변이 바뀌면 보정할 변도 바뀐다 */
  cv.style.setProperty('--tail-drop', Math.max(0, -(tv('y') || 0)) + 'px');
  /* 꼬리가 말풍선 왼쪽 끝을 넘어 나가는 길이. 그림형은 그림 폭에서 «물린 2px» 과 안쪽으로
     민 만큼(x)을 빼고, 점은 지름의 두 배 자리에서 x 를 뺀다 — CSS 의 left 식과 같은 셈이다. */
  const tSize = tv('size') ?? 7, tX = tv('x') ?? 0;
  const tailOut = tl.img ? (tSize * tl.w - 2 - tX) : (tSize * 2 - tX);
  const tailOn = (th.bubbleStyle || 'bubble') === 'bubble' && tl.hasTail;
  cv.style.setProperty('--tail-out',
    tailOn ? Math.max(0, Math.round(tailOut * 10) / 10) + 'px' : '0px');
  /* 꼬리를 아래에 다는 긴꼬리·점은 사진을 더 내려야 꼬리와 눈이 맞는다. 내리는 양은
     «사진 높이의 절반» — 그러면 사진 한가운데가 말풍선 밑변에 정확히 온다.
     곡선은 아래로 흘러내리지 않으므로 그대로 둔다. */
  const dropAv = tailOn && tPos !== 'top' && presetKey === 'kakaotalk';
  cv.style.setProperty('--av-drop', dropAv ? 'calc(var(--av-size, 28px) / 2)' : '0px');
  if (tl.img) {
    cv.style.setProperty('--tail-img', tl.img);
    cv.style.setProperty('--tail-w', String(tl.w));
    cv.style.setProperty('--tail-ar', String(tl.ar));
  }
  /* 안쪽 여백은 사람이 정한 값과 프레임 두께 중 큰 쪽이다 [padT] — 프레임이 없으면 예전 그대로다.
     여기서 한 번 못 박아 두면 이 값을 읽는 CSS 가 전부(.cv-head 의 음수 여백 · foot-pinned)
     프레임을 함께 셈한다. */
  cv.style.setProperty('--cv-pt', padT() + 'px');
  cv.style.setProperty('--cv-pb', padB() + 'px');
  cv.style.setProperty('--cv-pl', padL() + 'px');
  cv.style.setProperty('--title-body-inset', (3 * f.size / 14) + 'px');
  cv.style.setProperty('--cv-pr', padR() + 'px');
  cv.style.setProperty('--cv-gap', (f.blockGap ?? 10) + 'px');
  cv.style.setProperty('--cv-fs', f.size + 'px');
  cv.style.setProperty('--cv-lh', String(f.lineHeight));
  cv.style.setProperty('--cv-ls', f.letterSpacing + 'em');
  /* 동그랗게가 꺼지면 각진 사각이 아니라 모서리만 살짝 둥근 네모다 */
  cv.style.setProperty('--av-r', th.roundAvatar ? '50%' : '8px');
  /* 네 귀 값은 '왼쪽 말풍선' 기준이다. 내 말풍선은 거울처럼 좌우를 뒤집어 준다
     (좌상↔우상 · 좌하↔우하) — 안 뒤집으면 꼬리가 붙는 쪽 곡률이 반대로 간다. */
  /* [상한] 한 귀의 반경은 «한 줄짜리 말풍선 높이의 절반» 을 넘지 않게 묶는다.
     CSS 는 한 변에 붙은 두 반경의 합이 그 변보다 길면 전부 비례로 줄인다. 그래서 상한이
     없으면 키 작은 한 줄짜리에서만 깎이고 두 줄부터는 선언한 대로 그려져, 같은 테마인데
     «줄이 늘면 모서리가 커지는» 것처럼 보였다(24px 로 두면 16.55 대 24).
     한 줄 높이 = 위아래 여백(.92em×2) + 한글 잉크(약 .83em) ≒ 2.55em → 그 절반이 CAP.
     em 이라 글자 크기를 키우면 상한도 함께 올라간다 — 큰 글자에서는 24px 도 그대로 나온다. */
  const CAP = '1.27em';
  const cap = v => `min(${v}px, ${CAP})`;
  if (th.brDetail) {
    /* 네 귀 값은 '왼쪽 말풍선' 기준이다. 내 말풍선은 거울처럼 좌우를 뒤집어 준다 */
    const tl = th.brTL ?? 14, tr = th.brTR ?? 14, br = th.brBR ?? 14, bl = th.brBL ?? 14;
    cv.style.setProperty('--bub-r', `${cap(tl)} ${cap(tr)} ${cap(br)} ${cap(bl)}`);
    cv.style.setProperty('--bub-r-me', `${cap(tr)} ${cap(tl)} ${cap(bl)} ${cap(br)}`);
  } else {
    const r = cap(th.bubbleRadius ?? 14);
    cv.style.setProperty('--bub-r', r);
    cv.style.setProperty('--bub-r-me', r);
  }
  cv.style.fontFamily = fontStack(f.font);
  /* 인라인 <b> 의 굵기 [.blk-text b]. 작성창은 캔버스 밖이라 문서 뿌리에 내려 둔다 —
     캔버스와 작성창이 같은 «굵게» 를 보게 하는 것이 이 한 줄이다. */
  document.documentElement.style.setProperty('--bold-w', String(boldW()));

  /* 단 나누기 — 두 갈래다. «내용 맞춤» 은 나눌 장이 없으니 CSS 단에 통째로 맡기고,
     «비율 지정» 은 장을 나누는 셈과 얽히므로 손으로 앉힌다 [renderPageMarks · placeFlow].
     고르는 값은 둘 다 같다 — 단 수와 단 사이. */
  const cols = colCount();
  const colGap = f.columnGap ?? 24;
  cv.style.setProperty('--cv-cols', String(cols));
  cv.style.setProperty('--cv-colgap', colGap + 'px');
  /* 한 단의 폭 — 안쪽 폭에서 단 사이를 빼고 나눈 값. 재는 것도 앉히는 것도 이 값을 쓴다. */
  const innerW = canvasW() - padL() - padR();
  cv.style.setProperty('--cv-colw',
    Math.max(1, Math.floor((innerW - (cols - 1) * colGap) / cols)) + 'px');
  cv.classList.toggle('has-cols', cols > 1 && isFit());
  cv.classList.toggle('has-colpage', cols > 1 && !isFit());

  cv.innerHTML = '';
  cv.classList.toggle('bulk', !!S.ui.bulk);

  if (th.bgImage) {
    const layer = el('div', 'cv-bg');
    const i = el('i'), u = el('u');
    i.style.setProperty('--bgi', `url("${th.bgImage}")`);
    const rot = th.bgRotation ?? 0;
    const hasRotation = rot !== 0;
    /* 회전 시 빈 모서리 방지를 위해 요소 확장 → 크기 보정 필요 */
    if (hasRotation) {
      i.style.inset = '-25%';
      const bgSizeVal = th.bgSize ?? 100;
      i.style.setProperty('--bgs', bgSizeVal === 100 ? '66.67%' : (bgSizeVal * 0.6667) + '%');
    } else {
      i.style.inset = '0';
      i.style.setProperty('--bgs', (th.bgSize ?? 100) === 100 ? 'cover' : (th.bgSize ?? 100) + '%');
    }
    i.style.setProperty('--bgp', `${th.bgX ?? 50}% ${th.bgY ?? 50}%`);
    i.style.setProperty('--bgr', rot + 'deg');
    i.style.setProperty('--bgb', (th.bgBlur ?? 0) + 'px');
    u.style.setProperty('--bgo-c', th.bgOverlayColor || '#000000');
    u.style.setProperty('--bgo', String((th.bgOverlay ?? 0) / 100));
    layer.append(i, u); cv.appendChild(layer);
  }
  /* 종이결은 배경 이미지 «위» 다 — 결은 종이의 성질이라, 무엇을 깔든 그 위에 앉는다.

       한 장이면 딱 그 비율, 두 장이면 그 비율 두 개를 쌓은 꼴이다.

    cv.style.setProperty('--canvas-w', canvasW() + 'px');

    cv.classList.toggle('ratio-center', pages <= 1 && !isTopAlign() && !colOn());

    th.bgX, th.bgY, th.bgBlur, th.bgOverlay, th.bgOverlayColor];

    }));

       좌측은 왼쪽, 우측[sided]은 거울상이라 오른쪽이다. */
    if (bs === 'quote') bub.style.textAlign = sided ? 'right' : 'left';
    /* 없음·각본은 배경도 선도 없어서 이름·얼굴·글이 한 덩어리로 읽힌다.
       그 덩어리를 통째로 정렬한다 — 글만 칸 안에서 움직이면 얼굴만 왼쪽에 남는다. */
    if (bs === 'plain' || bs === 'script') {

         («우측» 은 줄 자체가 거울이라 [.is-me 의 row-reverse] flex-start 가 오른쪽 끝이다.)
         좌측은 여태처럼 글 정렬이 덩어리를 통째로 옮긴다. */

    return wrap;

  const inner = applyInline(b.text || '');

/* 제목은 적은 그대로 쓴다. 비워 두면 자리는 지키되 아무것도 안 적는다 —
   빈칸에 '이름' 같은 대신 글자를 넣으면 그것이 저장본에 그대로 찍힌다. */
/* 새 장식의 텍스트 설정은 두 테마 편집 화면이 같은 필드를 사용한다. */
const TITLE_HEADER_FIELDS = {
  bubble: [['headerTitle', '이름', '예) 사해이'], ['bubbleHeaderSubtitle', '기념일', '예) 1226']],
  'lock-clock': [['lockDate', '날짜', '예) 12월 26일 금요일'], ['lockTime', '시간', '예) 3:08']],
  'paper': [['paperJournal', '소제목', '예) 이혜미'],
    ['paperTitle', '제목', '예) 뜻밖의 바닐라']]
};
/* 이전 title(1) 저장본도 입력값을 보존해 통합 제목으로 표시한다. */
const titleHeaderValue = (t, key) => t[key] ?? t[({paperJournal: 'onlineCategory', paperTitle: 'onlineHeadline'})[key]] ?? '';
const titleTagColor = t => t.paperTagColor ?? t.onlineCategoryColor ?? '#1a73e8';
function titleHeaderControls(t, kind, up) {
  const wrap = el('div', 'stack');
  TITLE_HEADER_FIELDS[kind].forEach(([key, label, initial]) => {
    const field = el('div', 'field');
    field.appendChild(el('label', 'lab', label));
    const input = el('input', 'inp');
    const isBubbleNumber = kind === 'bubble' && key === 'bubbleHeaderSubtitle';
    const value = titleHeaderValue(t, key);
    input.value = isBubbleNumber ? String(value).replace(/[^0-9]/g, '') : value;
    input.placeholder = initial;
    if (isBubbleNumber) { input.inputMode = 'numeric'; input.pattern = '[0-9]*'; }
    input.oninput = () => {
      if (isBubbleNumber) input.value = input.value.replace(/[^0-9]/g, '');
      t[key] = input.value; up();
    };
    field.appendChild(input); wrap.appendChild(field);
  });
  if (kind === 'paper') {
    const field = el('div', 'field');
    field.appendChild(el('label', 'lab', '정렬'));
    const items = [['left', '좌측 정렬'], ['center', '중앙 정렬'], ['right', '우측 정렬']];
    const align = segment(items, t.paperAlign || 'left', value => {
      t.paperAlign = value;
      [...align.children].forEach((button, i) => {
        const active = items[i][0] === value;
        button.classList.toggle('is-on', active);
        button.setAttribute('aria-pressed', String(active));
      });
      up();
    });
    align.setAttribute('role', 'group'); align.setAttribute('aria-label', 'article 정렬');
    [...align.children].forEach((button, i) => button.setAttribute('aria-pressed', String(items[i][0] === (t.paperAlign || 'left'))));
    field.appendChild(align); wrap.appendChild(field);
    wrap.appendChild(colorField('소제목 색', titleTagColor(t), v => { t.paperTagColor = v; up(); }));
  }
  if (kind === 'lock-clock') {
    const styleField = el('div', 'field');
    styleField.appendChild(el('label', 'lab', '시계 스타일'));
    const items = [['normal', '기본'], ['glass', '글래스']];
    const styleSeg = segment(items, t.lockGlass ? 'glass' : 'normal', value => {
      t.lockGlass = value === 'glass';
      [...styleSeg.children].forEach((button, i) => {
        const active = items[i][0] === value;
        button.classList.toggle('is-on', active); button.setAttribute('aria-pressed', String(active));
      });
      up();
    });
    styleSeg.setAttribute('role', 'group'); styleSeg.setAttribute('aria-label', '시계 스타일');
    [...styleSeg.children].forEach((button, i) => button.setAttribute('aria-pressed', String(i === (t.lockGlass ? 1 : 0))));
    styleField.appendChild(styleSeg); wrap.appendChild(styleField);
    const makeColor = () => {
      const automatic = el('button', 'btn btn-quiet', '자동');
      automatic.type = 'button'; automatic.disabled = !t.lockFg;
      automatic.title = '글래스는 배경색을 사용하고, 기본 시계는 테마 글자색을 사용합니다';
      const color = colorField('글자색', t.lockFg || '', value => {
        t.lockFg = value; automatic.disabled = !value; up();
      });
      const colorLabel = color.querySelector('.lab'), colorRow = el('div', 'colorf-row');
      colorLabel.replaceWith(colorRow); colorRow.append(colorLabel, automatic);
      automatic.onclick = () => { t.lockFg = ''; color.replaceWith(makeColor()); up(); };
      return color;
    };
    wrap.appendChild(makeColor());
  }
  return wrap;
}

function headerNode(th) {
  /* 프레임을 두르면 화면머리는 안 선다 — 머리는 캔버스 가장자리까지 나가는 띠라
     [.cv-head 의 음수 여백] 껍데기 위로 올라타 창을 가로지른다. 둘 중 하나만 쓴다. */
  if (frameKind(th) !== 'none') return null;
  const kind = headKind(th);
  if (kind === 'none') return null;
  const title = (th.headerTitle || '').trim();
  const head = el('div', 'cv-head hd-' + kind);
  if (kind === 'paper') {
    head.dataset.align = th.paperAlign || 'left';
    head.style.textAlign = head.dataset.align;
  }
  /* 잠금화면 시간은 별도 글자 색상 지원 — lockFg가 있으면 그것을 사용 */
  if (kind === 'lock-clock' && th.lockFg) {
    head.style.color = th.lockFg;
  } else {
    head.style.color = th.fg;
  }
  if (kind === 'bubble') {
    head.style.color = th.fg;
    const row = el('div', 'bubble-head-row');
    const back = el('span', 'bubble-head-icon');
    back.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3L6 12l9 9"/></svg>';
    const close = el('span', 'bubble-head-icon');
    close.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20"/></svg>';
    row.append(back, el('div', 'bubble-head-title', th.headerTitle ?? ''), close);
    const sub = el('div', 'bubble-head-sub');
    const logo = el('img'); logo.src = BUBBLE_LOGO; logo.alt = 'bubble';
    const logoMark = el('span', 'bubble-logo-mark');
    logoMark.style.backgroundColor = th.artistTagColor || (th.artistTag !== false ? '#F080A6' : th.fg);
    logoMark.style.setProperty('--bubble-logo', 'url("' + BUBBLE_LOGO + '")');
    logoMark.appendChild(logo);
    const number = String(th.bubbleHeaderSubtitle ?? '').replace(/[^0-9]/g, '');
    sub.append(logoMark, el('span', 'bubble-head-number', '+ ' + number));
    head.append(row, sub);
    return head;
  }
  if (TITLE_HEADER_FIELDS[kind]) {
    head.style.setProperty('--title-u', (fmt().size / 14) + 'px');
    const classes = kind === 'lock-clock' ? ['lock-date', 'lock-time'] : ['paper-journal', 'paper-title'];
    TITLE_HEADER_FIELDS[kind].forEach(([key], i) => {
      const node = Object.assign(el('div', classes[i]), { textContent: titleHeaderValue(th, key) });
      if (kind === 'lock-clock' && i === 1 && th.lockGlass) {
        node.classList.add('is-glass');
        if (th.lockFg) {
          node.style.setProperty('--lock-glass-color', th.lockFg);
        }
        const face = el('span', 'lock-time-face', node.textContent);
        node.replaceChildren(face);
      }
      if (kind === 'paper' && i === 0) node.style.color = titleTagColor(th);
      head.appendChild(node);
    });
    /* 통합 제목: 서명을 저자 위치에 표시 */
    if (kind === 'paper' && th.signShow && (th.signChar || th.signMaker)) {
      const authors = el('div', 'paper-authors');
      authors.textContent = [th.signChar, th.signMaker].filter(Boolean).join(th.signSep === '|' ? ' | ' : ' · ');
      head.appendChild(authors);
    }
    return head;
  }

  if (kind === 'news') {
    ensureNewsFont();
    /* 제호는 본문이 흐르는 폭을 거의 다 쓴다 — 신문 이름은 1면을 가로지르는 것이 그 꼴이다.
       px 로 못 박아 두면 좁은 판형(폭 300)에서 통째로 삐져나가므로 폭에서 되짚어 잰다
       [NEWS_MAST_K]. 위아래 한도는 그래도 둔다: 아주 좁으면 읽을 수 없게 잘아지고,
       아주 넓으면 제호가 한 장을 다 먹는다. */
    /* 좌우 여백은 캔버스의 것을 안 따르고 제 몫으로 좁게 잡는다 [NEWS_INSET].
       그래도 «판의 몇 할» 만큼은 남긴다 — 여백을 0 으로 둔 캔버스에서 그대로 따라가면
       제호와 선이 종이 끝에 닿아 잘린 신문처럼 보인다.
       제호 크기도 그 좁힌 폭에서 뽑는다 — 선과 제호가 같은 폭을 봐야 나란히 앉는다. */
    const cvW = canvasW() || CANVAS_W;
    const least = Math.round(cvW * NEWS_INSET_MIN);
    const inL = Math.max(least, Math.round(padL() * NEWS_INSET));
    const inR = Math.max(least, Math.round(padR() * NEWS_INSET));
    head.style.paddingLeft = inL + 'px';
    head.style.paddingRight = inR + 'px';
    const w = Math.max(120, cvW - inL - inR);
    /* 제호는 입력한 텍스트만 표시한다. */
    const markText = (th.headerMark ?? '').trim();
    const mark = Object.assign(el('div', 'hd-mast'), { textContent: markText });
    mark.style.fontFamily = '"' + NEWS_FONT.mark + '", "' + NEWS_FONT.markKo + '", serif';
    /* 제호 크기는 56px 로 고정한다 — 가변으로 두면 글자 수에 따라 너무 커지거나 작아진다.
       긴 제호는 폭을 넘기므로 scaleX 로 눌러서 맞춘다 [아래 transform]. */
    const markEmW = markWidthEm(markText);
    const mastPx = 56;
    mark.style.fontSize = mastPx + 'px';
    /* 좌우로만 눌린다 — 세로는 그대로라 [markInk] 가 잰 위아래 몫도 그대로 맞는다.
       («가운데를 잡고» 눌러야 한다. 기본은 가운데이지만 못 박아 둔다 — 이 값이 바뀌면
        눌린 제호가 한쪽으로 밀린다.) */
    mark.style.letterSpacing = MAST_TRACK + 'em';
    /* [가운데를 잡는 법] 눌리기 «전» 의 글자는 판보다 넓다(눌러서 판에 맞추는 것이므로).
       그냥 두면 그 넘치는 줄을 브라우저가 가운데가 아니라 왼쪽 끝에 붙여 놓아, 눌린 제호가
       오른쪽으로 밀려 선 밖으로 삐져나간다 — 가운데맞춤은 «남는 자리» 를 나누는 규칙이라
       자리가 모자라면 아무것도 안 나눈다.
       그래서 상자를 글자 폭에 맞춰 두고, 그 상자를 반쪽씩 되밀어 가운데에 세운다:
       left:50% 로 판의 한복판에 붙이고 translateX(-50%) 로 제 폭의 절반을 되민다.
       scaleX 는 제 가운데를 축으로 도므로 [transform-origin 기본값] 눌러도 가운데가 안 움직인다.
       (transform 은 자리를 안 차지하므로 아래 선들은 원래 자리에 그대로 있다.) */
    mark.style.width = Math.ceil(mastPx * markEmW) + 'px';
    mark.style.position = 'relative';
    mark.style.left = '50%';
    mark.style.transform = 'translateX(-50%) scaleX(' + NEWS_MAST_SQUEEZE + ')';
    mark.style.fontWeight = String(NEWS_MARK_W);
    /* 선과 잉크 사이에 남길 틈만큼만 두고 나머지는 음수로 당긴다 [NEWS_MAST_GAP] */
    const ink = markInk(markText);
    mark.style.marginTop = (NEWS_MAST_GAP - ink.top).toFixed(3) + 'em';
    mark.style.marginBottom = (NEWS_MAST_GAP - ink.bottom).toFixed(3) + 'em';
    /* 굵은 선도 제호를 따라간다 — px 로 못 박아 두면 제호가 커질수록 실처럼 가늘어 보인다.
       제호 높이의 14분의 1이 눈에 «굵은 선» 으로 읽히는 두께다. */
    head.style.setProperty('--hd-thick', clamp(Math.round(mastPx / 14), 3, 10) + 'px');
    /* 굵은 선 · 가는 선 — 제호를 위아래에서 같은 짜임으로 감싼다 */
    head.append(el('i', 'hd-rule hd-thick'), el('i', 'hd-rule hd-thin'),
      mark,
      el('i', 'hd-rule hd-thin'), el('i', 'hd-rule hd-thick'));
    /* 적은 말(날짜·판)은 제호 아래 한 줄이다. 라틴·숫자는 세리프로, 한글은 명조로 받는다.
       비어 있으면 줄도 그 아래 선도 안 세운다 — 빈 줄만 남으면 제호 밑이 이유 없이
       벌어져, 아무것도 안 적었는데 무언가 빠진 것처럼 보인다. */
    if (title) {
      const lead = Object.assign(el('div', 'hd-lead'), { textContent: title });
      lead.style.fontFamily = '"' + NEWS_FONT.lead + '", "' + NEWS_FONT.leadKo + '", serif';
      head.append(lead, el('i', 'hd-rule hd-thin'));
    }
    return head;
  }

  if (kind === 'imessage') {
    /* 띠는 «반투명한 색 한 겹» 이다. 예전에는 배경색과 글자색을 미리 섞은 단색을 박았는데,
       그러면 배경 이미지를 깐 캔버스에서 말머리 자리만 이미지가 통째로 가려졌다.
       [핵심] 알파를 씌우되 «단색이던 시절의 진하기» 는 그대로 지킨다 — 섞는 비율을 알파로
       나눠 두면(r / A) 불투명한 배경 위에 얹혔을 때의 합성 결과가 예전 값과 같아진다.
         rgba(mix(bg,fg,r/A), A) 를 bg 위에 얹으면 = mix(bg, fg, r)
       그래서 단색 배경에서는 예전과 똑같이 보이고, 이미지를 깔았을 때만 비친다.
       (겹쳐 «까는 층» 은 여전히 안 쓴다 — 층을 하나 더 얹으면 저장 렌더에서 합쳐지는
        방식이 화면과 어긋날 여지가 남는다. 상자 자신의 background 한 겹뿐이다.) */
    const A = HD_BAND_A;
    head.style.setProperty('--hd-band', rgbaOf(mixHex(th.bg, th.fg, .055 / A), A * 100));
    head.style.setProperty('--hd-line', rgbaOf(mixHex(th.bg, th.fg, .12 / A), A * 100));
    /* 빈 프로필 동그라미는 «그 자리에 놓인 것» 이라 비치지 않는다 — 띠와 달리 불투명하다 */
    head.style.setProperty('--hd-avbg', mixHex(th.bg, th.fg, .55));
    /* 그림자는 글자색 계열로 — 배경색과 어울리는 그늘이 된다 */
    head.style.setProperty('--hd-shadow', rgbaOf(th.fg, 9));
  }

  /* 고른 머리 배경색 — 위의 «자동» 을 덮어쓴다. 색만 바뀌고 비치는 정도(HD_BAND_A)는
     그대로다: 띠를 불투명하게 칠하면 배경 이미지를 깐 캔버스에서 머리 자리만 통째로
     가려져, 애초에 이 띠를 반투명으로 만든 이유가 사라진다.
     띠가 없던 메시지2 도 이때만 띠가 선다 [.hd-kakao.hd-banded].
     밑줄과 빈 프로필 동그라미는 «띠가 내려앉은 뒤의 색» 에서 섞는다 — 고른 색 자체에서
     섞으면 배경과 겹쳐 실제로 보이는 색과 어긋나 대비가 안 맞는다. */
  const band = (kind === 'imessage' || kind === 'kakao') ? (th.headerBg || '').trim() : '';
  if (band) {
    const A = HD_BAND_A;
    const seen = mixHex(th.bg, band, A);
    head.classList.add('hd-banded');
    head.style.setProperty('--hd-band', rgbaOf(band, A * 100));
    head.style.setProperty('--hd-line', mixHex(seen, th.fg, .12));
    head.style.setProperty('--hd-avbg', mixHex(seen, th.fg, .55));
    head.style.setProperty('--hd-shadow', rgbaOf(th.fg, 9));
  }
  /* 띠가 없으면 배경 투명 + 그림자 없음 (CSS 기본값 사용) */

  const row = el('div', 'hd-row');
  const left = el('div', 'hd-side');
  left.appendChild(hdIcon('back'));
  const mid = el('div', 'hd-mid');
  const right = el('div', 'hd-side right');

  if (kind === 'imessage') {
    const av = el('div', 'hd-av' + (th.headerAvatar ? '' : ' is-empty'));
    if (th.headerAvatar) { const i = el('img'); i.src = th.headerAvatar; i.alt = ''; av.appendChild(i); }
    else av.appendChild(hdIcon('person'));
    mid.appendChild(av);
    const hdName = Object.assign(el('div', 'hd-name'), { textContent: title });
    hdName.style.fontWeight = textW();        /* 캐릭터 이름과 같은 굵기 [.who] */
    mid.appendChild(hdName);
    right.appendChild(hdIcon('video'));
  } else if (kind === 'insta-dm') {
    /* 인스타 DM: 뒤로가기 + 스토리링(아바타) + 이름/상태 + 전화/영상
       배경은 항상 투명 — 캔버스 배경이 그대로 비친다 */
    instaDecorationStyle(head, th);
    head.style.setProperty('--hd-avbg', mixHex(th.bg, th.fg, .23));
    head.style.setProperty('--insta-border', mixHex(th.bg, th.fg, .12));
    head.style.setProperty('--insta-btn-bg', th.bg);
    head.style.setProperty('--insta-ring-border', th.bg);
    const hRow = el('div', 'hd-row');
    /* 뒤로가기 버튼 */
    const backBtn = el('div', 'hd-btn-circle back');
    backBtn.appendChild(instaIcon('back'));
    hRow.appendChild(backBtn);
    /* 스토리 링 + 아바타 */
    const storyRing = el('div', 'hd-story-ring');
    const avInner = el('div', 'hd-av-inner');
    if (th.headerAvatar) { const i = el('img'); i.src = th.headerAvatar; i.alt = ''; avInner.appendChild(i); }
    else avInner.appendChild(hdIcon('person'));
    storyRing.appendChild(avInner);
    hRow.appendChild(storyRing);
    /* 유저 정보 */
    const userInfo = el('div', 'hd-user-info');
    const nameRow = el('div', 'hd-name-row');
    const hdName = Object.assign(el('span', 'hd-name'), { textContent: title });
    nameRow.appendChild(hdName);
    const chevron = el('span', 'hd-chevron');
    chevron.appendChild(instaIcon('chevron'));
    nameRow.appendChild(chevron);
    userInfo.appendChild(nameRow);
    const statusRow = el('div', 'hd-status-row');
    statusRow.appendChild(Object.assign(el('span', 'hd-status-text'), { textContent: '활동 중' }));
    statusRow.appendChild(el('span', 'hd-status-dot'));
    userInfo.appendChild(statusRow);
    hRow.appendChild(userInfo);
    /* 액션 버튼들 */
    const actions = el('div', 'hd-actions');
    const phoneBtn = el('div', 'hd-btn-circle');
    phoneBtn.appendChild(instaIcon('phone'));
    actions.appendChild(phoneBtn);
    const videoBtn = el('div', 'hd-btn-circle');
    videoBtn.appendChild(instaIcon('video'));
    actions.appendChild(videoBtn);
    hRow.appendChild(actions);
    head.appendChild(hRow);
    return head;
  } else if (kind === 'ebook-modern') {
    /* 이북 모던: 헤더 + 진행률 바 푸터 */
    const hx = hexOf(th.bg) || 'FFFFFF';
    const [rr, gg, bb] = [0, 2, 4].map(i => parseInt(hx.slice(i, i + 2), 16));
    const isLight = (rr * 299 + gg * 587 + bb * 114) / 1000 > 128;
    if (isLight) head.classList.add('light');
    const hRow = el('div', 'hd-row');
    hRow.appendChild(hdIcon('back'));
    const hTitle = Object.assign(el('span', 'hd-title'), { textContent: title });
    hRow.appendChild(hTitle);
    hRow.appendChild(hdIcon('menu'));
    head.appendChild(hRow);
    return head;
  } else {
    mid.classList.add('hd-title');
    mid.textContent = title;
    right.append(hdIcon('search'), hdIcon('menu'));
  }
  row.append(left, mid, right);
  head.appendChild(row);
  if (kind === 'imessage') head.appendChild(el('i', 'hd-rule'));
  return head;
}

/* 이북 푸터 — 하단 네비게이션 바.
   구조: 구분선 + «< 이전권» + 서명(캐릭터·제작자) + «다음권 >»
   장식 용도라 기능 없이 모양만 갖춘다. */
function ebookFooterNode(th) {
  const foot = el('div', 'cv-foot-ebook');
  foot.style.color = th.fg;
  /* 선 색상 → 배경색 (선 색상의 옅은 버전) */
  if (th.ebookColor) {
    foot.style.setProperty('--hd-ebook-line', th.ebookColor);
    foot.style.setProperty('--hd-ebook-bg', rgbaOf(th.ebookColor, 12));
  }
  /* 상단 구분선 */
  foot.appendChild(el('i', 'hd-rule'));
  /* 3열 그리드: 이전권 / 서명 / 다음권 */
  const row = el('div', 'hd-row');
  const left = el('div', 'hd-nav');
  left.appendChild(hdIcon('back'));
  left.appendChild(Object.assign(el('span'), { textContent: '이전권' }));
  const signText = [th.signChar, th.signMaker].filter(Boolean).join(th.signSep === '|' ? ' | ' : ' · ');
  const mid = Object.assign(el('div', 'hd-sign'), { textContent: signText });
  const right = el('div', 'hd-nav right');
  right.appendChild(Object.assign(el('span'), { textContent: '다음권' }));
  const fwdIcon = hdIcon('back');
  fwdIcon.style.transform = 'scaleX(-1)';
  right.appendChild(fwdIcon);
  row.append(left, mid, right);
  foot.appendChild(row);
  return foot;
}

/* 이북 모던 푸터 — 하단 네비게이션.
   구조: «< 이전» + 서명 + «다음 >» */
function ebookModernFooterNode(th) {
  const hx = hexOf(th.bg) || 'FFFFFF';
  const [rr, gg, bb] = [0, 2, 4].map(i => parseInt(hx.slice(i, i + 2), 16));
  const isLight = (rr * 299 + gg * 587 + bb * 114) / 1000 > 128;
  const foot = el('div', 'cv-foot-ebook-modern' + (isLight ? ' light' : ''));
  foot.style.color = th.fg;
  /* 하단 네비게이션 */
  const row = el('div', 'hd-row');
  const left = el('div', 'hd-nav');
  left.appendChild(hdIcon('back'));
  left.appendChild(Object.assign(el('span'), { textContent: '이전' }));
  const signText = [th.signChar, th.signMaker].filter(Boolean).join(th.signSep === '|' ? ' | ' : ' · ');
  const mid = Object.assign(el('div', 'hd-sign'), { textContent: signText });
  const right = el('div', 'hd-nav');
  right.appendChild(Object.assign(el('span'), { textContent: '다음' }));
  const fwdIcon = hdIcon('back');
  fwdIcon.style.transform = 'scaleX(-1)';
  right.appendChild(fwdIcon);
  row.append(left, mid, right);
  foot.appendChild(row);
  return foot;
}

/* ═══ 음악 (플레이리스트 바) ══════════════════════════════════
   노래 제목 · 가수 · 하트 · 진행바 · 재생 단추. 적는 칸은 제목과 가수 둘뿐이고
   나머지는 «어떻게 보일지» 다 — 색 둘 · 들은 만큼 · 크기.
   화면머리와 달리 테마가 아니라 블록이다 — 한 발췌 안에 여러 곡이 들어갈 수 있다. */
/* 폭 ÷ 글자 크기. 이 하나가 플레이리스트 바의 «생김새» 를 통째로 정한다 —
   폭이 정해지면 제목도 하트도 진행바도 재생 단추도 여기서 나온 em 을 따라 함께 정해진다.
   폭은 캔버스가 정하고 높이는 안쪽이 쌓인 만큼이므로, 이 값이 곧 «카드의 가로세로비» 다.
   키우면 글자가 폭 대비 작아지고 카드는 납작해진다 — 17.2 일 때 1:2 였고, 27 에서
   1:3.1 이 되어 «가로로 긴 재생 바» 꼴이 된다. */
const MU_W_EM = 27;
/* 제목·가수만은 이 em 에서 떼어 놓는다 — 제목은 본문과 같은 크기로, 가수는 그보다 한 뼘
   작게. 그 «한 뼘» 은 예전 1.05em : .85em 이 주던 차이를 그대로 옮긴 값이다.
   두 줄 사이는 예전 몫(제목의 .05)에 2px 을 더 준다 — 붙어 읽히던 것을 살짝 떼어 놓되
   여전히 «두 항목» 이 아니라 «한 덩어리» 로 보이는 만큼만이다. */
/* 가수 크기와 «제목–가수 사이» 는 둘 다 본문 크기에 대한 비율이다. 예전에는 사이 간격이
   «비율 + 고정 2px» 이라 글자를 키우면 간격만 상대적으로 좁아졌다 — 비율 하나로 고친다.
   (12.5px 기준 예전 값 2.63px 을 그대로 내는 비율이 .21 이다.) */
/* 가수 비율은 .81 → .88 이다. .81 은 제목과 한 뼘 차이가 나 «작은 글씨» 로 읽혔는데,
   제목이 본문 크기로 내려앉은 뒤로는 그 뼘이 과했다 — 두 줄이 한 덩어리로 읽히는 쪽에 맞춘다.
   (.81 · .85 · .90 을 나란히 놓고 고른 값이다. 눈에 띄게 작지 않으면서 제목과는 구별된다.) */
const MU_ARTIST_R = .88, MU_GAP_R = .21, MU_ARTIST_O = 77;
/* 카드 바탕의 기본값 — 사진 예시(iOS 재생 위젯)처럼 «흰 종이 한 장을 반투명하게 얹은» 꼴이다.
   배경 이미지를 깔았을 때 그 아래가 비쳐야 카드로 읽힌다. */
const MU_CARD = '#FFFFFF', MU_CARD_A = 55;
/* 카드 뒤 흐림의 상한 — 테마의 배경 «흐림» 과 같은 폭으로 맞춘다 [fontControls 아래 bg2] */
const MU_BLUR_MAX = 40;
/* 겹쳐 깐 층이 아니라 «알파를 가진 색 하나» 로 칠한다 — 층을 얹으면 저장 렌더에서
   합쳐지는 방식이 화면과 어긋날 여지가 남는다 [.hd-imessage 와 같은 이유]. */
function rgbaOf(hex, a) {
  const h = hexOf(hex) || 'FFFFFF';
  const [r, g, bl] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  return `rgba(${r},${g},${bl},${clamp(a, 0, 100) / 100})`;
}
function musicNode(b, th) {
  const d = el('div', 'blk-music');
  /* 크기 손잡이는 «캔버스 안쪽 폭의 몇 할» 이다. 그 폭에서 글자 크기를 뽑아 안쪽 전체가
     따라오게 한다 — 크기를 움직이면 폭만이 아니라 그림이 통째로 커지고 작아진다.
     (100% 가 캔버스를 꽉 채운 상태다. 그보다 크면 넘치므로 위로는 열지 않는다.) */
  const cvW = canvasW();
  const inner = Math.max(40, cvW - padL() - padR());
  const w = inner * clamp(b.scale ?? 100, 30, 100) / 100;
  d.style.width = w + 'px';
  d.style.fontSize = (w / MU_W_EM) + 'px';
  /* 제목·가수의 크기는 폭에서 뽑지 않는다 — 본문 글자 크기를 그대로 쓴다 [.mu-title].
     음악은 글자 서식을 따로 안 가지므로 [설정 패널] 테마의 본문 크기가 곧 이 크기다. */
  const tPx = Math.max(1, Number(fmt().size) || 14);
  d.style.setProperty('--mu-title', tPx + 'px');
  d.style.setProperty('--mu-artist', +(tPx * MU_ARTIST_R).toFixed(2) + 'px');
  d.style.setProperty('--mu-gap', +(tPx * MU_GAP_R).toFixed(2) + 'px');
  d.style.setProperty('--mu-w', String(boldW()));
  /* 가수는 제목 색을 흐려 쓴다. 손잡이는 두지 않는다 — 제목과 «한 덩어리로 읽히는» 흐리기가
     하나뿐이라 고르게 해 봐야 고를 일이 없다 [MU_ARTIST_O]. */
  d.style.setProperty('--mu-artist-o', String(MU_ARTIST_O / 100));
  /* 재생 단추와 진행바는 색을 따로 가진다. 안 고르면 둘 다 본문 글자색을 따라간다.
     (tint 는 둘을 한 색으로 묶어 두던 시절의 값이다 — 있으면 그것을 시작값으로 삼는다.) */
  const btnCol = b.btnColor || b.tint || th.fg;
  const barCol = b.barColor || b.tint || th.fg;
  d.style.setProperty('--mu-btn', btnCol);
  d.style.setProperty('--mu-bar', barCol);
  /* 저장된 값의 이름은 heartColor 그대로 둔다 — 예전 저장본과 호환된다 */
  if (b.heartColor) d.style.setProperty('--mu-mark', b.heartColor);
  /* 카드는 «알파를 가진 색 하나» 다 — 아래(캔버스 배경·배경 이미지)가 그만큼 비친다 */
  const cardHex = b.card || MU_CARD, cardA = b.cardOpacity ?? MU_CARD_A;
  d.style.setProperty('--mu-card', rgbaOf(cardHex, cardA));
  /* 카드 «뒤» 를 흐린다 — 배경 이미지를 깐 캔버스에서 «간유리 한 장» 이 되는 그 흐림이다.
     제 몸이 아니라 뒤를 흐리는 것이라 backdrop 이다 — filter 를 걸면 글자와 그림이 흐려진다.
     0 일 때는 아예 안 건다: backdrop-filter 는 값이 0 이어도 쌓임 맥락과 담는 상자를
     새로 만들어, 안 쓰는 카드의 그리는 방식까지 바꿔 놓는다.
     (배경이 단색이면 흐릴 것이 없어 아무 일도 안 일어난다 — 테마의 «흐림» 과 같다.) */
  const blur = clamp(b.cardBlur ?? 0, 0, MU_BLUR_MAX);
  if (blur > 0) {
    d.style.backdropFilter = `blur(${blur}px)`;
    d.style.webkitBackdropFilter = `blur(${blur}px)`;
  }
  /* 트랙은 «카드 위에 앉은 옅은 막대» 다. 반투명 층을 겹치는 대신 미리 섞은 단색을 쓴다 —
     섞을 바탕은 캔버스가 아니라 «카드가 실제로 보이는 색»(배경 위에 알파만큼 얹힌 것)이다.
     그래야 검은 테마에 흰 카드를 얹어도 트랙이 카드보다 밝아지는 일이 없다. */
  d.style.setProperty('--mu-track', mixHex(mixHex(th.bg, cardHex, clamp(cardA, 0, 100) / 100), barCol, .22));

  const flat = b.layout === 'flat';
  if (flat) d.classList.add('mu-flat');
  const meta = el('div', 'mu-meta');
  /* 제목·가수의 «글씨» 는 블록이 따로 고를 수 있다 — 글꼴과 색 둘뿐이다 [buildMusicEditor].
     안 고르면 본문의 것을 그대로 물려받는다. 크기는 여기 없다 — 본문과 나란한 크기라는
     것이 이 카드의 약속이라 [.mu-title] 손잡이를 주지 않는다.
     이 두 줄에만 건다 — 하트·진행바는 제 색을 따로 가진다.
     (재생 단추는 편집기에서 이 색과 한 칸으로 묶여 있어 같은 값이 들어온다 [buildMusicEditor].
      그래도 여기서 따로 받는다 — 서로 다른 색을 담은 예전 저장본이 그대로 그려져야 한다.)
     (가수는 opacity:.6 이 걸려 있어 [.mu-artist], 같은 색을 줘도 제목보다 옅게 남는다.)
     (블록이 제 글꼴을 가지면 저장할 때 임베드 목록에도 저절로 오른다 [usedFonts].) */
  if (b.font) meta.style.fontFamily = fontStack(b.font);
  if (b.textColor) meta.style.color = b.textColor;
  /* 안 적은 칸은 줄째로 뺀다 — 빈칸에 «노래 제목» 같은 대신 글자를 넣으면 그것이
     그대로 저장본에 찍히고, 빈 줄로 남겨 두면 가수만 적었을 때 위가 뜬다.
     (한쪽만 적어도 된다 — 편집기 안내문이 약속하는 그대로다.) */
  const mk = (cls, v) => (v || '').trim()
    ? Object.assign(el('div', cls), { textContent: v }) : null;
  const title = mk('mu-title', b.title), artist = mk('mu-artist', b.artist);
  /* 커버는 «고른 것이 있을 때만» 만든다 — 빈 네모를 두면 안 고른 카드가 어긋나 보인다 */
  let cover = null;
  if (b.cover) {
    cover = el('div', 'mu-cover');
    const ci = el('img'); ci.src = b.cover; ci.alt = '';
    cover.appendChild(ci);
  }
  const bar = el('div', 'mu-bar'), fill = el('i', 'mu-fill');
  fill.style.width = clamp(b.progress ?? 87, 0, 100) + '%';
  bar.appendChild(fill);

  if (flat) {
    d.appendChild(bar);
    const row = el('div', 'mu-row');
    if (cover) row.appendChild(cover);
    const tr = el('div', 'mu-titlerow');
    if (title) tr.appendChild(title);
    meta.appendChild(tr);
    if (artist) meta.appendChild(artist);
    row.appendChild(meta);
    const ctl = el('div', 'mu-ctrl');
    ctl.appendChild(muIcon('play', 'mu-play'));   /* 납작은 세모 재생 하나만 */
    row.appendChild(ctl);
    d.appendChild(row);
    return d;
  }

  const head = el('div', 'mu-head');
  if (cover) head.appendChild(cover);
  if (title) meta.appendChild(title);
  if (artist) meta.appendChild(artist);
  head.appendChild(meta);
  d.append(head, bar);
  const ctl = el('div', 'mu-ctrl');
  ctl.append(muIcon('prev', 'mu-side'), muIcon('play', 'mu-play'), muIcon('next', 'mu-side'));
  d.appendChild(ctl);
  return d;
}

/* ═══ 페이지 자동 분할 (F-WEB-019) [원본 page-split-save-script] ═══ */
const pageRows = () => [...$('#canvas').children].filter(n => n.classList.contains('blk'));
/* 서명은 장마다 바닥에 따로 놓인다 — 장을 나눌 때 세는 줄에서는 빠진다 */
// 본문과 함께 움직이는 제목도 높이 계산·장 배치·내보내기의 같은 흐름에 포함한다.
const flowRows = () => [...$('#canvas').children].filter(n =>
  (n.classList.contains('blk') && !n.classList.contains('is-footer'))
  || (n.classList.contains('cv-head') && n.classList.contains('head-flow')));
const footRow = () => {
  const f = pageRows().filter(n => n.classList.contains('is-footer'));
  return f[f.length - 1] || null;
};
/* 맨 위·맨 아래에 못 박은 화면머리와 서명이 본문에서 가져가는 높이(제 높이 + 블록 간격).
   renderPageMarks 가 정하고, 저장이 장을 나눌 때 같은 값을 그대로 쓴다. */
let footHold = 0, headHold = 0;
/* 미리보기에서 장마다 제자리에 앉히려고 얹은 여백 [renderPageMarks]. 저장은 장마다
   캔버스를 새로 세우므로 이것을 걷어 내고 시작한다 — 안 걷으면 그 여백만큼 밀려 나온다. */
const clearPageOffsets = cv => cv.querySelectorAll('.blk[data-page-top], .blk[data-page-col], .cv-head[data-page-top], .cv-head[data-page-col]')
  .forEach(n => {
    n.style.marginTop = ''; n.style.marginLeft = '';
    delete n.dataset.pageTop; delete n.dataset.pageCol;
  });

/* ── 단 ──────────────────────────────────────────────────
   단은 «한 장을 세로로 몇 쪽 내는가» 다. 그래서 장을 나누는 셈이 바뀌는 것이 아니라,
   그 셈이 세는 단위가 «장» 에서 «단» 으로 잘게 나뉜다 — 한 단의 높이는 여전히 한 장의
   본문 높이 그대로이고, 그런 단 N 개가 모여 한 장이 된다.
   그래서 pageRanges 는 손대지 않는다. 줄 폭만 한 단으로 좁혀 두면 그것이 내놓는 한 칸이
   곧 한 «단» 이고, N 개씩 묶으면 «장» 이다 [groupSpans]. */
const colCount = () => Math.max(1, Math.min(3, fmt().columns || 1));
/* 손으로 앉히는 단인가 — «내용 맞춤» 은 CSS 단이 알아서 하므로 여기 안 든다 */
const colOn = () => !isFit() && colCount() > 1;
/* 한 단에서 다음 단으로 옮겨 앉는 가로 거리 = 단 폭 + 단 사이 */
const colStep = () => {
  const cv = $('#canvas');
  const w = parseFloat(getComputedStyle(cv).getPropertyValue('--cv-colw')) || 0;
  return w + (fmt().columnGap ?? 24);
};
/* 단 범위를 장 범위로 묶는다. 단은 줄 차례를 지키며 이어지므로 묶어도 한 덩어리다. */
function groupSpans(rg, N) {
  if (N < 2) return rg;
  const out = [];
  for (let i = 0; i < rg.length; i += N) out.push([rg[i][0], rg[Math.min(i + N, rg.length) - 1][1]]);
  return out;
}
/* 줄 묶음을 제자리에 앉힌다. items = [{r:[from,to), p:장, c:단}].
   미리보기는 장을 죽 이어 붙이므로 p 가 그대로 장 번호이고, 저장은 한 장만 세우므로
   p 를 0 으로 준다 — 나머지 셈은 둘이 똑같다.
   [순서] 높이는 «앉히기 전에» 다 재 둔다. 한 칸이라도 옮기면 뒤의 줄자리가 모두 흔들린다.
   [세로 가운데] 남는 자리를 반씩 나누는 것은 «장» 단위다 — 한 장 안의 여러 단이 서로 다른
   높이에서 시작하면 단으로 안 읽힌다. 그래서 그 장에서 가장 긴 단을 기준으로 잡는다. */
function placeFlow(rows, items, H, avail, hold, topAlign, step) {
  const tall = items.map(it => {
    const a = rows[it.r[0]], b = rows[it.r[1] - 1];
    return (a && b) ? b.offsetTop + b.offsetHeight - a.offsetTop : 0;
  });
  const slack = {};
  items.forEach((it, i) => { slack[it.p] = Math.max(slack[it.p] || 0, tall[i]); });
  Object.keys(slack).forEach(k => {
    slack[k] = topAlign ? 0 : Math.max(0, Math.round((avail - slack[k]) / 2));
  });
  items.forEach(it => {
    const first = rows[it.r[0]];
    if (!first) return;
    /* 가로는 그 단의 «모든» 줄을 함께 민다 — 한 줄만 밀면 단이 아니라 들여쓰기가 된다 */
    if (it.c) for (let i = it.r[0]; i < it.r[1]; i++) {
      const n = rows[i]; if (!n) continue;
      n.style.marginLeft = (it.c * step) + 'px';
      n.dataset.pageCol = '1';
    }
    const want = it.p * H + padT() + hold + slack[it.p];
    /* 다음 단으로 넘어갈 때는 «위로» 올라간다 — 음수 여백이라 그대로 당겨 올린다.
       offsetTop 은 앞의 앉히기가 이미 반영된 지금 값이라, 차례로 더해도 어긋나지 않는다.
       (이어 말하기의 음수 위 여백[.blk.is-run]을 덮지 않고 더하는 것도 같은 이유다.) */
    const delta = want - first.offsetTop;
    if (!delta) return;
    first.style.marginTop = ((parseFloat(getComputedStyle(first).marginTop) || 0) + delta) + 'px';
    first.dataset.pageTop = '1';
  });
}

/* ── 한 단에 안 들어가는 글 쪼개기 ─────────────────────────
   장을 나누는 최소 단위는 블록 하나다 [pageRanges]. 그런데 단을 나누면 줄 폭이 1/N 로
   좁아져 같은 글이 N 배로 길어진다 — 세로가 짧은 판형(16:9 · 4:3)에서는 블록 하나가
   한 단보다 키가 커지고, 그러면 끊을 자리가 없어 그대로 다음 장까지 흘러넘쳤다.
   그래서 그런 «글 블록» 만 줄 단위로 쪼개 형제 블록 여럿으로 바꿔 둔다. 그 뒤로는
   pageRanges 가 여느 블록처럼 다루므로 장을 세는 셈은 한 줄도 안 바뀐다.
   신문이 한 문단을 단 경계에서 이어 흘리는 것과 같은 꼴이다.

   말풍선 · 사진 · 음악 · HTML 은 안 쪼갠다 — 껍데기가 있는 것을 반으로 가르면 꼬리도
   모서리도 두 동강이 나 그림이 깨진다. 그것들은 여태처럼 통짜로 다음 단에 넘어간다.
   [주의] 화면에 그린 것만 손댄다 — S.blocks 는 건드리지 않는다. 조각들은 원래 블록의
   data-id 를 그대로 물려받으므로 고르기도 끌기도 여태와 똑같이 먹는다. */
function splitTallRows(budget) {
  if (!(budget > 20)) return;
  flowRows().forEach(row => {
    if (row.offsetHeight <= budget) return;
    /* 글 하나만 든 블록인가 — 그 밖은 쪼갤 수 없다 */
    if (row.children.length !== 1) return;
    const src = row.firstElementChild;
    if (!src.classList.contains('blk-text')) return;

    const pos = flatChars(src);
    const last = pos.length - 1;
    if (last < 1) return;

    /* a 번째 글자부터 k 번째 글자까지가 몇 줄에 걸치는가. 글자 하나의 y 를 읽는 대신
       «걸친 줄 수» 를 보는 이유는 softBreaks 의 주석과 같다 — 소프트 줄바꿈 직후 첫
       글자의 rect 가 앞 줄 자리로 오는 웹킷의 affinity 를 이 값은 타지 않는다. */
    const range = document.createRange();
    const linesFrom = (a, k) => {
      try {
        range.setStart(pos[a].node, pos[a].off);
        range.setEnd(pos[k].node, pos[k].off + 1);
      } catch (_) { return 1; }
      const tops = new Set();
      for (const r of range.getClientRects()) if (r.height > 0) tops.add(Math.round(r.top));
      return tops.size || 1;
    };

    const total = linesFrom(0, last);
    if (total < 2) return;
    /* 한 문단 안에서는 줄 높이가 고르다 — 글 높이를 줄 수로 나누면 그것이 한 줄이다.
       (덕분에 줄마다 y 를 재지 않아도 되어, 재는 횟수가 조각 수만큼으로 준다.) */
    const textH = src.getBoundingClientRect().height;
    const extra = Math.max(0, row.offsetHeight - textH);   /* 글 말고 블록이 더 쓰는 높이 */
    const per = Math.max(1, Math.floor((budget - extra) / (textH / total)));
    if (per >= total) return;                              /* 사실은 들어간다 */

    /* a 에서 세어 per 줄을 넘기는 첫 글자 = 다음 조각의 첫 글자.
       앞에서부터 재면 글이 길수록 한 번 재는 값이 통째로 커진다 — 창을 per 줄 언저리로
       넓혀 가며 잡고(지수 탐색), 그 안에서만 이분 탐색한다. */
    const nextCut = a => {
      if (a >= last) return -1;
      let lo = a, step = 64, hi = Math.min(last, a + step);
      while (linesFrom(a, hi) <= per) {
        if (hi >= last) return -1;                         /* 남은 것이 다 들어간다 */
        lo = hi; step *= 2; hi = Math.min(last, hi + step);
      }
      while (lo + 1 < hi) {
        const mid = (lo + hi) >> 1;
        if (linesFrom(a, mid) > per) hi = mid; else lo = mid;
      }
      return hi;
    };

    const edges = [0];
    for (let a = 0, k; (k = nextCut(a)) > a; a = k) edges.push(k);
    if (edges.length < 2) return;
    edges.push(pos.length);

    const made = [];
    for (let i = 0; i + 1 < edges.length; i++) {
      const a = edges[i], b = edges[i + 1];
      if (a >= b) continue;
      try {
        range.setStart(pos[a].node, pos[a].off);
        range.setEnd(pos[b - 1].node, pos[b - 1].off + 1);
      } catch (_) { return; }
      const w = row.cloneNode(false);                      /* .blk — class · data-id 그대로 */
      w.dataset.split = i ? 'tail' : 'head';
      const t = src.cloneNode(false);                      /* .blk-text — 정렬 · 색 · 글꼴 그대로 */
      t.appendChild(range.cloneContents());
      /* 줄이 넘어가던 자리의 공백은 화면에서 줄 끝에 매달려 폭을 안 먹는다. 조각의
         맨 앞으로 오면 그 공백이 진짜 들여쓰기가 되어 첫 글자가 한 칸씩 밀린다. */
      if (i) {
        const first = t.firstChild;
        if (first && first.nodeType === 3) first.nodeValue = first.nodeValue.replace(/^[ \t]+/, '');
      }
      w.appendChild(t);
      made.push(w);
    }
    if (made.length < 2) return;
    /* 양쪽 정렬은 «문단의 마지막 줄» 만 늘리지 않는다. 쪼갠 자리는 문단이 끝난 데가
       아니라 이어지는 데라, 그대로 두면 단 밑동 한 줄만 들쭉날쭉해 눈에 띈다 —
       마지막 조각을 뺀 나머지는 끝 줄까지 늘려 단이 반듯하게 떨어지게 한다. */
    if (getComputedStyle(src).textAlign === 'justify')
      made.slice(0, -1).forEach(w => w.firstElementChild.style.textAlignLast = 'justify');
    made.forEach(w => row.parentNode.insertBefore(w, row));
    row.remove();
  });
}

/* Android Chrome 용 예측 기반 분할 — Range API 없이 lineHeight 와 문자 수로 추정한다.
   Range.getClientRects() 가 부정확하거나 느린 환경에서 쓴다. 정확도는 떨어지지만
   완전히 건너뛰는 것보다는 낫다. 한 페이지를 초과하는 긴 블록을 대략적으로 나눈다. */
function splitTallRowsEstimated(budget) {
  if (!(budget > 20)) return;
  flowRows().forEach(row => {
    if (row.offsetHeight <= budget) return;
    if (row.children.length !== 1) return;
    const src = row.firstElementChild;
    if (!src.classList.contains('blk-text')) return;

    const text = src.textContent || '';
    if (text.length < 2) return;

    const cs = getComputedStyle(src);
    const fontSize = parseFloat(cs.fontSize) || 16;
    /* lineHeight 가 'normal' 이면 fontSize 의 1.2 배 정도다 */
    const lineH = cs.lineHeight === 'normal' ? fontSize * 1.2 : (parseFloat(cs.lineHeight) || fontSize * 1.2);
    const textH = src.getBoundingClientRect().height;
    const extra = Math.max(0, row.offsetHeight - textH);
    const estLines = Math.max(1, Math.round(textH / lineH));
    const charsPerLine = Math.max(1, Math.ceil(text.length / estLines));
    const linesPerSeg = Math.max(1, Math.floor((budget - extra) / lineH));
    const charsPerSeg = charsPerLine * linesPerSeg;

    if (charsPerSeg >= text.length) return;

    /* 텍스트 노드와 오프셋 목록 구축 — flatChars 와 유사하지만 간략화 */
    const pos = [];
    const collectPos = node => {
      for (const ch of node.childNodes) {
        if (ch.nodeType === 3) {
          const v = ch.nodeValue || '';
          for (let i = 0; i < v.length; i++) pos.push({ node: ch, off: i });
        } else if (ch.nodeType === 1 && ch.tagName !== 'BR' && ch.tagName !== 'STYLE') {
          collectPos(ch);
        }
      }
    };
    collectPos(src);
    if (pos.length < 2) return;

    /* 분할 경계 계산 — 문자 수 기준으로 공백 근처에서 끊는다 */
    const edges = [0];
    let nextCut = charsPerSeg;
    for (let i = 0; i < pos.length; i++) {
      if (i >= nextCut) {
        /* 공백 근처에서 끊기 위해 앞뒤 20 자 범위를 살핀다 */
        let best = i;
        for (let j = Math.max(0, i - 10); j < Math.min(pos.length, i + 20); j++) {
          const c = (pos[j].node.nodeValue || '')[pos[j].off];
          if (/\s/.test(c)) { best = j + 1; break; }
        }
        edges.push(Math.min(best, pos.length));
        nextCut = best + charsPerSeg;
      }
    }
    if (edges.length < 2) return;
    edges.push(pos.length);

    /* 각 구간을 Range 로 잘라 새 블록으로 만든다 */
    const range = document.createRange();
    const made = [];
    for (let i = 0; i + 1 < edges.length; i++) {
      const a = edges[i], b = edges[i + 1];
      if (a >= b || a >= pos.length) continue;
      const endIdx = Math.min(b - 1, pos.length - 1);
      try {
        range.setStart(pos[a].node, pos[a].off);
        range.setEnd(pos[endIdx].node, pos[endIdx].off + 1);
      } catch (_) { continue; }

      const w = row.cloneNode(false);
      w.dataset.split = i ? 'tail' : 'head';
      const t = src.cloneNode(false);
      t.appendChild(range.cloneContents());
      /* 조각 맨 앞 공백 제거 */
      if (i) {
        const first = t.firstChild;
        if (first && first.nodeType === 3) first.nodeValue = first.nodeValue.replace(/^[ \t]+/, '');
      }
      w.appendChild(t);
      made.push(w);
    }

    if (made.length < 2) return;
    if (getComputedStyle(src).textAlign === 'justify')
      made.slice(0, -1).forEach(w => w.firstElementChild.style.textAlignLast = 'justify');
    made.forEach(w => row.parentNode.insertBefore(w, row));
    row.remove();
  });
}

function pageBox() {
  /* 소수점이 살아 있으면 렌더마다 끝자리가 흔들려 높이가 미세하게 달라진다 — 정수로 못 박는다 */
  const w = Math.round($('#canvas').clientWidth) || 1;
  const h = Math.round(w / (RATIOS[ratioKey()] || 1));
  return { w, h, inner: Math.max(1, h - padT() - padB()) };
}
function pageRanges(hold = headHold + footHold) {
  const rows = flowRows();
  if (!rows.length) return [];
  const H = Math.max(1, pageBox().inner - (hold || 0));
  const out = []; let start = 0, top = rows[0].offsetTop;
  for (let i = 0; i < rows.length; i++) {
    const bottom = rows[i].offsetTop + rows[i].offsetHeight;
    if (i > start && bottom - top > H) { out.push([start, i]); start = i; top = rows[i].offsetTop; }
  }
  out.push([start, rows.length]);
  return out;
}
function renderPageMarks() {

  cv.querySelectorAll('.foot-pin, .head-pin, .head-flow, .eb-foot-pin').forEach(n => n.classList.remove('foot-pin', 'head-pin', 'head-flow', 'eb-foot-pin'));

     전체 높이라, 창이 장 수만큼 늘어난 한 덩어리로 그려진다. */
  const frame0 = cv.querySelector('.cv-frame');
  if (frame0) frame0.style.removeProperty('height');

  const head = cv.querySelector('.cv-head:not(.head-ghost)');
  const foot = footRow();
  const ebFoot = cv.querySelector('.cv-foot-ebook:not(.eb-foot-ghost), .cv-foot-ebook-modern:not(.eb-foot-ghost), .cv-foot-insta-dm:not(.eb-foot-ghost)');
  /* 축소해 보여 주는 중이라도 offsetHeight 는 논리 높이 그대로다 [fitCanvas].
     둘 다 아직 흐름 안에 있을 때 재야 제 높이가 나온다 — 못 박는 것은 그다음이다. */
  const hh = head ? head.offsetHeight : 0;
  const fh = foot ? foot.offsetHeight : 0;
  /* 페이지 좌표와 같은 논리 높이로 잰다 — getBoundingClientRect 는 미리보기 배율을 탄다.
     offsetHeight 는 absolute 요소도 패딩을 포함한 높이를 돌려준다. */
  const ebh = ebFoot ? ebFoot.offsetHeight : 0;
  if (isFit()) {
    /* absolute 이북 푸터도 내용 맞춤의 자연 높이에 포함해야 한다.
       인스타 입력창은 has-insta-dm의 기존 예약 규칙을 그대로 사용한다. */
    if (ebFoot && !dmFoot) {

     (서명과 다르다. 서명은 한 장에 들어가면 본문과 한 덩어리로 가운데에 놓는 편이 낫다.)
     통합 제목는 본문과 함께 이동한다. */
  const th = theme();
  const isFlowHead = head && headKind(th) === 'paper';
  if (head && !isFlowHead) {

       위 여백은 그 «다음» 부터다. 캔버스가 이미 위 여백만큼 안쪽 여백을 두고 있으므로
       [.canvas.head-pinned], 본문이 더 내줘야 할 몫은 화면머리의 높이 그대로다.
       (문단 간격은 안 낀다 — 화면머리와 본문 사이를 정하는 것은 위 여백 하나다.) */
    headHold = hh;

    head.classList.add('head-pin');
  } else if (isFlowHead) {
    /* 제목은 flowRows에 이미 포함된다. 별도 예약하면 여러 장/다단에서
       제목 높이를 두 번 빼고 본문 묶음을 아래로 밀게 된다. */
    head.classList.add('head-flow');
  }
  /* 하단 장식과 서명이 차지할 몫을 먼저 빼고 장을 센다.
     인스타 입력창은 서명을 포함하지 않으므로 둘의 높이와 사이 간격을 함께 확보한다. */
  /* 서명과 입력창 사이 여백은 기존 하단 여백 + 블록 간격의 절반으로 둔다.
     pageBox.inner가 이미 padB를 빼므로 장식 예약 높이에서는 그 몫을 되돌린다. */
  const dmSpacing = (padB() + gap) / 2;
  const footH = dmFoot ? dmh + dmSpacing - padB() + (foot ? fh : -gap) : (foot ? fh : ebh);
  if (dmFoot) footHold = dmh + dmSpacing - padB();
  const hold = headHold + (footH ? footH + gap : 0);
  /* 장을 세기 «전에» 쪼개 둔다 — 한 단에 안 들어가는 글은 여기서 여러 블록이 되고,
