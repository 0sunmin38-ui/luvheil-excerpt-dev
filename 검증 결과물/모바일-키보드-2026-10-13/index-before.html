    items.length > 1 ? `이미지 ${items.length}장이 완성됐습니다` : '이미지가 완성됐습니다'));
  panel.appendChild(el('p', 'savesheet-sub', isIOS()
    ? '공유를 눌러 “이미지 저장”을 고르면 사진첩에 들어갑니다. 아래 이미지를 길게 눌러 저장해도 됩니다.'
    : '내려받거나 다른 앱으로 보낼 수 있습니다.'));

  const prev = el('div', 'savesheet-prev');
  items.forEach(s => { const i = el('img'); i.src = s.url; i.alt = s.name; prev.appendChild(i); });
  panel.appendChild(prev);

  const acts = el('div', 'savesheet-acts');
  const canShare = !!(navigator.share && typeof File !== 'undefined');
  if (canShare) {
    const b = el('button', 'btn btn-primary', '↗ 공유 · 사진 앱에 저장');
    b.onclick = shareSaved; acts.appendChild(b);
  }
  const dl = el('button', 'btn ' + (canShare ? 'btn-quiet' : 'btn-primary'), '↓ 이미지 내려받기');
  dl.onclick = () => _saved.forEach((s, i) => setTimeout(() => download(s.url, s.name), i * 450));
  acts.appendChild(dl);
  if (items.length === 1 && navigator.clipboard && typeof ClipboardItem !== 'undefined') {
    const cp = el('button', 'btn btn-quiet', '⧉ 이미지 복사');
    cp.onclick = copySaved; acts.appendChild(cp);
  }
  const cl = el('button', 'btn btn-quiet', '닫기');
  cl.onclick = closeSaveSheet; acts.appendChild(cl);
  panel.appendChild(acts);

  root.appendChild(panel);
  root.classList.add('is-on');
  root.onclick = e => { if (e.target === root) closeSaveSheet(); };
  enterOverlay(root, panel, panel.querySelector('.savesheet-title').textContent);
  toast('이미지가 완성됐습니다');
}
function closeSaveSheet() {
  const root = $('#saveSheet');
  root.classList.remove('is-on'); root.innerHTML = ''; root.onclick = null;
  clearSaved();
  leaveOverlay(root);
}
/* 공유는 사용자가 누른 그 순간에 불러야 한다 — 앞에 await 를 두면 iOS 가 제스처로 안 쳐준다 */
function shareSaved() {
  if (!_saved.length) return;
  let files;
  try { files = _saved.map(s => new File([s.blob], s.name, { type: 'image/png' })); }
  catch (_) { toast('이 브라우저에서는 공유할 수 없습니다'); return; }
  if (navigator.canShare && !navigator.canShare({ files })) {
    toast('이 브라우저에서는 이미지 공유가 막혀 있습니다 · 길게 눌러 저장해주세요');
    return;
  }
  navigator.share({ files }).catch(e => {
    if (e && e.name === 'AbortError') return;
    console.warn('공유 실패', e);
    toast('공유하지 못했습니다 · 이미지를 길게 눌러 저장해주세요');
  });
}
function copySaved() {
  navigator.clipboard.write([new ClipboardItem({ 'image/png': _saved[0].blob })])
    .then(() => toast('이미지를 복사했습니다'))
    .catch(e => { console.warn(e); toast('브라우저가 이미지 복사를 막았습니다'); });
}

let exportBusy = false, exportFocus = null;
function reportExportWarning(message) {
  const panel = $('#saveSheet .savesheet-panel');
  if (panel) {
    let notice = panel.querySelector('.savesheet-warning');
    if (!notice) { notice = el('p', 'savesheet-warning'); panel.insertBefore(notice, panel.querySelector('.savesheet-prev')); }
    notice.textContent = message;
  }
  toast(message, 0);
}
async function exportPNG() {
  if (exportBusy) return;
  if (!S.blocks.length) { toast('내보낼 블록이 없습니다'); return; }
  const button = $('#btnSave'), original = button.innerHTML;
  const focus = document.activeElement;
  const selection = S.ui.selectedBlockId;
  exportBusy = true;
  exportFocus = focus;
  button.disabled = true;
  button.setAttribute('aria-busy', 'true');
  button.setAttribute('aria-label', '이미지 만드는 중');
  button.innerHTML = '<span class="save-spinner" aria-hidden="true">◌</span><span class="btn-word"> 만드는 중</span>';
  syncOverlayLocks();
  try { await buildPNG(); }
  catch (error) { console.error(error); reportExportWarning('저장에 실패했습니다 · 다시 저장을 눌러주세요'); }
  finally {
    exportBusy = false;
    button.disabled = false; button.removeAttribute('aria-busy');
    button.innerHTML = original; button.setAttribute('aria-label', '캔버스를 PNG로 저장');
    S.ui.selectedBlockId = selection; renderCanvas();
    syncOverlayLocks();
    if (!activeOverlay() && focus?.isConnected && !focus.closest('[inert],[hidden]')) focus.focus({ preventScroll: true });
    exportFocus = null;
  }
}

async function buildPNG() {
  if (!S.blocks.length) { toast('내보낼 블록이 없습니다'); return; }
  const cv = $('#canvas');
  const wasSel = S.ui.selectedBlockId;
  let exportFontStyle = null;
  const exportStatus = { fontFallback: false };
  let exportFontWarning = '';
  S.ui.selectedBlockId = null;
  renderCanvas();
  toast('저장 준비 중…');
  /* renderCanvas 는 <img> 를 새로 만든다. 이미지가 높이를 얻기 전에 캔버스를 재면
     캡처용 복제본 높이가 짧게 고정되어, 뒤늦게 나타난 아래쪽 내용이 잘린다.
     원본의 이미지와 레이아웃이 모두 안정된 다음 페이지 범위와 높이를 잰다. */
  await waitForImages(cv);
  await raf2();
  /* 바깥 링크로 넣은 그림 중 저장에 담기지 «않을» 것을 먼저 센다 [blockedImages].
     [왜 막지 않나] 그림 한 장 때문에 저장 자체가 안 되는 편이 훨씬 나쁘다 — 담기는 것은
     그대로 담고 못 담는 자리만 비운 뒤 [BLANK_PX], 무엇이 빠졌는지 끝에 알려 준다.
     화면에는 멀쩡히 보이는 그림이라 [exportMissing 이 못 잡는 까닭] 말해 주지 않으면
     저장본을 열어 보고서야 안다. */
  const blocked = await blockedImages(cv);
  if (blocked.length) diag('export:image-blocked', { n: blocked.length });
  const tellExportWarnings = () => {
    const warnings = [];
    if (blocked.length) warnings.push(`바깥 링크 그림 ${blocked.length}장은 담기지 않았습니다`);
    if (exportFontWarning) warnings.push(exportFontWarning);
    else if (exportStatus.fontFallback) warnings.push('글꼴 보존 경로가 실패해 대체 경로로 이미지를 만들었습니다');
    if (warnings.length) reportExportWarning(warnings.join(' · ') + ' · 결과를 확인해주세요');
  };
  /* 미리보기용 표시만 걷어 낸다 — 못 박은 화면머리·서명(.head-pin/.foot-pin)과 그 자리
     (--head-h/--foot-h)는 저장할 그림 자체이므로 그대로 둔다. 구분선·사본·장마다 앉힌
     여백은 장을 이어 붙여 보여 주려던 것이고, 저장은 장마다 캔버스를 새로 세우므로 없어야 한다. */
  cv.querySelectorAll('.pagemark, .foot-ghost, .head-ghost, .frame-ghost, .eb-foot-ghost, .bg-ghost').forEach(n => n.remove());
  clearPageOffsets(cv);
  try {
    const hti = await loadHTI();
    /* fonts.ready 만으로는 부족하다 — 쓰인 글자·굵기의 서브셋을 강제로 받아 둔다 */
    await ensureFontsLoaded(cv);
    /* 화면에 실제로 쓰인 굵기만 심는다 — 안 쓰는 굵기를 같이 심으면 용량만 몇 배가 된다 */
    const bakeCss = () => withTimeout(fontEmbedCSS(cv.innerText || '', usedWeights(cv)), 20000, '');
    let css = await bakeCss();
    /* 덜 온 것이 있으면 «한 번 더» 돌린다 [exportMissing]. 첫 저장에서 빠지는 것들은
       대개 아직 안 온 것뿐이라, 두 번째에는 브라우저가 받아 둔 것을 그대로 쓴다.
       (fontEmbedCSS 는 앞서 시간이 넘어 비워 돌려주었더라도 그 사이 속으로 계속 받고 있다 —
        다시 부르면 그 결과를 캐시에서 그대로 집어 온다.) */
    if (exportMissing(cv, css)) {
      toast('아직 덜 왔습니다 · 다시 받는 중…');
      await waitForImages(cv);
      await ensureFontsLoaded(cv);
      css = await bakeCss();
      await raf2();
    }
    /* 그래도 덜 왔으면 이번에는 저장하지 않는다 — 빠진 채로 나온 그림 한 장보다,
       왜 안 됐는지 아는 편이 낫다. 여기서 돌아가도 finally 가 화면을 원래대로 돌려놓는다.
       [다만 영영 막지는 않는다] 망이 끊겨 글꼴을 못 받는 자리라면 아무리 눌러도 같은
       까닭으로 막힌다 — 그때는 저장 자체를 못 하게 되는 셈이다. 같은 까닭으로 두 번째
       눌렀다면 그것이 곧 «그래도 저장하겠다» 는 뜻이라 보고, 알려 준 뒤 그대로 그린다. */
    const miss = exportMissing(cv, css);
    if (miss && _exportMissLast !== miss) {
      _exportMissLast = miss;
      reportExportWarning(miss + ' · 한 번 더 누르면 그대로 저장합니다');
      return;
    }
    if (miss) {
      exportFontWarning = miss;
      toast(miss.replace(/습니다$/, '은 채로 저장합니다'));
    }
    _exportMissLast = '';
    /* iOS Safari 는 화면 폰트가 붙기 전의 대체 글꼴 치수로 페이지 분할·말풍선 폭을
       먼저 재 버리는 경우가 있다. 저장에 심을 @font-face 를 문서에도 잠깐 붙여,
       아래의 pageRanges() 와 captureClone() 이 실제 저장 렌더와 같은 폰트를 보게 한다. */
    exportFontStyle = installExportFontCSS(css);
    await ensureFontsLoaded(cv);
    await raf2();
    const bg = theme().bg;
    /* 단을 쓰면 한 칸이 «단» 이다 — 감출 줄을 고르는 것은 «장» 단위라 N 개씩 묶는다 */
    const segs = isFit() ? null : pageRanges();
    const N = colOn() ? colCount() : 1;
    const ranges = segs ? groupSpans(segs, N) : null;
    const multi = ranges && ranges.length > 1;
    /* 서명은 어느 장에서도 감추지 않는다 — 감출 줄을 고를 때부터 빼 놓는다 */
    const rows = flowRows();
    /* 저장은 장마다 캔버스를 한 장짜리로 새로 세운다 — 미리보기에서 앉혀 둔 자리는 위에서
       걷었으므로, 남긴 장의 단을 여기서 다시 앉힌다. p 를 0 으로 주는 것이 곧 «이 한 장» 이다. */
    const layoutCols = p => {
      if (N < 2) return;
      const box = pageBox();
      const avail = Math.max(1, box.inner - headHold - footHold);
      placeFlow(rows, segs.slice(p * N, p * N + N).map((r, c) => ({ r, p: 0, c })),
        box.h, avail, headHold, isTopAlign(), colStep());
    };
    const stamp = new Date().toISOString().slice(0, 10);

    if (multi) toast(`${ranges.length}장으로 저장합니다…`);
    /* 화면이 아니라 줄바꿈·상자 크기를 못 박은 클론을 SVG 로 뽑아 정확한 크기로 그린다 */
    const shoot = async () => {
      await syncCanvasBackgrounds(cv, 1);
      /* Android 는 화면 DOM → 수동 복제본 → html-to-image 복제본처럼 레이아웃을 두 번
         다시 만들지 않는다. 레퍼런스와 같이 화면에 실제로 놓인 캔버스를 곧장 넘긴다.
         라이브러리가 만드는 단 한 번의 복제본은 같은 문서·같은 계산 스타일·같은 내장
         글꼴을 물려받으므로, 말풍선과 글자가 서로 다른 치수표를 갖는 틈이 없다. */
      if (isAndroid()) {
        const keepTransform = cv.style.transform;
        if (keepTransform && keepTransform !== 'none') cv.style.transform = 'none';
        /* 말풍선 overflow 방어 — SVG foreignObject 에서 글꼴 높이 차이로 넘칠 수 있다 */
        const bubbles = [...cv.querySelectorAll('.bub')];
        const savedOverflow = bubbles.map(b => b.style.overflow);
        bubbles.forEach(b => b.style.setProperty('overflow', 'hidden', 'important'));
        /* 말풍선 꼬리는 실제 DOM 요소(.bub-tail)로 그린다 — ::before 가상 요소의
           z-index 문제가 해결되어 별도 처리 없이 정상 렌더링된다. */
        try {
          await bakeImagesForExport(cv);
          await raf2();
          const w = Math.ceil(cv.offsetWidth), h = Math.ceil(cv.offsetHeight);
          const scale = exportRatio(w, h);
          diag('export:android-live', { w, h, scale: Number(scale.toFixed(3)), bubbles: bubbles.length });
          return await renderExact(hti, cv, w, h, scale, css, bg, exportStatus);
        } finally {
          if (keepTransform && keepTransform !== 'none') cv.style.transform = keepTransform;
          bubbles.forEach((b, i) => {
            if (savedOverflow[i]) b.style.overflow = savedOverflow[i];
            else b.style.removeProperty('overflow');
          });
        }
      }
      const snap = captureClone(cv);
      try {
        await waitForImages(snap.clone);
        await bakeImagesForExport(snap.clone);
        await raf2();
        /* 내용 맞춤은 HTML·이미지 로딩 뒤 복제본의 실제 높이가 늘 수 있다. 처음 잰 h 로
           루트를 계속 자르지 말고 넘친 전체 높이까지 캡처 상자 자체를 확장한다. */
        if (isFit()) {
          const fullH = Math.max(snap.h, Math.ceil(snap.clone.scrollHeight));
          if (fullH !== snap.h) {
            snap.h = fullH;
            snap.host.style.height = fullH + 'px';
            ['height', 'min-height', 'max-height'].forEach(k =>
              snap.clone.style.setProperty(k, fullH + 'px', 'important'));
            await raf2();
          }
        }
        const scale = exportRatio(snap.w, snap.h);
        return await renderExact(hti, snap.clone, snap.w, snap.h, scale, css, bg, exportStatus);
      } finally { snap.host.remove(); }
    };
    if (!multi) {
      layoutCols(0);
      await raf2();
      const url = await shoot();
      await deliver([{ url, name: `발췌_${stamp}.png` }]);
      tellExportWarnings();
      return;
    }
    const box = pageBox();
    cv.style.aspectRatio = 'auto'; cv.style.height = box.h + 'px'; cv.style.minHeight = '0';
    const urls = [];
    for (let i = 0; i < ranges.length; i++) {
      const [from, to] = ranges[i];
      /* 앞 장에서 앉혀 둔 자리를 걷고 다시 센다 — 남는 줄이 달라지면 자리도 달라진다 */
      clearPageOffsets(cv);
      rows.forEach((n, j) => n.classList.toggle('row-off', j < from || j >= to));
      /* 한 장만 남긴 저장용 캔버스에서는 그 장의 내용 묶음을 세로 중앙에 둔다.
         «위로» 를 고른 테마는 그대로 둔다 — 위 여백과 화면머리 아래에서 바로 시작한다.
         단을 쓰면 flex 가운데맞춤 대신 placeFlow 가 그 몫을 낸다 [renderCanvas 와 같은 이유]. */
      cv.classList.toggle('ratio-center', !isTopAlign() && N < 2);
      await raf2();
      layoutCols(i);
      /* 장마다 다시 잰다 — 남은 행이 맨 위부터 쌓이면서 줄 위치가 달라진다 */
      urls.push(await shoot());
      toast(`이미지 만드는 중… (${i + 1}/${ranges.length})`);
    }
    rows.forEach(n => n.classList.remove('row-off'));
    await deliver(urls.map((u, i) => ({ url: u, name: `발췌_${stamp}-${i + 1}.png` })));
    tellExportWarnings();
  } catch (e) {
    console.error(e);
    /* «실패했습니다» 한 줄로는 누른 사람도, 전해 듣는 쪽도 손쓸 데가 없다. 넘어지는 자리는
       거의 늘 바깥에서 받아 오는 것(html-to-image · 글꼴)이 막힌 데라, 까닭을 붙여 둔다. */
    const why = (e && (e.message || e.name)) || '';
    reportExportWarning('저장에 실패했습니다' + (why ? ' · ' + why : ''));
  } finally {
    if (exportFontStyle) exportFontStyle.remove();
    flowRows().forEach(n => n.classList.remove('row-off'));
    S.ui.selectedBlockId = wasSel; renderCanvas();
  }
}

/* ═══ 설정 내보내기 · 들여오기 ═══════════════════════════════
   [원본 exportProject / importProject 를 설정만 담게 줄인 것]
   블록(작업 내용)은 빼고 다시 쓰게 될 것만 담는다 —
   캐릭터 · 서식 설정 · 캔버스 설정 · 저장한 테마.
   ═══════════════════════════════════════════════════════════ */
const SETTINGS_TYPE = 'chat-excerpt/settings';

/* 내보내고 들여오는 «갈래». 초기화와 같은 눈금으로 나눈다 [openResetModal] —
   한 파일에 전부 담을 이유도, 전부 덮어쓸 이유도 없다. 캐릭터만 옮기고 싶을 때가 많다.
   (글자 서식은 테마 안에 산다[t.fmt] — 전역 기본값도 테마와 한 갈래로 묶는다.) */
const SETTINGS_PARTS = [
  ['characters', '캐릭터', '저장한 캐릭터와 프로필 이미지'],
  ['themes', '테마', '테마 목록'],
  ['colors', '색상', '추가한 색상 프리셋']
];
/* 파일 안에 그 갈래가 실제로 들어 있는가 — 불러오기 모달이 고를 수 있는 것만 켜 준다 */
function settingsHas(d, key) {
  if (key === 'characters') return Array.isArray(d.characters);
  /* 테마와 캔버스는 한 묶음 — 둘 중 하나라도 있으면 테마로 친다 */
  if (key === 'themes') return (Array.isArray(d.themes) && d.themes.length > 0) || (!!d.canvas && typeof d.canvas === 'object');
  if (key === 'colors') return Array.isArray(d.palette) || (!!d.colors && typeof d.colors === 'object');
  return false;
}
const partName = key => (SETTINGS_PARTS.find(p => p[0] === key) || [, key])[1];

function openExportModal() {
  pickerModal(
    '내보낼 항목을 선택하세요',
    '고른 항목이 JSON 파일로 저장됩니다.',
    SETTINGS_PARTS.map(([k, n, d]) => [k, n, d, true]),
    '내보내기', 'btn-primary', picked => { closeModal(); exportSettings(picked); });
}

function exportSettings(picked) {
  const data = { __type: SETTINGS_TYPE, __v: 1 };
  if (picked.has('characters')) data.characters = S.characters;
  if (picked.has('themes')) {
    /* 테마별 캔버스 — 각 테마에 canvas가 없으면 전역 캔버스를 복사해 넣는다 */
    data.themes = S.themes.map(t => t.canvas ? t : { ...t, canvas: { ...S.canvas } });
    data.activeThemeId = S.activeThemeId; data.format = S.format;
    /* 하위호환: 전역 캔버스도 함께 내보낸다 (구버전 가져오기 대응) */
    data.canvas = S.canvas;
  }
  if (picked.has('colors')) {
    data.palette = userPalette; data.paletteHidden = hiddenPalette; data.colors = S.colors;
  }
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  download(url, `발췌설정_${new Date().toISOString().slice(0, 10)}.json`);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('내보냈습니다 · ' + [...picked].map(partName).join(' · '));
}

/* 불러오는 방식 — 지금 것을 두고 뒤에 «더할지», 지금 것 «대신» 넣을지.
   캐릭터·테마·색은 목록이라 더할 수 있지만, 캔버스는 테마와 함께 들어온다. */
const IMPORT_MODES = [['merge', '기존 항목 유지'], ['replace', '덮어쓰기']];
const IMPORT_NOTE = {
  merge: '기존 캐릭터 · 테마 · 색을 유지하고 새로운 항목을 추가합니다.',
  replace: '새 항목을 추가하고, 지금 캐릭터 · 테마 · 색을 지웁니다.'
};
function openImportModal(d) {
  let mode = 'merge';
  const wrap = el('div');
  wrap.appendChild(el('span', 'lab', '방식'));
  const note = el('div', 'lab-sub', IMPORT_NOTE[mode]);
  note.style.margin = '8px 0 0';
  const seg = segment(IMPORT_MODES, mode, v => {
    mode = v;
    /* segment 는 만들 때 한 번만 표시를 정한다 — 다시 그리지 않고 여기서 손본다 */
    [...seg.children].forEach((b, i) => b.classList.toggle('is-on', IMPORT_MODES[i][0] === v));
    note.textContent = IMPORT_NOTE[v];
  });
  wrap.append(seg, note);

  pickerModal(
    '불러올 항목을 선택하세요',
    '고른 항목만 JSON 파일에서 가지고 옵니다.',
    SETTINGS_PARTS.map(([k, n, desc]) => {
      const on = settingsHas(d, k);
      return [k, n, on ? desc : '해당 항목은 파일에 포함돼 있지 않습니다.', on, on];
    }),
    '불러오기', 'btn-primary', picked => {
      const added = applySettings(d, picked, mode);
      save(); closeModal(); render();
      toast((mode === 'merge' ? '더했습니다 · ' : '덮어썼습니다 · ') + added.join(' · '));
    }, wrap);
}

/* 이 도구가 내보낸 파일로 볼 만한가 — 갈래가 하나라도 들어 있으면 받는다.
   («판 표시(__type)가 없어도 모양만 맞으면 받는다» 는 예전 규칙을 그대로 지킨다 —
    손으로 고친 파일도 쓸 수 있어야 한다.) */
const validSettings = d => !!d && typeof d === 'object'
  && SETTINGS_PARTS.some(([k]) => settingsHas(d, k));

const HEX6 = x => /^#[0-9A-Fa-f]{6}$/.test(x);
/* 목록 둘을 잇는다. 열쇠(id)가 겹치면 들여온 쪽에 새 열쇠를 준다 —
   덮어쓰는 것이 아니라 «둘 다 남기는» 것이 목적이므로, 같은 id 라도 따로 선다.
   (블록이 가리키는 발화자 id 는 지금 것이라, 새 열쇠를 주는 쪽이 들여온 것이어야 안전하다.) */
function mergeById(mine, incoming) {
  const used = new Set(mine.map(x => x && x.id));
  return mine.concat(incoming.map(x => {
    const c = JSON.parse(JSON.stringify(x));
    if (used.has(c.id)) c.id = uid();
    used.add(c.id);
    return c;
  }));
}

/* picked 에 든 갈래만 반영한다. 나머지는 손대지 않는다 — 캐릭터만 받고 테마는 지키는 식.
   mode 가 'merge' 면 지금 것을 그대로 두고 뒤에 더하고, 'replace' 면 지금 것 대신 넣는다.
   돌려주는 것은 «실제로 반영된 갈래의 이름» 이다 — 파일에 없던 갈래는 빠진다. */
function applySettings(d, picked, mode) {
  if (!validSettings(d)) return [];
  const merge = mode !== 'replace';
  const done = [];
  if (picked.has('colors')) {
    /* 색 팔레트는 별도 저장소를 쓴다 — 같이 담아 왔으면 그쪽에 되돌려 놓는다 */
    if (Array.isArray(d.palette)) {
      const got = d.palette.filter(HEX6).map(x => x.toUpperCase());
      const hid = (Array.isArray(d.paletteHidden) ? d.paletteHidden : []).filter(HEX6).map(x => x.toUpperCase());
      /* 색은 값 자체가 열쇠다 — 같은 색을 두 번 담지 않는다 */
      userPalette = merge ? [...new Set(userPalette.concat(got))] : got;
      hiddenPalette = merge ? [...new Set(hiddenPalette.concat(hid))] : hid;
      savePalette();
    }
    if (d.colors && typeof d.colors === 'object') Object.assign(S.colors, d.colors);
    done.push(partName('colors'));
  }
  if (picked.has('characters') && Array.isArray(d.characters)) {
    S.characters = merge ? mergeById(S.characters, d.characters) : d.characters;
    done.push(partName('characters'));
  }
  if (picked.has('themes')) {
    if (Array.isArray(d.themes) && d.themes.length) {
      /* 테마별 캔버스 — canvas가 없는 테마는 전역 캔버스(d.canvas)나 기본값으로 채운다 */
      const fallbackCanvas = (d.canvas && typeof d.canvas === 'object') ? d.canvas : DEF_CANVAS;
      const incoming = d.themes.map(t => t.canvas ? t : { ...t, canvas: { ...fallbackCanvas } });
      S.themes = merge ? mergeById(S.themes, incoming) : incoming;
      S.themes.forEach(ensureThemeFormat);
      sortThemesByPreset();          /* 들여온 목록도 기본 테마는 정해진 차례에 세운다 */
      /* 더할 때는 보고 있던 테마를 그대로 둔다 — 더했다고 화면이 갈아엎히면 안 된다 */
      if (!merge || !S.themes.some(t => t.id === S.activeThemeId)) {
        S.activeThemeId = d.themes.some(t => t.id === d.activeThemeId) ? d.activeThemeId : S.themes[0]?.id;
      }
      done.push(partName('themes'));
    }
    /* 전역 서식은 테마와 한 갈래다 — 테마를 안 받으면 이것도 안 받는다.
       더하기에서는 손대지 않는다(지금 쓰던 기본값을 지킨다). */
    if (!merge && d.format && typeof d.format === 'object') Object.assign(S.format, d.format);
    /* 하위호환: 전역 캔버스도 업데이트 (구버전 파일 대응) */
    if (d.canvas && typeof d.canvas === 'object') Object.assign(S.canvas, d.canvas);
  }
  /* 들여온 캐릭터가 사라진 발화자를 가리키지 않게 정리한다 */
  const ids = new Set(S.characters.map(c => c.id));
  S.blocks.forEach(b => { if (b.speakerId && !ids.has(b.speakerId)) b.speakerId = null; });
  S.ui.editingCharacterId = null; S.ui.charDraft = null; S.ui.editingThemeId = null; S.ui.themeDraft = null;
  return done;
}

$('#settingsPick').onchange = e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    /* 읽자마자 덮어쓰지 않는다 — 무엇이 들어 있는지 보여 주고 고르게 한 다음에 덮는다 */
    let d = null;
    try { d = JSON.parse(r.result); } catch (_) { d = null; }
    if (!validSettings(d)) { toast('이 도구에서 내보낸 설정 파일이 아닙니다'); return; }
    openImportModal(d);
  };
  r.readAsText(f);
};

/* 새로 꽂을 것(사진·서명)을 고르는 상태로 들어간다.
   setStage 는 '자리를 옮기면 하던 것을 접는다' 는 뜻이라 이 값을 지운다 —
   그러니 자리를 먼저 옮기고 나서 세워야 한다. 순서를 바꾸면 세우자마자 지워진다. */
function startNew(kind, src) {
  setStage('format');
  S.ui.newKind = kind;
  S.ui.newSrc = src || '';
  S.ui.navOpen = true;        /* NAV 안의 일이다 — [×] 로 돌아올 길을 남긴다 */
  render();
}

/* [+] 가 앉을 자리는 화면 폭에 따라 다르다 — 좁으면 작성창 옆, 넓으면 도구 네비 오른쪽 끝.
   같은 버튼을 옮겨 붙인다(두 개를 두면 상태를 두 번 맞춰야 하고 반드시 어긋난다). */
/* 묶음의 마지막 칸 — 지금 콘텐츠를 확정하는 단추 하나.
   무엇을 하고 있든 자리는 늘 여기다. 이름과 하는 일만 갈린다. */
let _confirm = null;          /* 사진 편집기가 자기 확정 동작을 여기 걸어 둔다 */
function renderFoot() {
  /* 모든 블록 편집은 상단 헤더에 버튼이 있으므로 하단 버튼 필요 없음 */
  const foot = $('#sheetFoot');
  foot.innerHTML = '';
  foot.hidden = true;
}

/* ── 렌더 ────────────────────────────────────────────────── */
function render() {
  renderCanvas();
  renderTools();
  renderFormat();
  renderComposer();
  renderInsertBar();
  renderFoot();
  renderBulkBar();
  $('#sheet').classList.toggle('is-format', S.ui.stage === 'format');
  $('#sheet').classList.toggle('is-tools', S.ui.stage === 'tools');
  $('#sheet').classList.toggle('is-compact', S.ui.panel === 'compact');
  $('#sheet').classList.toggle('is-full', S.ui.panel === 'full');
  $('#sheet').classList.toggle('pane-tools', S.ui.deskPane === 'tools');
  applySnap();
  requestAnimationFrame(measureSheet);
}

/* ═══ 시트 손잡이 — 원래 크기·45%·70%의 실제 높이로 스냅한다. ═══ */
const SNAPS = [0, 45, 70];
const snapVH = () => window.innerHeight || 800;
let sheetMotion = null;
function syncSheetGrab() {
  const grab = $('#sheetGrab');
  const current = S.ui.snap == null ? 0 : S.ui.snap;
  grab.setAttribute('aria-valuenow', String(current));
  grab.setAttribute('aria-valuetext', current ? `화면 높이의 ${current}%` : '기본 크기');
  grab.title = '끌어서 높이 조절 · ' + (current ? '눌러 기본 크기로' : '눌러 직전 크기로') + ' · ↑↓ 높이 선택';
}
function applySnap() {
  const sheet = $('#sheet'), n = S.ui.snap;
  sheet.classList.toggle('has-snap', n != null);
  if (n != null) sheet.style.setProperty('--snap-h', n + 'dvh');
  else sheet.style.removeProperty('--snap-h');
  syncSheetGrab();
}
function stopSheetMotion() {
  if (sheetMotion) sheetMotion.cancel();
  sheetMotion = null;
  $('#sheet').classList.remove('is-settling');
}
function setSnap(n, animate = false) {
  const sheet = $('#sheet');
  const from = sheet.getBoundingClientRect().height;
  stopSheetMotion();
  S.ui.snap = n;
  if (n != null) { S.ui.snapLast = n; S.ui.panel = 'full'; }
  else S.ui.panel = (S.ui.stage === 'tools' || S.ui.stage === 'format') ? 'full' : 'compact';
  sheet.classList.toggle('is-compact', S.ui.panel === 'compact');
  applySnap();
  const to = sheet.getBoundingClientRect().height;
  if (animate && !isWide() && !matchMedia('(prefers-reduced-motion:reduce)').matches && Math.abs(from - to) > 1) {
    sheet.classList.add('is-settling');
    const motion = sheet.animate([
      { height: from + 'px', maxHeight: from + 'px' },
      { height: to + 'px', maxHeight: to + 'px' }
    ], { duration: 220, easing: 'cubic-bezier(.22,.61,.36,1)' });
    sheetMotion = motion;
    const track = () => {
      if (sheetMotion !== motion) return;
      measureSheet();
      if (motion.playState === 'running') requestAnimationFrame(track);
    };
    requestAnimationFrame(track);
    motion.finished.catch(() => {}).then(() => {
      if (sheetMotion !== motion) return;
      sheetMotion = null; sheet.classList.remove('is-settling'); measureSheet();
    });
  }
  requestAnimationFrame(measureSheet);
}
$('#btnSheetSize').onclick = () => {
  const p = modal('패널 크기', '원하는 높이를 선택하세요.');
  const list = el('div', 'settings-list');
  [['기본 크기', null], ['중간 크기 · 45%', 45], ['큰 크기 · 70%', 70]].forEach(([label, snap]) => {
    const button = el('button', 'btn btn-quiet', label);
    button.setAttribute('aria-pressed', String(S.ui.snap === snap));
    button.onclick = () => { closeModal(); setSnap(snap, true); };
    list.appendChild(button);
  });
  const foot = el('div', 'modal-foot');
  const cancel = el('button', 'btn btn-quiet', '취소'); cancel.onclick = closeModal;
  foot.appendChild(cancel); p.append(list, foot);
};
(function initSheetGrab() {
  const grab = $('#sheetGrab'), sheet = $('#sheet');
  const MOVE_TOL = 5;
  let st = null, frame = 0;
  const naturalPx = () => {
    const had = sheet.classList.contains('has-snap'), compact = sheet.classList.contains('is-compact');
    sheet.classList.remove('has-snap');
    sheet.classList.toggle('is-compact', S.ui.stage !== 'tools' && S.ui.stage !== 'format');
    const h = sheet.getBoundingClientRect().height;
    sheet.classList.toggle('has-snap', had); sheet.classList.toggle('is-compact', compact);
    return h;
  };
  const draw = () => {
    frame = 0;
    if (!st || !st.moved) return;
    sheet.classList.remove('is-compact'); sheet.classList.add('has-snap');
    sheet.style.setProperty('--snap-h', st.next + 'px');
    measureSheet();
  };
  grab.addEventListener('pointerdown', e => {
    if (isWide() || st || (e.button != null && e.button !== 0)) return;
    e.preventDefault();
    const h = sheet.getBoundingClientRect().height;
    stopSheetMotion();
    if (Math.abs(sheet.getBoundingClientRect().height - h) > 1) {
      sheet.classList.remove('is-compact'); sheet.classList.add('has-snap');
      sheet.style.setProperty('--snap-h', h + 'px');
    }
    const nat = naturalPx();
    st = { id: e.pointerId, y: e.clientY, h, nat, previous: S.ui.snap, moved: false, next: h };
    try { grab.setPointerCapture(e.pointerId); } catch (_) { }
    sheet.classList.add('is-dragging');
  });
  grab.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    const dy = st.y - e.clientY;
    if (Math.abs(dy) > MOVE_TOL) st.moved = true;
    if (!st.moved) return;
    const sizes = [st.nat, snapVH() * .45, snapVH() * .70];
    st.next = clamp(st.h + dy, Math.min(...sizes), Math.max(...sizes));
    if (!frame) frame = requestAnimationFrame(draw);
  });
  const end = e => {
    if (!st || e.pointerId !== st.id) return;
    if (frame) { cancelAnimationFrame(frame); frame = 0; draw(); }
    const previous = st;
    st = null;
    sheet.classList.remove('is-dragging');
    S.ui.snapAuto = null;
    if (e.type === 'pointercancel' || e.type === 'lostpointercapture') {
      setSnap(previous.previous, true);
    } else if (!previous.moved) {
      setSnap(S.ui.snap == null ? (S.ui.snapLast || 45) : null, true);
    } else {
      const targets = [{ snap: null, px: previous.nat }, { snap: 45, px: snapVH() * .45 }, { snap: 70, px: snapVH() * .70 }];
      targets.sort((a, b) => Math.abs(a.px - previous.next) - Math.abs(b.px - previous.next));
      setSnap(targets[0].snap, true);
    }
  };
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
  grab.addEventListener('lostpointercapture', end);
  grab.addEventListener('keydown', e => {
    if (isWide() || e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
    let next;
    const current = S.ui.snap || 0;
    if (e.key === 'ArrowUp') next = SNAPS[Math.min(SNAPS.length - 1, SNAPS.indexOf(current) + 1)] || 45;
    else if (e.key === 'ArrowDown') next = SNAPS[Math.max(0, SNAPS.indexOf(current) - 1)];
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = 70;
    else if (e.key === 'Enter' || e.key === ' ') next = current ? 0 : (S.ui.snapLast || 45);
    else return;
    e.preventDefault(); setSnap(next || null, true);
  });
})();

/* 데스크톱 한 기둥 배치에서 어느 칸을 열어 둘 것인가 [.sheet.pane-tools].
   [주의] 여기서 render() 를 부르면 안 된다 — 칸을 누를 때마다 패널이 통째로 새로 그려져
   치던 자리와 골라 둔 선택 영역을 잃는다. class 만 갈아 끼우고 높이만 다시 잰다.
   (상태는 S.ui 에 남아, 다음 render() 도 같은 자리를 다시 그린다.) */
function setDeskPane(p) {
  if (S.ui.deskPane === p) return;
  S.ui.deskPane = p;
  $('#sheet').classList.toggle('pane-tools', p === 'tools');
  requestAnimationFrame(measureSheet);
}
/* 밀려 있는 칸을 누르면 그쪽이 열린다. 누른 것을 삼키지는 않는다 —
   접힌 칸의 탭을 눌러 «열면서 그 탭으로» 가는 것이 한 번에 되어야 한다.
   두 칸이 나란히 서는 폭에서만 뜻이 있다: 좁은 화면은 한 칸을 번갈아 쓰고,
   1500px 부터는 좌우로 갈라져 둘 다 늘 보인다. */
(function initDeskPanes() {
  const split = () => window.matchMedia('(min-width:900px) and (max-width:1499.98px)').matches;
  let pointerFocus = false;
  document.addEventListener('pointerdown', () => { pointerFocus = true; }, true);
  document.addEventListener('pointerup', () => { pointerFocus = false; }, true);
  document.addEventListener('pointercancel', () => { pointerFocus = false; }, true);
  document.addEventListener('keydown', () => { pointerFocus = false; }, true);
  const bind = (sel, pane) => {
    const node = $(sel);
    /* 클릭이 확정된 뒤 넓힌다. 포인터를 누르는 도중 버튼이 움직이지 않게 한다. */
    node.addEventListener('click', () => { if (split()) setDeskPane(pane); });
    node.addEventListener('focusin', e => {
      if (split() && !pointerFocus && e.target.matches(':focus-visible')) setDeskPane(pane);
    });
  };
  bind('#sheetBody', 'tools');
  bind('#dock', 'dock');
})();

let suppressBlockTapUntil = 0;
function editCanvasBlock(id) {
  const block = S.blocks.find(item => item.id === id);
  if (!block) return;
  closeAllOverlays('format');
  S.ui.selectedBlockId = block.id;
  $('#ta').value = HAS_TEXT.includes(block.type) ? blockSource(block) : '';
  setStage('format'); autoGrow();
}
function syncCanvasKeyboard() {
  const rows = [...$('#canvas').querySelectorAll('.blk:not(.row-off)')];
  const blocks = new Map(S.blocks.map(block => [block.id, block]));
  const selected = rows.find(row => row.dataset.id === S.ui.selectedBlockId) || rows[0];
  rows.forEach((row, i) => {
    row.tabIndex = row === selected ? 0 : -1;

    row.setAttribute('aria-label', `${i + 1}번 블록 · ${String(block?.text || block?.title || block?.type || '').slice(0, 80)} · Enter로 편집`);
  });
}
$('#canvas').addEventListener('keydown', e => {
  const row = e.target.closest('.blk');
  if (!row || e.target !== row || e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); editCanvasBlock(row.dataset.id);
    (focusableIn($('#formatWrap'))[0] || $('#ta')).focus({ preventScroll: true });
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    const rows = [...$('#canvas').querySelectorAll('.blk:not(.row-off)')];
    const next = rows[clamp(rows.indexOf(row) + (e.key === 'ArrowDown' ? 1 : -1), 0, rows.length - 1)];
    e.preventDefault(); row.tabIndex = -1; next.tabIndex = 0; next.focus();
  }
});
/* ═══════════════════════════════════════════════════════════════
   [원본 initBlockInteractions]
   짧게 탭 = 수정 · 420ms 꾹 = 그 자리에서 끌어 순서 이동.
   길게 누르기 전에 손가락이 움직이면 화면 스크롤로 넘겨준다.
   ═══════════════════════════════════════════════════════════════ */
(function initBlockInteractions() {

  const clearMarks = () => cv.querySelectorAll('.drop-before,.drop-after')
    .forEach(r => r.classList.remove('drop-before', 'drop-after'));

  function reset() {

    document.body.style.userSelect = ''; cv.style.userSelect = '';
    clearMarks(); st = null;
  }

  cv.addEventListener('pointerdown', e => {
    if (e.button != null && e.button !== 0) return;
    if (e.target.closest('button,a,input,select,textarea')) return;
    const row = e.target.closest('.blk'); if (!row) return;
    /* 선택 삭제 모드에서는 탭이 곧 선택 토글이다 — 끌기·수정은 쉰다 [원본] */
    if (S.ui.bulk) {
      e.preventDefault();
      const id = row.dataset.id;
      S.ui.picked = S.ui.picked || new Set();
      S.ui.picked.has(id) ? S.ui.picked.delete(id) : S.ui.picked.add(id);
      render();
      return;
    }
    reset();
    /* 여기서 기본 동작을 막지 않으면 브라우저가 글자 선택 드래그를 먼저 시작한다. [원본] */
    e.preventDefault();
    cv.style.userSelect = 'none';
    /* 마우스에는 길게 누르기를 요구하지 않는다. 손가락은 끌기와 화면 스크롤이 겹쳐서
       420ms 를 눌러야 하지만, 마우스로 그러면 그냥 끌었을 때 아무 일도 안 일어나
       기능이 없는 것처럼 보인다. [원본은 둘 다 길게 누르기였다] */
    const mouse = !e.pointerType || e.pointerType === 'mouse';
    st = { id: row.dataset.id, row, x: e.clientX, y: e.clientY, pid: e.pointerId, mouse, long: false, moved: false, target: null, pos: null };
    timer = setTimeout(beginDrag, LONG_MS);
  });

  function beginDrag() {
    if (!st || st.long) return;
    st.long = true;
    st.row.classList.add('dragging');
    document.body.style.userSelect = 'none';
    try { const s = window.getSelection(); if (s && s.removeAllRanges) s.removeAllRanges(); } catch (_) { }
    try { cv.setPointerCapture(st.pid); } catch (_) { }
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (_) { }
    const scroll = () => {
      if (!st?.long) return;
      const stage = $('#stage'), rect = stage.getBoundingClientRect();
      const bottom = isWide() ? rect.bottom : Math.min(rect.bottom, $('#sheet').getBoundingClientRect().top);
      const y = st.clientY ?? st.y;
      const amount = y < rect.top + 48 ? -Math.min(12, (rect.top + 48 - y) / 4)
        : y > bottom - 48 ? Math.min(12, (y - bottom + 48) / 4) : 0;
      if (amount && st.moved) { stage.scrollTop += amount; markTarget(y); }
      scrollFrame = requestAnimationFrame(scroll);
    };
    scrollFrame = requestAnimationFrame(scroll);
  }

  function markTarget(y) {
    clearMarks(); st.target = null;
    const rows = pageRows().filter(r => r !== st.row);
    let best = null, bd = Infinity;
    rows.forEach(r => {
      const rc = r.getBoundingClientRect(), mid = rc.top + rc.height / 2;
      const d = Math.abs(y - mid);
      if (d < bd) { bd = d; best = { r, before: y < mid }; }
    });
    if (best) {
      best.r.classList.add(best.before ? 'drop-before' : 'drop-after');
      st.target = best.r; st.pos = best.before ? 'before' : 'after';
    }
  }

  cv.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.pid) return;
    if (!st.long) {
      if (Math.hypot(e.clientX - st.x, e.clientY - st.y) <= MOVE_TOL) return;
      /* 마우스는 움직인 순간이 곧 끌기 시작. 손가락이면 스크롤 의도로 보고 넘긴다. */
      if (!st.mouse) { reset(); return; }
      clearTimeout(timer); timer = null;
      beginDrag();
    }
    st.moved = true; st.clientY = e.clientY; markTarget(e.clientY);
  });

  function finish(e) {
    if (!st || (e && e.pointerId != null && e.pointerId !== st.pid)) return;
    if (performance.now() < suppressBlockTapUntil) { reset(); return; }
    const s = st;
    cancelAnimationFrame(scrollFrame); scrollFrame = 0;
    clearTimeout(timer); timer = null; st = null;
    clearMarks();
    s.row.classList.remove('dragging');
    document.body.style.userSelect = ''; cv.style.userSelect = '';

    if (!s.long) {                       /* 짧은 탭 — 수정 */
      const b = S.blocks.find(x => x.id === s.id); if (!b) return;
      /* 이미 고른 블록을 다시 누르면 놓는다 — 고르는 동작과 같은 손짓으로 풀 수 있어야 한다 */
      if (S.ui.selectedBlockId === b.id) { setStage('composer'); return; }
      /* 블록 선택 시 다른 모든 UI 닫기 — 상호 배타 */
      editCanvasBlock(b.id);
      if (HAS_TEXT.includes(b.type) && window.matchMedia('(pointer:fine)').matches) focusComposerEnd();
      return;
    }
    if (!s.moved || !s.target) return;

    const tid = s.target.dataset.id;
    const from = S.blocks.findIndex(m => m.id === s.id);
    let to = S.blocks.findIndex(m => m.id === tid);
    if (from < 0 || to < 0) return;
    if (s.pos === 'after') to++;
    if (to > from) to--;
    if (to === from) return;
    const it = S.blocks.splice(from, 1)[0];
    S.blocks.splice(to, 0, it);
    save(); render(); toast('순서를 옮겼습니다');
  }
  cv.addEventListener('pointerup', finish);
  cv.addEventListener('pointercancel', reset);
  /* 끌기가 시작된 뒤에는 손가락을 움직여도 화면이 따라 스크롤되지 않게 막는다.
     passive:false 여야 preventDefault 가 먹는다. [원본] */
  cv.addEventListener('touchmove', e => { if (st && st.long) e.preventDefault(); }, { passive: false });
})();

/* ═══════════════════════════════════════════════════════════════
   미리보기 끌어 옮기기
   캔버스가 화면보다 길어지면 아래쪽이 시트에 가려 안 보인다. 스크롤로 닿기는 하지만
   미리보기 안에는 잡을 것이 없어 '움직이지 않는 화면' 처럼 읽혔다 —
   빈 자리를 잡아 끌 수 있게 한다.
   · 블록 위에서 시작한 끌기는 순서 이동이므로 건드리지 않는다
   · 손가락은 원래 쓸어서 스크롤되므로 마우스에서만 켠다 (겹치면 두 배로 밀린다)
   ═══════════════════════════════════════════════════════════════ */
(function initStagePan() {
  const stage = $('#stage');
  let s = null;

  stage.addEventListener('pointerdown', e => {
    if (e.pointerType && e.pointerType !== 'mouse') return;
    if (e.button != null && e.button !== 0) return;
    if (e.target.closest('.blk')) return;
    if (e.target.closest('button,a,input,select,textarea')) return;
    s = { x: e.clientX, y: e.clientY, l: stage.scrollLeft, t: stage.scrollTop, pid: e.pointerId, on: false };
  });
  stage.addEventListener('pointermove', e => {
    if (!s || e.pointerId !== s.pid) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (!s.on) {
      if (Math.hypot(dx, dy) < 4) return;          /* 그냥 누른 것과 끈 것을 가른다 */
      s.on = true;
      stage.classList.add('is-pan');
      try { stage.setPointerCapture(s.pid); } catch (_) { }
    }
    stage.scrollLeft = s.l - dx;
    stage.scrollTop = s.t - dy;
  });
  const end = e => {
    if (!s || (e && e.pointerId != null && e.pointerId !== s.pid)) return;
    stage.classList.remove('is-pan');
    s = null;
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
})();

/* 미리보기 배율은 저장 규격과 분리한다. 버튼·트랙패드·두 손가락 모두 이 값만 바꾼다. */
(function initPreviewZoom() {
  const stage = $('#stage');
  const setZoom = value => {
    S.ui.previewZoom = clamp(value, PREVIEW_ZOOMS[0], PREVIEW_ZOOMS[PREVIEW_ZOOMS.length - 1]);
    fitCanvas();
  };
  const step = direction => {
    const cur = Number(S.ui.previewZoom) || 1;
    let i = PREVIEW_ZOOMS.findIndex(v => v >= cur - .001);
    if (i < 0) i = PREVIEW_ZOOMS.length - 1;
    setZoom(PREVIEW_ZOOMS[clamp(i + direction, 0, PREVIEW_ZOOMS.length - 1)]);
  };
  $('#zoomOut').onclick = () => step(-1);
  $('#zoomIn').onclick = () => step(1);
  $('#zoomReset').onclick = () => setZoom(1);

  stage.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    setZoom((Number(S.ui.previewZoom) || 1) * Math.exp(-e.deltaY * .002));
  }, { passive: false });

  let pinch = null;
  const metric = touches => {
    const a = touches[0], b = touches[1];
    return { d: Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY), x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
  };
  stage.addEventListener('touchstart', e => {
    if (e.touches.length !== 2) return;
    suppressBlockTapUntil = performance.now() + 500;
    const m = metric(e.touches);
    pinch = { d: Math.max(1, m.d), x: m.x, y: m.y, zoom: Number(S.ui.previewZoom) || 1, left: stage.scrollLeft, top: stage.scrollTop };
    e.preventDefault();
  }, { passive: false, capture: true });
  stage.addEventListener('touchmove', e => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    suppressBlockTapUntil = performance.now() + 500;
    const m = metric(e.touches);
    setZoom(pinch.zoom * m.d / pinch.d);
    stage.scrollLeft = pinch.left - (m.x - pinch.x);
    stage.scrollTop = pinch.top - (m.y - pinch.y);
  }, { passive: false, capture: true });
  const end = e => { if (!e.touches || e.touches.length < 2) pinch = null; };
  stage.addEventListener('touchend', end, { capture: true });
  stage.addEventListener('touchcancel', end, { capture: true });
})();

/* 서식 도구를 누르는 동안에는 작성창의 포커스를 지킨다.

  if (e.isComposing || _composerComposing || e.keyCode === 229 || activeOverlay()) return;

});
document.addEventListener('keydown', e => {
  if (e.isComposing || _composerComposing || e.keyCode === 229) return;
  const overlay = activeOverlay();
  if (!overlay) return;
  if (e.key === 'Escape') {
    e.preventDefault(); e.stopImmediatePropagation();
    overlay.id === 'saveSheet' ? closeSaveSheet() : closeModal();
    return;
  }
  if (e.key === 'Tab') {
    const items = focusableIn(overlay);
    const current = items.indexOf(document.activeElement);
    e.preventDefault(); e.stopImmediatePropagation();
    if (items.length) {
      const next = current < 0 ? (e.shiftKey ? items.length - 1 : 0)
        : (current + (e.shiftKey ? -1 : 1) + items.length) % items.length;
      items[next].focus();
    }
    else overlay.querySelector('[role="dialog"]').focus();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && ['Enter', 'z', 'Z', 'y', 'Y'].includes(e.key)) {
    /* 모달 입력칸의 텍스트 undo는 브라우저에 맡기고 문서 단축키 전파만 막는다. */

    const target = e.target;
    if (target.closest('button,textarea,[contenteditable="true"],select')) return;
    const apply = overlay.querySelector('.btn-primary:not(.btn-danger):not(:disabled),.btn-fill:not(.btn-danger):not(:disabled)');
    if (apply) { e.preventDefault(); e.stopImmediatePropagation(); apply.click(); }

/* «폭이 달라진 것» 과 «높이만 달라진 것» 은 다른 일이다.
   높이만 줄었다 늘었다 하는 것은 거의 언제나 키보드와 주소창이다 — 안드로이드 크롬은
   입력칸을 누르면 숨겼던 주소창을 도로 띄우면서 resize 를 보낸다. 그때 패널을 통째로
   다시 그리면, 방금 포커스를 준 입력칸이 새 것으로 갈려 올라오던 키보드가 도로 내려갔다.
   [캐릭터 추가 › 이름] 을 눌러도 키보드가 올라오다 마는 것이 이것이었고, 도구·서식 패널의
   모든 입력칸이 같은 병을 앓았다. closePop 도 같은 자리에서 색 팔레트의 «직접 적는 칸» 을
   손 밑에서 지워 버렸다. 작성창[#ta]만 멀쩡했던 것은 그것 하나가 다시 그려지지 않는
   붙박이라서다.
   폭이 그대로면 다시 그릴 이유도 없다 — 캔버스 크기도(비율·고정폭) 패널의 한 줄에 몇 개가
   서는지도 폭만 본다. 높이는 --app-vh · --sheet-h 가 따로 맡는다 [syncViewportVars]. */
let _rz, _rzW = window.innerWidth, _rzPending = false;
window.addEventListener('resize', () => {
  diag('viewport:resize');
  autoGrow(); measureSheet();
  const nextW = window.innerWidth;
  /* 키보드가 뜬 동안 Android Chrome 은 세로 스크롤바·주소창 정산으로 layout viewport 폭도
     몇 px 바꿀 수 있다. 입력칸이 살아 있는 동안에는 DOM 을 갈지 않고, 키보드가 내려간 뒤
     마지막 폭으로 한 번만 맞춘다. 회전 중 입력 중이어도 포커스를 잃게 만들지 않는다. */
  const active = document.activeElement;
  const editing = !!(active && active.matches && active.matches('input,textarea,select,[contenteditable="true"]'));
  if (editing) { _rzW = nextW; _rzPending = true; return; }
  if (nextW === _rzW && !_rzPending) return;
  _rzW = nextW; _rzPending = false;
  closePop();
  fitCanvas();                       /* 남는 폭이 달라지면 축소율도 달라진다 */
  clearTimeout(_rz);
  _rz = setTimeout(() => { if (!isFit()) render(); else renderPageMarks(); }, 120);
});

loadPalette();
initComposer();
initComposerV2();
initSettingsPanelV2();
load();
/* 되돌리기의 «출발점» — 불러온 직후 상태가 첫 장이다 [histRecord] */
setTimeout(() => { if (_histPrev === null) _histPrev = snapOf(); }, 0);
/* 새 초안과 설정 입력은 브라우저 편집 히스토리가 맡는다.
   기존 블록 수정은 실시간 save()로 기록하므로 문서 히스토리를 유지한다. */
window.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.isComposing || _composerComposing || e.keyCode === 229 || e.altKey || activeOverlay() || exportBusy) return;
  const key = e.key.toLowerCase();
  if (!(e.metaKey || e.ctrlKey) || (key !== 'z' && !(key === 'y' && e.ctrlKey))) return;
  const target = e.target instanceof Element ? e.target : document.activeElement;
  const editable = target?.closest('input,textarea,select,[contenteditable="true"]');
  if (editable && (editable !== $('#ta') || !selBlock())) return;
  e.preventDefault();
  if (key === 'y' || e.shiftKey) histRedo(); else histUndo();
});
S.themes.forEach(ensureThemeFormat); /* 기존 전역 서식을 각 테마에 한 번 복사하는 호환 마이그레이션 */
sortThemesByPreset();                /* 기본 테마의 차례는 코드가 정한다 [PRESET_THEMES] */
save();
ensureFontCss(fmt().font);
syncViewportVars();
render();
/* 화면에 설명을 더 노출하지 않고 기존 컨트롤의 접근 가능한 이름과 상태를 연결한다. */
const confirmShortcut = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘+Enter' : 'Ctrl+Enter';
$('#ta').setAttribute('aria-label', '블록 내용');
$('#ta').setAttribute('aria-keyshortcuts', 'Control+Enter Meta+Enter');
$('#ta').title = 'Enter 줄바꿈 · ' + confirmShortcut + ' 확정';
$('#btnSettings').setAttribute('aria-label', '캐릭터·테마 설정');
$('#btnSettings').setAttribute('aria-controls', 'settingsPanel');
$('#btnAdd').setAttribute('aria-label', '요소 추가 또는 작성 확정');
$('#charNameV2').setAttribute('aria-label', '캐릭터 이름');
$('#btnCharAvatarV2').setAttribute('role', 'button');
$('#btnCharAvatarV2').tabIndex = 0;
$('#btnCharAvatarV2').setAttribute('aria-label', '캐릭터 이미지 편집');
$('#btnCharSaveV2').title = '캐릭터 저장 (' + confirmShortcut + ')';
$('#btnCharSaveV2').setAttribute('aria-keyshortcuts', 'Control+Enter Meta+Enter');
enhanceControls();
syncSettingsViews();
const controlObserver = new MutationObserver(records => {
  const roots = new Set();
  records.forEach(record => {
    const node = record.target instanceof Element ? record.target : record.target.parentElement;
    if (node) roots.add(node.closest('.settings-content,#formatWrap,#modalRoot,#popRoot,#saveSheet') || node);
  });
  roots.forEach(root => { if (root.isConnected) enhanceControls(root); });
});
['#settingsPanel','#formatWrap','#modalRoot','#popRoot','#saveSheet'].forEach(selector => {
  controlObserver.observe($(selector), { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
});
window.matchMedia('(min-width:900px)').addEventListener('change', syncSettingsViews);
syncCanvasKeyboard();
new MutationObserver(syncCanvasKeyboard).observe($('#canvas'), { childList: true });
/* 2패널에서는 설정 패널을 처음부터 연다 */
if (is2Panel()) toggleSettingsPanel(true);
/* 캐시를 비우며 맡아 둔 «치던 글» 을 돌려준다 [clearCacheAndReload]. render() 뒤라야 한다 —
   앞에 두면 render 가 작성창을 제 손으로 비우며 함께 지운다. */
try {
  const draft = sessionStorage.getItem(DRAFT_KEY);
  if (draft != null) {
    sessionStorage.removeItem(DRAFT_KEY);
    if (draft) $('#ta').value = draft;
  }
} catch (_) { }
/* 새로 받으려고 붙였던 자국은 지운다 — 주소는 다시 깨끗해진다 [clearCacheAndReload] */
try {
  const u = new URL(location.href);
  if (u.searchParams.has(FRESH_Q)) {
    u.searchParams.delete(FRESH_Q);
    history.replaceState(null, '', u.pathname + u.search + u.hash);
  }
} catch (_) { }
autoGrow();

/* ── 진단용 뷰포트 자[#debug-vp] ──────────────────────────────
   주소 끝에 «#debug-vp» 를 붙였을 때만 만들어진다 — 평소에는 이 안으로 들어오지도 않는다.
   안드로이드에서 «키보드가 올라오다 닫히는» 것을 눈으로 재기 위한 자다. 셋을 함께 적는다.
     win  — 창 높이가 실제로 줄었는가(= window resize 가 오는가). 이게 오르내리면
            resize 처리기가 패널을 다시 그려 입력칸을 죽인 것이다.
     vv   — 보이는 영역만 줄었는가. win 은 그대로인데 vv 만 줄면 창은 안 변한 것이다.
     살아있음 — 포커스를 준 그 칸이 아직 DOM 에 있는가. N 으로 바뀐 시점이 범인의 시각이다.
   무엇이 «먼저» 일어나는지가 원인을 가른다. 시각은 focusin 을 0 으로 잡은 상대 시간이다. */
if (/debug-vp/.test(location.hash + location.search)) (function initVpDebug() {
  const box = el('div');
  box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;pointer-events:none;'
    + 'font:11px/1.35 ui-monospace,Menlo,monospace;white-space:pre;color:#0f0;'
    + 'background:rgba(0,0,0,.82);padding:4px 6px';
  document.body.appendChild(box);
  let rz = 0, vvr = 0, watched = null, t0 = Date.now();
  const log = [];
  const push = s => { log.unshift(String(Date.now() - t0).padStart(5) + 'ms ' + s); log.splice(6); };
  const name = n => n ? (n.tagName + (n.className ? '.' + String(n.className).split(' ')[0] : '')) : '-';
  const paint = () => {
    const vv = window.visualViewport;
    box.textContent =
      'win ' + innerWidth + 'x' + innerHeight + '  rz' + rz + '\n'
      + (vv ? 'vv  ' + Math.round(vv.width) + 'x' + Math.round(vv.height)
              + ' top' + Math.round(vv.offsetTop) + '  vvr' + vvr + '\n' : '')
      + 'focus ' + name(document.activeElement)
      + (watched ? '  살아있음:' + (watched.isConnected ? 'Y' : 'N') : '') + '\n'
      + log.join('\n');
  };
  addEventListener('resize', () => { rz++; push('resize ' + innerWidth + 'x' + innerHeight); paint(); });
  if (window.visualViewport)
    visualViewport.addEventListener('resize', () => {
      vvr++; push('vv-resize ' + Math.round(visualViewport.height)); paint();
    });
  document.addEventListener('focusin', e => {
    t0 = Date.now(); log.length = 0; watched = e.target;
    push('focusin ' + name(e.target)); paint();
  });
  document.addEventListener('focusout', e => {
    push('focusout ' + name(e.target) + ' 살아있음:' + (e.target.isConnected ? 'Y' : 'N')); paint();
  });
  setInterval(paint, 200);
  paint();
})();
</script>
</body>
</html>
